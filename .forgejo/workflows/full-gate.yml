# Forgejo Actions full gate — nightly + on-demand.
#
# Push events and this nightly workflow both run the complete test:gate. The
# scheduled lane provides an independent default-branch proof and manual rerun.
# Release tags run the even fuller test:ci (release.yml).
#
# Scheduled runs execute the workflow file on the default branch at its
# current head. If the self-hosted runner is offline at cron time, the run
# queues and executes when the runner comes back. A red nightly points at a
# day's push range, not one commit — `git bisect run npm run test:gate`
# recovers attribution locally.
#
# The statistical rolling-restart convergence gate is deliberately NOT run
# here: its pass rate is variance-bounded (~25-33% per run) and a per-run
# pass/fail would be satisfiable or violable by chance alone. It is promoted
# only on a sealed Wilson-95 bar over N>=20 runs (see
# docs/convergence-donewhen-metric.md) and tracked as a trend.
name: full-gate

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC nightly — runner machine is usually idle
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tools the gate shells out to that node:22-bookworm does not ship:
      # rg (spec-led-runtime-legacy-deletion-guard test), jq (failure-report
      # shell scripts), java (model:contracts runs TLC via tla2tools.jar).
      - name: Install gate CLI tools (ripgrep, jq, java, psql)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep jq default-jre-headless postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Full gate (test:gate)
        run: npm run test:gate
