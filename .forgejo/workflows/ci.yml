# Forgejo Actions CI — runs on Codeberg.
# Syntax is GitHub-Actions-compatible. `runs-on: docker` targets the
# self-hosted runner from ci/forgejo-runner/ (capacity 1, shares the machine
# with local dev work).
#
# Tiered gating:
#   * push / PR         -> this workflow: complete test:gate (fail-closed fast
#                          tests, static analysis, model contracts).
#   * nightly / manual  -> full-gate.yml: complete test:gate (fast test fleet
#                          + static + TLC model contracts).
#   * v* tag            -> release.yml: full test:ci + release artifacts.
#
# paths-ignore lists ONLY the high-churn Solver-artifact directories that BOTH
# repo scanners (check-no-kiro-refs.js, check-no-legacy-naming.js) already
# allowlist AND no other test:static script reads — so a push touching only
# these skips the lane with zero loss of static coverage. Everything else runs
# the lane: architecture/** is read by check-runtime-grammar-contracts.js;
# docs/steering/** by steering:check; README/CHANGELOG and solve/{quests,epics,
# specs}/** are scanned by the no-kiro / no-legacy audits. The nightly full
# gate (full-gate.yml) re-runs test:static in full regardless.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "solve/changes/**"
      - "solve/log/**"
      - "solve/report/**"
      - "solve/autonomous/**"
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gate CLI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep jq default-jre-headless postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Full gate (test:gate)
        run: npm run test:gate
