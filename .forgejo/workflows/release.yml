# Forgejo Actions release — runs on Codeberg when a `v*` tag is pushed.
# Syntax is GitHub-Actions-compatible.
#
# Prerequisites (one-time):
#   * Codeberg Actions enabled for the repo AND the SELF-HOSTED runner from
#     ci/forgejo-runner/ registered and Idle. Codeberg's HOSTED runners cannot
#     run this pipeline: their labels are codeberg-tiny/small/medium (no
#     `docker` label), jobs are capped at 10 minutes (test:ci alone runs
#     40-60), and docker-in-docker is unsupported — see ci/forgejo-runner/
#     README.md.
#   * Secrets:
#       REGISTRY_USER   - Codeberg username (package registry push)
#       REGISTRY_TOKEN  - Codeberg token with package:write scope
#       DOCKERHUB_USER  - Docker Hub username (e.g. psvensson; NOT an email)
#       DOCKERHUB_TOKEN - Docker Hub access token with Read/Write scope
#     The release-upload token is provided automatically by the Forgejo runner
#     as secrets.GITHUB_TOKEN — that name (and the github.* context / GITHUB_*
#     env vars used below) is Forgejo's GitHub-Actions-compat surface, NOT a
#     dependency on github.com.
#   * To re-fire for an already-pushed tag: delete and re-push the tag.
name: release

on:
  push:
    tags: ["v*"]

env:
  IMAGE: codeberg.org/psvensson/lagrange
  DOCKERHUB_IMAGE: docker.io/psvensson/lagrange

jobs:
  release:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail-fast release-notes gate, BEFORE the 40-60min test:ci: the tag must
      # match package.json's version and have a non-empty CHANGELOG.md section
      # (`## [x.y.z] — date`). That section becomes the Forgejo release-page
      # body and the "Release notes" section of the Docker Hub overview — a tag
      # whose changes were never written down fails here in seconds.
      # scripts/release-notes.js is dependency-free, so this runs before npm ci.
      # GITHUB_REF_NAME / GITHUB_OUTPUT / RUNNER_TEMP are Forgejo's built-in
      # GitHub-Actions-compatible runner variables, not github.com.
      - name: Resolve version and render release notes
        id: ver
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.js --mode check --version "$VERSION"
          NOTES_DIR="${RUNNER_TEMP:-/tmp}"
          node scripts/release-notes.js --mode notes --version "$VERSION" \
            > "$NOTES_DIR/release-notes.md"
          node scripts/release-notes.js --mode overview --version "$VERSION" \
            > "$NOTES_DIR/dockerhub-overview.md"
          echo "notes_dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<LAGRANGE_RELEASE_NOTES_EOF"
            cat "$NOTES_DIR/release-notes.md"
            echo "LAGRANGE_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Tools test:ci shells out to that the act runner image does not ship:
      # rg (spec-led-runtime-legacy-deletion-guard test), jq (failure-report
      # shell scripts; present in the act image but cheap to pin), java
      # (model:contracts runs TLC via tla2tools.jar), helm (test:ci ends with
      # test:chart:endpoint-sync, which renders/lints the endpoint-sync chart —
      # installing helm only in the later packaging step fails the gate).
      - name: Install gate CLI tools (ripgrep, jq, java, helm)
        # helm comes from helm's own CDN (get.helm.sh), not github.com. Bump
        # HELM_VERSION to adopt a newer helm; the URL accepts any released tag.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep jq default-jre-headless curl tar
          HELM_VERSION=v3.16.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          helm version --short

      - name: Install dependencies
        run: npm ci

      # Full pre-release gate. Fails the release if the tagged tree is not green.
      - name: Full gate (test:ci)
        run: npm run test:ci

      # Bundle + single-executable (SEA) builds -> ./dist
      - name: Build bundle and SEA binaries
        run: npm run build:all

      - name: Package Helm chart
        run: helm package charts/lagrange-node --destination dist/

      # Checksum every release artifact (SEA binaries + Helm chart tarball).
      # Only top-level FILES: build-sea.js also bundles a dist/node_modules/
      # directory (runtime deps), and `sha256sum *` errors on a directory
      # ("Is a directory"). Exclude SHA256SUMS itself; sort for stable output.
      - name: Checksum release artifacts
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
          # Drop the bundled runtime deps dir — it is not a release asset (you
          # cannot attach a directory) and would break the release upload below.
          # dist/ is not the Docker build context, so this is safe.
          rm -rf node_modules

      # NOTE: the image is amd64-only — the Dockerfile keeps only the linux-x64
      # leveldown prebuild. ARM hosts can pull it but run under emulation.
      #
      # Build once, then push. Docker Hub is REQUIRED (the primary registry);
      # Codeberg's container registry is BEST-EFFORT — its /v2/ endpoint has
      # returned transient "unexpected EOF", and a flaky mirror must not sink the
      # release or block the Docker Hub push. Both login+push are retried.
      - name: Build and push Docker image
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.version }}"

          # OCI provenance labels (Dockerfile ARGs): version/revision/created
          # are the per-tag metadata Docker Hub and the Codeberg package UI
          # display for a specific release's image.
          docker build \
            --build-arg "VERSION=$TAG" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$TAG"           -t "$IMAGE:latest" \
            -t "$DOCKERHUB_IMAGE:$TAG" -t "$DOCKERHUB_IMAGE:latest" .

          retry() { local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; \
            echo "retry $n/3: $*"; sleep $((n*5)); done; }
          dh_login() { echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login docker.io -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin; }
          cb_login() { echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login codeberg.org -u "${{ secrets.REGISTRY_USER }}" --password-stdin; }

          # Docker Hub — required.
          retry dh_login
          retry docker push "$DOCKERHUB_IMAGE:$TAG"
          retry docker push "$DOCKERHUB_IMAGE:latest"
          echo "Docker Hub push OK: $DOCKERHUB_IMAGE:$TAG + :latest"

          # Codeberg — best-effort; warnings, never a hard failure.
          if retry cb_login; then
            retry docker push "$IMAGE:$TAG"   || echo "::warning::codeberg push $IMAGE:$TAG failed (non-fatal)"
            retry docker push "$IMAGE:latest" || echo "::warning::codeberg push $IMAGE:latest failed (non-fatal)"
          else
            echo "::warning::codeberg registry login failed (non-fatal); image is on Docker Hub only"
          fi

      # Docker Hub has no per-tag release-notes surface, so the repository
      # full_description carries the per-release history: the rendered
      # overview (docs/dockerhub-overview.md + a generated "Release notes"
      # section per version, from CHANGELOG.md) is PATCHed via the Hub API.
      # Best-effort like the Codeberg mirror push: hub.docker.com/v2 login has
      # historically been picky about personal access tokens, and a failed
      # description update must not sink a release whose images are pushed.
      - name: Update Docker Hub repository description
        # Secrets flow through env (not ${{ }} textual splicing into the shell
        # script) so special characters in a token can't break or inject shell.
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          REPO="${DOCKERHUB_IMAGE#docker.io/}"
          OVERVIEW="${{ steps.ver.outputs.notes_dir }}/dockerhub-overview.md"
          update() {
            TOKEN=$(jq -n --arg u "$DH_USER" --arg p "$DH_TOKEN" \
                          '{username: $u, password: $p}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' -d @- \
                  https://hub.docker.com/v2/users/login \
              | jq -r '.token // empty')
            [ -n "$TOKEN" ] || return 1
            jq -n --rawfile fd "$OVERVIEW" '{full_description: $fd}' \
              | curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" \
                  -H 'Content-Type: application/json' -d @- \
                  "https://hub.docker.com/v2/repositories/$REPO/" > /dev/null
          }
          if update; then
            echo "Docker Hub overview updated for $REPO"
          else
            echo "::warning::Docker Hub description update failed (non-fatal)." \
              "If login was rejected, DOCKERHUB_TOKEN may need Read/Write/Delete" \
              "scope (or the account password) for hub.docker.com/v2/users/login;" \
              "fallback: run 'node scripts/release-notes.js --mode overview" \
              "--version ${{ steps.ver.outputs.version }}' and paste the output" \
              "at https://hub.docker.com/r/$REPO"
          fi

      # Publishes the tag as a Forgejo Release and attaches the artifacts. The
      # notes are the tagged version's CHANGELOG.md section (rendered by the
      # fail-fast step above), so the Codeberg release page shows the concrete
      # changes, not boilerplate.
      - name: Publish Forgejo release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          # forgejo-release@v2 requires a non-empty title (fails "title is empty").
          title: "Lagrange ${{ github.ref_name }}"
          release-dir: dist
          release-notes: ${{ steps.ver.outputs.notes }}
