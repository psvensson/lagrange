name: lagrange-scenario-a-live-admission

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/scenario-a-lagrange-live-admission-staging
      - benchmark/lagrange-scenario-a-visibility-20261028
    paths:
      - '.github/workflows/lagrange-scenario-a-live-admission.yml'
      - 'test/distributed/harness/oltp-scenario-a-comparison-systems.js'
      - 'test/distributed/harness/oltp-scenario-a-semantic-gate.js'
      - 'test/distributed/harness/oltp-scenario-a-proof-cases.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-proof-plan.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-live-admission.js'
      - 'scripts/checks/oltp-scenario-a-lagrange-live-admission-guard.js'
      - 'test/distributed/run-runtime-helpers.js'
      - 'test/distributed/scenarios/scenario-a-visibility-lagrange.js'
      - 'test/distributed/reference-client/lagrange-visibility-probe.js'
      - 'test/distributed/harness/__tests__/scenario-a-prestart-admission.test.js'
      - 'test/distributed/harness/__fixtures__/scenario-with-prestart.js'
      - 'test/distributed/reference-client/lagrange-visibility-probe.test.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-runtime-preflight.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-public-pg-context.js'
      - 'test/distributed/harness/oltp-scenario-a-visibility-case.js'
      - 'test/scripts/oltp-scenario-a-lagrange-live-admission-guard-witness.js'
      - 'scripts/generate-global-owner-debt-inventory.js'
      - 'scripts/global-owner-debt-inventory/constants.js'
      - 'test/scripts/dependency-policy-producer-binding.test.js'
      - 'test/scripts/impact-proof-cone-producer.test.js'
      - 'test/shards/impact-graph-seal.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lagrange-scenario-a-live-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove live-proof admission authority
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-lagrange-proof-plan.js \
            test/distributed/harness/oltp-scenario-a-lagrange-live-admission.js \
            scripts/checks/oltp-scenario-a-lagrange-live-admission-guard.js
          node scripts/checks/oltp-scenario-a-lagrange-live-admission-guard.js

      - name: Prove pre-start admission and nested dependency authority
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/run-runtime-helpers.js \
            test/distributed/scenarios/scenario-a-visibility-lagrange.js \
            test/distributed/harness/__tests__/scenario-a-prestart-admission.test.js \
            test/scripts/oltp-scenario-a-lagrange-live-admission-guard-witness.js \
            scripts/generate-global-owner-debt-inventory.js \
            scripts/global-owner-debt-inventory/constants.js
          node --test \
            test/distributed/harness/__tests__/scenario-a-prestart-admission.test.js \
            test/scripts/dependency-policy-producer-binding.test.js \
            test/scripts/impact-proof-cone-producer.test.js
          npx tap test/distributed/reference-client/lagrange-visibility-probe.test.js
          # The graph report is intentionally absent from a clean checkout.
          # Reproduce the ordinary CI gate: regenerate it, then refuse any
          # difference against the committed seal.
          node scripts/generate-global-owner-debt-inventory.js --refresh-import-graph-only
          git diff --exit-code -- test/shards/impact-graph-seal.json
