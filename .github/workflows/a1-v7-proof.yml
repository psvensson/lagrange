# exact-head semantic reproof after generated metadata refresh
# semantic reproof on refreshed A1-v7 tree
name: a1-v7-proof
# final generated-state-current proof trigger

on:
  push:
    branches:
      - review/a1-v7-partition-key-ordering-candidate

permissions:
  contents: write

concurrency:
  group: a1-v7-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh generated test metadata
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          npm run -s test:metadata:refresh
          paths=(
            test/shards/primary-classes.json
            test/shards/resource-classes.json
            test/shards/subsystem-classes.json
            test/shards/impact-graph-seal.json
            solve/changes/global-owner-debt-inventory/inventory.json
          )
          if ! git diff --quiet -- "${paths[@]}"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- "${paths[@]}"
            git commit -m "A1-v7: refresh generated proof metadata"
            git push origin HEAD:review/a1-v7-partition-key-ordering-candidate
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          else
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact candidate fingerprints
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          sha256sum \
            src/partition/split-key-comparator.js \
            src/partition/partition-split-merge-manager-core-methods.js \
            src/partition/partition-split-merge-manager-evaluation-methods.js \
            src/partition/partition-split-merge-manager-transition-methods.js \
            src/partition/partition-split-merge-manager-transition-methods.js \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js \
            scripts/checks/partition-key-ordering-owner-completion-v7.js

      - name: Controlled negatives on rejected A1 candidates
        if: steps.refresh.outputs.refreshed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "e0a84ca06b0d377d405a69d7c5bbc57ad5714f77:v6-rejected" \
            "9fcc09739a31a248297eb16eae3724c4e61fbfc6:v7-rejected"; do
            ref="${spec%%:*}"
            label="${spec##*:}"
            wt="$RUNNER_TEMP/$label"
            git worktree add --detach "$wt" "$ref"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$wt/node_modules"
            cp scripts/checks/partition-key-ordering-owner-completion-v7.js \
              "$wt/scripts/checks/partition-key-ordering-owner-completion-v7.js"
            set +e
            (
              cd "$wt"
              node scripts/checks/partition-key-ordering-owner-completion-v7.js
            ) >"$RUNNER_TEMP/$label.out" 2>"$RUNNER_TEMP/$label.err"
            status=$?
            set -e
            cat "$RUNNER_TEMP/$label.err"
            cat "$RUNNER_TEMP/$label.out"
            if [ "$status" -eq 0 ]; then
              echo "::error::$label unexpectedly satisfies the v7 closure probe"
              exit 1
            fi
            if [ "$label" = "v6-rejected" ]; then
              grep -Eq 'table-id-validation-before-(missing|null|undefined)' \
                "$RUNNER_TEMP/$label.err" &&
              grep -q 'evaluation-array-iterator-isolation' \
                "$RUNNER_TEMP/$label.err" &&
              grep -q 'evaluation-array-sort-capture' \
                "$RUNNER_TEMP/$label.err" || {
                  echo "::error::$label did not reproduce all named v6 defects"
                  exit 1
                }
            else
              grep -q 'evaluation-array-iterator-isolation' \
                "$RUNNER_TEMP/$label.err" &&
              grep -q 'evaluation-array-isarray-capture' \
                "$RUNNER_TEMP/$label.err" || {
                  echo "::error::$label did not reproduce the live-path v7 rejection"
                  exit 1
                }
            fi
            git worktree remove --force "$wt"
          done

      - name: A1 v6 preserved closure
        if: steps.refresh.outputs.refreshed != 'true'
        run: node scripts/checks/partition-key-ordering-owner-completion-v6.js
      - name: A1 v7 closure
        if: steps.refresh.outputs.refreshed != 'true'
        run: node scripts/checks/partition-key-ordering-owner-completion-v7.js
      - name: Focused behavior
        if: steps.refresh.outputs.refreshed != 'true'
        run: npm run test:file -- test/partition/routing-key-comparator.test.js test/partition/merge-auto-execution.test.js
      - name: Complexity ratchet
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          npm run test:complexity
          npm run test:complexity:scoped -- \
            src/partition/split-key-comparator.js \
            src/partition/partition-split-merge-manager-core-methods.js \
            src/partition/partition-split-merge-manager-evaluation-methods.js
      - name: Ambient intrinsic guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: node scripts/check-guideline-ambient-intrinsics.js scripts/checks/partition-key-ordering-owner-completion-v7.js
      - name: File-size admission
        if: steps.refresh.outputs.refreshed != 'true'
        run: npm run audit:file-size
      - name: Solver ESLint guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          paths=(
            scripts/checks/partition-key-ordering-owner-completion-v7.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node node_modules/eslint/bin/eslint.js --no-warn-ignored --no-error-on-unmatched-pattern "${paths[@]}"
      - name: Solver literal-guideline guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          paths=(
            scripts/checks/partition-key-ordering-owner-completion-v7.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node scripts/check-guideline-literals.js "${paths[@]}"
      - name: Solver decision-boundary guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          paths=(
            scripts/checks/partition-key-ordering-owner-completion-v7.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node scripts/check-guideline-decision-boundaries.js "${paths[@]}"
      - name: Solver ambient-intrinsics guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          paths=(
            scripts/checks/partition-key-ordering-owner-completion-v7.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node scripts/check-guideline-ambient-intrinsics.js "${paths[@]}"
      - name: Solver silent-catch guard
        if: steps.refresh.outputs.refreshed != 'true'
        run: |
          paths=(
            scripts/checks/partition-key-ordering-owner-completion-v7.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node scripts/check-guideline-silent-catch.js "${paths[@]}"
