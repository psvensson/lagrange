name: a1-v11-seal-and-attempt

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/a1-v11-seal-and-attempt.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
      BRANCH: quest/0-3-queryable-core-foundation
      QUEST_ID: partition-key-ordering-owner-completion-v11
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated test metadata before sealing
        shell: bash
        run: |
          set -euo pipefail
          npm run -s test:metadata:refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json
          if ! git diff --cached --quiet; then
            LAGRANGE_SKIP_PRECOMMIT=1 git commit -m "test: refresh metadata for A1-v11 seal"
          fi

      - name: Record v10 rejection, supersede it, and seal v11
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v10             --verification "REJECT: category-complete Copilot PR #96 review of exact v10 candidate tree found two production-semantic gaps inside the sealed adversarial bar: routeSplitSnapshotBatch used live new Map() after module load, allowing globalThis.Map replacement to silently suppress dispatch; and snapshot row/column dimensions lacked a policy cap, allowing over-wide/unbounded copy/group/dispatch beyond the SQLite 32,766 bind-variable budget. All other v10 constraints passed."             --verifier subagent:github-copilot-pr96             --verdict reject
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v10             --superseded "PR #96 found the live Map constructor and unbounded snapshot-dimension gaps outside v10's immutable predicate; preserve v10 and continue as v11."             --by "$QUEST_ID"
          node scripts/solve.js start --id "$QUEST_ID"
          node scripts/solve.js probe --id "$QUEST_ID"

      - name: Install v11 witnesses
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/$QUEST_ID/evidence
          cp "$evidence/candidate-test-routing-key-comparator.test.js"             test/partition/routing-key-comparator.test.js
          cp "$evidence/candidate-test-merge-auto-execution.test.js"             test/partition/merge-auto-execution.test.js
          cp "$evidence/candidate-test-partition-split-routing.test.js"             test/partition/partition-split-routing.test.js

      - name: Prove exact rejected v10 candidate red at both reviewed findings
        shell: bash
        run: |
          set -euo pipefail
          v10=solve/quests/partition-key-ordering-owner-completion-v10/evidence
          cp "$v10/candidate-src-split-merge-manager.js"             src/partition/partition-split-merge-manager.js
          cp "$v10/candidate-src-evaluation-context.js"             src/partition/partition-split-merge-evaluation-context.js
          cp "$v10/candidate-src-split-key-comparator.js"             src/partition/split-key-comparator.js
          cp "$v10/candidate-src-split-merge-core.js"             src/partition/partition-split-merge-manager-core-methods.js
          cp "$v10/candidate-src-split-merge-evaluation.js"             src/partition/partition-split-merge-manager-evaluation-methods.js
          cp "$v10/candidate-src-split-merge-transition.js"             src/partition/partition-split-merge-manager-transition-methods.js
          cp "$v10/candidate-src-partition-split-routing.js"             src/partition/partition-split-routing.js

          node scripts/checks/partition-key-ordering-owner-completion-v10.js

          set +e
          node test/partition/partition-split-routing.test.js             > /tmp/a1-v11-v10-red.log 2>&1
          routing_status=$?
          node scripts/checks/partition-key-ordering-owner-completion-v11.js             > /tmp/a1-v11-probe-v10-red.log 2>&1
          probe_status=$?
          set -e

          cat /tmp/a1-v11-v10-red.log
          cat /tmp/a1-v11-probe-v10-red.log
          test "$routing_status" -ne 0
          test "$probe_status" -ne 0
          grep -E "not ok.*captures Map constructor after module load"             /tmp/a1-v11-v10-red.log >/dev/null
          grep -E "not ok.*rejects dimensions outside one bind budget"             /tmp/a1-v11-v10-red.log >/dev/null

      - name: Install exact v11 candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/$QUEST_ID/evidence
          cp "$evidence/candidate-src-strict-own-data.js"             src/utils/strict-own-data.js
          cp "$evidence/candidate-src-split-merge-manager.js"             src/partition/partition-split-merge-manager.js
          cp "$evidence/candidate-src-evaluation-context.js"             src/partition/partition-split-merge-evaluation-context.js
          cp "$evidence/candidate-src-split-key-comparator.js"             src/partition/split-key-comparator.js
          cp "$evidence/candidate-src-split-merge-core.js"             src/partition/partition-split-merge-manager-core-methods.js
          cp "$evidence/candidate-src-split-merge-evaluation.js"             src/partition/partition-split-merge-manager-evaluation-methods.js
          cp "$evidence/candidate-src-split-merge-transition.js"             src/partition/partition-split-merge-manager-transition-methods.js
          cp "$evidence/candidate-src-partition-split-routing.js"             src/partition/partition-split-routing.js

      - name: Prove v11 candidate green
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checks/partition-key-ordering-owner-completion-v10.js
          node scripts/checks/partition-key-ordering-owner-completion-v11.js
          node scripts/solve.js probe --id "$QUEST_ID"
          npm run test:file --             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/partition-split-routing.test.js

      - name: Candidate guardrails
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/utils/strict-own-data.js
            src/partition/partition-split-merge-manager.js
            src/partition/partition-split-merge-evaluation-context.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            src/partition/partition-split-routing.js
          )
          npm run test:complexity
          npm run test:complexity:scoped -- "${paths[@]}"
          npm run audit:file-size
          node node_modules/eslint/bin/eslint.js --no-warn-ignored --no-error-on-unmatched-pattern             "${paths[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/partition-split-routing.test.js
          node scripts/check-guideline-literals.js "${paths[@]}"
          node scripts/check-guideline-decision-boundaries.js "${paths[@]}"
          node scripts/check-guideline-ambient-intrinsics.js "${paths[@]}"
          node scripts/check-guideline-silent-catch.js "${paths[@]}"
          git diff --check

      - name: Record content-bound v11 attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_hashes="$(sha256sum             src/utils/strict-own-data.js             src/partition/partition-split-merge-manager.js             src/partition/partition-split-merge-evaluation-context.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js             src/partition/partition-split-routing.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/partition-split-routing.test.js | tr '\n' ';')"
          node scripts/solve.js note             --id "$QUEST_ID"             --finding "A1-v11 run ${GITHUB_RUN_ID}: exact rejected v10 candidate is right-reason red for post-load Map replacement and over-wide snapshot dimensions; exact v11 candidate makes v10/v11 closure and focused suites green. Candidate sha256: ${candidate_hashes}"             --kind evidence             --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note             --id "$QUEST_ID"             --attempt "A1-v11 captures the snapshot grouping Map constructor and enforces pre-copy one-bind-budget row/column bounds through strict-own-data while preserving v10; v10/v11 closure, focused tests and guardrails green in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Restore authored product tree and preserve Solver records
        shell: bash
        run: |
          set -euo pipefail
          git restore --             src/utils/strict-own-data.js             src/partition/partition-split-merge-manager.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js             src/partition/partition-split-routing.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/partition-split-routing.test.js
          rm -f src/partition/partition-split-merge-evaluation-context.js

          git rm .github/workflows/a1-v11-seal-and-attempt.yml

          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n'             .github/workflows/a1-v11-seal-and-attempt.yml             solve/quests/partition-key-ordering-owner-completion-v10/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v11/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v11/quest.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-attempt mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             solve/quests/partition-key-ordering-owner-completion-v10/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v11/quest.json             solve/quests/partition-key-ordering-owner-completion-v11/log.ndjson
          git commit -m "0.3 A1: supersede v10 and record exact v11 attempt"

          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"
