name: pr73-readiness-pending-r7-proof

on:
  push:
    branches:
      - "investigate/pr73-readiness-pending-r7-20261006"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Red on exact PR73 source
        env:
          BASE_SHA: 6df3ec5e1c09ef14e6a743dc805399c1092712a8
        run: |
          set -euo pipefail
          git checkout "$BASE_SHA" -- src/rebalancer/unified-rebalancer-critical-topology-methods.js
          set +e
          node test/rebalancer/topology-settling-node-ready-lease-wake.test.js >"$RUNNER_TEMP/red.tap" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/red.tap"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::R7 deferred-readiness witness unexpectedly passes on exact PR73 source"
            exit 1
          fi
          grep -q "PENDING readiness plus ready canonical liveness" "$RUNNER_TEMP/red.tap"

      - name: Green on R7 candidate
        run: |
          set -euo pipefail
          git checkout "$GITHUB_SHA" -- src/rebalancer/unified-rebalancer-critical-topology-methods.js
          node test/rebalancer/topology-settling-node-ready-lease-wake.test.js

      - name: Adjacent readiness and topology proofs
        run: |
          set -euo pipefail
          node test/rebalancer/formation-barrier-spread-cure-lane-discrimination.test.js
          node test/rebalancer/startup-authority-topology-settling-contract.test.js
          node test/rebalancer/runtime-service-expired-lease-candidate-admission.test.js
          node test/control-plane/readiness-deferred-denial-evidence-absent.test.js
          node test/control-plane/node-liveness-semantic-projection-owner.test.js

      - name: Architecture model contracts
        run: npm run model:contracts

      - name: Scoped lint
        run: |
          npx eslint \
            src/rebalancer/unified-rebalancer-critical-topology-methods.js \
            test/rebalancer/topology-settling-node-ready-lease-wake.test.js
