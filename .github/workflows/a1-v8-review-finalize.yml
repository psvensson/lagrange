name: a1-v8-review-finalize

on:
  push:
    branches:
      - review/a1-v8-post-attempt-final
    paths:
      - .github/workflows/a1-v8-review-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify exact v8 candidate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected.sha256" <<'EOF'
          9aba852cf52c65e3e63927a28fdd0438a27864c96188ab5b77f71842aa31b81e  src/partition/partition-split-merge-manager.js
          f81f23a63712fec14cf2dc444068f3c2d342eef38b98c9d2872ffb2fa2f9e21e  src/partition/partition-split-merge-evaluation-context.js
          028aea46bf6b714c1a141ff374cf09bdf22151b28bda075217fe98b8ebe50e73  src/partition/split-key-comparator.js
          395b9c3e6ba6b00a1c86a94943b0d03584e7975e025004538e1cc2385aa3590b  src/partition/partition-split-merge-manager-core-methods.js
          38f1180c5e3c7a30a1ad45009863c084d10c3c94863af5bbea90a013a3b912d5  src/partition/partition-split-merge-manager-evaluation-methods.js
          36b32055b89b9c19efa211abd67193a65d61a730b5720c836e533caa6ceeb35c  src/partition/partition-split-merge-manager-transition-methods.js
          75731d4832f734ff89f063f35a4577443920b40376cb012d8eb20e55a54bcbc4  test/partition/routing-key-comparator.test.js
          8369fc9ec7eb7da7e75eacbc8589f1ad3e96f0a21e123725f8e0f544e6a28db7  test/partition/merge-auto-execution.test.js
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.sha256"
          sha256sum --check "$RUNNER_TEMP/expected.sha256"

      - name: Prove v6 v7 v8 closure and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checks/partition-key-ordering-owner-completion-v6.js
          node scripts/checks/partition-key-ordering-owner-completion-v7.js
          node scripts/checks/partition-key-ordering-owner-completion-v8.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v8
          npm run test:file --             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/split-merge-capacity-preflight.test.js

      - name: Prove landing guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/partition-split-merge-manager.js
            src/partition/partition-split-merge-evaluation-context.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
          )
          npm run test:complexity
          npm run test:complexity:scoped -- "${files[@]}"
          npm run audit:file-size
          node node_modules/eslint/bin/eslint.js --no-warn-ignored --no-error-on-unmatched-pattern             "${files[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-guideline-decision-boundaries.js "${files[@]}"
          node scripts/check-guideline-ambient-intrinsics.js "${files[@]}"
          node scripts/check-guideline-silent-catch.js "${files[@]}"
          git diff --check

      - name: Refresh canonical generated state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-global-owner-debt-inventory.js --refresh
          node scripts/generate-priority-recovery-owner-inventory.js
          npm run -s test:metadata:refresh

      - name: Commit clean review head
        shell: bash
        env:
          BRANCH: review/a1-v8-post-attempt-final
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v8-review-finalize.yml
          git add --             solve/changes/global-owner-debt-inventory/inventory.json             solve/changes/priority-recovery-owner-inventory/inventory.json             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m "review: finalize generated state for A1-v8"
          test -z "$(git status --porcelain)"

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"
