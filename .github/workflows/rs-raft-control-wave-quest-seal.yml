# Canonical RED Quest seal on design-only branch, not production or main.
name: rs-raft-control-wave-quest-seal
on:
  push:
    branches: [design/rs-raft-seed-control-wave-20261014]
    paths: [.github/workflows/rs-raft-control-wave-quest-seal.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Seal genuinely red before any source change
        shell: bash
        run: |
          set -euo pipefail
          H="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$H"
          npm ci
          node scripts/solve.js start --id seed-shared-current-control-wave --json
          node scripts/solve.js probe --id seed-shared-current-control-wave --json
          git diff --check
          git add -- solve/quests/seed-shared-current-control-wave/quest.json solve/quests/seed-shared-current-control-wave/log.ndjson
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: seal RED shared control-wave owner Quest'
          git fetch --no-tags origin refs/heads/design/rs-raft-seed-control-wave-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$H" || {
            echo 'Ref moved; preserve evidence only'; exit 1
          }
          git push origin HEAD:refs/heads/design/rs-raft-seed-control-wave-20261014
      - name: Retain Quest artifacts whether seal is accepted or refused
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-control-wave-quest-${{ github.sha }}
          path: solve/quests/seed-shared-current-control-wave/
          retention-days: 14
          if-no-files-found: warn
