# Bounded same-test-byte transport lifetime differential. No GCP spend or main merge.
name: u1-transport-handler-origin-differential-20261020
on:
  push:
    branches: [verify/u1-gcp-20261020]
    paths:
      - .github/workflows/u1-transport-handler-origin-differential-20261020.yml
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre-u1
            subject: 381750de29af647d446b19adedf1da53eb712093
          - label: final-u1
            subject: be25caa5f0c3612feec662d4feaa9ba28f8f34df
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.subject }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Execute exact unchanged tests once on selected source
        shell: bash
        env:
          LAGRANGE_RETRY_FAILED_ONCE: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ matrix.subject }}'
          npm ci
          mkdir -p test-output/u1-transport-identity
          printf '%s\n' '${{ matrix.subject }}' > test-output/u1-transport-identity/source-sha.txt
          set +e
          node scripts/run-classified-test-files.js --stdin \
             > test-output/u1-transport-identity/original-run.log 2>&1 <<'TESTFILES'
          test/node/replica-transport-handler-identity.test.js
          test/address/address-manager-peer-location-authority.test.js
          test/partition/raft-rs-transport-demux.test.js
          TESTFILES
          status=$?
          set -e
          printf '%s\n' "$status" > test-output/u1-transport-identity/original-exit.txt
          grep -E 'not ok test/|ok test/|# test-files total=' \
            test-output/u1-transport-identity/original-run.log | tail -n 40
          grep -q '# test-files total=3 ' test-output/u1-transport-identity/original-run.log
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Retain exact result including all reds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u1-transport-identity-${{ matrix.label }}-${{ github.run_id }}
          path: test-output/u1-transport-identity/
          retention-days: 14
          if-no-files-found: warn
