name: rs-raft-exact-source-export
on:
  push:
    branches: [resume/rs-raft-runtime-recovery-20261012]
    paths:
      - .github/workflows/rs-raft-exact-source-export.yml
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Export exact source, no dependencies or secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/rs-raft-source-export
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > test-output/rs-raft-source-export/SOURCE_SHA
          git archive --format=tar HEAD | gzip -n -6 > test-output/rs-raft-source-export/source.tar.gz
          sha256sum test-output/rs-raft-source-export/source.tar.gz > test-output/rs-raft-source-export/SHA256SUMS
          tar -tzf test-output/rs-raft-source-export/source.tar.gz | grep -qx package-lock.json
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-exact-source-${{ github.run_id }}
          path: test-output/rs-raft-source-export/
          retention-days: 7
          if-no-files-found: error
