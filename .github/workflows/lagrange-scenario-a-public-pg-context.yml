name: lagrange-scenario-a-public-pg-context

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/scenario-a-lagrange-public-pg-context-staging
    paths:
      - '.github/workflows/lagrange-scenario-a-public-pg-context.yml'
      - 'src/diagnostics/source-fingerprint.js'
      - 'test/distributed/harness/constants.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-live-admission.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-runtime-preflight.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-public-pg-context.js'
      - 'scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lagrange-scenario-a-public-pg-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove public PostgreSQL context ownership
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-lagrange-public-pg-context.js \
            scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js
          node scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js
