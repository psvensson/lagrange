name: a1-v9-governance-refresh
# retrigger on final pre-seal v9 evidence head

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/a1-v9-governance-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Refresh owner-debt inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-global-owner-debt-inventory.js --refresh
          node -e "const x=require('./solve/changes/global-owner-debt-inventory/inventory.json'); if(x.signalCounts?.complexity!==1794) process.exit(1)"
      - name: Commit generated governance state and self-remove
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v9-governance-refresh.yml
          git add solve/changes/global-owner-debt-inventory/inventory.json
          git commit -m "governance: refresh complexity inventory at 1794"
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          test "$remote_sha" = "$GITHUB_SHA"
          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"
