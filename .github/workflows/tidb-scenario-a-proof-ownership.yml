name: tidb-scenario-a-proof-ownership

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/payment-proof-ownership-repair
      - benchmark/stock-proof-ownership-staging
      - benchmark/delivery-proof-ownership-staging
    paths:
      - '.github/workflows/tidb-scenario-a-proof-ownership.yml'
      - 'test/distributed/harness/oltp-scenario-a-semantic-gate.js'
      - 'test/distributed/harness/oltp-scenario-a-new-order-contention-case.js'
      - 'test/distributed/harness/oltp-scenario-a-visibility-case.js'
      - 'test/distributed/harness/oltp-scenario-a-payment-case.js'
      - 'test/distributed/harness/oltp-scenario-a-order-status-case.js'
      - 'test/distributed/harness/oltp-scenario-a-delivery-case.js'
      - 'test/distributed/harness/oltp-scenario-a-stock-level-case.js'
      - 'scripts/checks/oltp-scenario-a-proof-ownership-guard.js'
      - 'scripts/checks/oltp-scenario-a-payment-case-guard.js'
      - 'scripts/checks/oltp-scenario-a-delivery-case-guard.js'
      - 'scripts/checks/oltp-scenario-a-stock-level-case-guard.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-scenario-a-proof-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove semantic proof ownership
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-payment-case.js \
            test/distributed/harness/oltp-scenario-a-delivery-case.js \
            test/distributed/harness/oltp-scenario-a-stock-level-case.js \
            scripts/checks/oltp-scenario-a-payment-case-guard.js \
            scripts/checks/oltp-scenario-a-delivery-case-guard.js \
            scripts/checks/oltp-scenario-a-stock-level-case-guard.js \
            scripts/checks/oltp-scenario-a-proof-ownership-guard.js
          node scripts/checks/oltp-scenario-a-payment-case-guard.js
          node scripts/checks/oltp-scenario-a-delivery-case-guard.js
          node scripts/checks/oltp-scenario-a-stock-level-case-guard.js
          node scripts/checks/oltp-scenario-a-proof-ownership-guard.js
