name: tidb-scenario-a-proof-ownership

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tidb-scenario-a-proof-ownership.yml'
      - 'test/distributed/harness/oltp-scenario-a-semantic-gate.js'
      - 'test/distributed/harness/oltp-scenario-a-proof-cases.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-proof-plan.js'
      - 'test/distributed/harness/oltp-scenario-a-new-order-contention-case.js'
      - 'test/distributed/harness/oltp-scenario-a-visibility-case.js'
      - 'test/distributed/harness/oltp-scenario-a-payment-case.js'
      - 'test/distributed/harness/oltp-scenario-a-order-status-case.js'
      - 'test/distributed/harness/oltp-scenario-a-delivery-case.js'
      - 'test/distributed/harness/oltp-scenario-a-stock-level-case.js'
      - 'test/distributed/harness/oltp-scenario-a-failure-atomicity-case.js'
      - 'test/distributed/harness/oltp-scenario-a-retryable-conflict-case.js'
      - 'test/distributed/harness/oltp-scenario-a-durability-case.js'
      - 'scripts/checks/oltp-scenario-a-proof-ownership-guard.js'
      - 'test/distributed/harness/oltp-comparison-history-store.js'
      - 'scripts/checks/oltp-comparison-history-store-guard.js'
      - 'data/tidb-comparison/history.ndjson'
      - 'data/tidb-comparison/progress-summary.json'
      - 'test/distributed/harness/oltp-comparison-static-web.js'
      - 'test/distributed/harness/oltp-comparison-svg-renderer.js'
      - 'docs/benchmarks/tidb-comparison-progress.svg'
      - 'docs/benchmarks/tidb-scenario-b-comparison.svg'
      - 'docs/benchmarks/tidb-comparison-progress.md'
      - 'docs/benchmarks/tidb-comparison-progress.html'
      - 'test/distributed/harness/scenario-b-risk-dataset.js'
      - 'test/distributed/harness/scenario-b-risk-oracle.js'
      - 'test/distributed/harness/scenario-b-comparators.js'
      - 'scripts/checks/scenario-b-risk-benchmark-guard.js'
      - 'test/distributed/harness/oltp-paired-sweep-runner.js'
      - 'scripts/checks/oltp-paired-sweep-runner-guard.js'
      - 'test/distributed/harness/scenario-b-latency-group-owner.js'
      - 'test/distributed/harness/scenario-b-movement-subphase.js'
      - 'scripts/checks/scenario-b-latency-movement-guard.js'
      - 'test/distributed/harness/scenario-b-fairness-gate.js'
      - 'scripts/checks/scenario-b-fairness-version-gate-guard.js'
      - 'scripts/checks/tidb-version-gated-comparison-publisher.js'
      - 'scripts/checks/comparative-benchmark-matrix-guard.js'
      - 'data/tidb-comparison/multi-system-matrix.json'
      - 'test/distributed/harness/comparative-matrix-runner.js'
      - 'test/distributed/harness/postgresql-comparison-static-web.js'
      - 'test/distributed/harness/citus-comparison-static-web.js'
      - 'test/distributed/harness/yugabyte-ignite-comparison-static-web.js'
      - 'test/distributed/harness/scenario-c-comparison-static-web.js'
      - 'test/distributed/harness/comparative-landing-svg-renderer.js'
      - 'test/distributed/harness/comparative-landing-tables.js'
      - 'test/distributed/harness/comparative-landing-page.js'
      - 'docs/benchmarks/postgresql-comparison-progress.svg'
      - 'docs/benchmarks/postgresql-comparison-progress.md'
      - 'docs/benchmarks/postgresql-comparison-progress.html'
      - 'docs/benchmarks/citus-comparison-progress.*'
      - 'docs/benchmarks/yugabyte-ignite-comparison-progress.*'
      - 'docs/benchmarks/scenario-c-feature-store-progress.*'
      - 'docs/benchmarks/scenario-b-shape-crossover.svg'
      - 'docs/benchmarks/comparative-overview.svg'
      - 'docs/benchmarks/README.md'
      - 'docs/benchmarks/index.html'
      - 'solve/epics/multi-system-comparative-benchmark-matrix.md'
      - 'solve/epics/distributed-scaleout-and-provenance-benchmark-series.md'
      - 'test/distributed/harness/lagrange-evolution-static-web.js'
      - 'scripts/checks/distributed-scaleout-provenance-guard.js'
      - 'docs/benchmarks/lagrange-metrics-evolution.*'
      - 'test/distributed/harness/scaleout-node-rf-comparison-static-web.js'
      - 'docs/benchmarks/scaleout-3to5-node-rf3-progress.*'
      - 'test/distributed/harness/scaleout-series-experiments.js'
      - 'test/distributed/harness/partition-granularity-comparison-static-web.js'
      - 'docs/benchmarks/partition-granularity-sweep-progress.md'
      - 'docs/benchmarks/partition-granularity-sweep-progress.html'
      - 'docs/benchmarks/partition-granularity-sweep-progress.svg'
      - 'test/distributed/harness/scenario-b-rtt-working-set-static-web.js'
      - 'docs/benchmarks/scenario-b-rtt-working-set-crossover.md'
      - 'docs/benchmarks/scenario-b-rtt-working-set-crossover.html'
      - 'docs/benchmarks/scenario-b-rtt-working-set-crossover.svg'
      - 'test/distributed/harness/movement-scenario-c-scaling-static-web.js'
      - 'docs/benchmarks/movement-and-scenario-c-scaling-progress.md'
      - 'docs/benchmarks/movement-and-scenario-c-scaling-progress.html'
      - 'docs/benchmarks/movement-and-scenario-c-scaling-progress.svg'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-scenario-a-proof-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove semantic proof ownership and planned Lagrange coverage
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-proof-cases.js \
            test/distributed/harness/oltp-scenario-a-lagrange-proof-plan.js \
            test/distributed/harness/oltp-comparison-history-store.js \
            scripts/checks/oltp-scenario-a-proof-ownership-guard.js \
            scripts/checks/oltp-comparison-history-store-guard.js \
            test/distributed/harness/oltp-comparison-static-web.js \
            test/distributed/harness/oltp-comparison-svg-renderer.js \
            test/distributed/harness/scenario-b-risk-dataset.js \
            test/distributed/harness/scenario-b-risk-oracle.js \
            test/distributed/harness/scenario-b-comparators.js \
            scripts/checks/scenario-b-risk-benchmark-guard.js \
            test/distributed/harness/oltp-paired-sweep-runner.js \
            scripts/checks/oltp-paired-sweep-runner-guard.js \
            test/distributed/harness/scenario-b-latency-group-owner.js \
            test/distributed/harness/scenario-b-movement-subphase.js \
            scripts/checks/scenario-b-latency-movement-guard.js \
            test/distributed/harness/scenario-b-fairness-gate.js \
            scripts/checks/scenario-b-fairness-version-gate-guard.js \
            scripts/checks/tidb-version-gated-comparison-publisher.js \
            test/distributed/harness/comparative-matrix-runner.js \
            test/distributed/harness/postgresql-comparison-static-web.js \
            test/distributed/harness/citus-comparison-static-web.js \
            test/distributed/harness/yugabyte-ignite-comparison-static-web.js \
            test/distributed/harness/scenario-c-comparison-static-web.js \
            test/distributed/harness/comparative-landing-svg-renderer.js \
            test/distributed/harness/comparative-landing-tables.js \
            test/distributed/harness/comparative-landing-page.js \
            test/distributed/harness/lagrange-evolution-static-web.js \
            test/distributed/harness/scaleout-node-rf-comparison-static-web.js \
            test/distributed/harness/scaleout-series-experiments.js \
            test/distributed/harness/partition-granularity-comparison-static-web.js \
            test/distributed/harness/scenario-b-rtt-working-set-static-web.js \
            test/distributed/harness/movement-scenario-c-scaling-static-web.js \
            scripts/checks/distributed-scaleout-provenance-guard.js \
            scripts/checks/comparative-benchmark-matrix-guard.js
          node scripts/checks/oltp-scenario-a-proof-ownership-guard.js
          node scripts/checks/oltp-comparison-history-store-guard.js
          node scripts/checks/scenario-b-risk-benchmark-guard.js
          node scripts/checks/oltp-paired-sweep-runner-guard.js
          node scripts/checks/scenario-b-latency-movement-guard.js
          node scripts/checks/scenario-b-fairness-version-gate-guard.js
          node scripts/checks/distributed-scaleout-provenance-guard.js
          node scripts/checks/tidb-version-gated-comparison-publisher.js --dry-run
