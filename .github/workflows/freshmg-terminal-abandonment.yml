name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind independent review to measured native-origin and checkpoint bytes
        shell: bash
        run: |
          set -euo pipefail
          expected=f5a06f643a8f389ea545e5673758cca249674fa9
          actual="$(gh pr view 111 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr comment 111 --repo psvensson/lagrange --body 'Independent adversarial review requested on exact head f5a06f643a8f389ea545e5673758cca249674fa9, measured source 6255634c71fa6c6c116e8e70252ef11f927f564f. Read evidence/learner-origin-20261009-review.md under the existing FreshMG Quest. Review exact original action provenance stored in the existing peer-identity row within the actual ConfState/applied transaction; conflicting origins, corrupt values, queued semantic outcome reads, group/action/index/term binding, same-file and shared-runtime reconstruction, checkpoint version-2 descriptor/payload equality, and old-image refusal. Actions 37918656129 passed seven files/263 reported assertions within unchanged budgets, strict scoped metrics/semantic counts and two exact-assertion mutation controls. Prior failed attempts retained. Rollback recovery uses the existing virtual clock and the actual owner retryAfterMs, not altered native timing. Checkpoint creation/scrubbing/payload validation is measured, NOT a complete native-origin target install/reopen. Missing origin grants no negative proof or successor attempt; no repository stamp update, CREATE/driver activation, global boot revocation, physical/GCP acceptance or main merge. PR110 generic recovery package remains a separate unmerged source. No author-issued independent approval or final gate relaxation is claimed.'
          gh pr edit 111 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 111 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Requested exact-head independent review; request success is not approval. Main and all preservation refs remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
