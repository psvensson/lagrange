name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind rereview to the exact corrected source and retained evidence
        shell: bash
        run: |
          set -euo pipefail
          expected=6d09b134c2ac0f7639b98751f4ed7f535367cb11
          actual="$(gh pr view 109 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr edit 109 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 109 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Rereview requested after review 5459955866: two same-owner complexity corrections, original native/holder/permit mutation controls, no extra await or authority expansion. Restart duration is explicitly unresolved and the complete Action is RED. Proof ran on hosted Linux, not GCP or a distributed cluster. Review the whole source scope and fixture limits; no prior rejection overridden or main/Quest/release approval claimed.' >> "$GITHUB_STEP_SUMMARY"
