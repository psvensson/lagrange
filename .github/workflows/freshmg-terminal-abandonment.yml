name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
env:
  BASE: ddff5a2c8b16635d287126e6a6b09f53951214b0
  WORK_BRANCH: work/freshmg-learner-authorization-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Start only existing proof runner
        run: |
          set -euo pipefail
          status="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$status" != RUNNING ]; then
            gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a
          fi
  learner-intent:
    needs: wake
    runs-on: [self-hosted, gcp]
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: learner-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE }}
          path: learner-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Add tests first with isolated copies of one closed schema fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/learner
          printf 'base=%s\ncarrier=%s\nrunner=%s\nrun=%s\n' "$BASE" "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_RUN_ID" > test-output/learner/provenance.txt
          npm ci
          npm run test:metrics:scoped -- src/rebalancer/replica-operation-message-group-membership-authorization.js > test-output/learner/source-metrics-before.txt 2>&1
          cp test-output/analysis/complexity-scoped.json test-output/learner/cyclomatic-before.json
          cp test-output/analysis/cognitive-complexity-scoped.json test-output/learner/cognitive-before.json
          python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/prepare-learner-authorization.py . tests > test-output/learner/test-preparation.txt
          python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/share-membership-schema-fixture.py . >> test-output/learner/test-preparation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/rebalancer/message-group-membership-branch-authorization.test.js test/integration/message-group-membership-claim-cache.integration.test.js
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'test: initial learner intent with isolated durable fixtures and real cache boundary'
          git rev-parse HEAD > test-output/learner/red-sha.txt
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          npm run test:file -- test/rebalancer/message-group-membership-branch-authorization.test.js > test-output/learner/red-unit.txt 2>&1
          unit=$?
          timeout 90s npm run test:file -- test/integration/message-group-membership-claim-cache.integration.test.js > test-output/learner/red-cache.txt 2>&1
          cache=$?
          set -e
          echo "$unit" > test-output/learner/red-unit-exit.txt
          echo "$cache" > test-output/learner/red-cache-exit.txt
          test "$unit" -eq 1
          test "$cache" -eq 1
          grep -q 'existing repository must record the initial exact learner intent' test-output/learner/red-unit.txt
          grep -q 'initial learner authorization method must exist on the real repository' test-output/learner/red-cache.txt
      - name: Implement the existing repository transition and refresh metadata
        run: |
          set -euo pipefail
          python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/prepare-learner-authorization.py . source > test-output/learner/source-preparation.txt
          npm exec --no -- eslint src/rebalancer/replica-operation-message-group-membership-authorization.js src/rebalancer/replica-operation-message-group-membership-owner-claim.js src/rebalancer/replica-operation-message-group-membership-permit.js src/rebalancer/replica-operation-repository.js test/rebalancer/message-group-membership-branch-authorization.test.js test/integration/message-group-membership-claim-cache.integration.test.js > test-output/learner/lint.txt 2>&1
          npm run test:metrics:scoped:strict -- test/rebalancer/message-group-membership-branch-authorization.test.js test/integration/message-group-membership-claim-cache.integration.test.js > test-output/learner/test-metrics.txt 2>&1
          npm run test:metrics:scoped -- src/rebalancer/replica-operation-message-group-membership-authorization.js > test-output/learner/source-metrics-after.txt 2>&1
          cp test-output/analysis/complexity-scoped.json test-output/learner/cyclomatic-after.json
          cp test-output/analysis/cognitive-complexity-scoped.json test-output/learner/cognitive-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('test-output/learner')
          for key in ['cyclomatic','cognitive']:
              before=json.loads((p/f'{key}-before.json').read_text())
              after=json.loads((p/f'{key}-after.json').read_text())
              assert after['count']<=before['count'],(key,before['count'],after['count'])
              print(key,before['count'],'->',after['count'])
          PY
          npm run test:metadata:refresh > test-output/learner/metadata.txt 2>&1
          npm run audit:shards > test-output/learner/shards.txt 2>&1
          git diff --check
          git add src/rebalancer/replica-operation-message-group-membership-authorization.js src/rebalancer/replica-operation-message-group-membership-owner-claim.js src/rebalancer/replica-operation-message-group-membership-permit.js src/rebalancer/replica-operation-repository.js test/shards/
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'feat: record initial learner intent under exact operation and membership holder'
          git rev-parse HEAD > test-output/learner/source-sha.txt
      - name: Same tests green, including actual SQL Raft CDC cache
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          npm run test:file -- test/rebalancer/message-group-membership-branch-authorization.test.js test/rebalancer/message-group-membership-operation-lane.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/reservation-file-backed-restart.test.js > test-output/learner/green-unit.txt 2>&1
          unit=$?
          timeout 90s npm run test:file -- test/integration/message-group-membership-claim-cache.integration.test.js > test-output/learner/green-cache.txt 2>&1
          cache=$?
          set -e
          echo "$unit" > test-output/learner/green-unit-exit.txt
          echo "$cache" > test-output/learner/green-cache-exit.txt
          tail -50 test-output/learner/green-unit.txt
          tail -50 test-output/learner/green-cache.txt
          test "$unit" -eq 0
          test "$cache" -eq 0
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('test-output/learner')
          for file,budget in [('green-unit.txt',2000),('green-cache.txt',30000)]:
              matches=re.findall(r'^ok (test/[^\n]+) \((\d+) assertions, (\d+)ms\)',(p/file).read_text(),re.M)
              assert len(matches)==(4 if budget==2000 else 1),matches
              assert all(int(ms)<budget for _,_,ms in matches), (file,matches)
          PY
      - name: Mutation controls reject terminal, holder and subject weakening
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          claim=Path('src/rebalancer/replica-operation-message-group-membership-owner-claim.js')
          auth=Path('src/rebalancer/replica-operation-message-group-membership-authorization.js')
          cases=[('terminal',claim,"  ['status', 'status'], ['workflow_step', 'workflowStep'], ['completed_at', 'completedAt'],\n",'',
            'ordinary terminal settlement racing initial authorization'),
            ('holder',claim,"  ['message_group_membership_owner_claim', 'messageGroupMembershipOwnerClaim'],\n",'',
            'holder renewal during initial authorization'),
            ('target',auth,'    permit.replicaIdentity === identity.targetReplicaId && permit.peerId === identity.targetPeerId;','    true;',
            'initial learner permit cannot substitute the source')]
          for key,p,old,new,witness in cases:
              original=p.read_bytes(); text=original.decode()
              assert text.count(old)==1,(key,text.count(old))
              try:
                  p.write_text(text.replace(old,new,1))
                  subprocess.run(['node','--check',str(p)],check=True)
                  result=subprocess.run(['npm','run','test:file','--','test/rebalancer/message-group-membership-branch-authorization.test.js'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  out=Path('test-output/learner')
                  (out/f'mutant-{key}.txt').write_bytes(result.stdout)
                  (out/f'mutant-{key}-exit.txt').write_text(str(result.returncode)+'\n')
                  assert result.returncode==1,(key,result.returncode)
                  text=result.stdout.decode()
                  assert any('not ok' in line and witness in line for line in text.splitlines()),(key,'wrong failure')
              finally:
                  p.write_bytes(original)
          PY
          git diff --exit-code -- src test
      - name: Preserve original failure and push exact measured WIP source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          test -z "$(git status --porcelain --untracked-files=no)"
          out=test-output/learner
          gh api repos/psvensson/lagrange/actions/artifacts/11554857284/zip > "$out/failed-37787377904.zip"
          echo 'f800881e390978eb96ca8e0d50858e844ec6126aa28f3a9cb203ab73462731a3  test-output/learner/failed-37787377904.zip' | sha256sum -c -
          node scripts/solve.js evidence add "$out/failed-37787377904.zip" --id "$QUEST" --text 'Initial learner run 37787377904: expected missing-method red engaged; lint refused one 105-character test line. No green/mutation/source approval. Original archive retained; corrected line and immutable schema-fixture reuse preserve all owner-write durability and original limits.' --json > "$out/prior-failure-canonical.json"
          git diff --binary "$BASE" > "$out/change.patch"
          git bundle create "$out/candidate.bundle" HEAD "^$BASE"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('test-output/learner')
          files={f.name:f.read_bytes() for f in p.iterdir() if f.is_file() and f.suffix!='.zip'}
          with zipfile.ZipFile(p/f'learner-proof-{os.environ["GITHUB_RUN_ID"]}.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name,data in files.items(): z.writestr(name,data)
              z.writestr('manifest.json',json.dumps({k:hashlib.sha256(v).hexdigest() for k,v in files.items()},indent=2)+'\n')
          PY
          node scripts/solve.js evidence add "$out/learner-proof-$GITHUB_RUN_ID.zip" --id "$QUEST" --text "Initial learner intent: actual repository row races and real single-seed SQL/Raft/CDC/cache, test-first red/green and three source mutation controls. Each unit still has an isolated WAL/FULL database; only immutable closed schema setup is shared. No runtime membership or CREATE activation; no independent approval." --json > "$out/canonical.json"
          node scripts/solve.js note --id "$QUEST" --attempt "Initial learner authorization implemented in existing repository, using shared claim/T0 row predicates and holder policy. GCP $GITHUB_RUN_ID measures missing method red, same unit and live-cache cases green, original hard time budgets, and exact terminal/holder/target mutation controls. Original issued action survives lost answer/terminality/takeover. Prior lint failure retained. Runtime consumer, committed learner, CREATE and debt-driver wiring remain incomplete. No new store or coordinator, no release approval." --json > "$out/attempt.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('test-output/learner')
          files={f.name:f.read_text() for f in p.iterdir() if f.is_file() and f.suffix not in ['.zip','.bundle']}
          record={'schema':'freshmg-initial-learner-proof/1','runId':int(os.environ['GITHUB_RUN_ID']),
            'baseSha':os.environ['BASE'],'carrierSha':os.environ['GITHUB_SHA'],
            'sourceSha':(p/'source-sha.txt').read_text().strip(),'runner':os.environ['RUNNER_NAME'],
            'independentApproval':False,'distributedAcceptance':False,
            'proofCeiling':'real repository and canonical SQLite row races; real single-seed SQL/Raft/CDC/cache with quiesced reconciliation and supplied runtime observations; no actual learner proposal or physical CREATE',
            'outputs':files,'sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in files.items()}}
          (Path('solve/quests')/os.environ['QUEST']/'evidence'/f'initial-learner-{os.environ["GITHUB_RUN_ID"]}.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          git add "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/initial-learner-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'evidence: retain initial learner intent red green and mutation proofs'
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$out/published-sha.txt"
      - name: Archive every outcome and recoverable candidate
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/learner
          git status --porcelain > test-output/learner/final-status.txt
          git diff --binary > test-output/learner/uncommitted.patch
          git diff --binary "$BASE" > test-output/learner/full-work.patch
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create test-output/learner/recovery.bundle HEAD "^$BASE"
          fi
          find test-output/learner -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/learner/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-initial-learner-${{ github.run_id }}-${{ github.run_attempt }}
          path: learner-${{ github.run_id }}/test-output/learner/
          retention-days: 14
          if-no-files-found: error
