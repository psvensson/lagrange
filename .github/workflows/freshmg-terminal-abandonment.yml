name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind rereview to the measured delivery/native interaction
        shell: bash
        run: |
          set -euo pipefail
          expected=8ece20f70392314ceba49e4e787b800bc14d07d6
          actual="$(gh pr view 109 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr comment 109 --repo psvensson/lagrange --body 'Independent category-complete rereview requested on 8ece20f70392314ceba49e4e787b800bc14d07d6. New source d9e87b2961993121d75df11d3a177d380ad790df binds the existing router-owned local/socket delivery lifetime through the existing semantic port into the native turn immediately before proposal. Actual in-process IDENTIFY/SERVICE_MESSAGE, same-boot replacement, shutdown/reinitialize, UNKNOWN and genuine queued Ready-send controls; nine files/294 reported assertions meet unchanged budgets. Three mutations prove native execution, socket identity and local-lifetime token checks. Read evidence/delivery-lifetime-20261009-review.md under the existing FreshMG Quest and architecture/contracts/message-group-learner-delivery-lifetime.md. This does NOT resolve the canonical node-row-only boot counterexample or global operation/boot atomicity. Refusal retains the durably issued action; generic privileged native callers keep their prior trust contract. Review authority/lifetime/queue/replay/terminal semantics and fixture fidelity without assuming either source correctness or complete activation. No CREATE, exact committed-action receipt, main merge, independent author approval, restart-duration clearance or full cutover is claimed. First unengaged queue attempt is retained, not counted as positive proof.'
          gh pr edit 109 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 109 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Requested exact-head independent review; request success is not approval. Main and preservation refs remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
