name: freshmg-terminal-abandonment
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
env:
  EXPECTED: ee4ddd5ca11eb5edec2b947554419914f8b8d778
  CANDIDATE: b4aabb36641a15269e0425e1ba3336be106094ac
  WORK_BRANCH: work/freshmg-terminal-abandonment-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  preserve-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify original archives and recover the exact measured commit
        run: |
          set -euo pipefail
          mkdir -p test-output/failed-only-retention
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          out=Path('test-output/failed-only-retention')
          specs=[(37781772537,11552577293,'836a6f1072d0af7630312262e09a38d646d3be139974eeae668da6c0444ca72f','measurement-passed-publication-failed'),
            (37780990679,11552945556,'99d84007a01c3fd4af90ddc003a65375baad0dfaddd9a40b8b6a1ab597535c09','test-fixture-strict-metrics-failed')]
          records=[]
          for run,aid,digest,verdict in specs:
              file=out/f'original-{run}.zip'
              with file.open('wb') as dest:
                  subprocess.run(['gh','api',f'repos/psvensson/lagrange/actions/artifacts/{aid}/zip'],stdout=dest,check=True)
              assert hashlib.sha256(file.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(file) as z:
                  names=z.namelist()
                  assert len(names)==len(set(names))
                  assert all('/' not in n and '\\' not in n for n in names)
                  checked=0
                  for line in z.read('FINAL_SHA256SUMS').decode().splitlines():
                      expected,path=line.split(None,1)
                      member=Path(path.strip()).name
                      assert hashlib.sha256(z.read(member)).hexdigest()==expected,member
                      checked+=1
                  if run==37781772537:
                      assert z.read('source-sha.txt').decode().strip()==os.environ['CANDIDATE']
                      assert z.read('final-status.txt')==b'' and z.read('uncommitted.patch')==b''
                      for name,code in [('red-unit',1),('red-cache',1),('green-unit',0),('green-cache',0),('mutant-status',1),('mutant-step',1),('mutant-sql',1),('lint',0),('shards',0),('test-metrics',0)]:
                          assert int(z.read(name+'-exit.txt'))==code,name
                      (out/'candidate.bundle').write_bytes(z.read('candidate.bundle'))
                      (out/'measurement.json').write_bytes(z.read('measurement.json'))
                  records.append({'runId':run,'artifactId':aid,'archiveSha256':digest,
                      'verifiedManifestMembers':checked,'verdict':verdict})
          (out/'verified-archives.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          git bundle verify test-output/failed-only-retention/candidate.bundle
          git fetch test-output/failed-only-retention/candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor "$EXPECTED" "$CANDIDATE"
          test "$(git rev-list --count "$EXPECTED..$CANDIDATE")" -eq 2
          git checkout --detach "$CANDIDATE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git diff --name-only "$EXPECTED" -- src)" = src/rebalancer/replica-operation-message-group-membership-authorization.js
          echo 'd01217f68be1e6f817207750bcf6f389869a2f4016585cc6a2c78802c4fb55f0  src/rebalancer/replica-operation-message-group-membership-authorization.js' | sha256sum -c -
          git diff --name-status "$EXPECTED" > test-output/failed-only-retention/recovered-paths.txt
      - name: Persist original evidence and publish without repeating measurements
        run: |
          set -euo pipefail
          npm ci
          out=test-output/failed-only-retention
          for run in 37781772537 37780990679; do
            node scripts/solve.js evidence add "$out/original-$run.zip" --id "$QUEST" --text "Original failed-only T1 attempt $run: exact red/green, guardrail and publication results retained. Measurement 37781772537 passed; packaging failed because zip was absent. No repeated product measurement or changed outer verdict." --json > "$out/canonical-$run.json"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('test-output/failed-only-retention')
          record=json.loads((out/'measurement.json').read_text())
          record['retentionRun']=int(os.environ['GITHUB_RUN_ID'])
          record['originalWorkflowConclusion']='failure'
          record['publicationFailure']='zip command absent after all required measurements passed; exact committed source recovered from verified bundle'
          archives=json.loads((out/'verified-archives.json').read_text())
          for a in archives:
              a['canonicalEvidence']=json.loads((out/f"canonical-{a['runId']}.json").read_text())
          record['retainedAttempts']=archives
          q=Path('solve/quests')/os.environ['QUEST']
          (q/'evidence/failed-only-37781772537.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          node scripts/solve.js note --id "$QUEST" --finding 'Recovered exact b4aabb366 from hash-verified 37781772537 bundle after zip executable absence stopped packaging. All required unit/live-cache red-green and three mutation controls passed; no remeasurement or runtime edit. Retained 37780990679 strict-fixture failure as well as previously canonical lint failure. T1 newly selected terminal abandonment is FAILED/FAILED only; successful REMOVED and mixed rows refuse even with stale learner hints. Existing exact SQL status/step predicates defeat delayed failed-row commands after success. Review, runtime activation and full cutover remain open.' --kind evidence --json > "$out/recovery-note.json"
          git add -- "solve/quests/$QUEST/evidence/failed-only-37781772537.json" "solve/quests/$QUEST/log.ndjson"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'evidence: retain exact failed-only source proof and publication recovery'
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$out/published-sha.txt"
          git status --porcelain > "$out/final-status.txt"
      - name: Request independent review at published head
        run: |
          set -euo pipefail
          exact="$(git rev-parse HEAD)"
          gh pr comment 107 --repo psvensson/lagrange --body "Review 4219025228 corrected at exact $exact. Newly selected terminal abandonment requires FAILED/FAILED; successful REMOVED and mixed terminal states refuse. Same-row CAS defeats stale failed-row writes after success. GCP 37781772537: same tests red then green, 149 regression assertions, two live-cache cases, and three mutation kills. Original packaging failure remains documented; exact measured commit recovered from a verified bundle, not rerun. See evidence/failed-only-37781772537.json. Request category-complete exact-head review, not activation or full-cutover approval."
          gh pr edit 107 --repo psvensson/lagrange --add-reviewer @copilot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: failed-only-retention-${{ github.run_id }}
          path: test-output/failed-only-retention/
          retention-days: 14
          if-no-files-found: error
