name: freshmg-terminal-abandonment
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
env:
  EXPECTED: f1487f97b4444f708aa0624ccd75d453714d427c
  WORK_BRANCH: work/freshmg-terminal-abandonment-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  retain-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify and persist both positive and failed original archives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/t1-retention
          npm ci
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          records=[]
          archives=[
            (37775751002,11549548269,'585ad9c0062c7b33c569ee8bbebe65d6ec8185541ac0cfdb249232555235bbda','test-output/t1/','passed'),
            (37776477963,11550360990,'d3dd0155d4db51909aa055b401d5359b41e52c47999ab52a83c902ea3fbb3598','test-output/t1-cache/','failed-harness-oracle'),
            (37777372340,11550855904,'1ff24efe70af75cda81b7f9a652e8416bbecc7cd0f2936dc267a33538a52a3da','test-output/t1-cache/','passed')]
          for run,artifact,digest,prefix,verdict in archives:
              file=Path(os.environ['RUNNER_TEMP'])/f't1-proof-{run}-{os.environ["GITHUB_RUN_ID"]}.zip'
              with file.open('wb') as output:
                  subprocess.run(['gh','api',f'repos/psvensson/lagrange/actions/artifacts/{artifact}/zip'],stdout=output,check=True)
              assert hashlib.sha256(file.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(file) as z:
                  count=0
                  for line in z.read('SHA256SUMS').decode().splitlines():
                      expected,name=line.split(None,1)
                      entry=name.strip().removeprefix(prefix)
                      assert hashlib.sha256(z.read(entry)).hexdigest()==expected,entry
                      count+=1
                  source=z.read('source-sha.txt').decode().strip()
              evidence=subprocess.run(['node','scripts/solve.js','evidence','add',str(file),
                  '--id',os.environ['QUEST'],'--text',f'T1 {verdict} original Actions run {run}; archive and every member verified before canonical upload. Not full-cutover proof.','--json'],
                  text=True,stdout=subprocess.PIPE,check=True)
              receipt=json.loads(evidence.stdout)
              records.append({'runId':run,'artifactId':artifact,'sourceSha':source,'verdict':verdict,
                  'archiveSha256':digest,'verifiedManifestMembers':count,'canonicalEvidence':receipt})
          record={'schema':'freshmg-t1-retained-proofs/1','retentionRun':int(os.environ['GITHUB_RUN_ID']),
              'reviewedWorkSha':os.environ['EXPECTED'],'independentApproval':False,'distributedAcceptance':False,
              'artifacts':records}
          dest=Path('solve/quests')/os.environ['QUEST']/'evidence'/'terminal-abandonment-retention.json'
          assert not dest.exists(), 'do not overwrite existing retained proof'
          dest.write_text(json.dumps(record,indent=2)+'\n')
          Path('test-output/t1-retention/retention.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          node scripts/solve.js note --id "$QUEST" --attempt 'T1 terminal abandonment increment and live SQL/Raft/CDC/cache proof complete as a bounded WIP. Actual test-first and source-revert negatives, repaired positives, three predicate mutants, failed cache HLC oracle, strict integration-test metrics and exact original archives retained. No external membership or CREATE activation. Request separate exact-head source/harness review; prior branches and full Quest remain unapproved.' --json > test-output/t1-retention/attempt.json
          git diff --check
          git diff --exit-code -- src test scripts .github
      - name: Push evidence only, update current review packet, then request independent review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED"
          git add "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/terminal-abandonment-retention.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: retain exact T1 source test failure and cache proof archives'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          candidate="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$candidate"
          echo "$candidate" > test-output/t1-retention/published-sha.txt
          cat > "$RUNNER_TEMP/pr107-body.md" <<EOF
          ## Exact current source-review packet

          Head **$candidate**; source behavior measured at **435320302ac976d60abedeffc978e43f0edb76d6**, latest test/cache candidate **4ece9393a9fe475ba6a79be8c76c420c1908f2e3**. Base **76c3a6175142a88cb79f332409d95587216c06ba**, existing sealed message-group-fresh-identity-membership Quest. No main merge, terminal landing, planner/handler unpark, physical CREATE or membership REMOVE activation. Parent #105/#106 and C0 retain their separate open reviews.

          ## Implemented T1 responsibility

          The existing selectMessageGroupMembershipBranch now allows a terminal operation with a committed learner to select exact target abandonment under the current live holder. Its same-row CAS matches exact terminal status/step/completed_at and retains immutable O/S/T/source generation, holder, learner/prior permit, boot and absent voter/removal-stamp predicates. PROMOTE remains nonterminal-only. Promotion committed first retains J1 forward direction. Selection retains membership lane/debt and changes no ordinary status, completed_at, reservation or cleanup claim. Recorded intent is not a runtime dispatch grant.

          ## Actual GCP proof

          **37775751002**: new tests red on inherited source; same tests and regressions green (**4 files / 141 reported assertions**). Three source mutations caught at named assertions: absent terminal-time predicate, terminal promotion admission, absent holder predicate. Exact source restored; lint and regenerated shard audit pass. One inherited source cyclomatic violation decreased 45 to 44; no cognitive/decision-boundary violations. This is not the full static/corpus gate.

          **37777372340**: live SQL/Raft -> CDC -> SystemTableCache test passes; reverting only T1 source fails at the actual terminal branch. Same four files /141 reported assertions pass; strict integration-test complexity and current metadata audits pass. Test reuses the known #105 fixture: ordinary coordinator shutdown is joined before synthetic rows, while real SQL/Raft/CDC/cache remain live. A committed-learner stamp is supplied fixture data, not a physical admission grant. The test verifies one exact terminal CAS, immutable ordinary fields, retained debt and lane, observational replay, and a strictly newer producer-owned origin HLC.

          **37776477963** remains FAILED: the original oracle mistakenly treated cache-only updated_at_hlc as immutable. Runtime already recorded the correct intent; the correction imports the existing HLCTimestamp ordering and explicitly asserts advancement. No runtime edit, timeout increase, or silent test removal fixed that failure.

          All three original archives, source snapshots/bundles and raw outputs are canonically retained after archive/member checks and Solver re-download/hash verification. Read evidence/terminal-abandonment-retention.json and the per-run records under the existing Quest. Author self-review is not independent approval.

          ## Required review and remaining product work

          Review exact **$candidate** for same-row terminal/promotion race exclusion, unchanged source/target subject, owner renewal/takeover/boot checks, unknown results, no lane/debt loss and harness fidelity. The file-backed tests substitute the distributed gateway; the cache test uses the real single-seed data path with quiesced reconciliation. Neither proves full membership driver, live learner admission/removal, multi-host replacement, seed-loss recovery or cutover/A1-v13 compatibility.

          Return explicit category-complete ACCEPT/REJECT of this bounded source increment. Full learner-authorization/runtime/CREATE wiring and debt driver remain required. Do not merge or approve merely from passing counts.
          EOF
          gh pr edit 107 --repo psvensson/lagrange --title 'FreshMG: terminal learner abandonment with live SQL and cache proof' --body-file "$RUNNER_TEMP/pr107-body.md"
          for i in 1 2 3 4 5; do
            actual="$(gh pr view 107 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
            [ "$actual" = "$candidate" ] && break
            sleep 2
          done
          test "$actual" = "$candidate"
          gh pr edit 107 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 107 --repo psvensson/lagrange --json headRefOid,url,reviewRequests > test-output/t1-retention/review-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-t1-retention-${{ github.run_id }}
          path: test-output/t1-retention/
          retention-days: 14
          if-no-files-found: error
