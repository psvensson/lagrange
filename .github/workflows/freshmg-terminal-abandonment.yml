name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind independent review to exact recovered-outcome recording bytes
        shell: bash
        run: |
          set -euo pipefail
          expected=85711505b502950ddfd095e108d31df237fb7464
          actual="$(gh pr view 113 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr comment 113 --repo psvensson/lagrange --body 'Independent category-complete adversarial review requested on exact head 85711505b502950ddfd095e108d31df237fb7464; measured source 292a2c6579542536d993eff8b876a34ec4783a80. Read evidence/learner-recording-20261009-review.md and architecture/contracts/message-group-learner-outcome-recording.md. Review actual same-turn native origin/witness, original action and old-term binding, final authoritative row and exact CAS, holder/terminal interleavings, UNKNOWN/readback and no-effect replay, ordinary-terminal membership debt, host-bound callback versus wire permission, and test fidelity. Normal-driver run37943949068: eight files/284 reported assertions within unchanged budgets; three exact-assertion mutations detect wrong-action borrowing, old-holder CAS overwrite and false success on unavailable readback. Source restored and artifacts hash-verified. Native/operation databases reopen in one process, NOT SIGKILL. Separate SQL/Raft/CDC visibility test has explicitly supplied native evidence, not a single full distributed proof. Cross-node takeover and terminal-in-CAS remain follow-up controls. No full driver, current CREATE, ordered successor issuance, global metadata revocation, physical GCP/lab acceptance, main merge or final compatibility proof. Native action history is not current execution permission. Inherited complexity and full-lab/timing gates remain; do not infer source correctness from bounded greens or request more rereads as cross-group atomicity. Reuse the existing owners and identify any concrete first violation.'
          gh pr edit 113 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 113 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Exact-head independent review requested. This successful request is not source approval; main and preserved refs remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
