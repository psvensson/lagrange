name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind independent review to the exact runtime-consumer source and evidence
        shell: bash
        run: |
          set -euo pipefail
          expected=ff8c95ee3546458db0154e7eb8920bcd1978b9c4
          actual="$(gh pr view 109 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr edit 109 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 109 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Requested category-complete owner-interaction, recovery, concurrency and harness-fidelity review. Known lab FAIL, complexity/census obligations and incomplete production driver remain explicit. No main merge, source approval, C0/FreshMG closure or release certification.' >> "$GITHUB_STEP_SUMMARY"
