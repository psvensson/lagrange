name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind independent review to the already pushed source and evidence
        shell: bash
        run: |
          set -euo pipefail
          expected=05a9883ae3ec0e556258bda73d99078ed2faab19
          actual="$(gh pr view 108 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr edit 108 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 108 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Requested category-complete independent review of dormant initial learner intent, exact holder/terminal/target predicates, unknown results and fixture fidelity. No source landing or full cutover approval.' >> "$GITHUB_STEP_SUMMARY"
