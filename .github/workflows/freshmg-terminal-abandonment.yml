name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind independent review to exact registered recipient and proof ceiling
        shell: bash
        run: |
          set -euo pipefail
          expected=d3d947f2d98ca9ea03f1cae91403ff551ee4d18d
          actual="$(gh pr view 114 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr comment 114 --repo psvensson/lagrange --body 'Independent adversarial review requested on exact head d3d947f2d98ca9ea03f1cae91403ff551ee4d18d, measured source 92504f38eee031a7f5536b695e48eaa0cc17a179. Read evidence/registered-learner-20261009-review.md and registered-learner-37963538484.json under the existing FreshMG Quest. Review explicit existing-witness routing, actual router second-argument delivery context, group/action binding, handler/service/native-port lifetime, trusted workflow callback versus payload evidence, response classification and same-owner JOINT handling. Actions37963538484: normal better-sqlite3,12files/313 runner-reported assertions within unchanged limits; four exact-assertion mutations including actual native DB/port replacement; source restored and212 manifest members rehashed. The test scheduling wrapper uses the existing operation-port constructor over real answers because overriding a frozen method with Proxy was invalid. Prior cancelled, patch-anchor and lint attempts remain retained. The JOINT control supplies a digest-valid joint projection from a native observation; this run does NOT perform native joint entry/exit. Actual routers use in-process sockets; operation SQL/hosted service descriptor are explicit fixtures. Separate cache and SIGKILL regressions do not establish distributed composition. PR113 finding4231684822 remains OPEN: row-CAS equality does not atomically fence lease expiry/canonical boot changes when the operation row is unchanged. No contract reinterpretation, extra metadata reread claimed atomic, automatic workflow progression, CREATE unpark, successor permission, main merge or final gate clearance. Review source and test fidelity without treating a component green as full-cutover approval. Author review is not independent approval.'
          gh pr edit 114 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 114 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Exact-head independent review requested. Request success is not source approval, commit-authority clearance or cutover completion.' >> "$GITHUB_STEP_SUMMARY"
