name: freshmg-learner-authorization
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
jobs:
  request-exact-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind rereview to actual process-loss and exact refusal classification
        shell: bash
        run: |
          set -euo pipefail
          expected=bcbf5e762ba2df9ea1e5bd12a78ecd1c728f0532
          actual="$(gh pr view 113 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          gh pr comment 113 --repo psvensson/lagrange --body 'Independent adversarial rereview requested on exact head bcbf5e762ba2df9ea1e5bd12a78ecd1c728f0532; measured source 8f8213d994b84c3c5858525dbdc91de835e59b5d. Review 4231271062 correction: keep missing history UNKNOWN, temporary native/read/witness unavailability UNAVAILABLE, and invalid or contradictory origin evidence CONFLICT without changing debt. Actual SIGKILL schedules now cover native commit before recording, ordinary failed debt, and operation commit before SQL answer. New processes adopt a different logical holder only after exact expiry and read another existing voter without new membership proposals. First-record requests come from the durable operation-row owner; the answer-loss case deliberately tests original request redelivery, not automatic recovery discovery. Add terminal competitor inside actual CAS. Nine files/290 reported assertions meet unchanged budgets; two classification mutations and a wrong-signal mutation fail exact assertion events. Read evidence/learner-process-20261009-review.md and learner-process-37948946816.json under the existing Quest, plus the updated recording contract. Review process ownership/engagement, shared-fixture equivalence, exact immutable action, holder/terminal CAS, replay and classification fidelity. Operation SQL is a local gateway and native transport in-process: this is OS process loss, NOT power loss or physical cross-host/Raft-SQL failover. No full driver, current CREATE, successor-action grant, main merge or final gate clearance. Holder takeover is not proof of predecessor noncommitment. Earlier independent findings and full-lab/timing obligations are not waived. This author response is not independent approval.'
          gh pr edit 113 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 113 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Exact-head rereview requested; request success is not source approval or cutover closure.' >> "$GITHUB_STEP_SUMMARY"
