name: freshmg-terminal-abandonment
on:
  push:
    branches: [ops/freshmg-terminal-abandonment-20261008]
    paths: [.github/workflows/freshmg-terminal-abandonment.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-terminal-abandonment-20261008
  cancel-in-progress: false
env:
  BASE: ee4ddd5ca11eb5edec2b947554419914f8b8d778
  WORK_BRANCH: work/freshmg-terminal-abandonment-20261008
  QUEST: message-group-fresh-identity-membership
  SOURCE: src/rebalancer/replica-operation-message-group-membership-authorization.js
  UNIT: test/rebalancer/message-group-membership-branch-authorization.test.js
  CACHE: test/integration/message-group-membership-claim-cache.integration.test.js
jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Start only the existing proof runner
        run: |
          set -euo pipefail
          status="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$status" != RUNNING ]; then
            gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a
          fi
  correct-and-prove:
    needs: wake
    runs-on: [self-hosted, gcp]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: t1-failed-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE }}
          path: t1-failed-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind reviewed source and add tests first
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/t1-failed-only
          printf 'base=%s\ncarrier=%s\nrunner=%s\nrun=%s\n' "$BASE" "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_RUN_ID" > test-output/t1-failed-only/provenance.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm ci
          python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/prepare-failed-only-abandonment.py . tests > test-output/t1-failed-only/preparation.txt
          node --check "$UNIT"
          node --check "$CACHE"
          git diff --exit-code "$BASE" -- src
          git add -- "$UNIT" "$CACHE"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'test: successful replacements cannot authorize target abandonment'
          git rev-parse HEAD > test-output/t1-failed-only/red-sha.txt
      - name: Measure intended unit and real SQL-cache failures
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          npm run test:file -- "$UNIT" > test-output/t1-failed-only/red-unit.txt 2>&1
          unit_status=$?
          timeout 100s npm run test:file -- "$CACHE" > test-output/t1-failed-only/red-cache.txt 2>&1
          cache_status=$?
          set -e
          echo "$unit_status" > test-output/t1-failed-only/red-unit-exit.txt
          echo "$cache_status" > test-output/t1-failed-only/red-cache-exit.txt
          tail -45 test-output/t1-failed-only/red-unit.txt
          tail -55 test-output/t1-failed-only/red-cache.txt
          test "$unit_status" -eq 1
          test "$cache_status" -eq 1
          grep -q 'successful replacement must never authorize target abandonment' test-output/t1-failed-only/red-unit.txt
          grep -q 'live successful replacement must never authorize target abandonment' test-output/t1-failed-only/red-cache.txt
          grep -q ERR_ASSERTION test-output/t1-failed-only/red-cache.txt
      - name: Correct the existing semantic gate and refresh metadata
        run: |
          set -euo pipefail
          python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/prepare-failed-only-abandonment.py . fix > test-output/t1-failed-only/correction.txt
          npm exec --no -- eslint "$SOURCE" "$UNIT" "$CACHE" > test-output/t1-failed-only/lint.txt 2>&1
          npm run test:metadata:refresh > test-output/t1-failed-only/metadata.txt 2>&1
          npm run audit:shards > test-output/t1-failed-only/shards.txt 2>&1
          npm run test:metrics:scoped -- "$SOURCE" > test-output/t1-failed-only/source-metrics.txt 2>&1
          npm run test:metrics:scoped:strict -- "$UNIT" "$CACHE" > test-output/t1-failed-only/test-metrics.txt 2>&1
          git diff --check
          test "$(git diff --name-only "$BASE" -- src)" = "$SOURCE"
      - name: Same tests must pass with failed-learner recovery retained
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          npm run test:file -- "$UNIT" test/rebalancer/message-group-membership-operation-lane.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/reservation-file-backed-restart.test.js > test-output/t1-failed-only/green-unit.txt 2>&1
          echo 0 > test-output/t1-failed-only/green-unit-exit.txt
          timeout 100s npm run test:file -- "$CACHE" > test-output/t1-failed-only/green-cache.txt 2>&1
          echo 0 > test-output/t1-failed-only/green-cache-exit.txt
          tail -35 test-output/t1-failed-only/green-unit.txt
          tail -45 test-output/t1-failed-only/green-cache.txt
      - name: Independent predicate mutations must be killed
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          saved="$RUNNER_TEMP/t1-failed-source-$GITHUB_RUN_ID.js"
          cp "$SOURCE" "$saved"
          trap 'cp "$saved" "$SOURCE"' EXIT
          for kind in status step sql; do
            cp "$saved" "$SOURCE"
            python3 ../carrier-$GITHUB_RUN_ID/scripts/quest-evidence/prepare-failed-only-abandonment.py . "mutant-$kind"
            set +e
            npm run test:file -- "$UNIT" > "test-output/t1-failed-only/mutant-$kind.txt" 2>&1
            code=$?
            set -e
            echo "$code" > "test-output/t1-failed-only/mutant-$kind-exit.txt"
            test "$code" -eq 1
            grep -q ERR_ASSERTION "test-output/t1-failed-only/mutant-$kind.txt"
            if [ "$kind" = sql ]; then
              grep -q 'changed ordinary state defeats the stale abandonment CAS' "test-output/t1-failed-only/mutant-$kind.txt"
            else
              grep -q 'inconsistent terminal facts are not failed-learner authority' "test-output/t1-failed-only/mutant-$kind.txt"
            fi
          done
          cp "$saved" "$SOURCE"
          cmp "$saved" "$SOURCE"
      - name: Commit exact source and canonically preserve evidence before push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$BASE"
          gh api repos/psvensson/lagrange/pulls/107/reviews > test-output/t1-failed-only/reviews.json
          node scripts/solve.js note --id "$QUEST" --finding 'Review 5456700481 / 4219025228 accepted as a bounded source defect: successful REMOVED and mixed terminal facts must not select target abandonment from a retained learner hint. The existing status/step owner distinguishes success from failure; exact FAILED/FAILED is required for the T1 arm. No new subsystem or broad terminal classifier change; existing action observation is not a dispatch grant. Physical activation remains blocked.' --kind altitude-check --json > test-output/t1-failed-only/reflection.json
          node scripts/solve.js note --id "$QUEST" --attempt "Addressed review 4219025228 on exact inherited $BASE. Test-first unit and live SQL/Raft/CDC/cache negatives reproduce successful target-abandonment admission. Same tests pass with exact FAILED status and step required; failed-learner positive retained. Three predicate mutations fail. No new runtime activation or independent approval. Run $GITHUB_RUN_ID." --json > test-output/t1-failed-only/attempt.json
          git add -- "$SOURCE" test/shards/ "solve/quests/$QUEST/log.ndjson"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'fix: only failed replacements may select terminal learner abandonment'
          git rev-parse HEAD > test-output/t1-failed-only/source-sha.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --binary "$BASE" > test-output/t1-failed-only/change.patch
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('test-output/t1-failed-only')
          outputs={f.name:f.read_text() for f in p.iterdir() if f.is_file()}
          source=Path(os.environ['SOURCE'])
          record={'schema':'freshmg-failed-only-abandonment/1','runId':int(os.environ['GITHUB_RUN_ID']),
            'baseSha':os.environ['BASE'],'carrierSha':os.environ['GITHUB_SHA'],
            'sourceSha':(p/'source-sha.txt').read_text().strip(),'runner':os.environ['RUNNER_NAME'],
            'reviewId':5456700481,'commentId':4219025228,'independentApproval':False,
            'distributedAcceptance':False,'runtimeActivation':False,
            'sourceSha256':hashlib.sha256(source.read_bytes()).hexdigest(),
            'proofCeiling':'actual repository and supplied learner row; file-backed unit gateway; live single-seed SQL/Raft/CDC/cache with quiesced coordinator; no physical membership or multi-host proof',
            'outputs':outputs,'sha256':{k:hashlib.sha256(v.encode()).hexdigest() for k,v in outputs.items()}}
          (p/'measurement.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          archive="$RUNNER_TEMP/failed-only-$GITHUB_RUN_ID.zip"
          (cd test-output/t1-failed-only && sha256sum * > SHA256SUMS && zip -q "$archive" *)
          node scripts/solve.js evidence add "$archive" --id "$QUEST" --text "Failed-only T1 correction, test-first unit/live-cache red, same tests green and three mutation kills; exact source, review and limits retained. Actions/GCP $GITHUB_RUN_ID; no full-cutover certification." --json > test-output/t1-failed-only/canonical-evidence.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('test-output/t1-failed-only')
          record=json.loads((p/'measurement.json').read_text())
          record['canonicalEvidence']=json.loads((p/'canonical-evidence.json').read_text())
          dest=Path('solve/quests')/os.environ['QUEST']/'evidence'/('failed-only-'+os.environ['GITHUB_RUN_ID']+'.json')
          dest.write_text(json.dumps(record,indent=2)+'\n')
          PY
          git add -- "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/failed-only-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'evidence: retain failed-only abandonment red green and mutation proof'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > test-output/t1-failed-only/published-sha.txt
      - name: Request independent review of the actual published head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exact="$(git rev-parse HEAD)"
          gh pr comment 107 --repo psvensson/lagrange --body "Addressed 4219025228 at exact $exact: only FAILED/FAILED may newly select target abandonment. Successful REMOVED and inconsistent terminal rows refuse before mutation; same-row status/step CAS prevents a delayed failed-row command from applying after success. Test-first unit and live SQL/Raft/CDC/cache red, same tests green, three predicate mutations killed. Canonical proof under evidence/failed-only-$GITHUB_RUN_ID.json. Review this exact head; no source approval, activation or full-cutover claim."
          gh pr edit 107 --repo psvensson/lagrange --add-reviewer @copilot
      - name: Preserve all results and recoverable source even on failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/t1-failed-only
          git diff --binary "$BASE" > test-output/t1-failed-only/full-work.patch
          git diff --binary > test-output/t1-failed-only/uncommitted.patch
          git status --porcelain > test-output/t1-failed-only/final-status.txt
          git archive --format=tar.gz -o test-output/t1-failed-only/source.tar.gz HEAD
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create test-output/t1-failed-only/candidate.bundle HEAD "^$BASE"
          fi
          find test-output/t1-failed-only -type f ! -name FINAL_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/t1-failed-only/FINAL_SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-failed-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: t1-failed-${{ github.run_id }}/test-output/t1-failed-only/
          retention-days: 14
          if-no-files-found: error
