name: tidb-scenario-a-delivery-contract

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/scenario-a-delivery-case-staging
    paths:
      - '.github/workflows/tidb-scenario-a-delivery-contract.yml'
      - 'test/distributed/harness/oltp-baseline-dataset.js'
      - 'test/distributed/harness/oltp-baseline-workload.js'
      - 'test/distributed/harness/oltp-scenario-a-semantic-gate.js'
      - 'test/distributed/harness/oltp-scenario-a-delivery-case.js'
      - 'scripts/checks/oltp-scenario-a-delivery-case-guard.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-scenario-a-delivery-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove delivery case contract
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-delivery-case.js \
            scripts/checks/oltp-scenario-a-delivery-case-guard.js
          node scripts/checks/oltp-scenario-a-delivery-case-guard.js
