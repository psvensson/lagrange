# Exact WIP source static/corpus measurement. Never waive inherited reds,
# update ratchets, delete negative witnesses, or count this as publisher seal.
name: rs-raft-postawait-exact-static
on:
  push:
    branches: [continue/rs-raft-postawait-release-deadline-20261014]
    paths: [.github/workflows/rs-raft-postawait-exact-static.yml]
permissions:
  contents: read
concurrency:
  group: rs-raft-postawait-exact-static
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Exact source locked dependencies
        run: npm ci
      - name: Record every strict static/corpus verdict, even when red
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-postawait-static
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/tree.txt"
          failed=0
          for task in \
            audit:shards \
            audit:impact-contracts \
            test:deps \
            test:unused:ratchet \
            audit:file-size:strict \
            test:duplication:strict \
            lint \
            audit:no-legacy-consensus-references \
            audit:owner-boundary-segments \
            audit:guideline:silent-catch; do
            name="${task//:/-}"
            npm run -s "$task" > "$OUT/$name.log" 2>&1
            rc=$?
            printf '%s\n' "$rc" > "$OUT/$name.status"
            echo "strict $task status=$rc"
            if test "$rc" -ne 0; then
              failed=1
              tail -n 27 "$OUT/$name.log" | cut -c 1-650
            fi
          done
          git diff --check > "$OUT/diff-check.log" 2>&1
          diff_rc=$?
          printf '%s\n' "$diff_rc" > "$OUT/diff-check.status"
          if test "$diff_rc" -ne 0; then failed=1; fi
          exit "$failed"
      - name: Archive each exact-src result, preserving every refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-postawait-static-${{ github.sha }}
          path: test-output/rs-raft-postawait-static/
          retention-days: 14
          if-no-files-found: warn
