name: tidb-reference-smoke

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/lagrange-oltp-adapter-staging
      - benchmark/lagrange-oltp-adapter-reconcile
      - benchmark/paired-retry-owner-staging
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-reference-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned reference-client dependencies
        run: npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Verify Docker engine
        run: docker version

      - name: Pull pinned TiDB reference images
        run: |
          set -euo pipefail
          docker pull pingcap/pd:v8.5.8
          docker pull pingcap/tikv:v8.5.8
          docker pull pingcap/tidb:v8.5.8
          docker pull mysql:8.4.11

      - name: Run lifecycle, topology, and budget contract guards
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/tidb-reference-physical-topology.js \
            test/distributed/harness/comparative-system-budget.js \
            scripts/checks/tidb-reference-physical-topology-guard.js \
            scripts/checks/comparative-system-budget-guard.js
          node scripts/checks/tidb-reference-lifecycle-guard.js
          node scripts/checks/tidb-reference-resource-policy-guard.js
          node scripts/checks/tidb-reference-physical-topology-guard.js
          node scripts/checks/comparative-system-budget-guard.js

      - name: Run OLTP contract guards
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-baseline-transaction-executor.js \
            test/distributed/harness/oltp-paired-retry-owner.js \
            test/distributed/reference-client/tidb-oltp-adapter.js \
            test/distributed/reference-client/lagrange-oltp-adapter.js \
            scripts/checks/oltp-baseline-transaction-executor-guard.js \
            scripts/checks/oltp-paired-retry-owner-guard.js \
            scripts/checks/lagrange-oltp-adapter-guard.js
          node scripts/checks/tidb-oltp-dataset-guard.js
          node scripts/checks/tidb-oltp-workload-guard.js
          node scripts/checks/oltp-baseline-transaction-executor-guard.js
          node scripts/checks/oltp-paired-retry-owner-guard.js
          node scripts/checks/lagrange-oltp-adapter-guard.js

      - name: Run PG wire transaction-conflict contract guard
        run: |
          set -euo pipefail
          npx eslint \
            src/query/distributed/transaction-participant-error-projection.js \
            src/query/pg/pg-wire-constants.js \
            src/query/pg/postgres-wire-adapter.js \
            scripts/checks/pgwire-transaction-conflict-guard.js
          node scripts/checks/pgwire-transaction-conflict-guard.js

      - name: Run live three-store Docker SQL smoke
        env:
          TIDB_REFERENCE_TIKV_STORE_COUNT: '3'
        run: node scripts/checks/run-tidb-reference-lifecycle-live.js

      - name: Run hosted TiDB OLTP measurement smoke
        env:
          TIDB_OLTP_EVIDENCE_PATH: test-output/tidb-reference/oltp-hosted-smoke.json
        run: node scripts/checks/run-tidb-oltp-hosted-measurement.js

      - name: Upload TiDB OLTP hosted-smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tidb-oltp-hosted-smoke-${{ github.run_id }}
          path: test-output/tidb-reference/oltp-hosted-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Capture Docker state on failure
        if: failure()
        run: |
          set +e
          echo '=== docker ps -a ==='
          docker ps -a
          echo '=== docker networks ==='
          docker network ls
