name: tidb-reference-smoke

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-reference-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned reference-client dependencies
        run: npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Verify Docker engine
        run: docker version

      - name: Pull pinned TiDB reference images
        run: |
          set -euo pipefail
          docker pull pingcap/pd:v8.5.8
          docker pull pingcap/tikv:v8.5.8
          docker pull pingcap/tidb:v8.5.8
          docker pull mysql:8.4.11

      - name: Run lifecycle contract guard
        run: node scripts/checks/tidb-reference-lifecycle-guard.js

      - name: Run OLTP dataset contract guard
        run: node scripts/checks/tidb-oltp-dataset-guard.js

      - name: Run OLTP workload contract guard
        run: node scripts/checks/tidb-oltp-workload-guard.js

      - name: Run live three-store Docker SQL smoke
        env:
          TIDB_REFERENCE_TIKV_STORE_COUNT: '3'
        run: node scripts/checks/run-tidb-reference-lifecycle-live.js

      - name: Run live persistent OLTP adapter proof
        run: node scripts/checks/run-tidb-oltp-adapter-live.js

      - name: Capture Docker state on failure
        if: failure()
        run: |
          set +e
          echo '=== docker ps -a ==='
          docker ps -a
          echo '=== docker networks ==='
          docker network ls
