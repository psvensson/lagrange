name: tidb-reference-gcp-path-ownership

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/tidb-gcp-path-owner-staging
    paths:
      - '.github/workflows/tidb-reference-gcp.yml'
      - '.github/workflows/tidb-reference-gcp-path-ownership.yml'
      - 'scripts/checks/tidb-reference-gcp-path-ownership-guard.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-reference-gcp-path-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove TiDB GCP trigger ownership
        run: |
          set -euo pipefail
          npx eslint scripts/checks/tidb-reference-gcp-path-ownership-guard.js
          node scripts/checks/tidb-reference-gcp-path-ownership-guard.js
