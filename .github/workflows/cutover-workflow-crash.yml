name: cutover-workflow-crash
on:
  push:
    branches: [integrate/rs-raft-contract-first-20261008]
    paths:
      - .github/workflows/cutover-workflow-crash.yml
      - scripts/quest-evidence/cutover-workflow-crash-baseline.js
permissions:
  contents: read
concurrency:
  group: cutover-workflow-crash-20261008
  cancel-in-progress: false
env:
  BASE: 82b54ef9b7c8d6be9f2d6450cbc5e6713ade00af
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind diagnostic status to existing policy (no runtime change)
        id: bind
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE" -- src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/quest-evidence/cutover-workflow-crash-baseline.js')
          s = p.read_text()
          old = 'ReplicaStatus.FAILED : ReplicaStatus.SENDING;'
          if old in s:
              assert s.count(old) == 1
              owner = Path('src/rebalancer/replica-operation-progress.js').read_text()
              assert '[WORKFLOW_STEP.SENDING]: ReplicaStatus.PENDING' in owner
              s = s.replace(old, 'ReplicaStatus.FAILED : WORKFLOW_STEP_TO_STATUS[WORKFLOW_STEP.SENDING];')
              anchor = "import {OperationType, ReplicaStatus} from '../../src/rebalancer/replica-status.js';"
              assert s.count(anchor) == 1
              s = s.replace(anchor, "import {OperationType, ReplicaStatus, WORKFLOW_STEP_TO_STATUS} from '../../src/rebalancer/replica-status.js';")
              p.write_text(s)
          PY
          node --check scripts/quest-evidence/cutover-workflow-crash-baseline.js
          git diff --check
          test "$(git ls-remote origin refs/heads/integrate/rs-raft-contract-first-20261008 | cut -f1)" = "$GITHUB_SHA"
          git add scripts/quest-evidence/cutover-workflow-crash-baseline.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: consume canonical SENDING status in process-loss diagnostic'
            git push origin HEAD:refs/heads/integrate/rs-raft-contract-first-20261008
          fi
          CANDIDATE="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/integrate/rs-raft-contract-first-20261008 | cut -f1)" = "$CANDIDATE"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
  wake-runner:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Start only the existing runner
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$STATUS" != RUNNING ]; then
            gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a
          fi
  process-loss:
    needs: [prepare, wake-runner]
    runs-on: [self-hosted, gcp]
    timeout-minutes: 20
    env:
      CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    defaults:
      run:
        shell: bash
        working-directory: c0-crash-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          path: c0-crash-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and bind exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          git diff --exit-code "$BASE" -- src
          mkdir -p test-output/c0-crash
          printf 'candidate=%s\nrunner=%s\nrun=%s\n' "$CANDIDATE" "$RUNNER_NAME" "$GITHUB_RUN_ID" > test-output/c0-crash/provenance.txt
          npm ci
      - name: Measure process loss at actual owner/repository/SQLite boundaries
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          timeout 300s node scripts/quest-evidence/cutover-workflow-crash-baseline.js test-output/c0-crash/process-loss.json "$CANDIDATE" > test-output/c0-crash/stdout.txt 2> test-output/c0-crash/stderr.txt
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > test-output/c0-crash/exit.txt
          tail -100 test-output/c0-crash/stdout.txt
          cat test-output/c0-crash/stderr.txt >&2
          test "$STATUS" -eq 0
          node -e 'const r=JSON.parse(require("fs").readFileSync("test-output/c0-crash/process-loss.json"));if(r.sourceSha!==process.env.CANDIDATE||r.measurementStatus!=="measured"||r.cases.length!==6||r.cases.some(c=>c.passed!==true))process.exit(2)'
      - name: Existing file-backed and owner regressions
        if: always()
        run: |
          set -uo pipefail
          npm run test:file -- test/rebalancer/reservation-file-backed-restart.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/operation-workflow-owner-handoff-retry-backoff.test.js > test-output/c0-crash/regressions.txt 2> test-output/c0-crash/regressions.stderr.txt
          STATUS=$?
          printf '%s\n' "$STATUS" > test-output/c0-crash/regressions-exit.txt
          tail -45 test-output/c0-crash/regressions.txt
          exit "$STATUS"
      - name: Archive provenance and unchanged runtime
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/c0-crash
          git diff --exit-code "$BASE" -- src > test-output/c0-crash/runtime-source-diff.txt
          git status --porcelain > test-output/c0-crash/final-status.txt
          sha256sum scripts/quest-evidence/cutover-workflow-crash-baseline.js > test-output/c0-crash/harness.sha256
          find test-output/c0-crash -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/c0-crash/SHA256SUMS
      - name: Retain every case, including failures and SQLite files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c0-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: c0-crash-${{ github.run_id }}-${{ github.run_attempt }}/test-output/c0-crash/
          retention-days: 14
          if-no-files-found: error
