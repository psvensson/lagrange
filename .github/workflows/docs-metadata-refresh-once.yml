name: docs-metadata-refresh-once

# Temporary workspace only; never merge this workflow to main.
on:
  push:
    branches: [ops/docs-metadata-refresh-20260926]

permissions:
  contents: read

jobs:
  generate-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 124d8f8a7b475db941dd0b227a550a5f281793c6
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Clarify the two audit-required phrases at the producer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          expected_head = '124d8f8a7b475db941dd0b227a550a5f281793c6'
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != expected_head:
              raise SystemExit('Unexpected source head')
          p = pathlib.Path('scripts/generate-current-capabilities-doc.js')
          data = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob != '87d88f08323cc4c995dd91f0a20e0c8f01470ce5':
              raise SystemExit('Unexpected generator source')
          text = data.decode('utf8')
          replacements = [
              ('The legacy callback representation in the table below is a separate internal\npath, not the component produced by the public service build.',
               'The legacy callback representation in the table below is a JavaScript envelope,\nnot a WebAssembly binary or component. It is a separate internal path, not the\ncomponent produced by the public service build.'),
              ('Managed OCI activation and OCI callback invocation remain unsupported.',
               'Managed OCI activation remains unsupported.\nOCI callback invocation remains unsupported.'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Expected prose boundary did not match exactly once')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          npm run -s docs:capabilities:generate
      - name: Regenerate test metadata with the existing owner
        run: npm run -s test:metadata:refresh
      - name: Verify documentation contracts and complete focused test file
        run: |
          set -euo pipefail
          git diff --check
          node scripts/generate-current-capabilities-doc.js --check
          npm run -s audit:service-portability-claims
          npm run -s audit:current-capabilities
          npm run -s audit:documentation-current
          npm run -s audit:doc-audience
          npm run -s audit:doc-ascii
          npm run -s test:file -- test/scripts/check-current-capabilities.test.js
      - name: Publish exact verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import subprocess
          import tempfile

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != '124d8f8a7b475db941dd0b227a550a5f281793c6':
              raise SystemExit('Unexpected source head')
          expected = {
              'scripts/generate-current-capabilities-doc.js': 'fa4628fd52d688d54fb89c99eb8edb4929c3bd80',
              'docs/current-capabilities-and-limitations.md': '77765134e8932a2f59490db856ea2212edf789b8',
              'test/shards/impact-graph-seal.json': None,
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if changed != set(expected):
              raise SystemExit(f'Unexpected generated scope: {sorted(changed)}')
          verified = {}
          for name, expected_blob in expected.items():
              data = pathlib.Path(name).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if expected_blob is not None and blob != expected_blob:
                  raise SystemExit(f'Approved prose identity differs: {name}')
              verified[name] = (data, blob)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          for name, (data, expected_blob) in verified.items():
              with tempfile.NamedTemporaryFile(mode='w', suffix='.json') as tmp:
                  json.dump({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}, tmp)
                  tmp.flush()
                  response = subprocess.check_output([
                      'gh', 'api', '--method', 'POST',
                      'repos/psvensson/lagrange/git/blobs', '--input', tmp.name,
                  ], text=True)
              actual = json.loads(response)['sha']
              if actual != expected_blob:
                  raise SystemExit(f'Published blob identity mismatch: {name}')
              print(json.dumps({'sourceHead': head, 'path': name, 'blobSha': actual}))
          PY
