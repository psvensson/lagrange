name: freshmg-terminal-doc-review
on:
  push:
    branches: [ops/c0-preservation-20261008]
    paths: [.github/workflows/c0-preserve-saved-work.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-claim-branch-increment
  cancel-in-progress: false
env:
  BASE: 9ab6470f8728b0322a864bdaec917701f39d707b
  WORK_BRANCH: work/freshmg-terminal-nonadmission-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  document-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Correct only misleading JSDoc and regenerate its derived identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/terminal-doc
          npm ci
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/rebalancer/replica-operation-repository.js')
          s=p.read_text()
          old='  /** Claim membership recovery ownership; no action authorization is created. */\n  settleMessageGroupMembershipNonAdmission(request) {'
          new='  /** Settle never-authorized terminal intent; no execution claim is acquired. */\n  settleMessageGroupMembershipNonAdmission(request) {'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          anchor='  claimMessageGroupMembershipOwner(request) {'
          assert s.count(anchor)==1
          s=s.replace(anchor,'  /** Claim membership recovery ownership; no action authorization is created. */\n'+anchor,1)
          p.write_text(s)
          PY
          npx eslint src/rebalancer/replica-operation-repository.js > test-output/terminal-doc/lint.txt
          npm run test:metadata:refresh > test-output/terminal-doc/metadata.txt
          npm run audit:shards > test-output/terminal-doc/shards.txt
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={'src/rebalancer/replica-operation-repository.js','test/shards/primary-classes.json','test/shards/resource-classes.json','test/shards/subsystem-classes.json','test/shards/impact-graph-seal.json'}
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert paths<=allowed,paths
          PY
          git add src/rebalancer/replica-operation-repository.js test/shards/primary-classes.json test/shards/resource-classes.json test/shards/subsystem-classes.json test/shards/impact-graph-seal.json
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: distinguish terminal non-admission settlement from holder acquisition'
          git rev-parse HEAD > test-output/terminal-doc/subject.txt
      - name: Verify exact documented tree and ordinary regressions
        run: |
          set -euo pipefail
          npm run audit:shards > test-output/terminal-doc/shards-exact.txt
          npm run test:file -- test/rebalancer/message-group-membership-branch-authorization.test.js test/rebalancer/message-group-membership-operation-lane.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/reservation-file-backed-restart.test.js > test-output/terminal-doc/regressions.txt 2> test-output/terminal-doc/regressions.stderr.txt
          git diff --exit-code
          git status --porcelain > test-output/terminal-doc/final-status.txt
          test ! -s test-output/terminal-doc/final-status.txt
      - name: Publish documentation correction and actual proof summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SUBJECT="$(cat test-output/terminal-doc/subject.txt)"
          gh api repos/psvensson/lagrange/pulls/comments/4218392251 > test-output/terminal-doc/finding.json
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path('test-output/terminal-doc')
          files={p.name:p.read_text() for p in d.iterdir()}
          r={'schema':'freshmg-terminal-doc-review/1','runId':int(os.environ['GITHUB_RUN_ID']),'sourceSha':os.environ['SUBJECT'],'baseSha':os.environ['BASE'],'runner':'GitHub-hosted ubuntu-24.04; no distributed run','semanticRuntimeChange':False,'independentApproval':False,'result':'pass','outputs':files,'sha256':{n:hashlib.sha256(t.encode()).hexdigest() for n,t in files.items()}}
          p=Path('solve/quests')/os.environ['QUEST']/'evidence'/('doc-review-'+os.environ['GITHUB_RUN_ID']+'.json');p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          node scripts/solve.js note --id "$QUEST" --attempt "PR106 finding 4218392251: settlement JSDoc describes non-admission resolution, claim JSDoc restored to claim method. No runtime behavior change. Canonical metadata freshly regenerated and audit:shards plus four ordinary regression files pass on $SUBJECT in hosted Actions $GITHUB_RUN_ID; no distributed/physical or independent approval claimed."
          git add "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/doc-review-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: retain terminal/claim documentation correction and exact metadata proof'
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          published="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$published"
          gh pr comment 106 --repo psvensson/lagrange --body "Exact documentation response at $published, tested subject $SUBJECT: settlement and holder-acquisition descriptions no longer conflated. Canonical generated artifacts refreshed again; audit:shards and four regressions pass on that exact tree in run $GITHUB_RUN_ID. No semantic runtime change or independent approval. The separate full membership authorization/runtime interaction remains an explicit later proof obligation."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-terminal-doc-${{ github.run_id }}
          path: test-output/terminal-doc/
          retention-days: 14
          if-no-files-found: error
