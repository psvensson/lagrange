name: freshmg-existing-frontier
on:
  push:
    branches: [ops/c0-preservation-20261008]
    paths: [.github/workflows/c0-preserve-saved-work.yml]
permissions:
  contents: read
concurrency:
  group: c0-preserve-saved-work
  cancel-in-progress: false
env:
  CANDIDATE: 16bc20e7d1f2d71490d915144215e773ca610a56
  WORK_BRANCH: work/freshmg-owner-chain-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: |
          set -euo pipefail
          status="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$status" != RUNNING ]; then gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a; fi
  inherited-frontier:
    needs: wake
    runs-on: [self-hosted, gcp]
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    defaults:
      run:
        shell: bash
        working-directory: freshmg-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          path: freshmg-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind clean inherited product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          git diff --exit-code 82b54ef9b7c8d6be9f2d6450cbc5e6713ade00af -- src
          mkdir -p test-output/freshmg-frontier
          npm ci
      - name: Measure existing real planner, handler and membership controls
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('test-output/freshmg-frontier')
          files=[
            'test/rebalancer/message-group-membership-change-parked.test.js',
            'test/rebalancer/message-group-membership-operation-lane.test.js',
            'test/node/message-group-service-handler-membership.test.js',
            'test/message-group/message-group-fresh-learner-promotion.test.js',
            'test/message-group/message-group-fresh-learner-snapshot.test.js',
            'test/raft/raft-rs-backend/message-group-membership-semantic-port.test.js']
          r={'schema':'freshmg-existing-frontier/1','sourceSha':os.environ['CANDIDATE'],
             'runId':int(os.environ['GITHUB_RUN_ID']),'runner':os.environ['RUNNER_NAME'],
             'runtimeChanges':False,'sourceApproval':False,'distributedAcceptance':False,
             'proofCeiling':'existing deterministic/component tests and actual planner/handler fixtures; no new runtime implementation or multi-host acceptance','files':[]}
          for i,file in enumerate(files):
              p=Path(file); assert p.is_file(),file
              stdout=out/f'{i+1}.stdout.txt';stderr=out/f'{i+1}.stderr.txt'
              with stdout.open('w') as so,stderr.open('w') as se:
                  process=subprocess.run(['timeout','240s','npm','run','test:file','--',file],stdout=so,stderr=se)
              r['files'].append({'file':file,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'exitCode':process.returncode,'stdout':stdout.name,'stderr':stderr.name})
              print(file,process.returncode,flush=True)
              print(stdout.read_text()[-5000:],flush=True)
          r['allPassed']=all(f['exitCode']==0 for f in r['files'])
          (out/'frontier.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git diff --exit-code 82b54ef9b7c8d6be9f2d6450cbc5e6713ade00af -- src > test-output/freshmg-frontier/runtime-diff.txt
          git status --porcelain > test-output/freshmg-frontier/final-status.txt
          find test-output/freshmg-frontier -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/freshmg-frontier/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        if: always()
        with:
          name: freshmg-inherited-frontier-${{ github.run_id }}
          path: freshmg-${{ github.run_id }}/test-output/freshmg-frontier/
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual product-test verdict
        run: |
          node -e 'const r=JSON.parse(require("fs").readFileSync("test-output/freshmg-frontier/frontier.json"));process.exit(r.allPassed?0:1)'
  preserve-attempt:
    needs: inherited-frontier
    if: always() && needs.inherited-frontier.outputs.artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT: ${{ needs.inherited-frontier.outputs.artifact }}
      DIGEST: ${{ needs.inherited-frontier.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve exact initial implementation frontier, not success
        run: |
          set -euo pipefail
          npm ci
          mkdir -p test-output/freshmg
          gh api "repos/psvensson/lagrange/actions/artifacts/$ARTIFACT/zip" > "test-output/freshmg/frontier-$GITHUB_RUN_ID.zip"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('test-output/freshmg')/('frontier-'+os.environ['GITHUB_RUN_ID']+'.zip')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest==os.environ['DIGEST'].removeprefix('sha256:')
          z=zipfile.ZipFile(p); members={Path(n).name:z.read(n) for n in z.namelist() if not n.endswith('/')}
          assert len(members)==len([n for n in z.namelist() if not n.endswith('/')])
          for line in members['SHA256SUMS'].decode().splitlines():
              h,n=line.split(None,1);assert hashlib.sha256(members[Path(n).name]).hexdigest()==h
          r=json.loads(members['frontier.json']);assert r['sourceSha']==os.environ['CANDIDATE']
          r['artifactId']=int(os.environ['ARTIFACT']);r['archiveSha256']=digest
          r['outputs']={n:b.decode() for n,b in members.items() if n.endswith('.txt')}
          dest=Path('solve/quests')/os.environ['QUEST']/'evidence'/('frontier-'+os.environ['GITHUB_RUN_ID']+'.json')
          dest.write_text(json.dumps(r,indent=2)+'\n')
          PY
          node scripts/solve.js evidence add "test-output/freshmg/frontier-$GITHUB_RUN_ID.zip" --id "$QUEST" --text 'Initial C1 existing production-entry and component frontier on exact inherited source. Original failures remain failures; no source fix, planner unpark or release claim.' --json > test-output/freshmg/upload.json
          node scripts/solve.js note --id "$QUEST" --finding 'Resume existing FreshMG Quest under user-approved J1: durable promotion authorization selects forward recovery; old source S and fresh target T are immutable. Start at actual planner/handler and repository/runtime admission boundaries. No wholesale adoption of rejected cd366cc0, no unpark before the correct owner chain, no new progress store. C0 classification source review remains separate from this inherited product baseline.' --kind decision --json > test-output/freshmg/decision.json
          node scripts/solve.js note --id "$QUEST" --attempt 'Measured the six existing planner/handler/membership test files before production changes and retained every exit/stdout/stderr plus source hashes. This first C1 attempt establishes the actual red frontier and existing positive controls; no assertion was removed and no source was changed.' --json > test-output/freshmg/attempt.json
          git diff --check
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$CANDIDATE"
          git add -- "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/frontier-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'FreshMG: resume admitted owner-chain implementation from measured existing frontier'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$head"
          echo "$head" > test-output/freshmg/pushed-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-frontier-publication-${{ github.run_id }}
          path: test-output/freshmg/
          if-no-files-found: error
          retention-days: 14
