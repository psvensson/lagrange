name: freshmg-claim-exact-proof
on:
  push:
    branches: [ops/c0-preservation-20261008]
    paths: [.github/workflows/c0-preserve-saved-work.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-claim-branch-increment
  cancel-in-progress: false
env:
  BASE: 91ed3358f620e1dc8779f99f0b507880bbc1a0ec
  WORK_BRANCH: work/freshmg-branch-authorization-20261008
jobs:
  publish-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.push.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE }}
          path: work
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Commit only the four reviewed implementation corrections
        id: push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$BASE"
          git apply --check ../carrier/scripts/quest-evidence/freshmg-explicit-repository.patch
          git apply ../carrier/scripts/quest-evidence/freshmg-explicit-repository.patch
          node --check src/rebalancer/replica-operation-message-group-membership-authorization.js
          node --check src/rebalancer/replica-operation-message-group-membership-owner-claim.js
          node --check test/rebalancer/message-group-membership-branch-authorization.test.js
          git add -- src/rebalancer/replica-operation-message-group-membership-authorization.js src/rebalancer/replica-operation-message-group-membership-owner-claim.js src/rebalancer/replica-operation-repository.js test/rebalancer/message-group-membership-branch-authorization.test.js
          git diff --cached --check
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WIP FreshMG: explicit repository dependency, preserve claim/branch semantics'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          candidate="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: |
          set -euo pipefail
          s="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$s" != RUNNING ]; then
            gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a
          fi
  exact-proof:
    needs: [publish-correction, wake]
    runs-on: [self-hosted, gcp]
    timeout-minutes: 25
    env:
      CANDIDATE: ${{ needs.publish-correction.outputs.candidate }}
    defaults:
      run:
        shell: bash
        working-directory: freshmg-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: freshmg-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          path: freshmg-proof-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and bind exact candidate
        id: install
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/freshmg-exact
          printf 'candidate=%s\ncarrier=%s\nrunner=%s\nrun=%s\n' "$CANDIDATE" "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_RUN_ID" > test-output/freshmg-exact/provenance.txt
          git diff --name-only 6fa07ca261f1df97c77428ac2660ba091ca13993 -- src test > test-output/freshmg-exact/paths.txt
          while IFS= read -r f; do sha256sum "$f"; done < test-output/freshmg-exact/paths.txt > test-output/freshmg-exact/source.sha256
          npm ci
      - name: Static lint of every changed runtime and test file
        if: steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          mapfile -t files < test-output/freshmg-exact/paths.txt
          npx eslint "${files[@]}" > test-output/freshmg-exact/lint.txt 2>&1
          status=$?
          printf '%s\n' "$status" > test-output/freshmg-exact/lint.exit.txt
          cat test-output/freshmg-exact/lint.txt
          exit "$status"
      - name: Exact candidate and existing related repository regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9 || exit "$?"
          timeout 240s npm run test:file -- test/rebalancer/message-group-membership-branch-authorization.test.js test/rebalancer/message-group-membership-operation-lane.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/reservation-file-backed-restart.test.js > test-output/freshmg-exact/tests.txt 2> test-output/freshmg-exact/tests.stderr.txt
          status=$?
          printf '%s\n' "$status" > test-output/freshmg-exact/tests.exit.txt
          tail -80 test-output/freshmg-exact/tests.txt
          cat test-output/freshmg-exact/tests.stderr.txt >&2
          exit "$status"
      - name: Falsify missing predicates in isolated copies, preserving positive controls
        if: always() && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9 || exit "$?"
          timeout 480s python3 ../freshmg-carrier-${{ github.run_id }}-${{ github.run_attempt }}/scripts/quest-evidence/check-freshmg-cas-mutations.py . test-output/freshmg-exact/mutations > test-output/freshmg-exact/mutations.stdout.txt 2> test-output/freshmg-exact/mutations.stderr.txt
          status=$?
          printf '%s\n' "$status" > test-output/freshmg-exact/mutations.exit.txt
          cat test-output/freshmg-exact/mutations.stdout.txt
          cat test-output/freshmg-exact/mutations.stderr.txt >&2
          exit "$status"
      - name: Bind unchanged candidate and preserve all outcomes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/freshmg-exact
          git status --porcelain > test-output/freshmg-exact/final-status.txt
          test ! -s test-output/freshmg-exact/final-status.txt
          sha256sum --check test-output/freshmg-exact/source.sha256
          find test-output/freshmg-exact -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/freshmg-exact/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: freshmg-proof-${{ github.run_id }}-${{ github.run_attempt }}/test-output/freshmg-exact/
          retention-days: 14
          if-no-files-found: error
