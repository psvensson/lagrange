name: freshmg-terminal-preserve-exact
on:
  push:
    branches: [ops/c0-preservation-20261008]
    paths: [.github/workflows/c0-preserve-saved-work.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-claim-branch-increment
  cancel-in-progress: false
env:
  BASE: 75977928ec0f8d8f17804e06b08e3ee0965b3f73
  SOURCE: 8d57e4093d297953f2cf563c634147cea0b79487
  WORK_BRANCH: work/freshmg-terminal-nonadmission-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact passing bundle and failed predecessor archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p test-output/terminal-retention
          gh api repos/psvensson/lagrange/actions/artifacts/11545780498/zip > test-output/terminal-retention/passed-37767400569.zip
          gh api repos/psvensson/lagrange/actions/artifacts/11544945422/zip > test-output/terminal-retention/failed-37766536144.zip
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          d=Path('test-output/terminal-retention')
          expected={'passed-37767400569.zip':'bf9cc08d11aabfa24a33174654b8e8143f724a085f1f8ab179be0fba57b1cc04','failed-37766536144.zip':'5231add95464d4e1ab95b2902f0b89a727d3aa543caafd39a79f18d90343be9d'}
          for name,sha in expected.items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha, name
          with zipfile.ZipFile(d/'passed-37767400569.zip') as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and all('/' not in n for n in names)
              for line in z.read('SHA256SUMS').decode().splitlines():
                  sha,filename=line.split(None,1)
                  assert hashlib.sha256(z.read(Path(filename).name)).hexdigest()==sha, filename
              for name,value in {'red-exit.txt':'1','green-exit.txt':'0','mutant-exit.txt':'1','lint-exit.txt':'0','final-status.txt':''}.items():
                  assert z.read(name).decode().strip()==value, name
              assert z.read('green-sha.txt').decode().strip()=='8d57e4093d297953f2cf563c634147cea0b79487'
              (d/'candidate.bundle').write_bytes(z.read('candidate.bundle'))
          PY
          git bundle verify test-output/terminal-retention/candidate.bundle
          git fetch test-output/terminal-retention/candidate.bundle terminal-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor "$BASE" "$SOURCE"
          git switch --detach "$SOURCE"
          python3 - <<'PY'
          import os,subprocess
          allowed={'src/rebalancer/replica-operation-message-group-membership-owner-claim.js','src/rebalancer/replica-operation-repository.js','test/rebalancer/message-group-membership-branch-authorization.test.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],os.environ['SOURCE']],text=True).splitlines())
          assert changed==allowed, changed
          PY
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$SOURCE"
      - name: Canonically retain evidence and append actual attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci
          # Current CLI implementation consumes --id, not the obsolete --quest.
          node scripts/solve.js evidence add test-output/terminal-retention/failed-37766536144.zip --id "$QUEST" --json > test-output/terminal-retention/failed-store.json
          node scripts/solve.js evidence add test-output/terminal-retention/passed-37767400569.zip --id "$QUEST" --json > test-output/terminal-retention/passed-store.json
          python3 - <<'PY'
          import os,json,zipfile,hashlib
          from pathlib import Path
          d=Path('test-output/terminal-retention')
          with zipfile.ZipFile(d/'passed-37767400569.zip') as z:
              outputs={n:z.read(n).decode() for n in z.namelist() if n.endswith(('.txt','.sha256')) or n=='SHA256SUMS'}
          report={'schema':'freshmg-terminal-nonadmission-attempt/1','runId':37767400569,'candidateSha':os.environ['SOURCE'],'baseSha':os.environ['BASE'],'measurementResult':'success','originalWorkflowConclusion':'failure','publicationFailure':'original preservation invocation used obsolete --quest; current CLI requires --id','retentionRunId':int(os.environ['GITHUB_RUN_ID']),'sourceApproval':False,'proofCeiling':'actual repository and file-backed SQLite with distributed gateway substitution; no driver activation, physical membership or multi-host acceptance','passedArchiveSha256':hashlib.sha256((d/'passed-37767400569.zip').read_bytes()).hexdigest(),'passedArchiveAndMembersVerified':True,'priorFailure':{'runId':37766536144,'reason':'missing braces in test loops failed lint; inherited shell errexit prevented bundle/manifest creation after useful tests and mutant passed','archiveHashVerified':True,'memberManifestAvailable':False},'retainedEvidence':{'passed':json.loads((d/'passed-store.json').read_text()),'failed':json.loads((d/'failed-store.json').read_text())},'outputs':outputs}
          p=Path('solve/quests')/os.environ['QUEST']/'evidence/terminal-nonadmission-37767400569.json'
          p.write_text(json.dumps(report,indent=2)+'\n')
          PY
          node scripts/solve.js note --id "$QUEST" --attempt "T0 implemented and measured on exact $SOURCE in GCP run 37767400569: test-first RED, four focused files/120 reported assertions GREEN, exact-holder-predicate deletion mutant RED, targeted lint GREEN, clean final checkout. Source commit and all evidence recovered without rerunning successful measurements. Earlier 37766536144 lint failure retained. Hosted publisher used obsolete --quest and failed; canonical --id used in run $GITHUB_RUN_ID. Existing repository settlement only; no driver, T1 branch, runtime delivery, CREATE activation or independent source approval."
          git add "solve/quests/$QUEST/evidence/terminal-nonadmission-37767400569.json" "solve/quests/$QUEST/log.ndjson"
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: retain exact successful terminal resolution and failed predecessors'
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'source=%s\npublished=%s\n' "$SOURCE" "$(git rev-parse HEAD)" > test-output/terminal-retention/publication.txt
          cat test-output/terminal-retention/publication.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-terminal-retention-${{ github.run_id }}
          path: test-output/terminal-retention/
          if-no-files-found: error
          retention-days: 14
