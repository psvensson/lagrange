name: c0-preserve-saved-work
on:
  push:
    branches: [ops/c0-preservation-20261008]
    paths: [.github/workflows/c0-preserve-saved-work.yml]
permissions:
  contents: read
concurrency:
  group: c0-preserve-saved-work
  cancel-in-progress: false
env:
  WORK_BRANCH: integrate/rs-raft-contract-first-20261008
  EXPECTED: 490b01962de55cd108be5b59ed0b389141e99dee
  BASE: 82b54ef9b7c8d6be9f2d6450cbc5e6713ade00af
jobs:
  corrections:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.push.outputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: work
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply exact-source review corrections, not runtime changes
        run: |
          set -euo pipefail
          python3 carrier/scripts/quest-evidence/c0-review-corrections.py work work/test-output/c0-corrections/changes.json
          cd work
          node --check scripts/quest-evidence/cutover-workflow-crash-baseline.js
          node --check scripts/quest-evidence/cutover-terminal-obligation-baseline.js
          git diff --check
          git diff --exit-code "$BASE" -- src
          npm ci
          npm run -s audit:steering-diet > test-output/c0-corrections/steering.json
          npm run -s audit:rule-set > test-output/c0-corrections/rules.json
          node scripts/solve.js note --id cutover-transition-authority-review --finding 'Reviewed C0 corrections: select Node22 before prepare Node invocation; name four identity dimensions and link the approved J1 decision; strengthen six-case crash cut engagement; replace the invalid terminal-arm boolean interpretation with actual terminal projection/dispatched=false, observed-progress skip, exact SQL debt and competing-lane evidence. The failed 37751224863 experiment is a harness assertion error, not new execution: armed=true recorded the terminal effect with zero physical calls. No runtime repair or independent acceptance.' --kind evidence --json > test-output/c0-corrections/note.json
      - name: Commit and git push only bounded corrections
        id: push
        working-directory: work
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED"
          git add -- .github/workflows/cutover-workflow-crash.yml scripts/quest-evidence/cutover-workflow-crash-baseline.js scripts/quest-evidence/cutover-terminal-obligation-baseline.js solve/quests/cutover-transition-authority-review/recovery-policy-proposal.md solve/quests/cutover-transition-authority-review/log.ndjson
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WIP C0 corrections: precise crash engagement and terminal obligation effects'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          candidate="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$candidate" > test-output/c0-corrections/published-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c0-review-corrections-${{ github.run_id }}
          path: work/test-output/c0-corrections/
          if-no-files-found: error
          retention-days: 14
  wake:
    needs: corrections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: |
          set -euo pipefail
          status="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$status" != RUNNING ]; then gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a; fi
  verify:
    needs: [corrections, wake]
    runs-on: [self-hosted, gcp]
    timeout-minutes: 20
    env:
      CANDIDATE: ${{ needs.corrections.outputs.candidate }}
    defaults:
      run:
        shell: bash
        working-directory: corrections-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          path: corrections-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind unchanged runtime and install
        id: install
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --exit-code "$BASE" -- src
          test -z "$(git status --porcelain)"
          mkdir -p test-output/c0-corrected
          printf 'candidate=%s\nrunner=%s\nrun=%s\n' "$CANDIDATE" "$RUNNER_NAME" "$GITHUB_RUN_ID" > test-output/c0-corrected/provenance.txt
          npm ci
      - name: Terminal debt through actual owner entrypoints
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          timeout 90s node scripts/quest-evidence/cutover-terminal-obligation-baseline.js test-output/c0-corrected/terminal.json "$CANDIDATE" > test-output/c0-corrected/terminal.stdout.txt 2> test-output/c0-corrected/terminal.stderr.txt
          status=$?
          set -e
          echo "$status" > test-output/c0-corrected/terminal-exit.txt
          tail -70 test-output/c0-corrected/terminal.stdout.txt
          test "$status" = 0
      - name: Six real-repository process-loss cases with stronger cut assertions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          timeout 300s node scripts/quest-evidence/cutover-workflow-crash-baseline.js test-output/c0-corrected/crash.json "$CANDIDATE" > test-output/c0-corrected/crash.stdout.txt 2> test-output/c0-corrected/crash.stderr.txt
          status=$?
          set -e
          echo "$status" > test-output/c0-corrected/crash-exit.txt
          tail -70 test-output/c0-corrected/crash.stdout.txt
          test "$status" = 0
      - name: Existing file-backed and membership regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          npm run test:file -- test/rebalancer/reservation-file-backed-restart.test.js test/rebalancer/operation-progress-store-persistence.test.js test/rebalancer/operation-workflow-owner-handoff-retry-backoff.test.js test/rebalancer/message-group-membership-operation-lane.test.js > test-output/c0-corrected/regressions.txt 2> test-output/c0-corrected/regressions.stderr.txt
          status=$?
          echo "$status" > test-output/c0-corrected/regressions-exit.txt
          tail -60 test-output/c0-corrected/regressions.txt
          exit "$status"
      - name: Bind evidence and final unchanged runtime
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/c0-corrected
          git diff --exit-code "$BASE" -- src > test-output/c0-corrected/runtime-diff.txt
          git status --porcelain > test-output/c0-corrected/final-status.txt
          sha256sum scripts/quest-evidence/cutover-workflow-crash-baseline.js scripts/quest-evidence/cutover-terminal-obligation-baseline.js > test-output/c0-corrected/harnesses.sha256
          find test-output/c0-corrected -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/c0-corrected/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c0-corrected-gcp-${{ github.run_id }}
          path: corrections-${{ github.run_id }}/test-output/c0-corrected/
          if-no-files-found: error
          retention-days: 14
