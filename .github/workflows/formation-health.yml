# Formation health — a standing signal, never a release gate.
#
# Runs the MovieLens demo's formation-only phase with one node per GCP VM,
# derives the formation verdict (seed event-loop gaps inside the formation
# window, ready-lease waits, critical spread, schema admission) and appends
# one record to the formation trend. The report and trend are uploaded as
# artifacts; `npm run health:formation -- --summary` renders the local trend.
# Scheduled nightly and runnable on demand. The GCP runner VM is woken keylessly
# exactly as release.yml does; the demo provisions its five hosts through the
# harness's GCP provider with the runner's own credentials.
name: formation-health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: formation-health
  cancel-in-progress: false

env:
  LAGRANGE_TEST_MACHINE_FACTOR: '3'

jobs:
  wake-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: false

      - name: Start the runner VM (idempotent)
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe lagrange-ci-runner \
            --zone europe-north1-a --format='value(status)')"
          echo "runner VM status: ${STATUS}"
          if [ "${STATUS}" != "RUNNING" ]; then
            gcloud compute instances start lagrange-ci-runner --zone europe-north1-a
          fi

  health:
    needs: wake-runner
    runs-on: [self-hosted, gcp]
    timeout-minutes: 60
    permissions:
      # The trend record is committed to main below.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The commit step below pushes with the workflow token; a token
          # push starts no other workflow, so a nightly record costs no run.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Pulumi CLI
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL \
            --connect-timeout 20 \
            --max-time 300 \
            --retry 2 \
            https://get.pulumi.com \
            -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version 3.261.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pulumi/bin:$PATH"
          test "$(pulumi version)" = "v3.261.0"

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci
          # The GCP harness deliberately keeps Pulumi out of the ordinary
          # package manifest. Install its exact optional boundary here, where
          # provision() is actually exercised, without rewriting the lockfile.
          npm install --no-save --package-lock=false @pulumi/pulumi@3.261.0 @pulumi/gcp@9.36.1

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Formation health run (one node per GCP VM)
        # The step's exit code is the formation verdict, so a red formation
        # is a red run; an UNKNOWN verdict records nothing and is red too.
        # The evidence upload and the trend commit below run regardless.
        run: npm run health:formation -- --gcp

      # data/formation-health/trend.ndjson is committed evidence, one record
      # per scheduled run, so the release notes, the README claim and the
      # consolidation budget read the same file. Only a measuring verdict
      # appends a record; a red measurement is committed like a green one.
      - name: Commit the trend record to main
        if: always()
        run: |
          set -euo pipefail
          git add data/formation-health/trend.ndjson
          if git diff --cached --quiet; then
            echo "no new trend record to commit"
            exit 0
          fi
          git config user.name "formation-health"
          git config user.email "formation-health@users.noreply.github.com"
          git commit -m "formation-health: trend record $(date -u +%Y-%m-%dT%H:%MZ) at ${GITHUB_SHA::9}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not push the trend record after three attempts"
          exit 1

      - name: Upload formation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formation-health-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            test-output/reports/movielens-lagrange-formation-only-live-*.report.json
            data/formation-health/trend.ndjson
            data/examples/service-data-affinity-demo/node-*.log
