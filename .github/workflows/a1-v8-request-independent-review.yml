name: a1-v8-request-independent-review

on:
  push:
    branches:
      - review/a1-v8-post-attempt-final
    paths:
      - .github/workflows/a1-v8-request-independent-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove request workflow and push clean review head
        shell: bash
        env:
          BRANCH: review/a1-v8-post-attempt-final
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v8-request-independent-review.yml
          git commit -m "review: remove A1-v8 review-request workflow"

          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"

      - name: Wait for PR head convergence and request Copilot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          for attempt in {1..20}; do
            actual_sha="$(gh pr view 93 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
            if [ "$actual_sha" = "$final_sha" ]; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "PR #93 did not converge to $final_sha; last head $actual_sha"
              exit 1
            fi
            sleep 3
          done

          gh pr edit 93 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 93 --repo psvensson/lagrange             --json number,state,isDraft,headRefOid,url,reviewRequests
