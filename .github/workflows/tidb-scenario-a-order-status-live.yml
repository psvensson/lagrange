name: tidb-scenario-a-order-status-live

on:
  push:
    branches:
      - benchmark/tidb-reference-scenarios
      - benchmark/scenario-a-order-status-tidb-live-staging
      - benchmark/order-status-lines-tidb-live-staging
    paths:
      - '.github/workflows/tidb-scenario-a-order-status-live.yml'
      - 'scripts/checks/run-tidb-scenario-a-order-status-live.js'
      - 'scripts/checks/oltp-baseline-transaction-executor-guard.js'
      - 'scripts/checks/oltp-scenario-a-order-status-case-guard.js'
      - 'scripts/checks/tidb-oltp-state-snapshot-guard.js'
      - 'test/distributed/harness/oltp-baseline-transaction-executor.js'
      - 'test/distributed/harness/oltp-paired-retry-owner.js'
      - 'test/distributed/harness/oltp-scenario-a-comparison-systems.js'
      - 'test/distributed/harness/oltp-scenario-a-semantic-gate.js'
      - 'test/distributed/harness/oltp-scenario-a-order-status-case.js'
      - 'test/distributed/harness/tidb-reference-lifecycle.js'
      - 'test/distributed/reference-client/tidb-oltp-adapter.js'
      - 'test/distributed/reference-client/tidb-oltp-state-snapshot.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-scenario-a-order-status-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Verify proof sources
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-baseline-transaction-executor.js \
            test/distributed/harness/oltp-scenario-a-order-status-case.js \
            test/distributed/reference-client/tidb-oltp-state-snapshot.js \
            scripts/checks/oltp-baseline-transaction-executor-guard.js \
            scripts/checks/oltp-scenario-a-order-status-case-guard.js \
            scripts/checks/tidb-oltp-state-snapshot-guard.js \
            scripts/checks/run-tidb-scenario-a-order-status-live.js
          node scripts/checks/oltp-baseline-transaction-executor-guard.js
          node scripts/checks/oltp-scenario-a-order-status-case-guard.js
          node scripts/checks/tidb-oltp-state-snapshot-guard.js

      - name: Verify Docker and pull pinned TiDB images
        run: |
          set -euo pipefail
          docker version
          docker pull pingcap/pd:v8.5.8
          docker pull pingcap/tikv:v8.5.8
          docker pull pingcap/tidb:v8.5.8
          docker pull mysql:8.4.11

      - name: Run live TiDB order-status proof
        env:
          TIDB_SCENARIO_A_ORDER_STATUS_EVIDENCE_PATH: test-output/tidb-reference/scenario-a-order-status-tidb.json
        run: node scripts/checks/run-tidb-scenario-a-order-status-live.js

      - name: Upload semantic proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tidb-scenario-a-order-status-${{ github.run_id }}
          path: test-output/tidb-reference/scenario-a-order-status-tidb.json
          retention-days: 14
          if-no-files-found: warn
