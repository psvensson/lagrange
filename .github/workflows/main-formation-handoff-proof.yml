name: main-formation-handoff-proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  handoff:
    if: github.head_ref == 'proof/main-formation-handoff-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: D handoff baseline
        env:
          TAP_TIMEOUT_FLOOR: '120'
        run: node --test test/simulation/formation-sim-production-handoff.test.js
