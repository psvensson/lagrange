# Strict absolute deadline falsifier at seed owner; deliberately RED on input.
# No fixture timeout extension or invented release answer.
name: rs-raft-seed-deadline-after-success
on:
  push:
    branches: [continue/rs-raft-seed-deadline-semantics-20261014]
    paths:
      - .github/workflows/rs-raft-seed-deadline-after-success.yml
      - src/bootstrap/bootstrap-service-seed-workflow.js
      - test/bootstrap/seed-release-once-per-cohort.test.js
permissions:
  contents: read
concurrency:
  group: rs-raft-seed-deadline-after-success
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Locked deps
        run: npm ci
      - name: Preserve exact RED or green source-bound outcomes
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-seed-deadline-after-success
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          TEST=test/bootstrap/seed-release-once-per-cohort.test.js
          npx eslint src/bootstrap/bootstrap-service-seed-workflow.js "$TEST" > "$OUT/lint.log" 2>&1
          lint=$?
          printf '%s\n' "$lint" > "$OUT/lint.status"
          if test "$lint" -ne 0; then cat "$OUT/lint.log"; fi
          node --test --test-name-pattern='a successful release reply after the original absolute deadline cannot publish seed success' "$TEST" > "$OUT/late-reply.tap" 2>&1
          late=$?
          printf '%s\n' "$late" > "$OUT/late.status"
          echo "late-success falsifier status=$late"
          tail -n 80 "$OUT/late-reply.tap"
          npm run -s test:file -- "$TEST" > "$OUT/all-seed-intents.log" 2>&1
          full=$?
          printf '%s\n' "$full" > "$OUT/full.status"
          echo "original other seed intents file status=$full"
          tail -n 28 "$OUT/all-seed-intents.log"
          if test -f ".tap/test-results/$TEST.tap"; then
            cp ".tap/test-results/$TEST.tap" "$OUT/all-seed-intents.full.tap"
          fi
          test "$late" -eq 0 && test "$full" -eq 0 && test "$lint" -eq 0
      - name: Preserve all red including unchanged source test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-seed-deadline-falsifier-${{ github.sha }}
          path: test-output/rs-raft-seed-deadline-after-success/
          retention-days: 14
          if-no-files-found: warn
