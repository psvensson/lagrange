name: a1-v10-request-independent-review

on:
  push:
    branches:
      - review/a1-v10-post-attempt-final
    paths:
      - .github/workflows/a1-v10-request-independent-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove request workflow and preserve clean review head
        shell: bash
        env:
          BRANCH: review/a1-v10-post-attempt-final
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v10-request-independent-review.yml
          git commit -m "review: remove A1-v10 review-request workflow"
          git push origin HEAD:refs/heads/"$BRANCH"

      - name: Request Copilot after PR head converges
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            actual_sha="$(gh pr view 96 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
            if [ "$actual_sha" = "$final_sha" ]; then
              gh pr edit 96 --repo psvensson/lagrange --add-reviewer @copilot
              gh pr view 96 --repo psvensson/lagrange                 --json number,state,isDraft,headRefOid,url,reviewRequests
              exit 0
            fi
            sleep 2
          done
          echo "PR #96 head did not converge to $final_sha"
          exit 1
