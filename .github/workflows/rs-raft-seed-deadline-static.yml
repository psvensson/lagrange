# Exact candidate strict static/corpus audit; no ratchet/baseline changes.
name: rs-raft-seed-deadline-static
on:
  push:
    branches: [continue/rs-raft-seed-deadline-semantics-20261014]
    paths:
      - .github/workflows/rs-raft-seed-deadline-static.yml
      - src/bootstrap/bootstrap-service-seed-workflow.js
      - test/bootstrap/seed-release-once-per-cohort.test.js
      - test/shards/impact-graph-seal.json
      - test/shards/subsystem-classes.json
      - test/shards/primary-classes.json
      - test/shards/resource-classes.json
permissions:
  contents: read
concurrency:
  group: rs-raft-seed-deadline-static
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Locked dependencies
        run: npm ci
      - name: Capture all strict checks including inherited red
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-seed-deadline-static
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          failed=0
          for task in \
            audit:shards \
            audit:impact-contracts \
            test:deps \
            test:unused:ratchet \
            audit:file-size:strict \
            test:duplication:strict \
            lint \
            audit:no-legacy-consensus-references \
            audit:owner-boundary-segments; do
            label="${task//:/-}"
            npm run -s "$task" > "$OUT/$label.log" 2>&1
            code=$?
            printf '%s\n' "$code" > "$OUT/$label.status"
            echo "$task status=$code"
            if test "$code" -ne 0; then
              failed=1
              tail -n 37 "$OUT/$label.log" | cut -c 1-400
            fi
          done
          git diff --check > "$OUT/git-diff-check.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$OUT/git-diff-check.status"
          if test "$code" -ne 0; then failed=1; fi
          exit "$failed"
      - name: Keep every exact-source static red, never change ratchets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-seed-deadline-static-${{ github.sha }}
          path: test-output/rs-raft-seed-deadline-static/
          retention-days: 14
          if-no-files-found: warn
