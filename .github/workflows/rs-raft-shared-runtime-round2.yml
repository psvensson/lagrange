name: rs-raft-shared-runtime-round2
on:
  push:
    branches: [resume/rs-raft-runtime-recovery-20261012]
    paths:
      - .github/workflows/rs-raft-shared-runtime-round2.yml
      - scripts/quest-evidence/run-shared-runtime-repair-round2.py
permissions:
  contents: read
concurrency:
  group: rs-raft-shared-runtime-repair-20261012
  cancel-in-progress: false
jobs:
  exact-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BRANCH: resume/rs-raft-runtime-recovery-20261012
      QUEST: replicated-transaction-decision-and-apply
      EVIDENCE: test-output/shared-runtime-round2
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind execution environment
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$EVIDENCE"
          npm ci > "$EVIDENCE/install.log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Measure baseline candidate revert regressions and active audits
        if: steps.setup.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python3 scripts/quest-evidence/run-shared-runtime-repair-round2.py > "$EVIDENCE/driver.log" 2>&1
          STATUS=$?
          printf '%s\n' "$STATUS" > "$EVIDENCE/driver-exit.txt"
          tail -50 "$EVIDENCE/driver.log"
      - name: Preserve exact source and all outcomes on the WIP branch
        if: always() && steps.setup.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE/candidate-sha.txt"
          git diff --exit-code -- src test
          DEST="solve/quests/$QUEST/evidence/shared-runtime-round2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp -a "$EVIDENCE/." "$DEST/"
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS"
          git add -- "$DEST"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: preserve refined shared-replacement proof and all audit outcomes'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$EVIDENCE/published-sha.txt"
      - name: Retain current source even on failures
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE/current-source"
          cp src/raft/raft-rs-runtime-owner.js src/raft/raft-rs-runtime-owner-constants.js src/raft/raft-rs-runtime-faults.js "$EVIDENCE/current-source/"
          git status --porcelain > "$EVIDENCE/final-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-shared-runtime-round2-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/shared-runtime-round2/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve any remaining failure as RED
        if: always()
        shell: bash
        run: |
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["EVIDENCE"])/"summary.json"; assert p.exists() and json.loads(p.read_text())["allRunGatesPassed"], "Incomplete or failed gate remains; no independent approval or merge"'
