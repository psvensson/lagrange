# Initial WIP hosted reproduction of original fresh-seed startup obligations.
# Not locked-host or distributed proof. All original budgets remain unchanged.
name: rs-raft-receipts-startup-probe
on:
  push:
    branches: [integrate/rs-raft-receipts-wip-20261014]
    paths: [.github/workflows/rs-raft-receipts-startup-probe.yml]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install exact source dependencies
        run: npm ci
      - name: Fresh-seed and control-claim at existing budgets, attempt one
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-receipts-startup
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          failed=0
          for f in \
            test/bootstrap/node-bootstrap-consistency.property.test.js \
            test/integration/message-group-membership-claim-cache.integration.test.js; do
            label="${f##*/}"
            npm run -s test:file -- "$f" > "$OUT/$label.log" 2>&1
            result=$?
            printf '%s\n' "$result" > "$OUT/$label.status"
            echo "$f status=$result"
            tail -n 65 "$OUT/$label.log"
            if test "$result" -ne 0; then failed=1; fi
            if test -d test-output/reports; then
              mkdir -p "$OUT/$label.canonical"
              find test-output/reports -maxdepth 1 -type f -name '*.ndjson' -exec cp {} "$OUT/$label.canonical/" \;
            fi
          done
          exit "$failed"
      - name: Preserve complete hosted startup evidence regardless of result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-receipts-startup-${{ github.sha }}
          path: test-output/rs-raft-receipts-startup/
          retention-days: 14
          if-no-files-found: warn
