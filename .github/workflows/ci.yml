# GitHub Actions CI — the required pull-request and main-branch gate.
#
# Runs the post-push gate manifest: the full gate minus the checks the
# pre-push hook (.githooks/pre-push) already ran moments earlier on the
# pushing machine (unused files, unused-exports ratchet, duplication,
# circular deps, eslint). The nightly full-gate workflow still runs the
# complete manifest, so those checks keep a binding remote signal.
#
# The workflow always starts so a required `ci / gate` check can resolve.
# A small GitHub-hosted classifier identifies documentation-only changes;
# for those changes the expensive gate job is skipped, which GitHub reports
# as a successful skipped check. Any code, configuration, workflow, test,
# chart, or package change still runs the full gate.
#
# Runner selection for pushes: the gate job runs on ephemeral GitHub-hosted
# runners by default; put '[ci:self-hosted]' in the head commit message to
# route that push to the maintainer's self-hosted box. Pull requests always
# run GitHub-hosted regardless of any flag.
#
# The statistical rolling-restart convergence gate is deliberately not run
# here: its pass rate is variance-bounded and is promoted only through the
# sealed Wilson-95 rule documented in docs/convergence-donewhen-metric.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      run_gate: ${{ steps.classify.outputs.run_gate }}
      # Runner selector for push events, driven by a commit-message flag:
      # '[ci:self-hosted]' routes a push gate to the fast local box. With no
      # flag, and for every pull request, use GitHub-hosted runners (fork code
      # on a public repo must never reach the self-hosted runner).
      runner: ${{ steps.classify.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$EVENT_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$head^")"
          fi

          mapfile -t changed_paths < <(git diff --name-only "$base" "$head")
          run_gate=false

          for path in "${changed_paths[@]}"; do
            case "$path" in
              *.md|docs/*|architecture/*)
                continue
                ;;
            esac

            if [ "$EVENT_NAME" = "push" ]; then
              case "$path" in
                solve/changes/*|solve/log/*|solve/report/*|solve/autonomous/*)
                  continue
                  ;;
              esac
            fi

            run_gate=true
            break
          done

          printf 'Changed paths:\n'
          printf '  %s\n' "${changed_paths[@]}"
          echo "run_gate=$run_gate" | tee -a "$GITHUB_OUTPUT"

          runner="ubuntu-24.04"
          if [ "$EVENT_NAME" = "push" ]; then
            head_message="$(git log -1 --format=%B "$head")"
            if grep -qF '[ci:self-hosted]' <<<"$head_message"; then
              runner="self-hosted"
            fi
          fi
          echo "runner=$runner" | tee -a "$GITHUB_OUTPUT"

  gate:
    needs: changes
    if: needs.changes.outputs.run_gate == 'true'
    # Push events default to ephemeral GitHub-hosted runners; a
    # '[ci:self-hosted]' flag in the head commit message explicitly routes
    # the run to the maintainer's local box. pull_request events (which can
    # carry fork code on a public repo) stay GitHub-hosted regardless of any
    # flag and must never be routed to self-hosted.
    runs-on: ${{ needs.changes.outputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: solver historical-artifact tests read files from
          # older commits via git show, which a shallow clone cannot serve.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install gate CLI tools
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          # Component tests spawn a bare `wasm-tools`; on the maintainer's box
          # that is a cargo install, so a GitHub-hosted runner has no way to
          # get it and the spawn fails ENOENT. Upstream publishes no checksum
          # file for the release asset, so pin the digest inline and fail
          # closed on drift, exactly as the MovieLens dataset step does.
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: npm ci

      # The MovieLens evidence tests read the real 100k ratings file; data/ is
      # gitignored, so fetch it and fail closed on any digest drift (the same
      # sha256 the tests pin).
      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Post-push gate
        run: npm run test:gate:postpush

      # The gate captures each manifest command's output to a file, so on
      # failure the job log alone cannot say which command broke. Print the
      # receipt's verdicts, then every failing command's failure lines (the
      # runner prints `not ok <file>` plus failing shard summaries) BEFORE a
      # bounded tail — a bare tail can truncate away the exact lines that
      # name the failing test.
      - name: Dump gate receipt on failure
        if: failure()
        run: |
          set -uo pipefail
          receipt=$(ls -t test-output/acceptance/*.report.json 2>/dev/null | head -1)
          [ -n "$receipt" ] || { echo "no receipt found"; exit 0; }
          echo "=== $receipt ==="
          jq '[.commands[] | {id, status, exitCode, reasons}]' "$receipt"
          jq -r '.commands[] | select(.status == "FAIL") | (.artifactIdentity.path // .requiredArtifact.path // empty)' "$receipt" |
          while read -r artifact; do
            [ -f "$artifact" ] || continue
            echo "=== failures in $artifact ==="
            jq -r '.stdout // .output // empty' "$artifact" 2>/dev/null |
              grep -E '^(not ok|# test-files.*fail=[1-9]|FAIL|.*[Ee]rror)' |
              head -100 || true
            echo "=== failing shard details in $artifact ==="
            jq -r '.stdout // .output // empty' "$artifact" 2>/dev/null |
              grep -A 60 '^not ok' | head -200 || true
            echo "=== tail of $artifact ==="
            jq -r '.stdout // .output // .' "$artifact" 2>/dev/null | tail -200 || tail -c 20000 "$artifact"
          done
