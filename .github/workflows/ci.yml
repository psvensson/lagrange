# GitHub Actions CI — the required pull-request and main-branch gate.
#
# Runs the post-push gate manifest: the full gate minus the checks the
# pre-push hook (.githooks/pre-push) already ran moments earlier on the
# pushing machine (unused files, unused-exports ratchet, duplication,
# circular deps, eslint). The nightly full-gate workflow still runs the
# complete manifest, so those checks keep a binding remote signal.
#
# The statistical rolling-restart convergence gate is deliberately not run
# here: its pass rate is variance-bounded and is promoted only through the
# sealed Wilson-95 rule documented in docs/convergence-donewhen-metric.md.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "solve/changes/**"
      - "solve/log/**"
      - "solve/report/**"
      - "solve/autonomous/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # Push events come only from the maintainer, so they run on the fast
    # self-hosted box; pull_request events (which can carry fork code on a
    # public repo) stay on ephemeral GitHub-hosted runners and must never be
    # routed to self-hosted.
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: solver historical-artifact tests read files from
          # older commits via git show, which a shallow clone cannot serve.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install gate CLI tools
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install dependencies
        run: npm ci

      # The MovieLens evidence tests read the real 100k ratings file; data/ is
      # gitignored, so fetch it and fail closed on any digest drift (the same
      # sha256 the tests pin).
      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Post-push gate
        run: npm run test:gate:postpush

      # The gate captures each manifest command's output to a file, so on
      # failure the job log alone cannot say which command broke. Print the
      # receipt's verdicts and the tail of every failing command's captured
      # output.
      - name: Dump gate receipt on failure
        if: failure()
        run: |
          set -uo pipefail
          receipt=$(ls -t test-output/acceptance/*.report.json 2>/dev/null | head -1)
          [ -n "$receipt" ] || { echo "no receipt found"; exit 0; }
          echo "=== $receipt ==="
          jq '[.commands[] | {id, status, exitCode, reasons}]' "$receipt"
          jq -r '.commands[] | select(.status == "FAIL") | (.artifactIdentity.path // .requiredArtifact.path // empty)' "$receipt" |
          while read -r artifact; do
            [ -f "$artifact" ] || continue
            echo "=== tail of $artifact ==="
            jq -r '.stdout // .output // .' "$artifact" 2>/dev/null | tail -200 || tail -c 20000 "$artifact"
          done
