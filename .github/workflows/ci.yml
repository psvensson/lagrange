# GitHub Actions CI - the required pull-request and main-branch gate.
#
# The workflow supplies IDENTITY AND ENVIRONMENT; repository code decides what
# must be proved. That is the whole design:
#
#   this workflow        which commits are in this change, and a machine to run on
#   npm run check        what that change obliges us to prove
#
# There is deliberately no path classifier here any more. One used to live in a
# `changes` job that decided whether the gate should run at all, with special
# cases for Markdown, docs/, architecture/ and Solver output. It was a SECOND
# AUTHORITY on what a change means, competing with the source taxonomy in
# scripts/checks/change-selection-constants.js, and two authorities on the same
# question eventually disagree. The taxonomy is exhaustive and fails closed; a
# YAML case statement cannot be either.
#
# Skipping the job for documentation is no longer worth its own semantics: a
# docs-only change now resolves to the safety spine, which is seconds of
# behavioural proof, so the job simply always runs and the selector decides.
#
# Runner selection for pushes: GitHub-hosted by default; '[ci:self-hosted]' in
# the head commit message routes that push to the maintainer's box. Pull
# requests always run GitHub-hosted regardless of any marker, because fork code
# on a public repo must never reach a self-hosted runner.
#
# The statistical rolling-restart convergence gate is deliberately not run
# here: its pass rate is variance-bounded and is promoted only through the
# sealed Wilson-95 rule documented in docs/convergence-donewhen-metric.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    # Expression rather than a preceding job: routing needs only the head
    # commit message, which is already on the event, so a whole extra job and
    # checkout would buy nothing. `github.event.head_commit` exists for push
    # events only, which is exactly the restriction we want.
    runs-on: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:self-hosted]')) && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The PR HEAD, not the synthetic merge commit: the proof range is
          # base.sha..head.sha, and diffing a merge commit would attribute
          # base-branch commits to this change.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the proof range reaches back to the base SHA, and
          # solver historical-artifact tests read older commits via git show,
          # which a shallow clone cannot serve.
          fetch-depth: 0

      - name: Resolve the proof range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A pull request proves base..head, so every commit on the branch
          # participates - not merely the tip. A push proves the range the
          # remote did not have, which is `before`..HEAD.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          # A new branch reports the zero SHA, and a force-push or an expired
          # object can leave `before` unreachable. Fall back to the single
          # preceding commit and SAY SO, rather than resolving to an empty base
          # that would quietly prove the working tree alone.
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] ||
            ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "proof range: base '$base' unavailable, falling back to HEAD^"
            base="$(git rev-parse HEAD^)"
          fi

          echo "proof range: $base..$(git rev-parse HEAD)"
          echo "LAGRANGE_CHECK_BASE=$base" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install gate CLI tools
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          # Component tests spawn a bare `wasm-tools`; on the maintainer's box
          # that is a cargo install, so a GitHub-hosted runner has no way to
          # get it and the spawn fails ENOENT. Upstream publishes no checksum
          # file for the release asset, so pin the digest inline and fail
          # closed on drift, exactly as the MovieLens dataset step does.
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: npm ci

      # The MovieLens evidence tests read the real 100k ratings file; data/ is
      # gitignored, so fetch it and fail closed on any digest drift (the same
      # sha256 the tests pin).
      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      # The ordinary proof: fast static over the changed paths, then the
      # safety spine plus whatever this change's subsystems oblige. It fails
      # closed - an unclassifiable change refuses with MODULAR PROOF NOT SAFE
      # and a reason code rather than proving a convenient subset.
      - name: Ordinary proof
        run: npm run check

      # `npm run check` prints its failures directly, so there is no receipt to
      # decode here. The artifacts still carry per-test detail that a bounded
      # console log cannot.
      - name: Upload proof failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proof-failure-evidence
          path: |
            test-output/
            .tap/test-results/
          retention-days: 14
          if-no-files-found: warn
