name: tidb-scenario-a-semantic-closure

on:
  push:
    branches:
      - benchmark/scenario-a-tidb-semantic-closure
    paths:
      - '.github/workflows/tidb-scenario-a-semantic-closure.yml'
      - '.github/workflows/tidb-scenario-a-proof-ownership.yml'
      - 'scripts/checks/**'
      - 'test/distributed/harness/**'
      - 'test/distributed/reference-client/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidb-scenario-a-semantic-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Prove combined semantic contracts and ownership
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-baseline-transaction-executor.js \
            test/distributed/harness/oltp-scenario-a-failure-atomicity-case.js \
            test/distributed/harness/oltp-scenario-a-retryable-conflict-case.js \
            test/distributed/harness/oltp-scenario-a-durability-case.js \
            test/distributed/harness/oltp-scenario-a-order-status-case.js \
            test/distributed/reference-client/tidb-retryable-conflict-probe.js \
            scripts/checks/oltp-baseline-transaction-executor-guard.js \
            scripts/checks/oltp-scenario-a-failure-atomicity-case-guard.js \
            scripts/checks/oltp-scenario-a-retryable-conflict-case-guard.js \
            scripts/checks/oltp-scenario-a-durability-case-guard.js \
            scripts/checks/oltp-scenario-a-order-status-case-guard.js \
            scripts/checks/tidb-retryable-conflict-probe-guard.js \
            scripts/checks/oltp-scenario-a-proof-ownership-guard.js \
            scripts/checks/tidb-scenario-a-semantic-gate-evidence.js
          node scripts/checks/oltp-baseline-transaction-executor-guard.js
          node scripts/checks/oltp-scenario-a-new-order-contention-case-guard.js
          node scripts/checks/oltp-scenario-a-visibility-case-guard.js
          node scripts/checks/oltp-scenario-a-payment-case-guard.js
          node scripts/checks/oltp-scenario-a-order-status-case-guard.js
          node scripts/checks/oltp-scenario-a-delivery-case-guard.js
          node scripts/checks/oltp-scenario-a-stock-level-case-guard.js
          node scripts/checks/oltp-scenario-a-failure-atomicity-case-guard.js
          node scripts/checks/oltp-scenario-a-retryable-conflict-case-guard.js
          node scripts/checks/tidb-retryable-conflict-probe-guard.js
          node scripts/checks/oltp-scenario-a-durability-case-guard.js
          node scripts/checks/oltp-scenario-a-semantic-gate-guard.js
          node scripts/checks/oltp-scenario-a-proof-ownership-guard.js

  semantic-live-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Verify Docker and pull pinned TiDB images
        run: |
          set -euo pipefail
          docker version
          docker pull pingcap/pd:v8.5.8
          docker pull pingcap/tikv:v8.5.8
          docker pull pingcap/tidb:v8.5.8
          docker pull mysql:8.4.11

      - name: Run all TiDB Scenario A semantic proofs
        run: |
          set -euo pipefail
          rm -rf test-output/tidb-reference
          node scripts/checks/run-tidb-scenario-a-new-order-contention-live.js
          node scripts/checks/run-tidb-scenario-a-visibility-live.js
          node scripts/checks/run-tidb-scenario-a-payment-live.js
          node scripts/checks/run-tidb-scenario-a-order-status-live.js
          node scripts/checks/run-tidb-scenario-a-delivery-live.js
          node scripts/checks/run-tidb-scenario-a-stock-level-live.js
          node scripts/checks/run-tidb-scenario-a-failure-atomicity-live.js
          node scripts/checks/run-tidb-scenario-a-retryable-conflict-live.js
          node scripts/checks/run-tidb-scenario-a-durability-live.js

      - name: Build content-bound TiDB semantic gate evidence
        run: |
          set -euo pipefail
          node scripts/checks/tidb-scenario-a-semantic-gate-evidence.js

      - name: Upload TiDB semantic closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tidb-scenario-a-semantic-closure-${{ github.run_id }}
          path: test-output/tidb-reference/*.json
          retention-days: 30
          if-no-files-found: warn
