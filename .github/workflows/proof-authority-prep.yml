name: proof-authority-prep

on:
  push:
    branches: [release/v0.2.4-process-repair]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/v0.2.4-process-repair
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - name: Finish durable proof authority wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, from, to, label) {
            if (text.includes(to)) return text;
            if (!text.includes(from)) throw new Error(`${label} source missing`);
            return text.replace(from, to);
          }

          const authorityPath = 'scripts/action-authority.js';
          let authority = fs.readFileSync(authorityPath, 'utf8');
          authority = replaceOnce(
            authority,
            " * One action carries a standing authority instead of a signal, and says so:\n",
            " * A small set of repository-maintenance actions carry standing authority instead\n * of an operator signal, and say so explicitly:\n",
            'authority standing comment',
          );
          authority = replaceOnce(
            authority,
            "  CREATE_PUBLIC_RELEASE: 'create-public-release',\n});",
            "  CREATE_PUBLIC_RELEASE: 'create-public-release',\n  RECORD_PROOF: 'record-proof',\n});",
            'record-proof action',
          );
          authority = replaceOnce(
            authority,
            "  RELEASE: 'an explicit request naming the release to create, matching the ' +\n    'tag at hand',\n});",
            "  RELEASE: 'an explicit request naming the release to create, matching the ' +\n    'tag at hand',\n  PROOF_RECEIPT: 'nothing beyond the standing authority to record a successful ' +\n    'registered proof for its exact immutable subject',\n});",
            'proof receipt requirement',
          );
          authority = replaceOnce(
            authority,
            "  [ACTION.CREATE_PUBLIC_RELEASE]: Object.freeze({\n    requires: REQUIRES.RELEASE,\n    decide: intendedRelease(REQUIRES.RELEASE, TAG_FIELD)}),\n});",
            "  [ACTION.CREATE_PUBLIC_RELEASE]: Object.freeze({\n    requires: REQUIRES.RELEASE,\n    decide: intendedRelease(REQUIRES.RELEASE, TAG_FIELD)}),\n  [ACTION.RECORD_PROOF]: Object.freeze({\n    requires: REQUIRES.PROOF_RECEIPT,\n    standing: 'successful registered immutable-SHA proofs are durably recorded ' +\n      'under their exact proof identity',\n  }),\n});",
            'record-proof registry entry',
          );
          fs.writeFileSync(authorityPath, authority);

          const actionTestPath = 'test/scripts/action-authority.test.js';
          let actionTest = fs.readFileSync(actionTestPath, 'utf8');
          actionTest = replaceOnce(
            actionTest,
            "const STANDING_ACTIONS = Object.freeze(['publish-head']);",
            "const STANDING_ACTIONS = Object.freeze(['publish-head', 'record-proof']);",
            'standing action expectation',
          );
          fs.writeFileSync(actionTestPath, actionTest);

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['check:release'] = 'node scripts/run-release-proof.js';
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          node test/scripts/proof-authority.test.js
          node test/scripts/action-authority.test.js
          node test/scripts/release-preflight.test.js
          node test/release/release-pipeline-proof-reuse.test.js
          npx eslint \
            scripts/proof-authority.js \
            scripts/run-release-proof.js \
            scripts/release-preflight.js \
            test/scripts/proof-authority.test.js \
            test/scripts/release-preflight.test.js \
            test/release/release-pipeline-proof-reuse.test.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            scripts/action-authority.js \
            test/scripts/action-authority.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'release: complete durable proof authority wiring'
            git push origin HEAD:release/v0.2.4-process-repair
          fi
