name: proof-authority-prep

on:
  push:
    branches: [release/v0.2.4-process-repair]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/v0.2.4-process-repair
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - name: Register durable proof recording authorization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const authorityPath = 'scripts/action-authority.js';
          let authority = fs.readFileSync(authorityPath, 'utf8');
          const edits = [
            [
              " * One action carries a standing authority instead of a signal, and says so:\n",
              " * A small set of repository-maintenance actions carry standing authority instead\n * of an operator signal, and say so explicitly:\n",
            ],
            [
              "  CREATE_PUBLIC_RELEASE: 'create-public-release',\n});",
              "  CREATE_PUBLIC_RELEASE: 'create-public-release',\n  RECORD_PROOF: 'record-proof',\n});",
            ],
            [
              "  RELEASE: 'an explicit request naming the release to create, matching the ' +\n    'tag at hand',\n});",
              "  RELEASE: 'an explicit request naming the release to create, matching the ' +\n    'tag at hand',\n  PROOF_RECEIPT: 'nothing beyond the standing authority to record a successful ' +\n    'registered proof for its exact immutable subject',\n});",
            ],
            [
              "  [ACTION.CREATE_PUBLIC_RELEASE]: Object.freeze({\n    requires: REQUIRES.RELEASE,\n    decide: intendedRelease(REQUIRES.RELEASE, TAG_FIELD)}),\n});",
              "  [ACTION.CREATE_PUBLIC_RELEASE]: Object.freeze({\n    requires: REQUIRES.RELEASE,\n    decide: intendedRelease(REQUIRES.RELEASE, TAG_FIELD)}),\n  [ACTION.RECORD_PROOF]: Object.freeze({\n    requires: REQUIRES.PROOF_RECEIPT,\n    standing: 'successful registered immutable-SHA proofs are durably recorded ' +\n      'under their exact proof identity',\n  }),\n});",
            ],
          ];
          for (const [from, to] of edits) {
            if (!authority.includes(from)) {
              throw new Error(`action-authority edit source missing: ${from}`);
            }
            authority = authority.replace(from, to);
          }
          fs.writeFileSync(authorityPath, authority);

          const testPath = 'test/scripts/action-authority.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const from = "const STANDING_ACTIONS = Object.freeze(['publish-head']);";
          const to = "const STANDING_ACTIONS = Object.freeze(['publish-head', 'record-proof']);";
          if (!test.includes(from)) throw new Error('standing-action expectation source missing');
          test = test.replace(from, to);
          fs.writeFileSync(testPath, test);
          NODE

          node test/scripts/proof-authority.test.js
          node test/scripts/action-authority.test.js
          npx eslint scripts/proof-authority.js test/scripts/proof-authority.test.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/action-authority.js test/scripts/action-authority.test.js
          git commit -m 'release: authorize durable proof receipts'
          git push origin HEAD:release/v0.2.4-process-repair
