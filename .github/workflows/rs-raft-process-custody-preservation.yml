name: rs-raft-process-custody-preservation
on:
  push:
    branches: [carrier/rs-raft-process-custody-20261016]
    paths: [.github/workflows/rs-raft-process-custody-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-process-custody-preservation-20261016
  cancel-in-progress: false
jobs:
  preserve-authored-wip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0cdf38556a4e11d35417c8378bfacf04f1a5ba18
          fetch-depth: 1
          persist-credentials: true
      - name: Preserve frozen author-review stage, not source acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/process-custody-preservation"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = 0cdf38556a4e11d35417c8378bfacf04f1a5ba18
          test -z "$(git status --porcelain)"
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          out = pathlib.Path(os.environ['OUT'])
          parts = ['84d00c0860df5a74cc41052de8b52ae1605a2231',
                   'dfcec068637d9333d64f8010d5bccff870eeee32',
                   'b654d0288f696a614196ff0479a5acc0898749aa',
                   'c8090e63386aaf887d12827ddd048c97a1e82ef3',
                   '771a5d6b1669ebd50162371fd931a828e3c03bf3']
          encoded = []
          for sha in parts:
              reply = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/psvensson/lagrange/git/blobs/' + sha]))
              data = base64.b64decode(reply['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              encoded.append(data)
          patch = zlib.decompress(base64.b64decode(b''.join(encoded), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a16bf48ff54a06a599ed50bd0db6f099f76fb5491562f0e159fd71d83ee0edab'
          commit = base64.b64decode('')
          (out / 'source.patch').write_bytes(patch)
          (out / 'head-commit.raw').write_bytes(commit)
          PYCODE
          git apply --check --index "$OUT/source.patch"
          git apply --index "$OUT/source.patch"
          test "$(git write-tree)" = 8cea01bc3cf5295f671cd47ee31337a707210bba
          test "$(git hash-object -t commit -w "$OUT/head-commit.raw")" = 9712d2633ed3d188faa2a418cca58c87db08045b
          git diff --exit-code 0cdf38556a4e11d35417c8378bfacf04f1a5ba18 9712d2633ed3d188faa2a418cca58c87db08045b -- src
          REF=refs/heads/work/rs-raft-process-custody-20261016
          git fetch --no-tags origin "$REF"
          test "$(git rev-parse FETCH_HEAD)" = 0cdf38556a4e11d35417c8378bfacf04f1a5ba18
          git push origin 9712d2633ed3d188faa2a418cca58c87db08045b:"$REF"
          REMOTE=$(git ls-remote --heads origin "$REF" | cut -f1)
          test "$REMOTE" = 9712d2633ed3d188faa2a418cca58c87db08045b
          printf '%s\n' "$REMOTE" > "$OUT/verified-remote-sha.txt"
          printf '%s\n' 'Test-only WIP; original production bytes; author review is not independent certification; full static gate remains open.' > "$OUT/claim-limit.txt"
          cd "$OUT"
          sha256sum source.patch head-commit.raw verified-remote-sha.txt claim-limit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-process-custody-preservation-${{ github.run_id }}
          path: ${{ runner.temp }}/process-custody-preservation/
          retention-days: 7
          if-no-files-found: error
