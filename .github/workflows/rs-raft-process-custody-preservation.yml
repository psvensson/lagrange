name: rs-raft-process-custody-preservation
on:
  push:
    branches: [carrier/rs-raft-process-custody-20261016]
    paths: [.github/workflows/rs-raft-process-custody-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-process-custody-preservation-20261016
  cancel-in-progress: false
jobs:
  preserve-authored-wip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9712d2633ed3d188faa2a418cca58c87db08045b
          fetch-depth: 1
          persist-credentials: true
      - name: Preserve reviewed source for measurement, not merge approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/process-custody-preservation"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = 9712d2633ed3d188faa2a418cca58c87db08045b
          test -z "$(git status --porcelain)"
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          out = pathlib.Path(os.environ['OUT'])
          parts = ['d825b1e08260049927927f462676969cd41fa54f',
                   '1e06ac2be3103792bdc5cf7b447de09216a30d56',
                   'c65a25d43cd5a6b91ed784d293c14405a389fc1a']
          encoded = []
          for sha in parts:
              reply = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/psvensson/lagrange/git/blobs/' + sha]))
              data = base64.b64decode(reply['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              encoded.append(data)
          patch = zlib.decompress(base64.b64decode(b''.join(encoded), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9174b03f677c5d20e44b6ac4a0ac5f7b5aacde0a0947017357b531b7a01c2793'
          commit = base64.b64decode('')
          (out / 'source.patch').write_bytes(patch)
          (out / 'head-commit.raw').write_bytes(commit)
          PYCODE
          git apply --check --index "$OUT/source.patch"
          git apply --index "$OUT/source.patch"
          test "$(git write-tree)" = a8d721c3fcb7489878d933a94f66a2d0cc7c2601
          test "$(git hash-object -t commit -w "$OUT/head-commit.raw")" = 1603b31a90e1c1d814898ddfa4de4851aae9865e
          git diff --exit-code 9712d2633ed3d188faa2a418cca58c87db08045b 1603b31a90e1c1d814898ddfa4de4851aae9865e -- test/entrypoint test/node
          REF=refs/heads/work/rs-raft-process-custody-20261016
          git fetch --no-tags origin "$REF"
          test "$(git rev-parse FETCH_HEAD)" = 9712d2633ed3d188faa2a418cca58c87db08045b
          git push origin 1603b31a90e1c1d814898ddfa4de4851aae9865e:"$REF"
          REMOTE=$(git ls-remote --heads origin "$REF" | cut -f1)
          test "$REMOTE" = 1603b31a90e1c1d814898ddfa4de4851aae9865e
          printf '%s\n' "$REMOTE" > "$OUT/verified-remote-sha.txt"
          printf '%s\n' 'WIP source correction, unchanged tests; author review not independent certification; full static gate remains open.' > "$OUT/claim-limit.txt"
          cd "$OUT"
          sha256sum source.patch head-commit.raw verified-remote-sha.txt claim-limit.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-process-custody-preservation-${{ github.run_id }}
          path: ${{ runner.temp }}/process-custody-preservation/
          retention-days: 7
          if-no-files-found: error
