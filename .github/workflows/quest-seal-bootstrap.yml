name: quest-a1-v2-retry-after-review

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  retry:
    name: record Copilot rejection and prove repaired A1-v2 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Record independent rejection
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v2             --verification "REJECT: GitHub Copilot review PR #74 review PRR_kwDOThZ5hs8AAAABQVJnnw found the candidate's Unicode merge witness proved sorting but did not isolate the adjacency compareRoutingKeys delegation; reverting only adjacency could still pass. Governance-scope and PR-description findings are handled separately."             --verifier subagent:github-copilot-pr74-PRR_kwDOThZ5hs8AAAABQVJnnw             --verdict reject

      - name: Confirm sealed source remains red
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v2
          set +e
          node scripts/checks/partition-key-ordering-owner-completion-v2.js
          status=$?
          set -e
          test "$status" -ne 0

      - name: Baseline scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js

      - name: Install repaired witnesses and prove controlled negatives
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v2/evidence
          cp "$evidence/candidate-test-routing-key-comparator.test.js"             test/partition/routing-key-comparator.test.js
          cp "$evidence/candidate-test-merge-auto-execution.test.js"             test/partition/merge-auto-execution.test.js

          set +e
          node --test test/partition/routing-key-comparator.test.js             > /tmp/a1-v2-routing-red.log 2>&1
          routing_status=$?
          node test/partition/merge-auto-execution.test.js             > /tmp/a1-v2-merge-red.log 2>&1
          merge_status=$?
          set -e

          cat /tmp/a1-v2-routing-red.log
          cat /tmp/a1-v2-merge-red.log
          test "$routing_status" -ne 0
          test "$merge_status" -ne 0
          grep -E "not ok.*text routing order matches SQLite BINARY"             /tmp/a1-v2-routing-red.log >/dev/null
          grep -E "not ok.*adjacency delegates mixed-key refusal"             /tmp/a1-v2-merge-red.log >/dev/null

      - name: Install exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v2/evidence
          cp "$evidence/candidate-src-split-key-comparator.js"             src/partition/split-key-comparator.js
          cp "$evidence/candidate-src-split-merge-core.js"             src/partition/partition-split-merge-manager-core-methods.js
          cp "$evidence/candidate-src-split-merge-evaluation.js"             src/partition/partition-split-merge-manager-evaluation-methods.js

      - name: Prove repaired candidate green
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v2.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v2

      - name: Candidate scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js
          npx eslint             "${files[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js
          git diff --check

      - name: Record repaired content-bound attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_hashes="$(sha256sum             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js | tr '\n' ';')"
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v2             --finding "A1-v2 repaired controlled negative on GitHub Actions run ${GITHUB_RUN_ID}: the added mixed-key adjacency witness is red on sealed source specifically because the old raw adjacency comparator admits the pair, and green only when adjacency delegates to compareRoutingKeys; Unicode SQLite-BINARY routing remains red/green. Candidate sha256: ${candidate_hashes}"             --kind evidence             --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v2             --attempt "A1-v2 repaired after independent rejection: exact candidate now has isolated red-on-revert coverage for both SQLite-BINARY ordering and adjacency owner delegation, with focused tests, doneWhen and scoped guardrails green in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Restore product tree and preserve review plus attempt record
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git restore --             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js

          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-attempt mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale attempt push"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson
          git commit -m "quest: record repaired A1-v2 attempt after Copilot rejection"
          git push origin HEAD:refs/heads/"$BRANCH"
