name: quest-a1-v2-candidate

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  candidate:
    name: prove and preserve A1-v2 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Confirm sealed A1-v2 baseline is red
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v2
          set +e
          node scripts/checks/partition-key-ordering-owner-completion-v2.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "A1-v2 baseline unexpectedly green before candidate installation"
            exit 1
          fi

      - name: Baseline scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js

      - name: Install witnesses and prove controlled negative
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion/evidence
          cp "$evidence/candidate-test-routing-key-comparator.test.js"             test/partition/routing-key-comparator.test.js
          cp "$evidence/candidate-test-merge-auto-execution.test.js"             test/partition/merge-auto-execution.test.js

          set +e
          node --test test/partition/routing-key-comparator.test.js             > /tmp/a1-v2-routing-red.log 2>&1
          routing_status=$?
          node test/partition/merge-auto-execution.test.js             > /tmp/a1-v2-merge-red.log 2>&1
          merge_status=$?
          set -e

          cat /tmp/a1-v2-routing-red.log
          cat /tmp/a1-v2-merge-red.log

          if [ "$routing_status" -eq 0 ]; then
            echo "routing witness unexpectedly green on sealed source"
            exit 1
          fi
          if [ "$merge_status" -eq 0 ]; then
            echo "merge witness unexpectedly green on sealed source"
            exit 1
          fi
          grep -E "not ok.*text routing order matches SQLite BINARY"             /tmp/a1-v2-routing-red.log >/dev/null
          grep -E "not ok.*adjacency sorting uses SQLite BINARY key order"             /tmp/a1-v2-merge-red.log >/dev/null

      - name: Install source candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion/evidence
          cp "$evidence/candidate-src-split-key-comparator.js"             src/partition/split-key-comparator.js
          cp "$evidence/candidate-src-split-merge-core.js"             src/partition/partition-split-merge-manager-core-methods.js
          cp "$evidence/candidate-src-split-merge-evaluation.js"             src/partition/partition-split-merge-manager-evaluation-methods.js

      - name: Prove green candidate
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v2.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v2

      - name: Candidate scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js
          npx eslint             "${files[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js
          git diff --check

      - name: Record A1-v2 evidence and attempt while five-file diff is live
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v2             --finding "A1-v2 controlled negative on GitHub Actions run ${GITHUB_RUN_ID}: real SQLite BINARY including U+E000/U+10000 and merge-adjacency witnesses are red on the sealed source and green with the candidate; exact typed mixed-key refusal and direct doneWhen metric zero are preserved."             --kind evidence             --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v2             --attempt "A1-v2 candidate completes the partition-key order owner: UTF-8/SQLite-BINARY text order, split comparator consistency, merge sort and adjacency delegation, numeric/TEXT compatibility and exact typed refusal; focused tests, red controls, doneWhen and scoped guardrails all pass in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Refresh generated metadata for candidate
        shell: bash
        run: npm run -s test:metadata:refresh

      - name: Refuse unexpected candidate mutations
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/partition/(split-key-comparator\.js|partition-split-merge-manager-core-methods\.js|partition-split-merge-manager-evaluation-methods\.js)|test/partition/(routing-key-comparator\.test\.js|merge-auto-execution\.test\.js)|solve/quests/partition-key-ordering-owner-completion-v2/log\.ndjson|test/shards/(primary-classes\.json|resource-classes\.json|subsystem-classes\.json|impact-graph-seal\.json))$'
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          for required in             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson; do
            printf '%s\n' "$changed" | grep -Fx "$required" >/dev/null
          done
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected candidate mutation set:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit and preserve candidate if branch is unchanged
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale candidate push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json
          git commit -m "feat: complete A1-v2 partition-key ordering owner"
          git push origin HEAD:refs/heads/"$BRANCH"
