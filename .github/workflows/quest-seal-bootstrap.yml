name: quest-a1-v4-seal-and-attempt

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  prove:
    name: seal and prove consolidated A1-v4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated state before sealing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-global-owner-debt-inventory.js --refresh
          node scripts/generate-priority-recovery-owner-inventory.js
          npm run -s test:metadata:refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             solve/changes/global-owner-debt-inventory/inventory.json             solve/changes/priority-recovery-owner-inventory/inventory.json             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json
          if ! git diff --cached --quiet; then
            LAGRANGE_SKIP_PRECOMMIT=1 git commit -m "test: refresh generated state for A1-v4 seal"
          fi

      - name: Record v3 rejection, supersede it, and seal v4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v3             --verification "REJECT: category-complete Copilot reviews PR #83 and PR #84 found residual A1-v3 defects: same-reference unsupported/non-finite bypass, inherited/accessor/iterator split metadata, mutable String table-ID sorting, and non-isolated intrinsic controls."             --verifier subagent:github-copilot-pr83-pr84             --verdict reject
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v3             --superseded "Category-complete independent review found production and harness gaps outside the sealed v3 predicate; preserve v3 and continue as consolidated v4."             --by partition-key-ordering-owner-completion-v4
          node scripts/solve.js start --id partition-key-ordering-owner-completion-v4
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v4

      - name: Baseline scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js

      - name: Install v4 witnesses and prove reviewed defects red
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v4/evidence
          cp "$evidence/candidate-test-routing-key-comparator.test.js"             test/partition/routing-key-comparator.test.js
          cp "$evidence/candidate-test-merge-auto-execution.test.js"             test/partition/merge-auto-execution.test.js

          set +e
          node --test test/partition/routing-key-comparator.test.js             > /tmp/a1-v4-routing-red.log 2>&1
          routing_status=$?
          node test/partition/merge-auto-execution.test.js             > /tmp/a1-v4-merge-red.log 2>&1
          merge_status=$?
          node scripts/checks/partition-key-ordering-owner-completion-v4.js             > /tmp/a1-v4-probe-red.log 2>&1
          probe_status=$?
          set -e

          cat /tmp/a1-v4-routing-red.log
          cat /tmp/a1-v4-merge-red.log
          cat /tmp/a1-v4-probe-red.log
          test "$routing_status" -ne 0
          test "$merge_status" -ne 0
          test "$probe_status" -ne 0

          grep -E "not ok.*unsupported identical and non-finite"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*text routing order matches SQLite BINARY"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures Number.isFinite"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures numeric conversion"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures RegExp.test"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures Error constructor"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures Buffer.compare"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*captures Buffer.isBuffer"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*split target routing captures Array.isArray"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*split target metadata ignores inherited accessors"             /tmp/a1-v4-routing-red.log >/dev/null
          grep -E "not ok.*merge sort table IDs ignore mutable String"             /tmp/a1-v4-merge-red.log >/dev/null
          grep -E "not ok.*adjacency delegates mixed-key refusal"             /tmp/a1-v4-merge-red.log >/dev/null

      - name: Install consolidated v4 source candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v4/evidence
          cp "$evidence/candidate-src-split-key-comparator.js"             src/partition/split-key-comparator.js
          cp "$evidence/candidate-src-split-merge-core.js"             src/partition/partition-split-merge-manager-core-methods.js
          cp "$evidence/candidate-src-split-merge-evaluation.js"             src/partition/partition-split-merge-manager-evaluation-methods.js

      - name: Prove v4 candidate green
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v4.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v4

      - name: Candidate guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js
          npx eslint "${files[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js
          git diff --check

      - name: Record v4 content-bound attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_hashes="$(sha256sum             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js | tr '\n' ';')"
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v4             --finding "A1-v4 GitHub Actions run ${GITHUB_RUN_ID}: same-reference/non-finite refusal, SQLite-BINARY order, isolated mutable intrinsics, own-data/accessor/iterator-safe split metadata, coercion-free table-ID sorting and merge adjacency are red on reviewed baseline and green on the exact consolidated candidate. Candidate sha256: ${candidate_hashes}"             --kind evidence             --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v4             --attempt "A1-v4 consolidates all category-complete A1 review findings; focused tests, isolated controls, doneWhen and scoped guardrails are green in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Restore product tree and preserve Solver records
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git restore --             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js

          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n'             solve/quests/partition-key-ordering-owner-completion-v3/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v4/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v4/quest.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-attempt mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             solve/quests/partition-key-ordering-owner-completion-v3/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v4/quest.json             solve/quests/partition-key-ordering-owner-completion-v4/log.ndjson
          git commit -m "quest: seal and record consolidated A1-v4 attempt"
          git push origin HEAD:refs/heads/"$BRANCH"
