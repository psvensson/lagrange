name: quest-a1-v5-seal-and-attempt

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify committed shard state before sealing
        shell: bash
        run: |
          set -euo pipefail
          npm run -s audit:shards
          git diff --exit-code -- \
            test/shards/primary-classes.json \
            test/shards/resource-classes.json \
            test/shards/subsystem-classes.json

      - name: Record final v4 rejection, supersede it, and seal v5
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v4 \
            --verification "REJECT: final category-complete Copilot PR #86 review of exact v4 candidate head 0b8689a7fc25a51c175670d6e2c8e479d8cffa1a found raw numeric subtraction returning noncanonical/non-finite derived results, falsey non-string table IDs normalized to absence, missing enumerable Object/Array prototype-pollution coverage, and combined rather than isolated Object descriptor/hasOwn controls." \
            --verifier subagent:github-copilot-pr86 \
            --verdict reject
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v4 \
            --superseded "Final category-complete review found two production and two verifier gaps outside the immutable v4 predicate; preserve v4 and continue as v5." \
            --by partition-key-ordering-owner-completion-v5
          node scripts/solve.js start --id partition-key-ordering-owner-completion-v5
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v5

      - name: Baseline scoped guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js

      - name: Install v5 witnesses
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v5/evidence
          cp "$evidence/candidate-test-routing-key-comparator.test.js" \
            test/partition/routing-key-comparator.test.js
          cp "$evidence/candidate-test-merge-auto-execution.test.js" \
            test/partition/merge-auto-execution.test.js

      - name: Prove exact rejected v4 candidate against v5 findings
        shell: bash
        run: |
          set -euo pipefail
          v4=solve/quests/partition-key-ordering-owner-completion-v4/evidence
          cp "$v4/candidate-src-split-key-comparator.js" \
            src/partition/split-key-comparator.js
          cp "$v4/candidate-src-split-merge-core.js" \
            src/partition/partition-split-merge-manager-core-methods.js
          cp "$v4/candidate-src-split-merge-evaluation.js" \
            src/partition/partition-split-merge-manager-evaluation-methods.js

          set +e
          node --test test/partition/routing-key-comparator.test.js \
            > /tmp/a1-v5-routing-v4-red.log 2>&1
          routing_status=$?
          node test/partition/merge-auto-execution.test.js \
            > /tmp/a1-v5-merge-v4-red.log 2>&1
          merge_status=$?
          node scripts/checks/partition-key-ordering-owner-completion-v5.js \
            > /tmp/a1-v5-probe-v4-red.log 2>&1
          probe_status=$?
          set -e

          cat /tmp/a1-v5-routing-v4-red.log
          cat /tmp/a1-v5-merge-v4-red.log
          cat /tmp/a1-v5-probe-v4-red.log

          test "$routing_status" -ne 0
          test "$merge_status" -ne 0
          test "$probe_status" -ne 0
          grep -E "not ok.*finite numeric comparisons return canonical finite comparator values" \
            /tmp/a1-v5-routing-v4-red.log >/dev/null
          grep -E "not ok.*merge table IDs preserve falsey values" \
            /tmp/a1-v5-merge-v4-red.log >/dev/null

          grep -E "ok [0-9]+ - split target routing captures Object.getOwnPropertyDescriptor" \
            /tmp/a1-v5-routing-v4-red.log >/dev/null
          grep -E "ok [0-9]+ - split target routing captures Object.hasOwn" \
            /tmp/a1-v5-routing-v4-red.log >/dev/null
          grep -E "ok [0-9]+ - split metadata ignores enumerable Object and Array prototype pollution" \
            /tmp/a1-v5-routing-v4-red.log >/dev/null

      - name: Install v5 source candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence=solve/quests/partition-key-ordering-owner-completion-v5/evidence
          cp "$evidence/candidate-src-split-key-comparator.js" \
            src/partition/split-key-comparator.js
          cp "$evidence/candidate-src-split-merge-core.js" \
            src/partition/partition-split-merge-manager-core-methods.js
          cp "$evidence/candidate-src-split-merge-evaluation.js" \
            src/partition/partition-split-merge-manager-evaluation-methods.js

      - name: Prove v5 candidate green
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v5.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v5

      - name: Candidate guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          node scripts/check-file-size-thresholds.js
          npx eslint "${files[@]}" \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js
          git diff --check

      - name: Record v5 content-bound attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_hashes="$(sha256sum \
            src/partition/split-key-comparator.js \
            src/partition/partition-split-merge-manager-core-methods.js \
            src/partition/partition-split-merge-manager-evaluation-methods.js \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js | tr '\n' ';')"
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v5 \
            --finding "A1-v5 GitHub Actions run ${GITHUB_RUN_ID}: exact rejected v4 candidate is right-reason red for canonical finite numeric results and falsey/non-own table-ID handling; new prototype-pollution and isolated Object-intrinsic witnesses are engaged at their real consumers; exact v5 candidate is green. Candidate sha256: ${candidate_hashes}" \
            --kind evidence \
            --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v5 \
            --attempt "A1-v5 closes final PR #86 findings: canonical finite -1/0/1 numeric comparison, own-data table-ID reads preserving falsey values for validation, explicit Object/Array prototype-pollution coverage, and isolated Object intrinsic controls; focused tests, doneWhen and guardrails green in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Restore product tree and preserve Solver records
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git restore -- \
            src/partition/split-key-comparator.js \
            src/partition/partition-split-merge-manager-core-methods.js \
            src/partition/partition-split-merge-manager-evaluation-methods.js \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js

          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            solve/quests/partition-key-ordering-owner-completion-v4/log.ndjson \
            solve/quests/partition-key-ordering-owner-completion-v5/log.ndjson \
            solve/quests/partition-key-ordering-owner-completion-v5/quest.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-attempt mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            solve/quests/partition-key-ordering-owner-completion-v4/log.ndjson \
            solve/quests/partition-key-ordering-owner-completion-v5/quest.json \
            solve/quests/partition-key-ordering-owner-completion-v5/log.ndjson
          git commit -m "quest: seal and record A1-v5 attempt"
          git push origin HEAD:refs/heads/"$BRANCH"
