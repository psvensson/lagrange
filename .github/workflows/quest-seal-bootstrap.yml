name: quest-seal-bootstrap
# preservation-fast-path active

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  seal:
    name: regenerate metadata then seal partition-key ordering quest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: quest/0-3-queryable-core-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Refresh and commit generated test metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run -s test:metadata:refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet --             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json; then
            git add --               test/shards/primary-classes.json               test/shards/resource-classes.json               test/shards/subsystem-classes.json               test/shards/impact-graph-seal.json
            git commit -m "test: refresh metadata for 0.3 Quest planning"
          fi

      - name: Seal Quest on the exact metadata-current HEAD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js start --id partition-key-ordering-owner-completion
          node scripts/solve.js probe --id partition-key-ordering-owner-completion

      - name: Refuse unexpected post-seal mutations
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n'             solve/quests/partition-key-ordering-owner-completion/log.ndjson             solve/quests/partition-key-ordering-owner-completion/quest.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-seal mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit and preserve exact Solver seal
        shell: bash
        run: |
          set -euo pipefail
          git add --             solve/quests/partition-key-ordering-owner-completion/quest.json             solve/quests/partition-key-ordering-owner-completion/log.ndjson
          git commit -m "quest: seal partition-key ordering owner completion"
          git push origin HEAD:refs/heads/quest/0-3-queryable-core-foundation
