name: quest-a1-v2-seal

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: write

jobs:
  seal:
    name: supersede A1 and seal reviewed A1-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Refresh and commit generated test metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run -s test:metadata:refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet --             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json; then
            git add --               test/shards/primary-classes.json               test/shards/resource-classes.json               test/shards/subsystem-classes.json               test/shards/impact-graph-seal.json
            git commit -m "test: refresh metadata for reviewed A1-v2 probe"
          fi

      - name: Supersede old A1 and seal A1-v2 on exact metadata-current HEAD
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note             --id partition-key-ordering-owner-completion             --superseded "Independent pre-seal Copilot review found the sealed checker incomplete for UTF-8/BINARY non-BMP ordering and exact typed-refusal discrimination; preserve that predicate and continue as v2."             --by partition-key-ordering-owner-completion-v2
          node scripts/solve.js start --id partition-key-ordering-owner-completion-v2
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v2

      - name: Refuse unexpected mutations
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n'             solve/quests/partition-key-ordering-owner-completion/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v2/quest.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected Solver mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Preserve reviewed seal if branch is unchanged
        shell: bash
        env:
          BRANCH: quest/0-3-queryable-core-foundation
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale seal push"
            exit 1
          fi
          git add --             solve/quests/partition-key-ordering-owner-completion/log.ndjson             solve/quests/partition-key-ordering-owner-completion-v2/quest.json             solve/quests/partition-key-ordering-owner-completion-v2/log.ndjson
          git commit -m "quest: supersede A1 and seal reviewed A1-v2"
          git push origin HEAD:refs/heads/"$BRANCH"
