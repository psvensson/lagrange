name: quest-a1-v2-request-independent-review

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    name: request Copilot review of exact A1-v2 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request independent Copilot review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit 77 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 77 --repo psvensson/lagrange             --json number,state,isDraft,headRefOid,url,reviewRequests
