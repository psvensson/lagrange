name: quest-a1-v2-request-re-review

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/quest-seal-bootstrap.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    name: request Copilot re-review of repaired A1-v2 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request independent Copilot re-review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewed_sha="50199bb8a5890913906b14892d74d4ba8712e5e0"
          actual_sha="$(gh pr view 77 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          if [ "$actual_sha" != "$reviewed_sha" ]; then
            echo "PR #77 head changed: expected $reviewed_sha, got $actual_sha"
            exit 1
          fi
          gh pr edit 77 --repo psvensson/lagrange --add-reviewer @copilot
