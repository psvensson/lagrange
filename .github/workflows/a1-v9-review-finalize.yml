name: a1-v9-post-attempt-review-finalize

on:
  push:
    branches:
      - review/a1-v9-post-attempt-final
    paths:
      - .github/workflows/a1-v9-review-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify exact v9 candidate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v9.sha256" <<'EOF'
          9aba852cf52c65e3e63927a28fdd0438a27864c96188ab5b77f71842aa31b81e  src/partition/partition-split-merge-manager.js
          4cac564fbb7504f73ef0c6be6c96b34fd2e57f24a53b9a32465ff8d1269f9fd5  src/partition/partition-split-merge-evaluation-context.js
          4142ae6c02ad40aeef4c1d1b5a692f3fe9c975d9027a9d51899478612bb9e652  src/partition/split-key-comparator.js
          395b9c3e6ba6b00a1c86a94943b0d03584e7975e025004538e1cc2385aa3590b  src/partition/partition-split-merge-manager-core-methods.js
          28909b70aae1746eb2fd895d795397b3523e6fcb4f37ec59fd40a19c3e2bada8  src/partition/partition-split-merge-manager-evaluation-methods.js
          36b32055b89b9c19efa211abd67193a65d61a730b5720c836e533caa6ceeb35c  src/partition/partition-split-merge-manager-transition-methods.js
          65b3d3f70294c65d1b8ced3cd379795a8d732c61e79ca80df77bec228c419524  src/partition/partition-split-routing.js
          75731d4832f734ff89f063f35a4577443920b40376cb012d8eb20e55a54bcbc4  test/partition/routing-key-comparator.test.js
          7ca08f03cb299a59c2f48edbdda47c989d8d06958f69c3cf348cb8fce05fb200  test/partition/merge-auto-execution.test.js
          8f68493406d9698ea717caf9a47b81391c144c32ef20cc46b6867199b8f337bf  test/partition/partition-split-routing.test.js
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/v9.sha256"
          sha256sum --check "$RUNNER_TEMP/v9.sha256"

      - name: V9 closure and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checks/partition-key-ordering-owner-completion-v9.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v9
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-routing.test.js
          npm run test:file -- test/partition/split-merge-capacity-preflight.test.js

      - name: Candidate guardrails
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/partition/partition-split-merge-manager.js
            src/partition/partition-split-merge-evaluation-context.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            src/partition/partition-split-routing.js
          )
          npm run test:complexity
          npm run test:complexity:scoped -- "${files[@]}"
          npm run audit:file-size
          node node_modules/eslint/bin/eslint.js --no-warn-ignored --no-error-on-unmatched-pattern             "${files[@]}"             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js             test/partition/partition-split-routing.test.js
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-guideline-decision-boundaries.js "${files[@]}"
          node scripts/check-guideline-ambient-intrinsics.js "${files[@]}"
          node scripts/check-guideline-silent-catch.js "${files[@]}"
          git diff --check

      - name: Refresh canonical generated state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-global-owner-debt-inventory.js --refresh
          node scripts/generate-priority-recovery-owner-inventory.js
          npm run -s test:metadata:refresh

      - name: Commit generated review state and remove temporary workflow
        shell: bash
        env:
          BRANCH: review/a1-v9-post-attempt-final
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v9-review-finalize.yml
          git add --             solve/changes/global-owner-debt-inventory/inventory.json             solve/changes/priority-recovery-owner-inventory/inventory.json             test/shards/primary-classes.json             test/shards/resource-classes.json             test/shards/subsystem-classes.json             test/shards/impact-graph-seal.json
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m "review: finalize generated state for A1-v9"
          test -z "$(git status --porcelain)"

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi
          git push origin HEAD:refs/heads/"$BRANCH"
