name: request-c0-review
on:
  push:
    branches: [ops/c0-review-20261008]
    paths: [.github/workflows/request-c0-review.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: request-c0-review-20261008
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request only the exact frozen contract packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: 9956c4adb1c6f6f8fd95c5d731ff5a4efa95bb41
        run: |
          set -euo pipefail
          test "$(gh pr view 104 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)" = "$EXPECTED"
          mkdir -p evidence
          gh pr view 104 --repo psvensson/lagrange --json headRefOid,body > evidence/exact-request.json
          gh pr comment 104 --repo psvensson/lagrange --body "Current exact review is $EXPECTED, including exact-membership-owner-claim.md. It addresses 4217392058 through a single-winner claim CAS in the existing operation row; the holder identity is separate from immutable pending action authority. Promotion/abort CAS matches the current claimant, not the ordinary expiry-only orphan sweep. Current PR body and disposition state two true/three false receipts. No previous review is claimed as current acceptance. Please return explicit category-complete ACCEPT/REJECT of C0 classification on this exact head, including takeover, terminal debt, boot reread, delayed old action, snapshot ownership and proof ceilings. No source/release/merge approval is requested."
          gh pr edit 104 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 104 --repo psvensson/lagrange --json headRefOid,reviewRequests > evidence/request-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c0-frozen-request-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
