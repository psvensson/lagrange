name: freshmg-cache-visibility-review
on:
  push:
    branches: [ops/c0-review-20261008]
    paths: [.github/workflows/request-c0-review.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-cache-visibility
  cancel-in-progress: false
env:
  CANDIDATE: b435d6b4cbda9ef37bb54cf1d3835f433c6697d8
  WORK_BRANCH: work/freshmg-null-claim-20261008
  QUEST: message-group-fresh-identity-membership
jobs:
  request-terminal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request independent review of isolated terminal settlement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh pr view 106 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)" = 4b31e90765d80528bbb5506d325ab1e284fbb56e
          gh pr comment 106 --repo psvensson/lagrange --body 'Review exact 4b31e90765d80528bbb5506d325ab1e284fbb56e for T0 terminal-first non-admission: current boot; exact immutable row/holder/status/phase/no-action basis; monotonic lane release only; current holder when present; unknown-result/replay; no ordinary resurrection or physical grant. GCP 37767400569 proves same-case red/green plus holder-fence deletion mutant and lint. Return category-complete ACCEPT/REJECT; this is not a request to merge or activate the missing membership driver. Parent NULL-lease increment still has its separate cache integration review.'
          gh pr edit 106 --repo psvensson/lagrange --add-reviewer @copilot
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: |
          set -euo pipefail
          status="$(gcloud compute instances describe lagrange-ci-runner --project something-2e584 --zone europe-north1-a --format='value(status)')"
          if [ "$status" != RUNNING ]; then
            gcloud compute instances start lagrange-ci-runner --project something-2e584 --zone europe-north1-a
          fi
  cache:
    needs: wake
    runs-on: [self-hosted, gcp]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: claim-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          path: claim-cache-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind exact source and integration fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
          mkdir -p test-output/claim-cache
          npm ci
          node --check test/integration/message-group-membership-claim-cache.integration.test.js
          printf 'candidate=%s\nrun=%s\nrunner=%s\n' "$CANDIDATE" "$GITHUB_RUN_ID" "$RUNNER_NAME" > test-output/claim-cache/provenance.txt
      - name: Run actual seed SQL/Raft and SystemTableCache with non-executing row fixture
        run: |
          set -euo pipefail
          exec 9>/tmp/lagrange-contract-first-measurement.lock
          flock -w 120 9
          set +e
          timeout 180s npm run test:file -- test/integration/message-group-membership-claim-cache.integration.test.js > test-output/claim-cache/stdout.txt 2> test-output/claim-cache/stderr.txt
          status=$?
          set -e
          echo "$status" > test-output/claim-cache/exit.txt
          tail -120 test-output/claim-cache/stdout.txt
          tail -80 test-output/claim-cache/stderr.txt >&2
          exit "$status"
      - name: Always retain exact outcome, lint and hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-output/claim-cache
          set +e
          npx eslint test/integration/message-group-membership-claim-cache.integration.test.js > test-output/claim-cache/lint.txt 2> test-output/claim-cache/lint.stderr.txt
          status=$?
          set -e
          echo "$status" > test-output/claim-cache/lint-exit.txt
          git status --porcelain > test-output/claim-cache/final-status.txt
          sha256sum test/integration/message-group-membership-claim-cache.integration.test.js src/rebalancer/replica-operation-message-group-membership-owner-claim.js src/rebalancer/replica-operation-repository.js > test-output/claim-cache/sources.sha256
          find test-output/claim-cache -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-output/claim-cache/SHA256SUMS
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-cache-${{ github.run_id }}
          path: claim-cache-${{ github.run_id }}-${{ github.run_attempt }}/test-output/claim-cache/
          retention-days: 14
          if-no-files-found: error
  record:
    needs: cache
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retain previous and current results, publish without approval
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.cache.result }}
        run: |
          set -euo pipefail
          npm ci
          mkdir -p test-output/cache-retention
          export ARCHIVE_NAME="freshmg-cache-$GITHUB_RUN_ID"
          gh api "repos/psvensson/lagrange/actions/runs/$GITHUB_RUN_ID/artifacts" > test-output/cache-retention/artifacts.json
          export ARTIFACT_ID="$(python3 -c 'import json,os; a=[x for x in json.load(open("test-output/cache-retention/artifacts.json"))["artifacts"] if x["name"]==os.environ["ARCHIVE_NAME"]];assert len(a)==1;print(a[0]["id"])')"
          gh api "repos/psvensson/lagrange/actions/artifacts/$ARTIFACT_ID/zip" > test-output/cache-retention/cache.zip
          gh api repos/psvensson/lagrange/actions/artifacts/11545881533/zip > test-output/cache-retention/founder-37767526592.zip
          python3 - <<'PY'
          import json,os,hashlib,zipfile
          from pathlib import Path
          d=Path('test-output/cache-retention')
          a=next(x for x in json.loads((d/'artifacts.json').read_text())['artifacts'] if x['id']==int(os.environ['ARTIFACT_ID']))
          expected={'cache.zip':a['digest'].split(':')[1],'founder-37767526592.zip':'11c73245adbf9ae5ec9ffcfe0ea754f332277ecc189e2a23e3c4c55b84f7181b'}
          for name,sha in expected.items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha
              with zipfile.ZipFile(d/name) as z:
                  for line in z.read('SHA256SUMS').decode().splitlines():
                      h,n=line.split(None,1)
                      assert hashlib.sha256(z.read(Path(n).name)).hexdigest()==h, n
                  (d/(name+'.json')).write_text(json.dumps({n:z.read(n).decode() for n in z.namelist()},indent=2)+'\n')
          PY
          node scripts/solve.js evidence add test-output/cache-retention/cache.zip --id "$QUEST" --json > test-output/cache-retention/store.json
          node scripts/solve.js evidence add test-output/cache-retention/founder-37767526592.zip --id "$QUEST" --json > test-output/cache-retention/prior-store.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path('test-output/cache-retention')
          r={'schema':'freshmg-cache-integration/1','runId':int(os.environ['GITHUB_RUN_ID']),'candidateSha':os.environ['CANDIDATE'],'result':os.environ['RESULT'],'independentApproval':False,'multiHostAcceptance':False,'fixtureBoundary':'synthetic non-executing operation-row tuple inserted through actual repository; real seed boot/gateway/SQL/Raft/CDC/cache; no physical CREATE grant','retainedEvidence':json.loads((d/'store.json').read_text()),'outputs':json.loads((d/'cache.zip.json').read_text()),'priorFailure':{'runId':37767526592,'candidate':'29280b016f464c08204549c89648d74485c97a39','result':'failure','firstDivergence':'booted founder service did not supply nonempty CREATE-attempt token expected by new identity format; assertion before operation insertion','interpretation':'founder source-generation admission remains unresolved product work; not hidden by the isolated cache test','retainedEvidence':json.loads((d/'prior-store.json').read_text()),'outputs':json.loads((d/'founder-37767526592.zip.json').read_text())}}
          p=Path('solve/quests')/os.environ['QUEST']/'evidence'/('cache-'+os.environ['GITHUB_RUN_ID']+'.json');p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          node scripts/solve.js note --id "$QUEST" --attempt "PR105 cache integration $CANDIDATE: actual seed, gateway, SQL/Raft, CDC and SystemTableCache with explicitly non-executing operation fixture; run $GITHUB_RUN_ID result=$RESULT. Previous founder-token assertion in 37767526592 retained as source-generation admission gap, not passed. No founder row edited or physical token fabricated, no full replacement proof. Current evidence CLI --id corrected after previous publisher failed using --quest."
          git add "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/cache-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: retain real cache visibility result and founder admission blocker'
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$CANDIDATE"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          gh pr comment 105 --repo psvensson/lagrange --body "Cache integration on exact $CANDIDATE in GCP run $GITHUB_RUN_ID: $RESULT. Evidence retained at $(git rev-parse HEAD), including prior founder-generation failure. Real SQL/Raft/CDC/cache, synthetic non-executing operation tuple; not planner admission or physical replacement. Review predicate/evidence scope independently; no approval inferred."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-cache-retention-${{ github.run_id }}
          path: test-output/cache-retention/
          retention-days: 14
          if-no-files-found: error
