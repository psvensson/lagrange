name: request-freshmg-source-review
on:
  push:
    branches: [ops/c0-review-20261008]
    paths: [.github/workflows/request-c0-review.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: request-c0-review-20261008
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request bounded source review on the exact proof subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: 75977928ec0f8d8f17804e06b08e3ee0965b3f73
        run: |
          set -euo pipefail
          test "$(gh pr view 105 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)" = "$EXPECTED"
          mkdir -p evidence
          gh pr view 105 --repo psvensson/lagrange --json headRefOid,baseRefOid,body > evidence/exact-request.json
          gh pr comment 105 --repo psvensson/lagrange --body "Please review exact $EXPECTED: the narrow SQL NULL lease correction, not the inherited dormant claim/branch implementation. Canonical decoder omits absent lease; the writer now matches IS NULL only for that one field and preserves the exact lease predicate. Actual GCP run 37765480208 retained test-first RED (two failures), unchanged-test GREEN (3 files/62 reported assertions), and controlled removal-of-lease-predicate RED; targeted lint passed. Check invalid non-NULL values, renewal interleaving, single-winner competition, identity preservation and harness fidelity. Return explicit ACCEPT/REJECT with remaining findings; no source landing, activation, cutover or C0 closure is requested."
          gh pr edit 105 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 105 --repo psvensson/lagrange --json headRefOid,reviewRequests > evidence/request-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-source-review-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
