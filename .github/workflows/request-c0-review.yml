name: request-c0-review
on:
  push:
    branches: [ops/c0-review-20261008]
    paths: [.github/workflows/request-c0-review.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: request-c0-review-20261008
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request independent review of the confirmed evidence head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=41a8cdfb33ddc4acddafa192f7f5141a6ae38119
          actual="$(gh pr view 104 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          # The previous run retained and published evidence successfully, then
          # stopped at its immediate post-push PR identity check. Do not repeat
          # that upload or overwrite its evidence. This job only requests review.
          gh pr edit 104 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 104 --repo psvensson/lagrange --json number,headRefOid,isDraft,reviewRequests
          echo 'Requested scoped follow-up review of process-loss evidence and J1 proposal. No closure, policy ruling or source approval implied.' >> "$GITHUB_STEP_SUMMARY"
