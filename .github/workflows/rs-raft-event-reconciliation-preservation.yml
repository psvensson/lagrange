name: rs-raft-event-reconciliation-preservation
on:
  push:
    branches: [carrier/rs-raft-event-reconciliation-publication-20261017]
    paths: [.github/workflows/rs-raft-event-reconciliation-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-event-reconciliation-preservation-20261017
  cancel-in-progress: false
jobs:
  preserve-original-evidence-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b7266f3b83fcc6c6afd5a6bc85298e464da0af23
          fetch-depth: 1
          persist-credentials: true
      - name: Preserve ignored original logs and verify committed tree without product execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ChatGPT
          GIT_AUTHOR_EMAIL: chatgpt@openai.com
          GIT_COMMITTER_NAME: ChatGPT
          GIT_COMMITTER_EMAIL: chatgpt@openai.com
          GIT_AUTHOR_DATE: '2026-10-17T06:21:31Z'
          GIT_COMMITTER_DATE: '2026-10-17T06:21:31Z'
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/event-reconciliation-complete-evidence"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, time
          from datetime import datetime, timezone
          
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['OUT'])
          out.mkdir(parents=True, exist_ok=True)
          base = 'b7266f3b83fcc6c6afd5a6bc85298e464da0af23'
          source = 'e221c8c63ae2baea9614c52db04b05336745f35f'
          ref = 'refs/heads/work/rs-raft-event-reconciliation-20261016'
          prefix = 'solve/quests/wasm-creation-genesis/evidence/event-reconciliation-20261016/checkpoint/'
          parts = [
           '26aad1d166ae2ce6d360d38b1f23610e31a45106',
           '02a07b87e8bb287d5fb1335134e68421ddb3c565',
           '5599efd28160401ecc4a2b45ba51f32830397968',
           '0cee9495738ef6e0e55efb9cb3f9b57a21201b67',
           'd49f71717201d0bddf19e96a1c7764a87be89fec',
           '7c37e9060fac957eba0ee5888429612670f3dd1b',
           'a3576f0613adb34844254ce0882d9b0e302fa25a',
           '71f237ad806a29b5b5105c04e39d7cc6b48c314a',
          ]
          def git(*args):
           return subprocess.check_output(['git', *args])
          def tg(*args):
           return git(*args).decode().strip()
          def digest(data):
           return hashlib.sha256(data).hexdigest()
          def blob(data):
           return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def safe(parent, name):
           p=pathlib.PurePosixPath(name)
           assert not p.is_absolute() and '..' not in p.parts
           target=parent/p
           assert target.resolve().is_relative_to(parent.resolve())
           return target
          assert tg('rev-parse','HEAD')==base
          assert not git('status','--porcelain','--untracked-files=all').strip()
          chunks=[]
          for sha in parts:
           for attempt in range(3):
            reply=subprocess.run(['gh','api','repos/psvensson/lagrange/git/blobs/'+sha],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if reply.returncode==0: break
            (out/('read-failure-'+sha+'-'+str(attempt)+'.log')).write_bytes(reply.stderr)
            if attempt==2: raise RuntimeError('GitHub read failed')
            time.sleep(2**attempt)
           data=base64.b64decode(json.loads(reply.stdout)['content'])
           assert blob(data)==sha
           chunks.append(data)
          raw=lzma.decompress(base64.b64decode(b''.join(chunks),validate=True))
          assert digest(raw)=='de7dfbd8bc7d15c14e5357e004cfe8cb344d2eb344d8e809cb453edd0112d7a8'
          payload=json.loads(raw)
          files={name:text.encode() for name,text in payload['files'].items()}
          for name in ['evidence/frozen-input-file-identities.json','evidence/final-input-file-identities.json']:
           files[name]=git('show',base+':'+prefix+name)
          assert len(files)==103
          for line in files['SHA256SUMS'].decode().splitlines():
           expected,name=line.split(maxsplit=1)
           assert digest(files[name.lstrip('*')])==expected,name
          tracked=set(git('ls-tree','-r','--name-only','-z',base,'--',prefix).decode().split('\0'))-{''}
          assert len(tracked)==65
          added=[]
          for name,data in files.items():
           path=prefix+name
           artifact=safe(out/'checkpoint',name)
           artifact.parent.mkdir(parents=True,exist_ok=True)
           artifact.write_bytes(data)
           if path in tracked:
            assert git('show',base+':'+path)==data,path
           else:
            assert name.startswith('evidence/') and name.endswith('.log'),name
            assert len(data)<1000000
            target=safe(root,path); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
            sha=tg('hash-object','-w',path)
            assert sha==blob(data)
            # Explicitly preserve only these verified evidence logs; do not alter ignore rules.
            git('update-index','--add','--cacheinfo','100644',sha,path)
            added.append(path)
          assert len(added)==38
          correction='''# Publication verification correction - 17 October 2026
          
          The first publication produced a complete 103-file downloadable checkpoint, but
          its ordinary directory staging respected the repository's log ignore rules.
          Only 65 checkpoint files were actually tracked at b7266f3b83fcc6c6afd5a6bc85298e464da0af23;
          38 original .log files remained only in the artifact. The original claim that
          all 103 were committed was premature. The preserved source commit is unchanged.
          
          This correction stages exactly those 38 hash-verified original text logs, without
          changing ignore rules, production source, tests, assertions or prior evidence.
          Before publication it reads every one of the 103 members from the proposed Git
          tree and compares bytes to the original checkpoint; a clean worktree or complete
          Actions artifact alone is no longer treated as evidence of Git completeness.
          
          The source remains e221c8c63ae2baea9614c52db04b05336745f35f on PR #133 ancestry.
          All current serving, home-lab, static, corpus and main-merge holds remain open.
          No product tests or home-lab jobs execute in this evidence-only correction.
          Historical publication records and first attempts remain unchanged; this record
          supersedes only their incomplete Git-preservation claim. See the subsequent
          verified publication receipt for the final head and all-file tree checks.
          '''
          quest=root/'solve/quests/wasm-creation-genesis'
          correction_path=quest/'evidence/event-reconciliation-20261016/PUBLICATION-CORRECTION-20261017.md'
          assert not correction_path.exists()
          correction_path.write_text(correction)
          handover=quest/'HANDOVER-20261017.md'
          handover.write_text(handover.read_text()+'''\n## Publication verification addendum\n\nThe first push at b7266f3b preserved the complete archive but Git ignored 38 log\nfiles during directory staging. A subsequent evidence-only correction explicitly\nstages those exact original logs and verifies all 103 checkpoint members from the\ncommitted Git tree, not just the workspace or artifact. The product source and\ntest trees remain unchanged. Read PUBLICATION-CORRECTION-20261017.md in the\nevent-reconciliation evidence directory and use the final corrected branch tip.\n''')
          git('add','--',str(correction_path.relative_to(root)),str(handover.relative_to(root)))
          tree=tg('write-tree')
          for subtree,expected in [('src','4d41f37c628ccdcf518989496b21a25908e6245c'),('test','4f4b38381e1f20c2d6c311b5a7d7c695c4c8d28d')]:
           assert tg('rev-parse',tree+':'+subtree)==expected
          members=set(git('ls-tree','-r','--name-only','-z',tree,'--',prefix).decode().split('\0'))-{''}
          assert members=={prefix+name for name in files}
          for name,data in files.items():
           assert git('show',tree+':'+prefix+name)==data,name
          allowed=set(added)|{str(correction_path.relative_to(root)),str(handover.relative_to(root))}
          assert set(tg('diff','--cached','--name-only',base).splitlines())==allowed
          head=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=b'docs: preserve ignored original evidence logs and verify complete committed checkpoint\n').decode().strip()
          (out/'head-commit.raw').write_bytes(git('cat-file','commit',head))
          (out/'evidence-correction.patch').write_bytes(git('diff','--binary',base,head))
          (out/'HANDOVER.md').write_bytes(handover.read_bytes())
          (out/'PUBLICATION-CORRECTION.md').write_text(correction)
          (out/'added-original-logs.json').write_text(json.dumps(added,indent=2)+'\n')
          def remote_tip():
           return tg('ls-remote','--heads','origin',ref).split()[0]
          for attempt in range(3):
           before=remote_tip()
           if before==head: break
           assert before==base,'Unexpected remote change; refuse'
           p=subprocess.run(['git','push','origin',head+':'+ref],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
           (out/('push-attempt-'+str(attempt+1)+'.log')).write_bytes(p.stdout)
           if remote_tip()==head: break
           retryable=any(word in p.stdout.lower() for word in (b'timeout',b'timed out',b'502',b'503',b'504',b'could not resolve',b'connection'))
           if attempt==2 or not retryable: raise RuntimeError('Publication refused; inspect push log')
           time.sleep(2**(attempt+1))
          assert remote_tip()==head
          git('reset','--hard',head)
          assert not git('status','--porcelain','--untracked-files=all').strip()
          # Verify committed object content again after publication.
          for name,data in files.items():
           assert git('show',head+':'+prefix+name)==data
          receipt={'scope':'Evidence-only publication correction; no new product execution',
           'base':'6ba84863490bff9a43874a03f69ad2afff4b5898','sourceCommit':source,
           'previousHead':base,'headCommit':head,'headTree':tree,'verifiedRemoteSha':head,
           'branch':ref,'sourceTree':'4d41f37c628ccdcf518989496b21a25908e6245c',
           'testTree':'4f4b38381e1f20c2d6c311b5a7d7c695c4c8d28d',
           'originalArchiveSha256':'00b7e514fdf01b86c527d4030aaaae4489835e2729cb98537c8dc19e36a0df64',
           'originalPatchSha256':'d19948a622750ade11e1c7216fd2f722b5490da6695962ef6a0f9b4c0c35fc93',
           'priorTrackedCheckpointFiles':65,'addedOriginalLogs':38,'allCheckpointMembersInGit':103,
           'allCommittedMemberBytesVerified':True,'sourceAndTestUnchanged':True,
           'testsExecuted':False,'homeLabJobsSubmitted':False,'mainTargeted':False,
           'fullStaticPassed':False,'fullCorpusPassed':False,'publicationComplete':True,
           'recordedAt':datetime.now(timezone.utc).isoformat(),'cleanWorktree':True}
          (out/'PUBLICATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          cd "$OUT"
          find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-event-reconciliation-complete-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/event-reconciliation-complete-evidence/
          retention-days: 30
          if-no-files-found: error
