name: rsraft-historical-red-artifact-inventory-20261020
on:
  push:
    branches: [investigate/rsraft-historical-reds-20261020]
    paths: [.github/workflows/rsraft-historical-red-artifact-inventory-20261020.yml]
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download immutable candidate and predecessor error artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history/candidate" "$RUNNER_TEMP/history/predecessor"
          gh run download 39393585693 -R psvensson/lagrange -n u1-gcp-selected-corpus-39393585693 -D "$RUNNER_TEMP/history/candidate"
          gh run download 39405963549 -R psvensson/lagrange -n u1-gcp-predecessor-119-39405963549 -D "$RUNNER_TEMP/history/predecessor"
          python3 - "$RUNNER_TEMP/history" <<'PY'
          import os,sys,glob
          root=sys.argv[1]
          for k in ('candidate','predecessor'):
              files=glob.glob(root+'/'+k+'/**/*',recursive=True)
              files=[p for p in files if os.path.isfile(p)]
              print('ARTIFACT',k,'files',len(files),'bytes',sum(os.path.getsize(f) for f in files))
              for p in files[:35]:
                  print('ENTRY',k,os.path.relpath(p,root+'/'+k),os.path.getsize(p))
              for p in files:
                  if p.endswith(('.ndjson','.json','.tap','.log')) and os.path.getsize(p)>0:
                      print('SAMPLE',k,os.path.relpath(p,root+'/'+k),repr(open(p,errors='replace').read(1200)))
                      if k=='candidate':break
                      if 'test-results' in p:break
          PY
