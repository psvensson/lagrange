name: a1-v2-review-metadata
# retry after static candidate sanity fix

on:
  push:
    branches:
      - review/a1-v2-copilot-main-current
    paths:
      - .github/workflows/a1-v2-review-metadata.yml

permissions:
  contents: read

jobs:
  prove-and-generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Prove adversarial A1-v2 candidate
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v2.js

      - name: Refresh generated metadata
        run: npm run -s test:metadata:refresh

      - name: Upload canonical generated metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a1-v2-generated-metadata
          retention-days: 7
          path: |
            test/shards/primary-classes.json
            test/shards/resource-classes.json
            test/shards/subsystem-classes.json
            test/shards/impact-graph-seal.json
