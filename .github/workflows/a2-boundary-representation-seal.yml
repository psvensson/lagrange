name: a2-boundary-representation-seal
# trigger red seal measurement
on:
  push:
    branches:
      - quest/0-3-boundary-representation
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Seal red A2 Quest
        run: |
          node scripts/solve.js start --id partition-boundary-representation
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solve/quests/partition-boundary-representation/quest.json solve/quests/partition-boundary-representation/log.ndjson
          git commit -m "0.3 A2: seal boundary representation Quest"
          git push origin HEAD:quest/0-3-boundary-representation
