name: runtime-endpoint-publication-owner-smoke

on:
  push:
    branches:
      - core/runtime-endpoint-publication-owner
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: runtime-endpoint-publication-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint owner slice
        run: |
          set -euo pipefail
          npx eslint \
            src/runtime/runtime-endpoint-publication-wiring.js \
            src/bootstrap/shared/runtime-service-handler-setup.js \
            src/bootstrap/shared/meta-service-definition-registration.js \
            test/runtime/runtime-endpoint-publication-wiring.test.js \
            test/bootstrap/meta-service-endpoint-registration.test.js

      - name: Prove boot/runtime endpoint ownership
        run: |
          set -euo pipefail
          node --test \
            test/bootstrap/meta-service-endpoint-registration.test.js \
            test/runtime/runtime-endpoint-publication-wiring.test.js \
            test/runtime/runtime-endpoint-writer.test.js
