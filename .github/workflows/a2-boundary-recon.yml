name: a2-boundary-recon

on:
  push:
    branches:
      - recon/a2-boundary-representation-2026-10-02

permissions:
  contents: write

jobs:
  measure:
    if: ${{ !contains(github.event.head_commit.message, '[a2-recon-recorded]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Measure parser and SQLite integer boundaries
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' | tee a2-boundary-recon-output-v2.jsonl
          import Database from 'better-sqlite3';
          import {SQLParser} from './src/query/sql-parser.js';

          const intended = '9007199254740993';
          const jsNumber = Number(intended);
          console.log(JSON.stringify({
            observation: 'js-number',
            intended,
            jsNumber,
            safe: Number.isSafeInteger(jsNumber),
            rendered: String(jsNumber),
          }));

          for (const dialect of ['sqlite', 'postgresql']) {
            const sql = 'SELECT * FROM items WHERE id = ' + intended;
            const ast = new SQLParser(sql, {dialect}).parse();
            console.log(JSON.stringify({
              observation: 'parser-literal',
              dialect,
              intended,
              where: ast.where,
            }));
          }

          for (const [label, expression] of [
            ['small-unquoted', '500'],
            ['small-quoted', "'500'"],
            ['large-unquoted', intended],
            ['large-quoted', "'" + intended + "'"],
          ]) {
            const ast = new SQLParser(
              'SELECT * FROM items WHERE id = ' + expression,
              {dialect: 'sqlite'},
            ).parse();
            console.log(JSON.stringify({
              observation: 'parser-literal-shape',
              label,
              value: ast.where?.right?.value,
              jsType: typeof ast.where?.right?.value,
              node: ast.where?.right,
            }));
          }

          const db = new Database(':memory:');
          db.exec('CREATE TABLE t_text (v TEXT); CREATE TABLE t_int (v INTEGER);');

          const big = BigInt(intended);
          const cases = [
            ['text-number', 't_text', jsNumber],
            ['text-string', 't_text', intended],
            ['text-bigint', 't_text', big],
            ['int-number', 't_int', jsNumber],
            ['int-string', 't_int', intended],
            ['int-bigint', 't_int', big],
          ];

          for (const [name, table, value] of cases) {
            db.exec('DELETE FROM ' + table);
            let insertError = null;
            try {
              db.prepare('INSERT INTO ' + table + ' (v) VALUES (?)').run(value);
            } catch (error) {
              insertError = String(error?.message || error);
            }
            let ordinary = null;
            let safe = null;
            if (!insertError) {
              ordinary = db.prepare('SELECT v, typeof(v) AS storage_type FROM ' + table).get();
              const statement = db.prepare('SELECT v, typeof(v) AS storage_type FROM ' + table);
              statement.safeIntegers(true);
              safe = statement.get();
            }
            console.log(JSON.stringify({
              observation: 'sqlite-roundtrip',
              name,
              inputType: typeof value,
              input: String(value),
              insertError,
              ordinary: ordinary && {
                value: String(ordinary.v),
                jsType: typeof ordinary.v,
                storageType: ordinary.storage_type,
              },
              safe: safe && {
                value: String(safe.v),
                jsType: typeof safe.v,
                storageType: safe.storage_type,
              },
            }));
          }

          const blob = Buffer.from([0x00, 0xff, 0x01, 0x80]);
          db.exec('CREATE TABLE t_blob_affinity (v TEXT);');
          db.prepare('INSERT INTO t_blob_affinity (v) VALUES (?)').run(blob);
          const blobRow = db.prepare(
            'SELECT v, typeof(v) AS storage_type FROM t_blob_affinity',
          ).get();
          console.log(JSON.stringify({
            observation: 'sqlite-blob-through-text-affinity',
            storageType: blobRow.storage_type,
            jsType: typeof blobRow.v,
            isBuffer: Buffer.isBuffer(blobRow.v),
            hex: Buffer.isBuffer(blobRow.v) ? blobRow.v.toString('hex') : null,
            rendered: Buffer.isBuffer(blobRow.v) ? null : String(blobRow.v),
          }));

          db.exec('CREATE TABLE t_real (v REAL);');
          for (const value of [0.1, Number.MAX_VALUE, Number.MIN_VALUE, -0]) {
            db.exec('DELETE FROM t_real');
            db.prepare('INSERT INTO t_real (v) VALUES (?)').run(value);
            const row = db.prepare(
              'SELECT v, typeof(v) AS storage_type FROM t_real',
            ).get();
            console.log(JSON.stringify({
              observation: 'sqlite-real-roundtrip',
              input: Object.is(value, -0) ? '-0' : String(value),
              output: Object.is(row.v, -0) ? '-0' : String(row.v),
              same: Object.is(value, row.v),
              storageType: row.storage_type,
            }));
          }

          db.close();
          NODE

      - name: Record measured evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a2-boundary-recon-output-v2.jsonl
          git commit -m "recon: record A2 boundary measurements [a2-recon-recorded]"
          git push origin HEAD:recon/a2-boundary-representation-2026-10-02
