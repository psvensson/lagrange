name: pr73-late-leader-row-seed-proof

on:
  push:
    branches:
      - "investigate/pr73-late-leader-row-seed-20261006"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Red on exact PR73 source
        env:
          BASE_SHA: 6df3ec5e1c09ef14e6a743dc805399c1092712a8
        run: |
          set -euo pipefail
          cp test/control-plane/cl-036-local-leader-row-seed.test.js "$RUNNER_TEMP/cl036-fixed-test.js"
          git checkout "$BASE_SHA" -- src/partition/partition-service-metadata-delivery-methods.js
          cp "$RUNNER_TEMP/cl036-fixed-test.js" test/control-plane/cl-036-local-leader-row-seed.test.js
          set +e
          node test/control-plane/cl-036-local-leader-row-seed.test.js >"$RUNNER_TEMP/red.tap" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/red.tap"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::new late-row witness unexpectedly passes on exact PR73 source"
            exit 1
          fi
          grep -q "RED-ON-CURRENT: the later real row closes the missed election edge" "$RUNNER_TEMP/red.tap"

      - name: Green on candidate fix
        run: |
          set -euo pipefail
          git checkout "$GITHUB_SHA" --             src/partition/partition-service-metadata-delivery-methods.js             test/control-plane/cl-036-local-leader-row-seed.test.js
          node test/control-plane/cl-036-local-leader-row-seed.test.js

      - name: Adjacent owner proofs
        run: |
          set -euo pipefail
          node test/partition/partition-leader-row-publication-integrity.test.js
          node test/partition/partition-service-role-metadata-publication.test.js
          node test/convergence/dt-local-leader-seed-safety-merge.test.js

      - name: Scoped lint
        run: |
          npx eslint             src/partition/partition-service-metadata-delivery-methods.js             test/control-plane/cl-036-local-leader-row-seed.test.js
