name: pr73-recovery-authority-placement-escape-proof

on:
  push:
    branches:
      - "proof/pr73-recovery-authority-placement-escape-20261007"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Red-first authority reinterpretation witness
        run: |
          set -euo pipefail
          set +e
          node test/rebalancer/pr73-recovery-authority-placement-escape.test.js >"$RUNNER_TEMP/red.tap" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/red.tap"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::authority reinterpretation witness unexpectedly GREEN"
            exit 1
          fi
          grep -q "RED-ON-CURRENT: a recovery-authorized planning pass must not invent" "$RUNNER_TEMP/red.tap"
          grep -q "replica_inventory_unusable" "$RUNNER_TEMP/red.tap"

      - name: Historical placement and spread owners remain green
        run: |
          set -euo pipefail
          node test/rebalancer/spread-cure-at-target-minting-gap.test.js
          node test/rebalancer/cl-038-surplus-drain-retains-leader-node.test.js
          node test/rebalancer/formation-barrier-spread-cure-lane-discrimination.test.js
          node test/rebalancer/formation-barrier-recovery-mutation-admission.test.js

      - name: Scoped lint
        run: npx eslint test/rebalancer/pr73-recovery-authority-placement-escape.test.js
