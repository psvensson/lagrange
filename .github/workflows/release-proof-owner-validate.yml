name: release-proof-owner-validate

on:
  push:
    branches: [release/v0.2.3-proof-owner]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof-owner branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/v0.2.3-proof-owner
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove proof-owner repair
        env:
          LAGRANGE_CHECK_BASE: 3d36fe433f53c63be983f46489bab294c1206625
        run: |
          npm run check
          node --test test/scripts/release-preflight.test.js \
            test/release/project-hardening-contracts.test.js
