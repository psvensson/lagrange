# GitHub Actions nightly + on-demand full gate.
#
# A red nightly points at a day's push range rather than one commit; use
# `git bisect run npm run test:gate` locally to recover attribution.
name: full-gate

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: solver historical-artifact tests read files from
          # older commits via git show, which a shallow clone cannot serve.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install gate CLI tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          # Component tests spawn a bare `wasm-tools`; on the maintainer's box
          # that is a cargo install, so a GitHub-hosted runner has no way to
          # get it and the spawn fails ENOENT. Upstream publishes no checksum
          # file for the release asset, so pin the digest inline and fail
          # closed on drift, exactly as the MovieLens dataset step does.
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: npm ci

      # The MovieLens evidence tests read the real 100k ratings file; data/ is
      # gitignored, so fetch it and fail closed on any digest drift (the same
      # sha256 the tests pin).
      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Full gate
        run: npm run test:gate

      # The acceptance runner captures per-command outcomes into the receipt,
      # not the job log; without this step a red nightly says only "N/5
      # commands passed" and the receipt dies with the runner. Mirrors the
      # ci.yml post-push dump: verdicts first, then each failing command's
      # failure lines before a bounded tail.
      - name: Name the failing gate commands
        if: failure()
        run: |
          set -uo pipefail
          receipt=$(ls -t test-output/acceptance/*.report.json 2>/dev/null | head -1)
          [ -n "$receipt" ] || { echo "no acceptance receipt was produced"; exit 0; }
          echo "=== $receipt ==="
          jq '{summary: .summary, commands: [.commands[] | {id, status, exitCode, reasons}]}' "$receipt"
          jq -r '.commands[] | select(.status == "FAIL") | (.artifactIdentity.path // .requiredArtifact.path // empty)' "$receipt" |
          while read -r artifact; do
            [ -f "$artifact" ] || continue
            echo "=== failures in $artifact ==="
            jq -r '.stdout // .output // empty' "$artifact" 2>/dev/null |
              grep -E '^(not ok|# test-files.*fail=[1-9]|FAIL|.*[Ee]rror)' |
              head -100 || true
            echo "=== tail of $artifact ==="
            jq -r '.stdout // .output // .' "$artifact" 2>/dev/null | tail -200 || tail -c 20000 "$artifact"
          done

      - name: Upload gate outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-gate-output
          path: |
            test-output/acceptance/
            test-output/reports/
            test-output/analysis/
            test-output/proof-cone/
            .tap/test-results/
          retention-days: 14
          if-no-files-found: ignore
