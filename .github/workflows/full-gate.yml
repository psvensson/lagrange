# On-demand whole-tree proof for an exact main SHA.
#
# Release order is enforced here: release.yml must first have produced a green
# publishability run for this exact SHA. Only then do we wake the controlled GCP
# runner and spend the whole-system proof budget.
name: full-gate

on:
  workflow_dispatch: {}
  push:
    branches:
      - "release-proof/**"

permissions:
  contents: read

jobs:
  require-publishability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require exact-SHA publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/release.yml" and (.head_branch | startswith("release-publishability/")) and .status == "completed" and .conclusion == "success")][0].id // empty')"
          test -n "$RUN_ID" || {
            echo "::error::No successful release publishability run exists for exact SHA $GITHUB_SHA"
            echo "Point release-publishability/<version> at this exact main SHA first."
            exit 1
          }
          echo "publication preflight run $RUN_ID already green for $GITHUB_SHA"

  wake-runner:
    needs: require-publishability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: false

      - name: Start the proof runner VM (idempotent)
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe lagrange-ci-runner \
            --zone europe-north1-a --format='value(status)')"
          echo "runner VM status: ${STATUS}"
          if [ "$STATUS" != "RUNNING" ]; then
            gcloud compute instances start lagrange-ci-runner --zone europe-north1-a
          fi

  gate:
    needs: wake-runner
    runs-on: [self-hosted, gcp]
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_RETRY_FAILED_ONCE: '1'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install gate CLI tools
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl gh
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Full release proof, single pass
        run: node scripts/run-release-proof.js

      - name: Name a failing hardening-tail command
        if: failure()
        run: |
          set -uo pipefail
          receipt=$(ls -t test-output/acceptance/*.report.json 2>/dev/null | head -1)
          [ -n "$receipt" ] || { echo "no hardening receipt was produced"; exit 0; }
          echo "=== $receipt ==="
          jq '{summary: .summary, commands: [.commands[] | {id, status, exitCode, reasons}]}' "$receipt"

      - name: Upload gate outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-gate-output
          path: |
            test-output/acceptance/
            test-output/reports/
            test-output/analysis/
            test-output/proof-cone/
            .tap/test-results/
          retention-days: 14
          if-no-files-found: ignore
