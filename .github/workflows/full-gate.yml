# GitHub Actions on-demand full proof - the "prove everything now" button.
#
# This is deliberately unscheduled. A whole-system proof is a standing veto:
# rerunning an unchanged tree on a timer can only turn variance into unrelated
# blocking work. It runs either when an operator dispatches it manually or when
# an exact main SHA is exposed through a `release-proof/**` branch for release
# preflight. The latter is a ref-only trigger: the branch must point at the
# already-landed main commit, so the proof identity is the release identity.
#
# What replaced the old nightly whole-system proof:
#
#   every change      npm run check           (ci.yml, required modular proof)
#   every main push   repository-health.yml   (expensive global analysis)
#   on demand         this workflow           (the whole system)
#   every release     this workflow           (required exact-head pre-tag proof)
#   tagged release    release.yml             (the same command + publication)
#
# It invokes npm run check:release and nothing else. There is deliberately no
# workflow-level opinion here about what "complete" means: that lives in the
# package manifest, so this workflow and the release pipeline cannot drift into
# two different definitions.
name: full-gate

on:
  workflow_dispatch: {}
  push:
    branches:
      - "release-proof/**"

permissions:
  contents: read

jobs:
  # Starting the GCP VM is operator-owned. The maintainer starts it from the
  # authenticated local machine before triggering this workflow; GitHub only
  # queues the proof onto the already-authorized runner.
  gate:
    runs-on: [self-hosted, gcp]
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_RETRY_FAILED_ONCE: '1'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: solver historical-artifact tests read files from
          # older commits via git show, which a shallow clone cannot serve.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install gate CLI tools
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl gh
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Full release proof
        run: npm run check:release

      - name: Name the failing gate commands
        if: failure()
        run: |
          set -uo pipefail
          receipt=$(ls -t test-output/acceptance/*.report.json 2>/dev/null | head -1)
          [ -n "$receipt" ] || { echo "no acceptance receipt was produced"; exit 0; }
          echo "=== $receipt ==="
          jq '{summary: .summary, commands: [.commands[] | {id, status, exitCode, reasons}]}' "$receipt"
          jq -r '.commands[] | select(.status == "FAIL") | (.artifactIdentity.path // .requiredArtifact.path // empty)' "$receipt" |
          while read -r artifact; do
            [ -f "$artifact" ] || continue
            echo "=== failures in $artifact ==="
            jq -r '.stdout // .output // empty' "$artifact" 2>/dev/null |
              grep -E '^(not ok|# test-files.*fail=[1-9]|FAIL|.*[Ee]rror)' |
              head -100 || true
            echo "=== tail of $artifact ==="
            jq -r '.stdout // .output // .' "$artifact" 2>/dev/null | tail -200 || tail -c 20000 "$artifact"
          done

      - name: Upload gate outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-gate-output
          path: |
            test-output/acceptance/
            test-output/reports/
            test-output/analysis/
            test-output/proof-cone/
            .tap/test-results/
          retention-days: 14
          if-no-files-found: ignore
