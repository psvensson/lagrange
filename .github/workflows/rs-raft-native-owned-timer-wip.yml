# Experimental exact WIP native timer candidate, never final Quest acceptance.
name: rs-raft-native-owned-timer-wip
on:
  push:
    branches: [continue/rs-raft-cloud-native-inbound-owned-timer-v1-20261014]
    paths:
      - .github/workflows/rs-raft-native-owned-timer-wip.yml
      - src/raft/raft-rs-inbound-timer-custody.js
      - src/raft/raft-rs-runtime-owner.js
      - src/raft/raft-rs-runtime-owner-constants.js
      - test/raft/raft-rs-backend/inbound-drain-owned-timer.test.js
      - test/partition/participant-release-native-application-order.test.js
      - test/partition/participant-release-native-exit-diagnostic.js
      - test/shards/subsystem-classes.json
      - test/shards/impact-graph-seal.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: rs-raft-native-owned-timer-wip
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Preserve all source-bound focused results without retries
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-native-owned-timer
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/checkout-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/checkout-tree.txt"
          npm run -s test:metadata:refresh > "$OUT/metadata-refresh.log" 2>&1
          metadata=$?
          printf '%s\n' "$metadata" > "$OUT/metadata-refresh.status"
          git diff --name-status > "$OUT/metadata-diff.txt"
          git diff --check > "$OUT/metadata-check.log" 2>&1
          diffcheck=$?
          failed=0
          if test "$metadata" -ne 0 || test "$diffcheck" -ne 0; then failed=1; fi
          npx eslint \
            src/raft/raft-rs-runtime-owner.js \
            src/raft/raft-rs-runtime-owner-constants.js \
            src/raft/raft-rs-inbound-timer-custody.js \
            test/raft/raft-rs-backend/inbound-drain-owned-timer.test.js \
            test/partition/participant-release-native-application-order.test.js \
            test/partition/participant-release-native-exit-diagnostic.js \
            > "$OUT/scoped-eslint.log" 2>&1
          lint=$?
          printf '%s\n' "$lint" > "$OUT/scoped-eslint.status"
          if test "$lint" -ne 0; then failed=1; cat "$OUT/scoped-eslint.log"; fi
          for f in \
            test/raft/raft-rs-backend/inbound-drain-owned-timer.test.js \
            test/raft/raft-rs-backend/operation-port-ready-recovery.test.js \
            test/partition/participant-release-native-application-order.test.js; do
            name="${f##*/}"
            npm run -s test:file -- "$f" > "$OUT/$name.log" 2>&1
            result=$?
            printf '%s\n' "$result" > "$OUT/$name.status"
            echo "$f exact-source test_status=$result"
            tail -n 58 "$OUT/$name.log"
            if test "$result" -ne 0; then failed=1; fi
            if test -d test-output/reports; then
              mkdir -p "$OUT/$name.canonical"
              find test-output/reports -maxdepth 1 -type f -name '*.ndjson' -exec cp {} "$OUT/$name.canonical/" \;
            fi
          done
          exit "$failed"
      - name: Keep raw, canonical and source provenance including every red
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-native-owned-timer-${{ github.sha }}
          path: test-output/rs-raft-native-owned-timer/
          retention-days: 14
          if-no-files-found: warn
