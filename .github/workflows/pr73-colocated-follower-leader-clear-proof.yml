name: pr73-colocated-follower-leader-clear-proof

on:
  push:
    branches:
      - "investigate/pr73-colocated-follower-leader-clear"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      - name: Co-located follower leader-clear witness
        run: node test/node/replica-colocated-follower-leader-clear.test.js

      - name: Adjacent durable lifecycle proof
        run: node test/node/replica-lifecycle-durable-generation.test.js
