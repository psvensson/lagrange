name: rs-raft-bound-bootstrap-preservation
on:
  push:
    branches: [carrier/rs-raft-bound-bootstrap-20261016]
    paths: [.github/workflows/rs-raft-bound-bootstrap-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-bound-bootstrap-preservation-20261016
  cancel-in-progress: false
jobs:
  preserve-reviewed-wip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 609f35524a40d3f7ce8ee6c5a2fdfe89c0859203
          fetch-depth: 1
          persist-credentials: true
      - name: Preserve exact source and isolated proof variants without running product code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ChatGPT
          GIT_AUTHOR_EMAIL: chatgpt@openai.com
          GIT_COMMITTER_NAME: ChatGPT
          GIT_COMMITTER_EMAIL: chatgpt@openai.com
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/bound-bootstrap-preservation"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          out = pathlib.Path(os.environ['OUT'])
          base = '609f35524a40d3f7ce8ee6c5a2fdfe89c0859203'
          def git(*args):
            return subprocess.check_output(['git', *args])
          def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git('rev-parse', 'HEAD').decode().strip() == base
          assert not git('status', '--porcelain').strip()
          parts = [
            'efdcf15de724317a19feec01016c98873fe6874d',
            '499874175f9598e27046c27f23dbe4b42fa3cda8',
            'ed69cd7a263f7c6e3dccb3213cc8b5ff9380e85c',
            'ca89ed4822adbdcbdb6c7caf2c42f606e3b33cef',
            'e005900aa29e9f479b2a72311c8b2e38313d6e5f',
            '4e1e41493362e3b95de43281ba8ed5aaaa6607f8',
            '72f64a7759c6039a86d0969d8bab60594a43d70d',
            '2c940bbc8f192f5856993638758c28d3a5bed359',
            '8e02e708ee093d53dc82c39b4d84a27b5fdd9f0c',
          ]
          encoded = []
          for sha in parts:
            reply = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/psvensson/lagrange/git/blobs/' + sha]))
            data = base64.b64decode(reply['content'])
            assert blob(data) == sha
            if sha == 'ca89ed4822adbdcbdb6c7caf2c42f606e3b33cef':
              assert data.count(b'dfD69vZc6PT') == 1
              data = data.replace(b'dfD69vZc6PT', b'dfD69vjs6PT', 1)
              assert blob(data) == 'cdebc13e303f3d45ad0ee2241965d9ad918ac3ef'
            encoded.append(data)
          raw = zlib.decompress(base64.b64decode(b''.join(encoded), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '21e4d68cec1e9eb9579f1d458f31b93e3f2a1d6de9ef4fc9adde00429b245421'
          payload = json.loads(raw)
          identity = payload['identity']
          assert identity['baseRemote'] == base
          (out / 'expected.json').write_text(json.dumps(identity, indent=2) + '\n')
          (out / 'transfer.json').write_text(json.dumps({'parts': parts,
            'payloadSha256': hashlib.sha256(raw).hexdigest(),
            'correction': 'part 4: dfD69vZc6PT to dfD69vjs6PT, original Git identity verified'}, indent=2) + '\n')
          def commit(tree, parent, message):
            return subprocess.check_output(['git', 'commit-tree', tree, '-p', parent],
              input=(message + '\n').encode()).decode().strip()
          parent = base
          for stage in ('tests', 'source'):
            patch = out / (stage + '.patch')
            patch.write_text(payload[stage])
            git('apply', '--check', '--index', str(patch))
            git('apply', '--index', str(patch))
            tree = git('write-tree').decode().strip()
            message = ('WIP test checkpoint: freeze held native bootstrap and exhaustive cleanup witnesses'
              if stage == 'tests' else
              'WIP: connect retained creation to held native bootstrap; serving and full recovery remain held')
            parent = commit(tree, parent, message)
            (out / (stage + '-commit.raw')).write_bytes(git('cat-file', 'commit', parent))
            (out / (stage + '-sha.txt')).write_text(parent + '\n')
          candidate = parent
          for path, expected in identity['postimages'].items():
            assert blob(pathlib.Path(path).read_bytes()) == expected, path
          for subtree in ('src', 'test'):
            assert git('rev-parse', candidate + ':' + subtree).decode().strip() == identity[subtree + 'Tree']
          ref = 'refs/heads/work/rs-raft-bound-bootstrap-20261016'
          git('fetch', '--no-tags', 'origin', ref)
          assert git('rev-parse', 'FETCH_HEAD').decode().strip() == base
          git('push', 'origin', candidate + ':' + ref)
          assert git('ls-remote', '--heads', 'origin', ref).decode().split()[0] == candidate
          (out / 'verified-remote-sha.txt').write_text(candidate + '\n')
          (out / 'complete.patch').write_bytes(git('diff', '--binary', base, candidate))
          (out / 'changed-paths.txt').write_bytes(git('diff', '--name-status', base, candidate))
          proofs = []
          for item in payload['mutations']:
            git('reset', '--hard', candidate)
            path = pathlib.Path(item['path'])
            text = path.read_text()
            assert text.count(item['before']) == 1
            path.write_text(text.replace(item['before'], item['after'], 1))
            assert blob(path.read_bytes()) == item['blob']
            git('add', item['path'])
            tree = git('write-tree').decode().strip()
            assert git('rev-parse', tree + ':test').decode().strip() == identity['testTree']
            proof = commit(tree, candidate, 'PROOF ONLY: ' + item['branch'] + '; never a product candidate')
            target = 'refs/heads/' + item['branch']
            assert not git('ls-remote', '--heads', 'origin', target).strip()
            git('push', 'origin', proof + ':' + target)
            assert git('ls-remote', '--heads', 'origin', target).decode().split()[0] == proof
            proofs.append({'branch': item['branch'], 'sha': proof, 'path': item['path'], 'blob': item['blob']})
          (out / 'proofs.json').write_text(json.dumps(proofs, indent=2) + '\n')
          git('reset', '--hard', candidate)
          assert not git('status', '--porcelain').strip()
          (out / 'claim-limit.txt').write_text('WIP byte preservation only; no product tests, full static acceptance, serving, main merge or release proof.\n')
          PY
          cd "$OUT"
          sha256sum *.patch *.json *.raw *.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-bound-bootstrap-preservation-${{ github.run_id }}
          path: ${{ runner.temp }}/bound-bootstrap-preservation/
          retention-days: 7
          if-no-files-found: error
