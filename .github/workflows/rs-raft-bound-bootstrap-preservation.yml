name: rs-raft-bound-bootstrap-preservation
on:
  push:
    branches: [carrier/rs-raft-bound-bootstrap-20261016]
    paths: [.github/workflows/rs-raft-bound-bootstrap-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-bound-bootstrap-preservation-20261016
  cancel-in-progress: false
jobs:
  preserve-proof-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8200dd4529b4fa19b72e0450fee1a91493eb942a
          fetch-depth: 2
          persist-credentials: true
      - name: Verify preserved candidate and publish source-only falsifiers
        shell: bash
        env:
          GIT_AUTHOR_NAME: ChatGPT
          GIT_AUTHOR_EMAIL: chatgpt@openai.com
          GIT_COMMITTER_NAME: ChatGPT
          GIT_COMMITTER_EMAIL: chatgpt@openai.com
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/bound-bootstrap-proof-publication"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['OUT'])
          candidate = '8200dd4529b4fa19b72e0450fee1a91493eb942a'
          def git(*args):
            return subprocess.check_output(['git', *args])
          def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git('rev-parse', 'HEAD').decode().strip() == candidate
          assert not git('status', '--porcelain').strip()
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == '5a71eed4fdda72f6c9f1056d05df2ba86ef623b3'
          assert git('rev-parse', 'HEAD:src').decode().strip() == 'd4361a9c67c7480a28be633f283e9e300377d0c1'
          test_tree = 'c2c149387ad5e9c3ac705f2bbe1d243c6380dcac'
          assert git('rev-parse', 'HEAD:test').decode().strip() == test_tree
          ref = 'refs/heads/work/rs-raft-bound-bootstrap-20261016'
          assert git('ls-remote', '--heads', 'origin', ref).decode().split()[0] == candidate
          (out / 'candidate-commit.raw').write_bytes(git('cat-file', 'commit', candidate))
          variants = [
            {
              'branch': 'proof/rs-raft-bound-bootstrap-wrong-root-20261016',
              'path': 'src/wasm-service/wasm-writer-state.js',
              'before': 'if (root !== null && (root.serviceDefinitionId !== identity.serviceId ||\n        root.incarnation !== identity.incarnation)) return refused(command, R.INCARNATION);',
              'after': 'if (root !== null && root.serviceDefinitionId !== identity.serviceId) {\n      return refused(command, R.INCARNATION);\n    }',
              'blob': 'a2a56764f6a3c8c1e3a0c9fa663a9a6f7a00ace7'
            },
            {
              'branch': 'proof/rs-raft-bound-bootstrap-replay-fresh-20261016',
              'path': 'src/service/service-consensus-creation-intent.js',
              'before': 'if (row[COL.OPENING_JSON] !== null) {\n      return {outcome: CONSENSUS_CREATION_OPENING.RETAINED,',
              'after': 'if (row[COL.OPENING_JSON] !== null) {\n      return {outcome: CONSENSUS_CREATION_OPENING.FRESH,',
              'blob': 'd795fe04251730c9e659d92e82ae69e5fca2e44e'
            }
          ]
          proofs = []
          for index, item in enumerate(variants):
            git('reset', '--hard', candidate)
            path = pathlib.Path(item['path'])
            text = path.read_text()
            assert text.count(item['before']) == 1
            path.write_text(text.replace(item['before'], item['after'], 1))
            assert blob(path.read_bytes()) == item['blob']
            git('add', item['path'])
            tree = git('write-tree').decode().strip()
            assert git('rev-parse', tree + ':test').decode().strip() == test_tree
            message = 'PROOF ONLY: ' + item['branch'] + '; never a product candidate\n'
            proof = subprocess.check_output(['git', 'commit-tree', tree, '-p', candidate], input=message.encode()).decode().strip()
            target = 'refs/heads/' + item['branch']
            assert not git('ls-remote', '--heads', 'origin', target).strip()
            (out / ('proof-' + str(index) + '.raw')).write_bytes(git('cat-file', 'commit', proof))
            (out / ('proof-' + str(index) + '.patch')).write_bytes(git('diff', candidate, proof))
            git('push', 'origin', proof + ':' + target)
            assert git('ls-remote', '--heads', 'origin', target).decode().split()[0] == proof
            proofs.append({'branch': item['branch'], 'sha': proof, 'path': item['path'], 'blob': item['blob']})
            (out / 'proofs.json').write_text(json.dumps(proofs, indent=2) + '\n')
          git('reset', '--hard', candidate)
          assert not git('status', '--porcelain').strip()
          assert git('ls-remote', '--heads', 'origin', ref).decode().split()[0] == candidate
          (out / 'claim-limit.txt').write_text('Publication recovery only. Original run 38944956850 published the verified candidate then GitHub rejected the first proof push with a workflow-detection timeout. This run never changes the product branch and runs no product tests.\n')
          PY
          cd "$OUT"
          sha256sum *.patch *.json *.raw *.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-bound-bootstrap-proof-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/bound-bootstrap-proof-publication/
          retention-days: 7
          if-no-files-found: error
