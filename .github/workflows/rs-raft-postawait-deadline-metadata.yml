# Exact-source WIP canonical metadata refresh; preserve every source audit
# red, no baseline/ratchet increases, no main updates.
name: rs-raft-postawait-deadline-metadata
on:
  push:
    branches: [continue/rs-raft-postawait-release-deadline-20261014]
    paths: [.github/workflows/rs-raft-postawait-deadline-metadata.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-postawait-deadline-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run unchanged canonical classifier on exact source
        shell: bash
        run: |
          set -euo pipefail
          H="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$H"
          npm ci
          npm run -s test:metadata:refresh
          git diff --check
          git diff --name-status
          while IFS= read -r changed; do
            test -z "$changed" && continue
            case "$changed" in
              test/shards/impact-graph-seal.json|test/shards/primary-classes.json|test/shards/resource-classes.json|test/shards/subsystem-classes.json) ;;
              *) echo "REFUSED unexpected generated path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          npm run -s audit:shards
          git add -- test/shards/impact-graph-seal.json test/shards/primary-classes.json test/shards/resource-classes.json test/shards/subsystem-classes.json
          if git diff --cached --quiet; then
            echo 'No generated metadata changed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: canonical post-await deadline impact metadata'
          git fetch --no-tags origin refs/heads/continue/rs-raft-postawait-release-deadline-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$H" || {
            echo "Concurrent WIP writer; refuse stale generated push"; exit 1;
          }
          git push origin HEAD:refs/heads/continue/rs-raft-postawait-release-deadline-20261014
