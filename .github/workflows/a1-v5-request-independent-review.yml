name: a1-v5-request-independent-review

on:
  push:
    branches:
      - review/a1-v5-partition-key-ordering-final
    paths:
      - .github/workflows/a1-v5-request-independent-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove request workflow and preserve clean review head
        shell: bash
        env:
          BRANCH: review/a1-v5-partition-key-ordering-final
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v5-request-independent-review.yml
          git commit -m "review: remove A1-v5 review-request workflow"
          git push origin HEAD:refs/heads/"$BRANCH"

      - name: Request Copilot on exact clean head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          actual_sha="$(gh pr view 87 --repo psvensson/lagrange --json headRefOid --jq .headRefOid)"
          if [ "$actual_sha" != "$final_sha" ]; then
            echo "PR #87 head changed: expected $final_sha, got $actual_sha"
            exit 1
          fi
          gh pr edit 87 --repo psvensson/lagrange --add-reviewer @copilot
          gh pr view 87 --repo psvensson/lagrange \
            --json number,state,isDraft,headRefOid,url,reviewRequests
