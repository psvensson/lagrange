# Disposable, read-only five-VM formation diagnostic for exact learner candidate.
# Never merges, pushes, or claims a release proof; this workflow stays only on
# the disposable probe branch and must not be merged into main.
name: learner-committed-gcp-diagnostic

on:
  push:
    branches: [probe/learner-committed-gcp-20261102]
    paths: [.github/workflows/learner-committed-gcp-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: learner-committed-gcp-diagnostic
  cancel-in-progress: false

env:
  LAGRANGE_TEST_MACHINE_FACTOR: '3'
  LAGRANGE_AUTHORIZE_CLOUD_PROJECT: 'something-2e584'
  SOURCE_CANDIDATE: 'b26d2c09070ce719c10d3d59ee9b2a42622f0bdf'

jobs:
  wake-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: false

      - name: Start the runner VM (idempotent)
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe lagrange-ci-runner \
            --zone europe-north1-a --format='value(status)')"
          echo "runner VM status: ${STATUS}"
          if [ "${STATUS}" != "RUNNING" ]; then
            gcloud compute instances start lagrange-ci-runner --zone europe-north1-a
          fi

  health:
    needs: wake-runner
    runs-on: [self-hosted, gcp]
    timeout-minutes: 60
    permissions:
      # The trend record is committed to main below.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The commit step below pushes with the workflow token; a token
          # push starts no other workflow, so a nightly record costs no run.
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate source, no publication authority
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_CANDIDATE}^{commit}"
          git diff --exit-code "${SOURCE_CANDIDATE}" HEAD -- src test scripts package.json package-lock.json
          printf 'candidate=%s\nprobe=%s\n' "${SOURCE_CANDIDATE}" "$GITHUB_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Pulumi CLI
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL \
            --connect-timeout 20 \
            --max-time 300 \
            --retry 2 \
            https://get.pulumi.com \
            -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version 3.261.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pulumi/bin:$PATH"
          test "$(pulumi version)" = "v3.261.0"

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci
          # The GCP harness keeps Pulumi out of the package manifest; install
          # its pinned optional boundary here. --no-save leaves the lockfile
          # governing every other package (switching it off re-resolved the
          # whole tree, and the push gate then rewrote the seal, 09-18).
          npm install --no-save @pulumi/pulumi@3.261.0 @pulumi/gcp@9.36.1

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Formation health run (one node per GCP VM)
        # The step's exit code is the formation verdict, so a red formation
        # is a red run; an UNKNOWN verdict records nothing and is red too.
        # The evidence upload and the trend commit below run regardless.
        run: npm run health:formation -- --gcp

      - name: Upload formation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: learner-committed-formation-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            test-output/reports/movielens-lagrange-formation-only-live-*.report.json
            data/formation-health/trend.ndjson
            data/examples/service-data-affinity-demo/node-*.log
