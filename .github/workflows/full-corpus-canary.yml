# The whole behavioural corpus on a GitHub-hosted runner - by hand only.
#
# The owner's rule (2026-09-18): the corpus is never run on a hosted runner
# while a local alternative exists, releases included. A push proves its
# change cone plus the safety spine in the local gate (lean-push-gate,
# 2026-09-12); the publisher then proves the rest of the corpus for that
# commit locally, detached, placed across the lab machines, and records the
# whole-corpus receipt when it is green (scripts/publish-head.js, the local
# corpus). A red local corpus is reported by the next publish. This workflow
# therefore has no automatic trigger any more: dispatch it by hand only when
# no lab machine and no controller can run the corpus. A hand dispatch always
# re-proves (--force), receipt or not.
name: full-corpus-canary
run-name: "full-corpus: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: full-corpus-canary
  cancel-in-progress: true

jobs:
  decide:
    name: decide
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      # The checkout comes FIRST: actions/checkout deletes the contents of a
      # destination that is not already a git repository, so a scope artifact
      # downloaded into the workspace before it would be wiped unread
      # (verifier round 1). The artifact therefore lands under runner.temp,
      # outside anything the checkout touches.
      - name: Checkout the decision owner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Read the gate run's proof scope
        id: scope
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: proof-scope
          path: ${{ runner.temp }}/gate-proof-scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The decision has one owner with a witness
      # (scripts/checks/canary-corpus-needed.js): the gate run's scope OR a
      # durable whole-corpus receipt for this sha. Anything unknown leaves the
      # corpus owed. Only the script is needed here, so no dependencies are
      # installed - it reads the scope file and the remote's proof refs. A hand
      # dispatch always re-proves: --force, because the operator asking for a
      # canary is asking for the corpus, receipt or not.
      - name: Decide whether the corpus is still unproved
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checks/canary-corpus-needed.js \
            --sha '${{ github.event.workflow_run.head_sha || github.sha }}' \
            --scope '${{ runner.temp }}/gate-proof-scope/proof-scope.json' \
            --remote '${{ github.server_url }}/${{ github.repository }}' \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            >> "$GITHUB_OUTPUT"

  corpus:
    name: corpus
    needs: decide
    # != 'false' and not == 'true': a decide job that fails or times out leaves
    # the output empty, and an empty answer must leave the corpus owed exactly
    # as the owner's own fail-open does (verifier round 1).
    # !cancelled() and not always(): always() runs even on cancellation, so a
    # superseded run would still launch the 300-minute corpus on an old sha
    # against this workflow's own coalescing (verifier round 2). A failed or
    # timed-out decide still reaches the corpus: an empty answer leaves it
    # owed, exactly as the owner's fail-open does. A SKIPPED decide (not main,
    # not a dispatch) never starts it.
    if: >-
      !cancelled() && needs.decide.result != 'skipped' &&
      needs.decide.outputs.needed != 'false'
    runs-on: ubuntu-24.04
    # A hosted runner is roughly three times slower than the box where the
    # ordinary lane alone took 17 minutes, and the exclusive lane is serial:
    # budget for a long run rather than cancel a nearly finished one.
    timeout-minutes: 300
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_RETRY_FAILED_ONCE: '1'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The sha the gate proved, not the branch tip at event time.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # The same toolchain ci.yml installs, with the same bounds: every
      # download fails in minutes rather than consuming the job budget.
      - name: Install gate CLI tools
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: npm ci

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      # --keep-going: a finder runs every lane. Without it one red ordinary
      # batch ends the run before the exclusive lane, and every integration
      # and bootstrap file goes unproved (2026-09-13: three canary runs in a
      # row stopped at a unit red and never reached a red integration test).
      - name: Whole behavioural corpus
        run: npm run test:all -- --keep-going

      # The convergence-probe class (test/shards/convergence-probes.txt) is
      # bounded-time convergence: statistical and hardware-relative, never a
      # per-run gate (decision 6fcb63299). The change-proof planner leaves it
      # out by name; this step is where it is observed, and only observed.
      - name: Convergence probes (observed, never gating)
        if: always()
        continue-on-error: true
        run: npm run test:convergence-probes

      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-corpus-canary-evidence
          path: |
            test-output/reports/
            .tap/test-results/
          retention-days: 14
          if-no-files-found: ignore
