name: a1-v7-record-attempt

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/a1-v7-record-attempt.yml

permissions:
  contents: write

jobs:
  attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
      ACCEPTED_SHA: e813ae541051f1d9ebfb5adfd34f5ce180bfe4df
      BRANCH: quest/0-3-queryable-core-foundation
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install exact accepted v7 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin review/a1-v7-final-freeze
          candidate_paths=(
            src/partition/partition-split-merge-manager.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          for file in "${candidate_paths[@]}"; do
            git show "${ACCEPTED_SHA}:${file}" > "${file}"
          done

      - name: Verify immutable accepted fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected.sha256" <<'EOF'
          dfa1f07734caeae364b9824c53fee8a1cd6f15391c2843d18b00c3a3d033edea  src/partition/partition-split-merge-manager.js
          00ce153a34e32e558042316e797e2e8c3caef271210e2b345985b051730975f7  src/partition/split-key-comparator.js
          d191ce77ac7d1429721cb963bad80334bb106a36b0ffb42d8f945fb332c7a963  src/partition/partition-split-merge-manager-core-methods.js
          acadd68e31227313444f8e6af73fef47a3f3aba6f162b30cf239064e3e0ed6dc  src/partition/partition-split-merge-manager-evaluation-methods.js
          36b32055b89b9c19efa211abd67193a65d61a730b5720c836e533caa6ceeb35c  src/partition/partition-split-merge-manager-transition-methods.js
          bbe3a9cc87aede6446b08a0fc99526bb5ffa8ed4adc6c246996d23833ccaf7fe  test/partition/routing-key-comparator.test.js
          e240d8a1e0711a9bf1d4407d3768e6a55914e4e83af4037ea04eff63b8e1ce61  test/partition/merge-auto-execution.test.js
          5737c30027e811e82a9b4a6307b5d6308e08d548a72bf55d6e05adea41711ec6  scripts/checks/partition-key-ordering-owner-completion-v7.js
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.sha256"
          sha256sum --check "$RUNNER_TEMP/expected.sha256"

      - name: Prove v6 and v7 closure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checks/partition-key-ordering-owner-completion-v6.js
          node scripts/checks/partition-key-ordering-owner-completion-v7.js
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v7

      - name: Focused behavior
        run: npm run test:file -- test/partition/routing-key-comparator.test.js test/partition/merge-auto-execution.test.js

      - name: Candidate guardrails
        shell: bash
        run: |
          set -euo pipefail
          npm run test:complexity
          npm run test:complexity:scoped --             src/partition/partition-split-merge-manager.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js
          npm run audit:file-size
          paths=(
            src/partition/partition-split-merge-manager.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          node node_modules/eslint/bin/eslint.js --no-warn-ignored --no-error-on-unmatched-pattern "${paths[@]}"
          node scripts/check-guideline-literals.js "${paths[@]}"
          node scripts/check-guideline-decision-boundaries.js "${paths[@]}"
          node scripts/check-guideline-ambient-intrinsics.js "${paths[@]}"
          node scripts/check-guideline-silent-catch.js "${paths[@]}"
          git diff --check

      - name: Record content-bound v7 attempt
        shell: bash
        run: |
          set -euo pipefail

          candidate_hashes="$(sha256sum             src/partition/partition-split-merge-manager.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js | tr '\n' ';')"

          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v7             --finding "Exact immutable A1-v7 candidate from accepted freeze e813ae541051f1d9ebfb5adfd34f5ce180bfe4df re-proved on authoritative #74 checkout in GitHub Actions run ${GITHUB_RUN_ID}. All accepted source/test fingerprints match; v6/v7 closure, focused behavior and final guardrails are green. Derived inventories remain owned by Solver land. Candidate sha256: ${candidate_hashes}"             --kind evidence             --evidence "github-actions:${GITHUB_RUN_ID}"

          node scripts/solve.js note             --id partition-key-ordering-owner-completion-v7             --attempt "Replay exact independently accepted A1-v7 source/test bytes on authoritative #74 checkout; immutable fingerprints, v6/v7 closure, focused behavior and final guardrails green in GitHub Actions run ${GITHUB_RUN_ID}."

      - name: Restore product tree and preserve attempt record
        shell: bash
        run: |
          set -euo pipefail
          git restore --             src/partition/partition-split-merge-manager.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js

          # The workflow stays unchanged while Solver records the attempt so it
          # is not part of the attempt's path set. Remove it only afterwards.
          git rm .github/workflows/a1-v7-record-attempt.yml

          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n'             .github/workflows/a1-v7-record-attempt.yml             solve/quests/partition-key-ordering-owner-completion-v7/log.ndjson | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-attempt mutation set:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git rm above already staged the workflow deletion.
          git add -- solve/quests/partition-key-ordering-owner-completion-v7/log.ndjson
          git commit -m "0.3 A1: record exact accepted v7 attempt"

          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"
