name: a1-v7-solver-land

on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/a1-v7-land.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
      ACCEPTED_SHA: e813ae541051f1d9ebfb5adfd34f5ce180bfe4df
      REVIEW_SHA: f45fdd68072ff6575647ad67123fc0ff5e7cbcbb
      BRANCH: quest/0-3-queryable-core-foundation
      QUEST_ID: partition-key-ordering-owner-completion-v7

    steps:
      - name: Checkout exact authoritative head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install exact independently accepted A1-v7 bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin review/a1-v7-final-freeze
          paths=(
            src/partition/partition-split-merge-manager.js
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
            src/partition/partition-split-merge-manager-transition-methods.js
            test/partition/routing-key-comparator.test.js
            test/partition/merge-auto-execution.test.js
          )
          for file in "${paths[@]}"; do
            git show "${ACCEPTED_SHA}:${file}" > "${file}"
          done

      - name: Verify exact attempt/review fingerprints and closure
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected.sha256" <<'EOF'
          dfa1f07734caeae364b9824c53fee8a1cd6f15391c2843d18b00c3a3d033edea  src/partition/partition-split-merge-manager.js
          00ce153a34e32e558042316e797e2e8c3caef271210e2b345985b051730975f7  src/partition/split-key-comparator.js
          d191ce77ac7d1429721cb963bad80334bb106a36b0ffb42d8f945fb332c7a963  src/partition/partition-split-merge-manager-core-methods.js
          acadd68e31227313444f8e6af73fef47a3f3aba6f162b30cf239064e3e0ed6dc  src/partition/partition-split-merge-manager-evaluation-methods.js
          36b32055b89b9c19efa211abd67193a65d61a730b5720c836e533caa6ceeb35c  src/partition/partition-split-merge-manager-transition-methods.js
          bbe3a9cc87aede6446b08a0fc99526bb5ffa8ed4adc6c246996d23833ccaf7fe  test/partition/routing-key-comparator.test.js
          e240d8a1e0711a9bf1d4407d3768e6a55914e4e83af4037ea04eff63b8e1ce61  test/partition/merge-auto-execution.test.js
          5737c30027e811e82a9b4a6307b5d6308e08d548a72bf55d6e05adea41711ec6  scripts/checks/partition-key-ordering-owner-completion-v7.js
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.sha256"
          sha256sum --check "$RUNNER_TEMP/expected.sha256"

          node scripts/checks/partition-key-ordering-owner-completion-v6.js
          node scripts/checks/partition-key-ordering-owner-completion-v7.js
          node scripts/solve.js probe --id "$QUEST_ID"

      - name: Record fresh post-attempt independent approval
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js note \
            --id "$QUEST_ID" \
            --verification "APPROVE: post-attempt category-complete Copilot review PR #92 accepted exact review head ${REVIEW_SHA} after canonical A1-v7 attempt run 37103648881. The reviewer independently matched all seven source/test SHA-256 fingerprints, confirmed v6/v7 closure, live harness fidelity, adversarial intrinsic/own-data/prototype defenses, full guard-chain results from review finalizer run 37103870676, and the A2 durable-representation boundary. No A1 correctness findings." \
            --verifier subagent:github-copilot-pr92 \
            --verdict approve

      - name: Solver land A1-v7
        shell: bash
        run: |
          set -euo pipefail
          node scripts/solve.js land --id "$QUEST_ID"

      - name: Verify landed source bytes and solved log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/expected.sha256"
          node scripts/solve.js probe --id "$QUEST_ID"
          grep -q '"status":"solved"' "solve/quests/$QUEST_ID/log.ndjson"
          echo "LANDING_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short

      - name: Remove temporary landing workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v7-land.yml
          git commit -m "ci: remove completed A1-v7 landing workflow"

      - name: Preserve Solver landing on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from event SHA $GITHUB_SHA to $remote_sha; refusing stale push"
            exit 1
          fi

          git fetch origin workflow/non-main-push-preservation
          git show FETCH_HEAD:.githooks/pre-push > .githooks/pre-push
          chmod +x .githooks/pre-push
          git push origin HEAD:refs/heads/"$BRANCH"

          echo "Solver landing commit: $LANDING_SHA"
          echo "Published feature-branch head: $(git rev-parse HEAD)"
