name: Apply Mermaid canvas migration

on:
  push:
    branches:
      - agent/explicit-mermaid-canvases
    paths:
      - scripts/apply-mermaid-canvases.mjs
      - .github/workflows/apply-mermaid-canvases.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply explicit diagram canvases
        run: node scripts/apply-mermaid-canvases.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply-mermaid-canvases.mjs
          rm .github/workflows/apply-mermaid-canvases.yml

      - name: Commit migrated documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/INDEX.md architecture/system-model.md \
            scripts/apply-mermaid-canvases.mjs \
            .github/workflows/apply-mermaid-canvases.yml
          git commit -m "Draw explicit white Mermaid canvases"
          git push
