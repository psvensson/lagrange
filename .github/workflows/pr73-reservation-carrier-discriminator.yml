name: pr73-reservation-carrier-discriminator

on:
  push:
    branches:
      - "proof/pr73-reservation-carrier-discriminator-20261007"

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reservation carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 24dcf2abb16c17bbcb55a4148a83e17d7b14a857
          fetch-depth: 0
          persist-credentials: false

      - name: Overlay immutable qualification witness
        env:
          WITNESS_REF: proof/pr73-formation-cure-progress-20261007
        run: |
          set -euo pipefail
          git fetch origin "$WITNESS_REF"
          git show FETCH_HEAD:test/rebalancer/formation-cure-reservation-progress-obligation.test.js             > test/rebalancer/formation-cure-reservation-progress-obligation.test.js
          echo "carrier=24dcf2abb16c17bbcb55a4148a83e17d7b14a857"

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm ci

      - name: Formation cure reservation-to-progress witness
        run: node test/rebalancer/formation-cure-reservation-progress-obligation.test.js
