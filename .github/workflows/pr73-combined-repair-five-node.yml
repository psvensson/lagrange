name: pr73-combined-repair-five-node

on:
  push:
    branches:
      - "investigate/pr73-leader-retention-r7-combined"

permissions:
  contents: read

concurrency:
  group: pr73-combined-repair-five-node
  cancel-in-progress: false

env:
  BASE_SHA: 6df3ec5e1c09ef14e6a743dc805399c1092712a8
  CANDIDATE_SHA: 47ad1c512a420e6b5b55b7f9859040f564184c1f
  LAGRANGE_TEST_MACHINE_FACTOR: '3'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact combined candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind candidate identity
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "base=${BASE_SHA}"
          echo "candidate=${CANDIDATE_SHA}"
          echo "checked_out=${ACTUAL}"
          test "${ACTUAL}" = "${CANDIDATE_SHA}"

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      - name: Leader-retention and R7 witnesses
        run: |
          set -euo pipefail
          node test/node/replica-colocated-follower-leader-clear.test.js
          node test/rebalancer/topology-settling-node-ready-lease-wake.test.js

      - name: Adjacent durable and topology proofs
        run: |
          set -euo pipefail
          node test/node/replica-lifecycle-durable-generation.test.js
          node test/rebalancer/formation-barrier-spread-cure-lane-discrimination.test.js
          node test/rebalancer/startup-authority-topology-settling-contract.test.js
          node test/rebalancer/runtime-service-expired-lease-candidate-admission.test.js
          node test/control-plane/readiness-deferred-denial-evidence-absent.test.js
          node test/control-plane/node-liveness-semantic-projection-owner.test.js

      - name: Readiness planning impact-contract witness cone
        run: |
          set -euo pipefail
          for test_file in \
            test/control-plane/single-readiness-owner.receipt.test.js \
            test/control-plane/publication-readiness-churn-liveness.test.js \
            test/control-plane/readiness-planning-cache-classification-barrier.test.js \
            test/control-plane/readiness-planning-deferral-bounded.test.js \
            test/control-plane/readiness-planning-generation-granularity.test.js \
            test/control-plane/readiness-planning-semantic-generation.test.js \
            test/control-plane/readiness-planning-snapshot-identity-owner.test.js \
            test/control-plane/control-plane-read-authority-token.test.js \
            test/control-plane/control-plane-readiness-service-sync-and-priority-recovery.test.js \
            test/control-plane/replica-dispatch-node-state-update-ready-node-retry-dispatch.test.js \
            test/rebalancer/startup-authority-available-node-contract.test.js \
            test/rebalancer/storage-capacity-accounting-service.test.js \
            test/rebalancer/storage-capacity-semantic-projection-owner.test.js \
            test/workflow/owner-key-reconcile-queue.test.js
          do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

      - name: Architecture model contracts
        run: npm run model:contracts

      - name: Scoped lint
        run: |
          npx eslint \
            src/node/replica-handler-class.js \
            src/node/replica-state-machine-leader-clear.js \
            src/node/replica-state-machine.js \
            src/rebalancer/unified-rebalancer-critical-topology-methods.js \
            test/node/replica-colocated-follower-leader-clear.test.js \
            test/rebalancer/topology-settling-node-ready-lease-wake.test.js

  wake-runner:
    needs: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: false

      - name: Start the runner VM (idempotent)
        run: |
          set -euo pipefail
          STATUS="$(gcloud compute instances describe lagrange-ci-runner --zone europe-north1-a --format='value(status)')"
          echo "runner VM status: ${STATUS}"
          if [ "${STATUS}" != "RUNNING" ]; then
            gcloud compute instances start lagrange-ci-runner --zone europe-north1-a
          fi

  discriminator:
    needs: wake-runner
    runs-on: [self-hosted, gcp]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact combined candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact candidate identity
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "candidate=${CANDIDATE_SHA}"
          echo "checked_out=${ACTUAL}"
          test "${ACTUAL}" = "${CANDIDATE_SHA}"
          mkdir -p test-output
          printf 'candidate=%s\nchecked_out=%s\n' "${CANDIDATE_SHA}" "${ACTUAL}" > test-output/pr73-combined-candidate.txt

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Pulumi CLI
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 2 https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version 3.261.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pulumi/bin:$PATH"
          test "$(pulumi version)" = "v3.261.0"

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci
          npm install --no-save @pulumi/pulumi@3.261.0 @pulumi/gcp@9.36.1

      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      - name: Five-node GCP discriminator
        run: npm run health:formation -- --gcp --trend "$RUNNER_TEMP/pr73-combined-formation-trend.ndjson"

      - name: Upload discriminator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr73-combined-five-node-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-output/pr73-combined-candidate.txt
            test-output/reports/movielens-lagrange-formation-only-live-*.report.json
            data/examples/service-data-affinity-demo/node-*.log
