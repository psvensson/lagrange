name: a1-v7-fast-proof
on:
  push:
    branches:
      - review/a1-v7-fast-proof
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: v6 preserved closure
        run: node scripts/checks/partition-key-ordering-owner-completion-v6.js
      - name: v7 closure
        run: node scripts/checks/partition-key-ordering-owner-completion-v7.js
      - name: focused behavior
        run: npm run test:file -- test/partition/routing-key-comparator.test.js test/partition/merge-auto-execution.test.js
      - name: complexity ratchet
        run: npm run test:complexity
      - name: scoped complexity report
        run: npm run test:complexity:scoped -- src/partition/split-key-comparator.js src/partition/partition-split-merge-manager-core-methods.js src/partition/partition-split-merge-manager-evaluation-methods.js
      - name: ambient intrinsic guard
        run: npm run audit:guideline:ambient-intrinsics
      - name: file size admission
        run: npm run audit:file-size
