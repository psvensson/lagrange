name: rs-raft-opening-history
on:
  push:
    branches: [resume/rs-raft-runtime-recovery-20261012]
    paths: [.github/workflows/rs-raft-opening-history.yml]
permissions:
  contents: read
concurrency:
  group: rs-raft-opening-history-20261012
  cancel-in-progress: false
jobs:
  exact-history-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BRANCH: resume/rs-raft-runtime-recovery-20261012
      EVIDENCE: test-output/opening-history-proof
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind exact source treatment and locked dependencies
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$EVIDENCE" "$RUNNER_TEMP/opening-history"
          ARCHIVE="$RUNNER_TEMP/opening-history/execution.tar.xz"
          : > "$ARCHIVE"
          for SHA in e0c5f4fbd934b669f216631821fdf4acef108d37 77d9d59f01616c2784bd7524f1f082de01dc9037 8bd87d5c2100c2fb221ff5809f7a98ccc6d3c621 7690d0c1f0b0108378eb960e21862420c2e9c3a0; do
            gh api "repos/psvensson/lagrange/git/blobs/$SHA" --jq .content | base64 -d >> "$ARCHIVE"
          done
          printf '%s  %s\n' 02c1897000d353a492420b2cd790ac4a0097cb6b40d6dee0a3ed7540eddb5acd "$ARCHIVE" | sha256sum --check
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/opening-history" --no-same-owner
          cp "$ARCHIVE" "$EVIDENCE/execution.tar.xz"
          cp "$RUNNER_TEMP/opening-history/manifest.json" "$EVIDENCE/content-manifest.json"
          npm ci > "$EVIDENCE/install.log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Seal and measure baseline candidate source-revert and complete selected regressions
        id: measure
        if: steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python3 "$RUNNER_TEMP/opening-history/run.py" > "$EVIDENCE/execution.log" 2>&1
          STATUS=$?
          printf '%s\n' "$STATUS" > "$EVIDENCE/execution-exit.txt"
          tail -100 "$EVIDENCE/execution.log"
      - name: Preserve exact WIP source and every result without main integration
        if: steps.measure.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$EVIDENCE/execution-exit.txt")" = 0
          git diff --exit-code -- src test
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          DEST="solve/quests/replica-opening-history/evidence/native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp -a "$EVIDENCE/." "$DEST/"
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS"
          git add -- "$DEST" solve/quests/replica-opening-history/evidence/receipt.json solve/quests/replica-opening-history/log.ndjson
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: retain native history evidence and unresolved full-gate failures'
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$EVIDENCE/published-head.txt"
      - name: Retain incomplete runs and current source as evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          git status --porcelain > "$EVIDENCE/final-status.txt"
          git rev-parse HEAD > "$EVIDENCE/final-head.txt"
          git diff --binary "$GITHUB_SHA" -- src test solve/quests/replica-opening-history test/guidelines/harness.md > "$EVIDENCE/current-change.patch"
          find "$EVIDENCE" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-opening-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/opening-history-proof/
          retention-days: 30
          if-no-files-found: error
      - name: Keep unresolved safety and static gates visible
        if: always()
        shell: bash
        run: |
          test "$(cat "$EVIDENCE/execution-exit.txt")" = 0
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['EVIDENCE'])/'summary.json').read_text())
          print(json.dumps(result,indent=2))
          assert result['allRunGatesPassed'] is True, 'Unresolved gates remain RED; this is not independent approval or merge readiness.'
          PY
