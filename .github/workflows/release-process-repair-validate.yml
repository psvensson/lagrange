name: release-process-repair-validate

on:
  push:
    branches: [release/v0.2.4-process-repair]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci

      - name: Prove durable proof authority and release reuse invariants
        run: |
          node test/scripts/proof-authority.test.js
          node test/scripts/release-preflight.test.js
          node test/release/release-pipeline-proof-reuse.test.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {ACTION, authorizeAction, isAuthorized, registeredActions} from './scripts/action-authority.js';
          assert.ok(registeredActions().includes(ACTION.RECORD_PROOF));
          const decision = authorizeAction({action: ACTION.RECORD_PROOF, signal: null});
          assert.equal(isAuthorized(decision), true);
          assert.equal(decision.standing, true);
          NODE
          npx eslint \
            scripts/proof-authority.js \
            scripts/run-release-proof.js \
            scripts/release-preflight.js \
            test/scripts/proof-authority.test.js \
            test/scripts/release-preflight.test.js \
            test/release/release-pipeline-proof-reuse.test.js

      - name: Prove npm registry package exists
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/lagrange-server', {cache: 'no-store'});
          if (!response.ok) throw new Error(`npm registry returned ${response.status}`);
          const metadata = await response.json();
          if (metadata.name !== 'lagrange-server') throw new Error('wrong npm package identity');
          console.log(`lagrange-server exists; latest=${metadata['dist-tags']?.latest || 'none'} versions=${Object.keys(metadata.versions || {}).length}`);
          NODE

      - name: Prove GitHub-hosted OIDC issuance
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$RESPONSE")"
          OIDC_TOKEN="$TOKEN" node --input-type=module <<'NODE'
          const p = JSON.parse(Buffer.from(process.env.OIDC_TOKEN.split('.')[1], 'base64url').toString('utf8'));
          if (p.repository !== 'psvensson/lagrange') throw new Error(`repo claim ${p.repository}`);
          if (p.runner_environment && p.runner_environment !== 'github-hosted') throw new Error(`runner ${p.runner_environment}`);
          console.log(`OIDC ok: ${p.repository} ${p.runner_environment || 'github-hosted'}`);
          NODE

      - name: Prove Docker Hub pull+push authorization
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          RESPONSE="$(curl -fsS -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:psvensson/lagrange:pull,push')"
          TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.token) process.exit(2); process.stdout.write(x.token)' "$RESPONSE")"
          REGISTRY_TOKEN="$TOKEN" node --input-type=module <<'NODE'
          const p = JSON.parse(Buffer.from(process.env.REGISTRY_TOKEN.split('.')[1], 'base64url').toString('utf8'));
          const a = (p.access || []).find((x) => x.type === 'repository' && x.name === 'psvensson/lagrange');
          const actions = new Set(a?.actions || []);
          if (!actions.has('pull') || !actions.has('push')) throw new Error(`scope=${JSON.stringify(a || null)}`);
          console.log('Docker Hub push authorization confirmed');
          NODE
          docker logout
