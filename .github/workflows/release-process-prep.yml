name: release-process-prep

on:
  push:
    branches: [release/v0.2.4-process-repair]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/v0.2.4-process-repair
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Make release proof and preflight single-owner
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts['check:release'] = 'node scripts/run-release-proof.js';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const path = 'scripts/release-preflight.js';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [" *   3. either the modular `ci` gate or stronger `full-gate` concluded\n *      success for that exact sha;",
             " *   3. the `full-gate` concluded success for that exact sha;"],
            ["const CI_WORKFLOW_PATH = '.github/workflows/ci.yml';\n", ""],
            ["CI_GATE_GREEN: 'ci_gate_green_on_exact_sha'", "FULL_GATE_GREEN: 'full_gate_green_on_exact_sha'"],
            ["(run.path === CI_WORKFLOW_PATH || run.path === FULL_GATE_WORKFLOW_PATH) &&", "run.path === FULL_GATE_WORKFLOW_PATH &&"],
            ["id: CHECK.CI_GATE_GREEN", "id: CHECK.FULL_GATE_GREEN"],
            ["`no completed successful ${CI_WORKFLOW_PATH} or ` +\n          `${FULL_GATE_WORKFLOW_PATH} run for ${facts.headSha}`", "`no completed successful ${FULL_GATE_WORKFLOW_PATH} run for ${facts.headSha}`"],
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`release-preflight replacement source missing: ${from}`);
            text = text.replaceAll(from, to);
          }
          fs.writeFileSync(path, text);

          const testPath = 'test/scripts/release-preflight.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('workflowRuns: [CI_RUN],', 'workflowRuns: [FULL_GATE_RUN],');
          test = test.replaceAll('CHECK.CI_GATE_GREEN', 'CHECK.FULL_GATE_GREEN');
          test = test.replace(
            "test('a successful full gate is a stronger exact-sha pre-tag proof', (t) => {",
            "test('a successful exact-sha full gate is the pre-tag proof', (t) => {",
          );
          test = test.replace(
            "workflowRuns: [{...CI_RUN, conclusion: 'failure'}, FULL_GATE_RUN],",
            "workflowRuns: [CI_RUN, FULL_GATE_RUN],",
          );
          test = test.replace(
            "'only a completed successful ci.yml or full-gate.yml run on the exact sha counts'",
            "'only a completed successful full-gate.yml run on the exact sha counts'",
          );
          fs.writeFileSync(testPath, test);
          NODE

          node test/scripts/release-preflight.test.js
          node test/release/release-pipeline-proof-reuse.test.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/release-preflight.js test/scripts/release-preflight.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'release: make full gate the single pretag proof owner'
            git push origin HEAD:release/v0.2.4-process-repair
          fi
