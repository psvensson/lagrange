# Diagnostic only: compare exactly the 119 immutable candidate RED file names
# against predecessor 381750de, without changing positive candidate/main.
name: u1-gcp-predecessor-red-differential-20261020
on:
  push:
    branches:
      - verify/u1-gcp-20261020
    paths:
      - .github/workflows/u1-gcp-inherited-red-differential-20261020.yml
permissions:
  contents: read
concurrency:
  group: u1-gcp-predecessor-red-differential-20261020
  cancel-in-progress: false
env:
  BASE: 381750de29af647d446b19adedf1da53eb712093
  CANDIDATE: be25caa5f0c3612feec662d4feaa9ba28f8f34df
  GCP_PROJECT: something-2e584
  GCP_ZONE: europe-north1-a
  GCP_VM: lagrange-ci-runner
jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      owned: ${{ steps.start.outputs.owned }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - id: start
        name: Start only the existing idle GCP verification runner
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(gcloud compute instances describe "$GCP_VM" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --format='value(status)')"
          test "$STATE" = TERMINATED || { echo "GCP_SOURCE_RUNNER_SHARED_OR_BUSY=$STATE"; exit 3; }
          echo 'owned=true' >> "$GITHUB_OUTPUT"
          gcloud compute instances start "$GCP_VM" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --quiet
  predecessor:
    needs: wake
    runs-on: [self-hosted, gcp]
    timeout-minutes: 125
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: u1-verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 381750de29af647d446b19adedf1da53eb712093
          path: u1-predecessor
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify original 119 candidate reds and exact predecessor
        working-directory: u1-predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          mkdir -p test-output/u1-predecessor
          cp ../u1-verification/verification/u1-20261020/gcp-corpus-119-red-files.txt \
            test-output/u1-predecessor/observed-candidate-red-list.txt
          test "$(wc -l < test-output/u1-predecessor/observed-candidate-red-list.txt)" -eq 119
          while IFS= read -r f; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              printf '%s\n' "$f" >> test-output/u1-predecessor/present.txt
            else
              printf '%s\n' "$f" >> test-output/u1-predecessor/absent.txt
            fi
          done < test-output/u1-predecessor/observed-candidate-red-list.txt
          echo "candidate_red_files=119 predecessor_present=$(wc -l < test-output/u1-predecessor/present.txt) predecessor_absent=$(if [ -f test-output/u1-predecessor/absent.txt ]; then wc -l < test-output/u1-predecessor/absent.txt; else echo 0; fi)"
          test -s test-output/u1-predecessor/present.txt
          npm ci
      - name: Run only candidate RED files that exist at the predecessor using its unchanged classifier
        working-directory: u1-predecessor
        timeout-minutes: 110
        shell: bash
        env:
          LAGRANGE_RETRY_FAILED_ONCE: '0'
        run: |
          set -euo pipefail
          node scripts/run-classified-test-files.js --stdin \
            < test-output/u1-predecessor/present.txt \
            > test-output/u1-predecessor/runner.log 2>&1 || {
              code=$?
              tail -n 85 test-output/u1-predecessor/runner.log
              echo "PREDECESSOR_MEASURED_RED_EXIT=$code"
              exit "$code"
            }
          tail -n 50 test-output/u1-predecessor/runner.log
      - name: Keep predecessor results on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u1-gcp-predecessor-119-${{ github.run_id }}
          path: |
            u1-predecessor/test-output/u1-predecessor/
            u1-predecessor/test-output/reports/
            u1-predecessor/.tap/test-results/
          retention-days: 14
          if-no-files-found: ignore
  cleanup:
    if: always() && needs.wake.outputs.owned == 'true'
    needs: [wake, predecessor]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/759391918025/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-release-starter@something-2e584.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Stop and verify exact GCP runner
        run: |
          set -euo pipefail
          gcloud compute instances stop "$GCP_VM" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --quiet
          STATE="$(gcloud compute instances describe "$GCP_VM" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --format='value(status)')"
          echo "PREDECESSOR_CLEANUP=$STATE"
          test "$STATE" = TERMINATED
