# Canonical Solver RED seal, before changing original caller production owner.
name: rs-raft-late-reply-quest-seal
on:
  push:
    branches: [work/rs-raft-release-late-success-fence-20261014]
    paths: [.github/workflows/rs-raft-late-reply-quest-seal.yml]
permissions:
  contents: write
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Canonical red probe, not a success receipt
        shell: bash
        run: |
          set -euo pipefail
          START="$GITHUB_SHA"
          npm ci
          test "$(git rev-parse HEAD)" = "$START"
          test "$(git rev-parse HEAD:src/node/participant-release-client.js)" = \
            "$(git rev-parse 7d0042659daaed7d38e9e586454861c21df3d838:src/node/participant-release-client.js)"
          node scripts/solve.js start --id participant-release-late-reply-deadline --json
          node scripts/solve.js probe --id participant-release-late-reply-deadline --json
          git diff --check
          git add solve/quests/participant-release-late-reply-deadline/quest.json solve/quests/participant-release-late-reply-deadline/log.ndjson
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: seal original-client post-await deadline Quest RED'
          git fetch --no-tags origin refs/heads/work/rs-raft-release-late-success-fence-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$START" || {
            echo 'WIP branch moved, declining conflicting push'; exit 1;
          }
          git push origin HEAD:refs/heads/work/rs-raft-release-late-success-fence-20261014
      - name: Keep original RED Quest on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-late-reply-seal-${{ github.sha }}
          path: solve/quests/participant-release-late-reply-deadline/
          retention-days: 14
          if-no-files-found: warn
