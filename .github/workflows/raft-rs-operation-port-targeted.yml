name: raft-rs-operation-port-targeted

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  targeted:
    if: github.head_ref == 'quest/raft-rs-operation-port-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operation-port and formation parity
        env:
          TAP_TIMEOUT_FLOOR: '120'
        run: |
          node --test --test-concurrency=1 \
            test/raft/raft-rs-backend/partition-construction-seam.test.js \
            test/raft/raft-rs-backend/operation-port-boundary.test.js \
            test/raft/raft-rs-backend/operation-port-lifecycle.test.js \
            test/raft/raft-rs-backend/operation-port-provenance.test.js \
            test/raft/raft-rs-backend/operation-port-ready-recovery.test.js \
            test/raft/raft-rs-backend/operation-port-regression.test.js \
            test/partition/partition-service-write-commit.test.js \
            test/partition/partition-service-raft-noop-cdc-placement.test.js \
            test/partition/partition-service-size-split-transport.test.js \
            test/partition/partition-service-transactions-query-routing.test.js \
            test/simulation/formation-sim-production-partitions.test.js \
            test/simulation/formation-sim-production-handoff.test.js
