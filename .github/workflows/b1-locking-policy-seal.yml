name: b1-locking-policy-seal
on:
  push:
    branches:
      - quest/0-3-locking-read-wait-policy-seal
permissions:
  contents: read
concurrency:
  group: b1-locking-policy-seal
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sealed B1 policy probe
        run: node scripts/checks/locking-read-wait-policy-seal.js
      - name: B1 checker ESLint
        run: node node_modules/eslint/bin/eslint.js --no-warn-ignored scripts/checks/locking-read-wait-policy-seal.js
      - name: B1 checker guideline guards
        run: |
          node scripts/check-guideline-literals.js scripts/checks/locking-read-wait-policy-seal.js
          node scripts/check-guideline-decision-boundaries.js scripts/checks/locking-read-wait-policy-seal.js
          node scripts/check-guideline-ambient-intrinsics.js scripts/checks/locking-read-wait-policy-seal.js
          node scripts/check-guideline-silent-catch.js scripts/checks/locking-read-wait-policy-seal.js
      - name: Policy is design-only
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git diff --name-only 09fd1965ccba075d185936306f81799bbae6a50a...HEAD |
              grep -Ev '^(.github/workflows/b1-locking-policy-seal\.yml|architecture/postgres-locking-reads\.md|scripts/checks/locking-read-wait-policy-seal\.js|solve/epics/release-0-3-queryable-core\.md|solve/quests/locking-read-wait-policy-seal/|solve/specs/release-0-3-queryable-core/locking-read-wait-policy\.json) ||
              true
          )"
          if [ -n "$unexpected" ]; then
            printf 'unexpected B1 path(s):\n%s\n' "$unexpected" >&2
            exit 1
          fi
