name: pr73-focused-regression-proof
on:
  push:
    branches:
      - finalize/zero-liferaft-2026-10-02
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:file -- test/runtime/wasm-driver-contract-conformance.test.js
      - run: npm run test:file -- test/integration/service-install-lifecycle-cli-pgwire.integration.test.js
