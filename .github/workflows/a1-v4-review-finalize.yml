name: a1-v4-review-finalize

on:
  push:
    branches:
      - review/a1-v4-partition-key-ordering-final
    paths:
      - .github/workflows/a1-v4-review-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Re-prove exact A1-v4 candidate
        shell: bash
        run: |
          set -euo pipefail
          node --test test/partition/routing-key-comparator.test.js
          node test/partition/split-key-comparator.test.js
          node test/partition/merge-auto-execution.test.js
          node test/partition/partition-split-merge-manager.test.js
          node scripts/checks/partition-key-ordering-owner-completion-v4.js
          files=(
            src/partition/split-key-comparator.js
            src/partition/partition-split-merge-manager-core-methods.js
            src/partition/partition-split-merge-manager-evaluation-methods.js
          )
          npm run -s test:metrics:scoped -- "${files[@]}"
          node scripts/check-guideline-literals.js "${files[@]}"
          node scripts/check-runtime-grammar-contracts.js "${files[@]}"
          npx eslint "${files[@]}" \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js
          git diff --check

      - name: Refresh canonical generated state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-global-owner-debt-inventory.js --refresh
          node scripts/generate-priority-recovery-owner-inventory.js
          npm run -s test:metadata:refresh

      - name: Commit clean review head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a1-v4-review-finalize.yml
          git add -- \
            solve/changes/global-owner-debt-inventory/inventory.json \
            solve/changes/priority-recovery-owner-inventory/inventory.json \
            test/shards/primary-classes.json \
            test/shards/resource-classes.json \
            test/shards/subsystem-classes.json \
            test/shards/impact-graph-seal.json
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m "review: finalize generated state for A1-v4"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/review/a1-v4-partition-key-ordering-final
