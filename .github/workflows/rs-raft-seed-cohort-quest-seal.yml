# Canonical red Quest seal; no implementation authorization by green shortcut.
name: rs-raft-seed-cohort-quest-seal
on:
  push:
    branches: [continue/rs-raft-seed-cohort-once-20261014]
    paths: [.github/workflows/rs-raft-seed-cohort-quest-seal.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Solver owns sealing and refuses green probe
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$BEFORE"
          node scripts/solve.js start --id seed-release-once-per-partition-cohort --json
          node scripts/solve.js probe --id seed-release-once-per-partition-cohort --json
          git diff --check
          git add -- solve/quests/seed-release-once-per-partition-cohort/quest.json solve/quests/seed-release-once-per-partition-cohort/log.ndjson
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: seal measured red per-cohort seed release Quest'
          git fetch --no-tags origin refs/heads/continue/rs-raft-seed-cohort-once-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$BEFORE" || {
            echo "Concurrent writer; no WIP push"; exit 1
          }
          git push origin HEAD:refs/heads/continue/rs-raft-seed-cohort-once-20261014
      - name: Preserve seal and initial receipts even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-seed-cohort-quest-seal-${{ github.sha }}
          path: |
            solve/quests/seed-release-once-per-partition-cohort/quest.json
            solve/quests/seed-release-once-per-partition-cohort/log.ndjson
            solve/quests/seed-release-once-per-partition-cohort/evidence/receipt.json
          retention-days: 14
          if-no-files-found: warn
