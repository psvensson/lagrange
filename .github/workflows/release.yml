# GitHub Actions release — runs only when a maintainer pushes a `v*` tag.
#
# Repository configuration:
#   variable DOCKERHUB_USERNAME — Docker Hub username (for example psvensson)
#   secret   DOCKERHUB_TOKEN    — Docker Hub PAT with Read/Write scope
#   secret   NPM_TOKEN          — bootstrap only; remove after trusted publishing
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: docker.io/psvensson/lagrange

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Fail before the expensive gate if the tag, package version, or changelog
      # section disagree. The rendered files are reused by the final publish steps.
      - name: Resolve version and render release notes
        id: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          TAGGED_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAGGED_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main
          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "$LATEST_TAG" ]; then
            echo "::error::Refusing to move :latest backward from $LATEST_TAG to $GITHUB_REF_NAME"
            exit 1
          fi
          NOTES_DIR="$RUNNER_TEMP/lagrange-release-notes"
          mkdir -p "$NOTES_DIR"
          node scripts/release-notes.js --mode check --version "$VERSION"
          node scripts/release-notes.js --mode notes --version "$VERSION" \
            > "$NOTES_DIR/release-notes.md"
          node scripts/release-notes.js --mode overview --version "$VERSION" \
            > "$NOTES_DIR/dockerhub-overview.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagged_commit=$TAGGED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "notes_dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install gate CLI tools
        # Bounds a HANG, not the normal duration. Measured on hosted runners:
        # 115s, and 1252s on a run that succeeded, and once 62 minutes hung
        # until cancelled by hand. The spread is wide, so this sits well above
        # the slowest success and well below the 120-minute job backstop; the
        # per-download --max-time values are the tighter bound.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            ripgrep jq default-jre-headless postgresql-client curl
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          # Component tests spawn a bare `wasm-tools`; on the maintainer's box
          # that is a cargo install, so a GitHub-hosted runner has no way to
          # get it and the spawn fails ENOENT. Upstream publishes no checksum
          # file for the release asset, so pin the digest inline and fail
          # closed on drift, exactly as the MovieLens dataset step does.
          WASM_TOOLS_VERSION=1.236.0
          WASM_TOOLS_DIR="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          WASM_TOOLS_ARCHIVE="${WASM_TOOLS_DIR}.tar.gz"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 --retry-max-time 120 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${WASM_TOOLS_ARCHIVE}"
          echo "a4fe8101d98f4efeb4854fde05d7c6a36a9a61e8249d4c72afcda4a4944723fb  ${WASM_TOOLS_ARCHIVE}" | sha256sum --check
          tar -xzf "$WASM_TOOLS_ARCHIVE"
          sudo install "${WASM_TOOLS_DIR}/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      # The MovieLens evidence tests read the real 100k ratings file; data/ is
      # gitignored, so fetch it and fail closed on any digest drift (the same
      # sha256 the tests pin).
      - name: Fetch MovieLens dataset (digest-pinned)
        run: |
          node examples/service-data-affinity/download-movielens.js
          echo "06416e597f82b7342361e41163890c81036900f418ad91315590814211dca490  data/examples/movielens-100k/u.data" | sha256sum --check

      # The same command the manual full-gate workflow runs. A release and an
      # on-demand whole-system proof must not be able to mean different things.
      - name: Full pre-release proof
        run: npm run check:release

      - name: Build bundle and SEA binaries
        run: npm run build:all

      - name: Package Helm chart
        run: helm package charts/lagrange-node --destination dist/

      - name: Checksum release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          cd dist
          ASSETS=(lagrange lagrange-cli "lagrange-node-${VERSION}.tgz")
          for asset in "${ASSETS[@]}"; do
            test -f "$asset"
          done
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
          rm -rf node_modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Build and smoke-test before Docker Hub credentials enter the job.
      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.tagged_commit }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}

      - name: Smoke-test Docker image
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          VERSION_OUTPUT="$(
            docker run --rm "$DOCKERHUB_IMAGE:$VERSION" src/index.js --version
          )"
          test "$VERSION_OUTPUT" = "lagrange v$VERSION"
          test "$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "$DOCKERHUB_IMAGE:$VERSION")" = "$VERSION"

      # Build one commit-bound tarball, then install and execute that exact file
      # from a clean consumer before any release channel is mutated.
      - name: Build and verify npm package
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          npm run package:npm -- \
            --output dist/npm \
            --git-head "${{ steps.release.outputs.tagged_commit }}"
          NPM_TARBALL="dist/npm/lagrange-server-${VERSION}.tgz"
          test -f "$NPM_TARBALL"
          sha256sum "$NPM_TARBALL" >> dist/SHA256SUMS

      # Trusted publishing uses the job's OIDC identity. NPM_TOKEN is accepted
      # only for the one-time first publication before npm can bind the trusted
      # publisher; remove the secret immediately after that bootstrap release.
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          npm run publish:npm -- \
            --tarball "dist/npm/lagrange-server-${VERSION}.tgz" \
            --git-head "${{ steps.release.outputs.tagged_commit }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          retry() {
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          retry docker push "$DOCKERHUB_IMAGE:$VERSION"
          LATEST_REMOTE_TAG="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | sort -V \
              | tail -n 1
          )"
          if [ "$GITHUB_REF_NAME" != "$LATEST_REMOTE_TAG" ]; then
            echo "::error::Refusing to move :latest backward from $LATEST_REMOTE_TAG to $GITHUB_REF_NAME"
            exit 1
          fi
          retry docker push "$DOCKERHUB_IMAGE:latest"

      - name: Update Docker Hub repository description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: psvensson/lagrange
          readme-filepath: ${{ steps.release.outputs.notes_dir }}/dockerhub-overview.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          ASSETS=(
            dist/lagrange
            dist/lagrange-cli
            "dist/lagrange-node-${VERSION}.tgz"
            "dist/npm/lagrange-server-${VERSION}.tgz"
            dist/SHA256SUMS
          )
          for asset in "${ASSETS[@]}"; do
            test -f "$asset"
          done
          NOTES="${{ steps.release.outputs.notes_dir }}/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Lagrange $GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              --draft=false \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --title "Lagrange $GITHUB_REF_NAME" \
              --notes-file "$NOTES"
          fi
