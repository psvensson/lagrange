# Release publication owner.
#
# Pre-tag: point release-publishability/** at the exact main SHA. This workflow
# checks external publication prerequisites on a GitHub-hosted runner without
# mutating npm, Docker Hub, or GitHub Releases.
#
# Tag: the same workflow rechecks those prerequisites, requires the durable
# exact-SHA release proof receipt, then publishes artifacts. It never reruns the
# application corpus: the proof authority owns reuse and full-gate produces a
# missing receipt.
name: release

on:
  push:
    branches:
      - "release-publishability/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: docker.io/psvensson/lagrange
  NPM_PACKAGE: lagrange-server

jobs:
  publishability:
    name: publishability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Bind candidate identity
        id: candidate
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
            test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
            git fetch --quiet origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            [[ "$GITHUB_REF_NAME" == release-publishability/* ]]
            git fetch --quiet origin main
            test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check npm registry state
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/lagrange-server', {
            cache: 'no-store', headers: {'accept': 'application/json'},
          });
          if (response.status === 404) {
            throw new Error('lagrange-server does not exist on npm; trusted publishing cannot bootstrap a new package');
          }
          if (!response.ok) throw new Error(`npm registry returned ${response.status}`);
          const metadata = await response.json();
          if (metadata.name !== 'lagrange-server') throw new Error('npm package identity mismatch');
          const versions = metadata.versions || {};
          if (process.env.IS_TAG !== 'true' && versions[process.env.VERSION]) {
            throw new Error(`npm version ${process.env.VERSION} already exists before tagging`);
          }
          console.log(`npm registry reachable; latest=${metadata['dist-tags']?.latest || 'none'} candidate=${process.env.VERSION} existing=${Boolean(versions[process.env.VERSION])}`);
          NODE

      - name: Check npm OIDC claims
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          RESPONSE="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          ID_TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(2); process.stdout.write(x.value)' "$RESPONSE")"
          OIDC_TOKEN="$ID_TOKEN" node --input-type=module <<'NODE'
          const payloadPart = process.env.OIDC_TOKEN.split('.')[1];
          const payload = JSON.parse(Buffer.from(payloadPart, 'base64url').toString('utf8'));
          if (payload.repository !== process.env.EXPECTED_REPOSITORY) {
            throw new Error(`OIDC repository mismatch: ${payload.repository}`);
          }
          if (!String(payload.workflow_ref || '').includes('/.github/workflows/release.yml@')) {
            throw new Error(`OIDC workflow_ref is not release.yml: ${payload.workflow_ref}`);
          }
          if (payload.runner_environment && payload.runner_environment !== 'github-hosted') {
            throw new Error(`npm trusted publishing requires github-hosted, got ${payload.runner_environment}`);
          }
          console.log(`npm OIDC claims available for ${payload.repository} via release.yml on ${payload.runner_environment || 'github-hosted'}`);
          NODE

      - name: Check Docker Hub credentials and push scope
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          RESPONSE="$(curl -fsS -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            'https://auth.docker.io/token?service=registry.docker.io&scope=repository:psvensson/lagrange:pull,push')"
          REGISTRY_TOKEN="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.token) process.exit(2); process.stdout.write(x.token)' "$RESPONSE")"
          REGISTRY_TOKEN="$REGISTRY_TOKEN" node --input-type=module <<'NODE'
          const payload = JSON.parse(Buffer.from(process.env.REGISTRY_TOKEN.split('.')[1], 'base64url').toString('utf8'));
          const access = (payload.access || []).find((entry) => entry.type === 'repository' && entry.name === 'psvensson/lagrange');
          const actions = new Set(access?.actions || []);
          if (!actions.has('pull') || !actions.has('push')) {
            throw new Error(`Docker Hub token lacks pull+push scope: ${JSON.stringify(access || null)}`);
          }
          console.log('Docker Hub credentials grant pull+push on psvensson/lagrange');
          NODE
          docker logout

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publishability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Publication must be globally serialized across SHAs: two different
    # release tags must never mutate npm/Docker Hub/Releases at the same time.
    # The workflow-level SHA-scoped group only orders work on one release.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Resolve release identity and consume durable exact-SHA proof
        id: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          TAGGED_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAGGED_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          PROOF_JSON="$RUNNER_TEMP/release-proof.json"
          node scripts/proof-authority.js check release-full-v1 "$TAGGED_COMMIT" --json > "$PROOF_JSON" || {
            STATUS=$?
            cat "$PROOF_JSON" || true
            echo "::error::No reusable release-full-v1 proof receipt for $TAGGED_COMMIT (status $STATUS)"
            exit "$STATUS"
          }
          cat "$PROOF_JSON"
          PROOF_OBJECT="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(x.objectSha||"")' "$PROOF_JSON")"
          test -n "$PROOF_OBJECT"
          # versionsort.suffix=- ranks a prerelease BELOW its release, as semver
          # does; git's default ranked v0.2.4-rc.2 above v0.2.4 and refused the
          # first release after a release candidate (v0.2.4, 2026-09-13).
          LATEST_TAG="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          test "$GITHUB_REF_NAME" = "$LATEST_TAG" || { echo "::error::Refusing to move latest backward from $LATEST_TAG"; exit 1; }
          NOTES_DIR="$RUNNER_TEMP/lagrange-release-notes"
          mkdir -p "$NOTES_DIR"
          node scripts/release-notes.js --mode check --version "$VERSION"
          node scripts/release-notes.js --mode notes --version "$VERSION" > "$NOTES_DIR/release-notes.md"
          node scripts/release-notes.js --mode overview --version "$VERSION" > "$NOTES_DIR/dockerhub-overview.md"
          CHANNEL_JSON="$(node scripts/release-npm-package.js channel --version "$VERSION")"
          PRERELEASE="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).prerelease))' "$CHANNEL_JSON")"
          DIST_TAG="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).distTag)' "$CHANNEL_JSON")"
          echo "Release channel: $CHANNEL_JSON"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "tagged_commit=$TAGGED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "proof_object=$PROOF_OBJECT" >> "$GITHUB_OUTPUT"
          echo "notes_dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Consuming durable proof receipt $PROOF_OBJECT for $TAGGED_COMMIT"

      - name: Install dependencies
        run: |
          npm install --global npm@11.7.0
          npm ci

      # npm is the first release channel mutated. If the trusted-publisher
      # binding is wrong, fail here before SEA/Helm/Docker build work.
      - name: Build and verify npm package
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          npm run package:npm -- \
            --output dist/npm \
            --git-head "${{ steps.release.outputs.tagged_commit }}"
          test -f "dist/npm/lagrange-server-${VERSION}.tgz"

      - name: Publish npm package
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          npm run publish:npm -- \
            --tarball "dist/npm/lagrange-server-${VERSION}.tgz" \
            --authorize-version "$VERSION" \
            --git-head "${{ steps.release.outputs.tagged_commit }}"

      - name: Install artifact tools
        run: |
          set -euo pipefail
          HELM_VERSION=v3.16.3
          HELM_ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 "https://get.helm.sh/${HELM_ARCHIVE}"
          curl -fsSLO --connect-timeout 20 --max-time 300 --retry 2 "https://get.helm.sh/${HELM_ARCHIVE}.sha256sum"
          sha256sum --check "${HELM_ARCHIVE}.sha256sum"
          tar -xzf "$HELM_ARCHIVE"
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Build release artifacts
        run: |
          npm run build:all
          helm package charts/lagrange-node --destination dist/
          VERSION="${{ steps.release.outputs.version }}"
          cd dist
          ASSETS=(lagrange lagrange-cli "lagrange-node-${VERSION}.tgz" "npm/lagrange-server-${VERSION}.tgz")
          for asset in "${ASSETS[@]}"; do test -f "$asset"; done
          sha256sum "${ASSETS[@]}" > SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and smoke-test Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.tagged_commit }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}

      - name: Smoke-test Docker image
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          test "$(docker run --rm "$DOCKERHUB_IMAGE:$VERSION" src/index.js --version)" = "lagrange v$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$DOCKERHUB_IMAGE:$VERSION")" = "$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          retry() { local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; sleep "$((n*5))"; done; }
          retry docker push "$DOCKERHUB_IMAGE:$VERSION"
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            echo "prerelease $VERSION: latest stays where it is"
            exit 0
          fi
          LATEST_REMOTE_TAG="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' | sed 's#^refs/tags/##' | grep -v -- '-' | sort -V | tail -n 1)"
          test "$GITHUB_REF_NAME" = "$LATEST_REMOTE_TAG" || { echo "::error::Refusing to move latest backward from $LATEST_REMOTE_TAG"; exit 1; }
          docker tag "$DOCKERHUB_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:latest"
          retry docker push "$DOCKERHUB_IMAGE:latest"

      - name: Update Docker Hub repository description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: psvensson/lagrange
          readme-filepath: ${{ steps.release.outputs.notes_dir }}/dockerhub-overview.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          ASSETS=(dist/lagrange dist/lagrange-cli "dist/lagrange-node-${VERSION}.tgz" "dist/npm/lagrange-server-${VERSION}.tgz" dist/SHA256SUMS)
          NOTES="${{ steps.release.outputs.notes_dir }}/release-notes.md"
          CHANNEL_FLAGS=(--latest)
          if [ "$PRERELEASE" = "true" ]; then CHANNEL_FLAGS=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Lagrange $GITHUB_REF_NAME" --notes-file "$NOTES" --draft=false "${CHANNEL_FLAGS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --title "Lagrange $GITHUB_REF_NAME" --notes-file "$NOTES" "${CHANNEL_FLAGS[@]}"
          fi

      - name: Write publication receipt from what the registries report
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAGGED_COMMIT: ${{ steps.release.outputs.tagged_commit }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Observed, never intended: each fact below is re-read from the
          # registry that now holds it, the same rule as re-hashing evidence.
          NPM_DIST_TAGS="$(npm view lagrange-server dist-tags --json)"
          DOCKER_VERSION_DIGEST="$(docker manifest inspect --verbose "$DOCKERHUB_IMAGE:$VERSION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const m=Array.isArray(j)?j[0]:j;process.stdout.write(m.Descriptor?.digest||"")})')"
          DOCKER_LATEST_DIGEST="$(docker manifest inspect --verbose "$DOCKERHUB_IMAGE:latest" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const m=Array.isArray(j)?j[0]:j;process.stdout.write(m.Descriptor?.digest||"")}catch{process.stdout.write("")}})')"
          GH_RELEASE="$(gh release view "$GITHUB_REF_NAME" --json isPrerelease,url,assets)"
          # "latest" is a repository fact, not a release field the runner's gh
          # exposes (2.89.0 rejects --json isLatest): ask the API which release
          # it serves as latest and compare with this tag.
          GH_LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          # The receipt is written by a child node process: every observed value
          # must be exported to reach it (a separate statement, so set -e still
          # judged each substitution above).
          export NPM_DIST_TAGS DOCKER_VERSION_DIGEST DOCKER_LATEST_DIGEST GH_RELEASE GH_LATEST_TAG
          mkdir -p data/releases
          node --input-type=module <<'NODE' > "data/releases/${GITHUB_REF_NAME}.json"
          const env = process.env;
          const distTags = JSON.parse(env.NPM_DIST_TAGS);
          const npmTagsAtVersion = Object.entries(distTags)
            .filter(([, version]) => version === env.VERSION).map(([tag]) => tag).sort();
          const release = JSON.parse(env.GH_RELEASE);
          const assetNames = (release.assets || []).map((asset) => asset.name);
          const helmAsset = `lagrange-node-${env.VERSION}.tgz`;
          const repo = env.GITHUB_REPOSITORY;
          const image = env.DOCKERHUB_IMAGE.replace(/^docker\.io\//u, '');
          const receipt = {
            schema: 'release-publication-receipt/1',
            tag: env.GITHUB_REF_NAME,
            sha: env.TAGGED_COMMIT,
            version: env.VERSION,
            prerelease: env.PRERELEASE === 'true',
            intended: {distTag: env.DIST_TAG},
            observedAt: new Date().toISOString(),
            published: {
              "npm": {published: npmTagsAtVersion.length > 0, distTags: npmTagsAtVersion,
                latest: distTags.latest || null,
                url: `https://www.npmjs.com/package/lagrange-server/v/${env.VERSION}`},
              "docker": {published: env.DOCKER_VERSION_DIGEST !== '', digest: env.DOCKER_VERSION_DIGEST,
                latestDigest: env.DOCKER_LATEST_DIGEST || null,
                latestIsThisRelease: env.DOCKER_LATEST_DIGEST !== '' && env.DOCKER_LATEST_DIGEST === env.DOCKER_VERSION_DIGEST,
                url: `https://hub.docker.com/r/${image}/tags?name=${env.VERSION}`},
              "helm": {published: assetNames.includes(helmAsset),
                url: `https://github.com/${repo}/releases/download/${env.GITHUB_REF_NAME}/${helmAsset}`},
              "github": {published: Boolean(release.url), prerelease: release.isPrerelease === true,
                latest: env.GH_LATEST_TAG === env.GITHUB_REF_NAME, assets: assetNames,
                url: release.url || null},
            },
          };
          process.stdout.write(`${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          cat "data/releases/${GITHUB_REF_NAME}.json"
          cp "data/releases/${GITHUB_REF_NAME}.json" release-receipt.json
          gh release upload "$GITHUB_REF_NAME" release-receipt.json --clobber
