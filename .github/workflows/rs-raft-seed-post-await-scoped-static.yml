name: rs-raft-seed-post-await-scoped-static
on:
  push:
    branches: [verify/rs-raft-seed-late-reply-fence-20261014]
    paths: [.github/workflows/rs-raft-seed-post-await-scoped-static.yml]
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: npm ci
      - name: Scoped source lint and unchanged structural contracts
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src/node/participant-release-client.js src/bootstrap/bootstrap-service-seed-workflow.js test/bootstrap/seed-release-once-per-cohort.test.js test/scripts/participant-release-trace-envelope.test.js test/integration/message-group-membership-claim-cache.integration.test.js scripts/quest-evidence/participant-release-trace-envelope.mjs scripts/quest-evidence/summarize-seed-release-trace.mjs
          npm run -s audit:shards
          npm run -s audit:impact-contracts
          npm run -s audit:no-legacy-consensus-references
          npm run -s audit:owner-boundary-segments
          git diff --check
