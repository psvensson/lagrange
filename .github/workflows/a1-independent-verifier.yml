name: a1-independent-verifier

on:
  push:
    branches:
      - review/a1-partition-key-ordering
    paths:
      - .github/workflows/a1-independent-verifier.yml

permissions: write-all

jobs:
  verify:
    name: Copilot CLI verifier smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Ask Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: copilot -p "Return only the word OK." -s
