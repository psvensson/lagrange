name: freshmg-learner-recording
on:
  push:
    branches: [ops/freshmg-learner-recording-20261009]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-learner-recording-20261009
  cancel-in-progress: false
env:
  EXPECTED: 16bcff35bc44d2c6c6151cfb29d35fa7a4b4325a
  WORK_BRANCH: work/freshmg-learner-recording-20261009
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  learner-recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retain patch-format and lint failures unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/learner-recording-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          gh api repos/psvensson/lagrange/actions/artifacts/11616222072/zip > "$out/second-attempt-37931949476.zip"
          echo "e0fccd29321f5c3d953732b82b2a8229d3c423f3b018249b116e056a3626cb60  $out/second-attempt-37931949476.zip" | sha256sum -c -
      - name: Prove original red, owned recording and actual worker-loss recovery
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/learner-recording-20261009/resume.sh measure
      - name: Preserve measured work and canonical evidence, not main integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/learner-recording-20261009/resume.sh publish
      - name: Retain failures and all exact recoverable changes
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/learner-recording-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          git diff --binary "$EXPECTED" > "$out/total-change.patch"
          git status --porcelain > "$out/archive-status.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"; fi
          if [ -d .tap/test-results ]; then cp -a .tap/test-results "$out/archive-tap"; fi
          if [ -f test-output/reports/test-results.ndjson ]; then cp test-output/reports/test-results.ndjson "$out/archive-results.ndjson"; fi
          echo 'Hosted component/operation-worker loss proof. No GCP physical cluster, full-node loss, distributed control-plane SQL, complete driver, CREATE, successor issuance or main approval.' > "$out/substrate.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-learner-recording-${{ github.run_id }}-${{ github.run_attempt }}
          path: learner-recording-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
