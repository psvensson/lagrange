name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: 16bcff35bc44d2c6c6151cfb29d35fa7a4b4325a
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          persist-credentials: false
          fetch-depth: 1
      - name: Export only tracked exact source and its blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/learner-recording-source"
          mkdir -p "$out"
          git archive --format=tar.gz "$EXPECTED" > "$out/source.tar.gz"
          git ls-tree -r "$EXPECTED" > "$out/tree-manifest.txt"
          printf '%s\n' "$EXPECTED" > "$out/source-sha.txt"
          (cd "$out" && sha256sum source.tar.gz tree-manifest.txt source-sha.txt > SHA256SUMS)
          echo 'Read-only source export for the approved existing FreshMG continuation. No test, mutation, integration, cloud provisioning or certification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freshmg-recording-source-${{ github.run_id }}
          path: ${{ runner.temp }}/learner-recording-source/
          retention-days: 14
          if-no-files-found: error
