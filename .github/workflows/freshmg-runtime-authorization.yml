name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: 963edd9678466b8ae7246add2d9c535b1b53e2cc
  WORK_BRANCH: work/freshmg-runtime-authorization-20261008
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
jobs:
  holder-revalidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Measure original race, correction and source-revert controls
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/run-runtime-review-r2.sh measure
      - name: Preserve exact WIP and evidence through normal Git push
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/run-runtime-review-r2.sh publish
      - name: Retain all failed outcomes and recoverable work
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/runtime-r2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          cd candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          git diff --binary "$EXPECTED" > "$out/total-change.patch"
          git status --porcelain > "$out/archive-status.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then
            git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"
          fi
          if [ -f test-output/reports/test-results.ndjson ]; then
            cp test-output/reports/test-results.ndjson "$out/all-results.ndjson"
          fi
          echo 'GitHub-hosted one-worker component measurement, not GCP or physical distributed acceptance. Restart-duration finding and full lab FAIL remain unresolved.' > "$out/substrate.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-runtime-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-r2-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
      - name: Do not portray the unresolved complete review as green
        if: always()
        run: |
          echo 'The bounded R2 result is retained separately. The restart unit-file duration finding remains open; no complete PR/cutover approval.'
          exit 1
