name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: f258bade6dedde2b10b6c73d035f2b942b493b5e
  WORK_BRANCH: work/freshmg-committed-learner-origin-20261009
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
jobs:
  committed-learner-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retain both failed origin attempts without altering their verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/learner-origin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          gh api repos/psvensson/lagrange/actions/artifacts/11611141238/zip > "$out/prior-origin-37917632948.zip"
          echo "25bcb1bc4c9b0ff3910ea5b2c5d6928b4c8677719b45212a1bca10ac2b690270  $out/prior-origin-37917632948.zip" | sha256sum -c -
          echo 'This verified archive contains the original failed attempt 37892536228 with its exact checksum.' > "$out/prior-attempts.txt"
      - name: Measure original red, corrected native recovery and checkpoint binding
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/learner-origin-20261009/continue.sh measure
      - name: Preserve measured WIP and canonical evidence without integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/learner-origin-20261009/continue.sh publish
      - name: Preserve failures and exact recoverable changes
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/learner-origin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          git diff --binary "$EXPECTED" > "$out/total-change.patch"
          git status --porcelain > "$out/archive-status.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then
            git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"
          fi
          if [ -d .tap/test-results ]; then cp -a .tap/test-results "$out/archive-tap"; fi
          if [ -f test-output/reports/test-results.ndjson ]; then
            cp test-output/reports/test-results.ndjson "$out/archive-results.ndjson"
          fi
          echo 'Hosted component measurement. No physical/GCP acceptance, global metadata revocation, new attempt issuance, repository phase update, CREATE or main merge. Prior full lab FAIL and duration gates remain.' > "$out/substrate.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-learner-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: learner-origin-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
      - name: Keep the complete cutover verdict unresolved
        if: always()
        run: |
          echo 'The bounded result is separate from full FreshMG, original lab and timing gates. No independent source approval, main merge or release certification.'
          exit 1
