name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: ca1cb1384daee9592c88f7b47851043abdb7a5ae
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve immutable source and tracked-file identities only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/freshmg-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/freshmg-source/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/freshmg-source/tree-manifest.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/freshmg-source/source-sha.txt"
          sha256sum "$RUNNER_TEMP/freshmg-source/source.tar.gz" > "$RUNNER_TEMP/freshmg-source/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freshmg-source-${{ github.run_id }}
          path: ${{ runner.temp }}/freshmg-source/
          retention-days: 7
          if-no-files-found: error
