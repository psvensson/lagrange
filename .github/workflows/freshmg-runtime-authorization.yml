name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: 5c1595e7ea46be54f7114657b2117571f14a5c16
  WORK_BRANCH: work/freshmg-runtime-authorization-20261008
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
jobs:
  adversarial-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bind isolated source and exercise only test fixtures
        run: |
          set -euo pipefail
          export PROOF_OUT="$GITHUB_WORKSPACE/runtime-r3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$PROOF_OUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          printf 'base=%s\ncarrier=%s\nrunner=%s\ncap=%s\n' "$EXPECTED" "$GITHUB_SHA" "$RUNNER_NAME" "$LAGRANGE_LANE_JOBS_CAP" > "$PROOF_OUT/provenance.txt"
          echo 'GitHub-hosted component run. Prior GCP worker unavailable; no GCP service reconfiguration, distributed cluster, full lab rerun or certification.' > "$PROOF_OUT/substrate.txt"
          npm ci > "$PROOF_OUT/install.txt" 2>&1
          python3 -m py_compile ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/review-runtime-r3.py
          python3 ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/review-runtime-r3.py > "$PROOF_OUT/experiment.stdout.txt" 2> "$PROOF_OUT/experiment.stderr.txt"
      - name: Commit the bounded fixture correction and remeasure exact bytes
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/runtime-r3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npm run test:metadata:refresh > "$out/metadata.txt" 2>&1
          npm run audit:shards > "$out/shards.txt" 2>&1
          git diff --exit-code "$EXPECTED" -- src
          git diff --check
          git diff --binary "$EXPECTED" > "$out/proposed.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/solve.js note --id "$QUEST" --attempt 'Author adversarial review: demonstrate the symmetric final-read boot window without adding another reread; retain it as an unresolved owner-interaction question. Measure raw SQLite DELETE/FULL against production-journal WAL while retaining FULL on every fixture open/reopen. Preserve all sixteen restart cases and independent disk reads. Derive two historical-prose corrections from the untouched machine evidence. No production code or sealed acceptance changed.' --json > "$out/attempt.json"
          git add -- test/raft/raft-rs-backend/partition-node-cluster.js test/shards/ "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/lab-attribution-37803287356-correction.md"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'test: align native partition fixture journal without reducing sync durability'
          git rev-parse HEAD > "$out/fixture-sha.txt"
          npm run test:file -- test/raft/raft-rs-backend/evidence-o1-restart-equivalence.test.js test/integration/message-group-learner-runtime-authorization.integration.test.js test/raft/raft-rs-backend/evidence-o1-admission-liveness.test.js test/raft/raft-rs-backend/evidence-o1-proposal-ingress.test.js > "$out/exact-tests.txt" 2>&1
          test -z "$(git status --porcelain)"
          git diff --exit-code "$EXPECTED" -- src
          cp test-output/reports/test-results.ndjson "$out/all-results.ndjson"
          export PROOF_OUT="$out"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          out=Path(os.environ['PROOF_OUT'])
          rows=re.findall(r'^ok (test/\S+) \((\d+) assertions, (\d+)ms\)',(out/'exact-tests.txt').read_text(),re.M)
          assert len(rows)==4,rows
          record={'sourceSha':(out/'fixture-sha.txt').read_text().strip(),'files':[]}
          for path,count,ms in rows:
              limit=30000 if path.startswith('test/integration/') else 2000
              record['files'].append({'path':path,'reportedAssertions':int(count),'durationMs':int(ms),'budgetMs':limit,'withinBudget':int(ms)<=limit})
          record['allBudgetsSatisfied']=all(x['withinBudget'] for x in record['files'])
          (out/'exact-results.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Preserve complete evidence and push only the expected work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PROOF_OUT="$GITHUB_WORKSPACE/runtime-r3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path(os.environ['PROOF_OUT'])
          manifest={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()}
          (out/'member-sha256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          archive=out.parent/(out.name+'.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file():z.write(p,str(p.relative_to(out)))
          with zipfile.ZipFile(archive) as z:
              for n,h in manifest.items():assert hashlib.sha256(z.read(n)).hexdigest()==h
          (out/'archive-sha256.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'\n')
          PY
          node scripts/solve.js evidence add "$PROOF_OUT.zip" --id "$QUEST" --text 'Author adversarial R3 review: symmetric final-operation-read boot counterexample stays unresolved. Paired DELETE/FULL vs WAL/FULL native partition fixture measurement preserves every restart matrix case, oracle and sync level; exact-head focused run and journal/sync mutation engagement are separate facts. Correct attribution prose from machine record. No production mutation, independent approval, physical distributed acceptance or cutover closure.' --json > "$PROOF_OUT/canonical.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          out=Path(os.environ['PROOF_OUT'])
          record=json.loads((out/'review-r3.json').read_text())
          record.update({'runId':int(os.environ['GITHUB_RUN_ID']),'exactHead':json.loads((out/'exact-results.json').read_text()),'canonicalEvidence':json.loads((out/'canonical.json').read_text()),'archiveSha256':(out/'archive-sha256.txt').read_text().strip()})
          p=Path('solve/quests')/os.environ['QUEST']/'evidence'/('adversarial-r3-'+os.environ['GITHUB_RUN_ID']+'.json')
          p.write_text(json.dumps(record,indent=2)+'\n')
          PY
          git add -- "solve/quests/$QUEST/log.ndjson" "solve/quests/$QUEST/evidence/adversarial-r3-$GITHUB_RUN_ID.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'evidence: retain self-review counterexample and exact fixture proof'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$PROOF_OUT/published-sha.txt"
          git status --porcelain > "$PROOF_OUT/final-status.txt"
      - name: Retain failed outcomes and recoverable source
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/runtime-r3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          git diff --binary "$EXPECTED" > "$out/total-change.patch"
          git status --porcelain > "$out/archive-status.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then
            git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"
          fi
          if [ -f test-output/reports/test-results.ndjson ]; then
            cp test-output/reports/test-results.ndjson "$out/archive-test-results.ndjson"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-adversarial-r3-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-r3-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
      - name: Retain unresolved authorization verdict
        if: always()
        run: |
          echo 'The final-read boot counterexample is unresolved. No complete PR, source approval or cutover certification follows from the fixture correction.'
          exit 1
