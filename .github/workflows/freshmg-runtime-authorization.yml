name: freshmg-runtime-authorization
on:
  push:
    branches: [ops/freshmg-runtime-authorization-20261008]
    paths: [.github/workflows/freshmg-runtime-authorization.yml]
permissions:
  contents: read
concurrency:
  group: freshmg-runtime-review-20261008
  cancel-in-progress: false
env:
  EXPECTED: ff8c95ee3546458db0154e7eb8920bcd1978b9c4
  WORK_BRANCH: work/freshmg-runtime-authorization-20261008
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
jobs:
  review-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Retain original failures and record bounded worker-cap experiment
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/runtime-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          gh api repos/psvensson/lagrange/actions/artifacts/11566547325/zip > "$out/grouped-budget-failure-37814349071.zip"
          echo "f5a0aec899fb3aed85609dd4494c66b0648d8e4efa3ea438287dd9bf706811e6  $out/grouped-budget-failure-37814349071.zip" | sha256sum -c -
          gh api repos/psvensson/lagrange/actions/artifacts/11565997590/zip > "$out/lint-stopped-37813798876.zip"
          echo "9b03f4560a416dc16d5bd153ada7b5c6bb3a823ae3eb8aafdb38bd6ccb595aae  $out/lint-stopped-37813798876.zip" | sha256sum -c -
          { printf 'cap=%s\n' "$LAGRANGE_LANE_JOBS_CAP"; nproc; free -b; cat /proc/loadavg; lscpu; } > "$out/runner-resources.txt"
          echo 'GitHub-hosted Linux, not GCP. The previous corrected-source run passed 177 focused assertions but all four concurrent unit files exceeded 2 seconds. This measurement changes only the classified runner existing LAGRANGE_LANE_JOBS_CAP to 1; source/tests/budgets remain identical. It tests resource-concurrency sensitivity, not an assumed saturation diagnosis. The cancelled GCP job never started. No distributed acceptance substitution.' > "$out/execution-substrate.txt"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Measure strict guard repair and preserved native refusal controls
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/run-runtime-review-r1.sh measure
      - name: Retain evidence and push the reviewed WIP branch, not main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/run-runtime-review-r1.sh publish
      - name: Preserve all failures and recoverable source
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/runtime-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          dir="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -d "$dir/.git" ]; then
            cd "$dir"
            git diff --binary "$EXPECTED" > "$out/total-change.patch"
            git status --porcelain > "$out/archive-status.txt"
            if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then
              git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"
            fi
            if [ -f test-output/reports/test-results.ndjson ]; then
              cp test-output/reports/test-results.ndjson "$out/all-test-results.ndjson"
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: freshmg-runtime-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-review-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
      - name: Keep the unresolved restart-duration verdict red
        if: always()
        run: |
          out="$GITHUB_WORKSPACE/runtime-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -f "$out/restart-budget-exit.txt" || exit 1
          echo 'Focused review correction is not independent approval or complete cutover certification.'
          exit "$(cat "$out/restart-budget-exit.txt")"
