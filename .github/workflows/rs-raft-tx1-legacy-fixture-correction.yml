name: rs-raft-tx1-legacy-fixture-correction
on:
  push:
    branches: [resume/rs-raft-runtime-recovery-20261012]
    paths:
      - .github/workflows/rs-raft-tx1-legacy-fixture-correction.yml
permissions:
  contents: read
jobs:
  exact-tx1-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      OUT: test-output/tx1-legacy-fixture
      BRANCH: resume/rs-raft-runtime-recovery-20261012
      INPUT: f7ea865db5d67284d0ccdb170c12130d936cf74b
      LEGACY: test/partition/partition-legacy-session-statement-admission.test.js
      STAGING: test/partition/partition-participant-transaction-staging.test.js
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify unchanged source and exact reviewed witness bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/candidate-sha.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$LEGACY" | cut -d' ' -f1)" = 1cda07fa838dbc1229c66367f0462c07852af8a5e9f36fe4a7a8ae02e36f25a0
          test "$(sha256sum "$STAGING" | cut -d' ' -f1)" = cb063e0f0d30ac041ca81dbae58fc6c3c4fd2502c249536262bf46d461576fac
          git diff --exit-code "$INPUT" HEAD -- src
          npm ci > "$OUT/install.log" 2>&1
      - name: Record old invalid assertions without counting them as passing
        shell: bash
        run: |
          set -euo pipefail
          cp "$LEGACY" "$RUNNER_TEMP/tx1-final-legacy.js"
          cp "$STAGING" "$RUNNER_TEMP/tx1-final-staging.js"
          git show "$INPUT:$LEGACY" > "$LEGACY"
          git show "$INPUT:$STAGING" > "$STAGING"
          set +e
          node --test "$LEGACY" "$STAGING" > "$OUT/superseded-old-assertions.log" 2>&1
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > "$OUT/superseded-old-exit.txt"
          cp "$RUNNER_TEMP/tx1-final-legacy.js" "$LEGACY"
          cp "$RUNNER_TEMP/tx1-final-staging.js" "$STAGING"
          test "$STATUS" -ne 0
          test "$(sha256sum "$LEGACY" | cut -d' ' -f1)" = 1cda07fa838dbc1229c66367f0462c07852af8a5e9f36fe4a7a8ae02e36f25a0
          test "$(sha256sum "$STAGING" | cut -d' ' -f1)" = cb063e0f0d30ac041ca81dbae58fc6c3c4fd2502c249536262bf46d461576fac
      - name: Canonical corrected TX1 legacy and participant cone
        shell: bash
        run: |
          set +e
          set -uo pipefail
          npm run -s test:file -- "$LEGACY" "$STAGING"             test/partition/partition-participant-transaction-apply.test.js             test/partition/partition-transaction-replicated-apply-v3.test.js             test/raft/raft-rs-backend/transaction-leg-a-three-replica.test.js             > "$OUT/current-tx1.log" 2>&1
          printf '%s\n' "$?" > "$OUT/current-tx1-exit.txt"
          mkdir -p "$OUT/tap"
          cp --parents .tap/test-results/"$LEGACY".tap "$OUT/tap" 2>/dev/null
          cp --parents .tap/test-results/"$STAGING".tap "$OUT/tap" 2>/dev/null
          tail -50 "$OUT/current-tx1.log"
      - name: Lint, owner boundary, impacts and unchanged production
        shell: bash
        run: |
          set -euo pipefail
          npm run -s test:metadata:refresh > "$OUT/metadata.log" 2>&1
          node_modules/.bin/eslint "$LEGACY" "$STAGING" > "$OUT/lint.log" 2>&1
          npm run -s audit:impact-contracts > "$OUT/impact.log" 2>&1
          node --input-type=module -e "import {auditRaftRsOperationBoundary} from './scripts/checks/raft-rs-operation-boundary-audit.js';const v=auditRaftRsOperationBoundary({root:process.cwd()});console.log(JSON.stringify(v,null,2));process.exitCode=v.length?1:0;" > "$OUT/boundary.json"
          git diff --exit-code "$INPUT" HEAD -- src
          git diff --check
      - name: Classify honest result and unresolved migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['OUT'])
          raw=(p/'current-tx1.log').read_text()
          def number(key):
              ms=re.findall(r'^# '+key+r' (\d+)$',raw,re.M)
              return int(ms[-1]) if ms else None
          checks={
            'superseded-assertions-red':int((p/'superseded-old-exit.txt').read_text())!=0,
            'candidate-test-exit':(p/'current-tx1-exit.txt').read_text().strip()=='0',
            'candidate-tests':number('fail')==0 and number('cancelled')==0 and
              number('skipped')==0 and number('todo')==0 and number('pass') is not None,
          }
          result={'sourceInput':os.environ['INPUT'],
            'candidate':(p/'candidate-sha.txt').read_text().strip(),
            'checks':checks,
            'tests':{k:number(k) for k in ['pass','fail','cancelled','skipped','todo']},
            'focusedProofPassed':all(checks.values()),
            'historicalLegacyAdmissionProved':False,
            'legacyMigrationRetirementAuthorized':False,
            'independentApproval':False,'mergeReady':False,
            'scope':'Current-build legacy-entry fences and participant staging; obsolete historical-session test expectations retired. Not a proof of genuine pre-L6 admitted obligations or migration.'}
          (p/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert result['focusedProofPassed']
          PY
      - name: Publish exact gate receipts to WIP branch only
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$INPUT" HEAD -- src
          DEST="solve/quests/replicated-transaction-decision-and-apply/evidence/legacy-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp -a "$OUT/." "$DEST/"
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/shards "$DEST"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP TX1: retain corrected legacy-fixture test proof and historical migration HOLD'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin "HEAD:refs/heads/$BRANCH"
      - name: Preserve all failure evidence as artifact
        if: always()
        shell: bash
        run: |
          mkdir -p "$OUT"
          git status --porcelain > "$OUT/final-status.txt"
          git diff -- src > "$OUT/production-delta.patch"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-tx1-legacy-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/tx1-legacy-fixture/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed on incomplete proof
        if: always()
        shell: bash
        run: |
          test -f "$OUT/summary.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['OUT'])/'summary.json').read_text())
          assert x['focusedProofPassed']
          assert x['historicalLegacyAdmissionProved'] is False
          PY
