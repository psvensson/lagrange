# Whole-repository structural analysis, deliberately NOT a change gate.
#
# `npm run check` stopped paying for these on every change, and that was the
# point: duplication, unused exports, cycles and full complexity are global BY
# NATURE. A duplication ratchet over only the files a change touched is
# meaningless, so making them change-aware would have been abstraction in
# service of nothing. They keep repository health honest here instead.
#
# The distinction this workflow exists to draw:
#
#   red here    main carries structural debt that someone should pay down
#   red in ci   this change is not proved and must not land
#
# The old system could not say the first without also saying the second. A
# nightly whole-corpus failure made every unrelated change unlandable, which is
# most of what the modular-proof migration set out to stop.
#
# So: NOT a required check, and no schedule. On push to main, because that is
# when debt can actually have changed, plus manual dispatch for when someone
# wants to know. An unchanged tree cannot grow new complexity overnight, so a
# cron would only rerun the same analysis over the same bytes.
#
# Deliberately NOT here: test:sharded:all or any other behavioural corpus.
# Repository health is about structure. A behavioural suite hiding in this
# workflow would quietly restore the full-system gate under a friendlier name,
# and the whole-system proof already has an explicit home in full-gate.yml and
# release.yml, both of which run npm run check:release.
name: repository-health

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health:
    name: health
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: the owner-debt inventory and several structural
          # audits read older commits via git show.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # Only what the structural analyses actually need. The wasm and Helm
      # toolchains belong to behavioural tests, which do not run here.
      - name: Install analysis CLI tools
        # Bounded like every other network-facing step: apt must fail in
        # minutes rather than consume the job budget if a mirror stops
        # responding.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
            ripgrep jq default-jre-headless

      - name: Install dependencies
        run: npm ci

      # Runs FIRST on purpose. The static and model analyses read generated
      # inventory inputs, and several checks silently mean something different
      # when those inputs are absent - the same hidden ordering dependency that
      # made a standalone test:fast reproduction disagree with the manifest.
      - name: Prepare owner-debt inputs
        run: npm run test:owner-debt:prepare

      - name: Whole-repository static analysis
        run: npm run test:static

      - name: Model and contract checks
        run: npm run model:contracts

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-health-evidence
          path: |
            test-output/analysis/
            test-output/reports/
          retention-days: 14
          if-no-files-found: ignore
