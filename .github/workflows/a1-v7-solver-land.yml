name: a1-v7-solver-land
on:
  push:
    branches:
      - land/a1-v7-queryable-core
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAP_TIMEOUT_FLOOR: '120'
      LAGRANGE_TEST_MACHINE_FACTOR: '3'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bind reviewed candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          freeze=e813ae541051f1d9ebfb5adfd34f5ce180bfe4df
          for path in             src/partition/partition-split-merge-manager.js             src/partition/split-key-comparator.js             src/partition/partition-split-merge-manager-core-methods.js             src/partition/partition-split-merge-manager-evaluation-methods.js             src/partition/partition-split-merge-manager-transition-methods.js             test/partition/routing-key-comparator.test.js             test/partition/merge-auto-execution.test.js; do
            test "$(git rev-parse "$freeze:$path")" = "$(git hash-object "$path")"
          done
      - name: Record Solver attempt
        run: |
          node scripts/solve.js note partition-key-ordering-owner-completion-v7 --attempt --summary "A1-v7 immutable candidate e813ae541051f1d9ebfb5adfd34f5ce180bfe4df accepted by independent review; exact-head final proof run 37046137427."
      - name: Record independent approval
        run: |
          node scripts/solve.js note partition-key-ordering-owner-completion-v7 --verification --verifier subagent:copilot --verdict approve --summary "ACCEPT on immutable e813ae541051f1d9ebfb5adfd34f5ce180bfe4df after exact-head metadata stability, fingerprints, controlled negatives, v6/v7 closure, focused behavior, complexity, file-size, ESLint and guideline guards."
      - name: Probe sealed Quest
        run: |
          node scripts/solve.js probe partition-key-ordering-owner-completion-v7
      - name: Solver land
        run: |
          node scripts/solve.js land partition-key-ordering-owner-completion-v7 --summary "A1-v7 partition-key ordering owner completion: immutable accepted candidate landed for 0.3 queryable core."
      - name: Push Solver landing commit to authoritative PR branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:quest/0-3-queryable-core-foundation
