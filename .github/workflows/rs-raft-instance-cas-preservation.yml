name: rs-raft-instance-cas-preservation
on:
  push:
    branches: [carrier/rs-raft-instance-cas-20261016]
    paths: [.github/workflows/rs-raft-instance-cas-preservation.yml]
permissions:
  contents: write
concurrency:
  group: rs-raft-instance-cas-preservation-20261016
  cancel-in-progress: false
jobs:
  preserve-reviewed-wip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: af976fe9212cd06c062f93ec9dda7c2b3747a148
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact patches and preserve WIP without executing product code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ChatGPT
          GIT_AUTHOR_EMAIL: chatgpt@openai.com
          GIT_COMMITTER_NAME: ChatGPT
          GIT_COMMITTER_EMAIL: chatgpt@openai.com
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/instance-cas-preservation"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = af976fe9212cd06c062f93ec9dda7c2b3747a148
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          out = pathlib.Path(os.environ['OUT'])
          parts = [
            ('ffc514134c0ac8a7348f7a4f6999dd4c03d935e0', None),
            ('1399611cef681c9d5e705dfdd08f02013931bcf6', None),
            ('bd6339e781039edbaf33a6562fd5a6be97c905bf', ('byCDiru', 'byDiru', '32a818afccb00e3bfebe7908b7c565f19cb3f3e9')),
            ('41d8c1c0c557bc9f464eb7339f804c2f470fab10', None),
            ('0e5efcd502ee4bd0cf484b2e44a52ec4d8229aa1', ('fXPRYYyt', 'fXPRYyt', '9d86f9f543614dfb3fdd1ee1e11cf329192f778b')),
            ('6a95a58c1cd2ead84823c55e0f5acbd1def7a139', None),
          ]
          def git_blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          encoded = []
          for sha, transmission_correction in parts:
            reply = json.loads(subprocess.check_output(['gh', 'api', 'repos/psvensson/lagrange/git/blobs/' + sha]))
            data = base64.b64decode(reply['content'])
            assert git_blob(data) == sha
            if transmission_correction:
              before, after, original_sha = transmission_correction
              assert data.count(before.encode()) == 1
              data = data.replace(before.encode(), after.encode(), 1)
              assert git_blob(data) == original_sha
            encoded.append(data)
          raw = zlib.decompress(base64.b64decode(b''.join(encoded), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'd7002127d119d10cd6867bc852c4bf97240da73efe64b512c40bd9dcb7bd716a'
          payload = json.loads(raw)
          assert payload['identity']['baseRemote'] == 'af976fe9212cd06c062f93ec9dda7c2b3747a148'
          for name in ('tests', 'source'):
            (out / (name + '.patch')).write_text(payload[name])
          (out / 'expected.json').write_text(json.dumps(payload['identity'], indent=2) + '\n')
          (out / 'transfer.json').write_text(json.dumps({'parts': parts, 'payloadSha256': hashlib.sha256(raw).hexdigest()}, indent=2) + '\n')
          PY
          git apply --check --index "$OUT/tests.patch"
          git apply --index "$OUT/tests.patch"
          TEST_TREE=$(git write-tree)
          TEST_SHA=$(printf '%s\n' 'WIP test checkpoint: frozen instance CAS companion and lossless bounded diagnostics' | git commit-tree "$TEST_TREE" -p af976fe9212cd06c062f93ec9dda7c2b3747a148)
          printf '%s\n' "$TEST_SHA" > "$OUT/test-checkpoint-sha.txt"
          git apply --check --index "$OUT/source.patch"
          git apply --index "$OUT/source.patch"
          TREE=$(git write-tree)
          export TREE
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['OUT'])
          expected = json.loads((out / 'expected.json').read_text())
          for path, sha in expected['postimages'].items():
            actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
            assert actual == sha, (path, actual, sha)
          for name in ('src', 'test'):
            actual = subprocess.check_output(['git', 'rev-parse', os.environ['TREE'] + ':' + name], text=True).strip()
            assert actual == expected[name + 'Tree'], (name, actual)
          PY
          CANDIDATE=$(printf '%s\n' 'WIP: implement reviewed bounded instance selection and resource metadata CAS (not activated)' | git commit-tree "$TREE" -p "$TEST_SHA")
          git cat-file commit "$TEST_SHA" > "$OUT/test-commit.raw"
          git cat-file commit "$CANDIDATE" > "$OUT/candidate-commit.raw"
          git diff af976fe9212cd06c062f93ec9dda7c2b3747a148 "$CANDIDATE" --binary > "$OUT/complete.patch"
          git diff-tree --no-commit-id --name-status -r "$CANDIDATE" > "$OUT/changed-paths.txt"
          REF=refs/heads/work/rs-raft-instance-cas-20261016
          git fetch --no-tags origin "$REF"
          test "$(git rev-parse FETCH_HEAD)" = af976fe9212cd06c062f93ec9dda7c2b3747a148
          git push origin "$CANDIDATE:$REF"
          REMOTE=$(git ls-remote --heads origin "$REF" | cut -f1)
          test "$REMOTE" = "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$OUT/verified-remote-sha.txt"
          printf '%s\n' "$TREE" > "$OUT/verified-tree.txt"
          printf '%s\n' 'WIP preservation only. No product tests, activation, main merge, full static or release proof. Two transmission insertions corrected only after uploaded and original blob identities verify.' > "$OUT/claim-limit.txt"
          cd "$OUT"
          sha256sum *.patch *.json *.raw *.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-instance-cas-preservation-${{ github.run_id }}
          path: ${{ runner.temp }}/instance-cas-preservation/
          retention-days: 7
          if-no-files-found: error
