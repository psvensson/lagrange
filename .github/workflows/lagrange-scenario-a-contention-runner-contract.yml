name: lagrange-scenario-a-contention-runner-contract

on:
  push:
    branches:
      - benchmark/scenario-a-lagrange-contention-runner-staging
    paths:
      - '.github/workflows/lagrange-scenario-a-contention-runner-contract.yml'
      - 'test/distributed/harness/oltp-paired-retry-owner.js'
      - 'test/distributed/harness/oltp-scenario-a-new-order-contention-case.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-public-pg-context.js'
      - 'test/distributed/harness/oltp-scenario-a-lagrange-new-order-contention-runner.js'
      - 'test/distributed/reference-client/lagrange-oltp-adapter.js'
      - 'test/distributed/reference-client/lagrange-new-order-contention-observer.js'
      - 'scripts/checks/oltp-scenario-a-new-order-contention-case-guard.js'
      - 'scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js'
      - 'scripts/checks/lagrange-new-order-contention-observer-guard.js'
      - 'scripts/checks/oltp-scenario-a-lagrange-new-order-contention-runner-guard.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lagrange-scenario-a-contention-runner-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix test/distributed/reference-client

      - name: Prove dormant Lagrange contention runner contract
        run: |
          set -euo pipefail
          npx eslint \
            test/distributed/harness/oltp-scenario-a-lagrange-public-pg-context.js \
            test/distributed/harness/oltp-scenario-a-lagrange-new-order-contention-runner.js \
            test/distributed/reference-client/lagrange-new-order-contention-observer.js \
            scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js \
            scripts/checks/lagrange-new-order-contention-observer-guard.js \
            scripts/checks/oltp-scenario-a-lagrange-new-order-contention-runner-guard.js
          node scripts/checks/oltp-scenario-a-new-order-contention-case-guard.js
          node scripts/checks/oltp-scenario-a-lagrange-public-pg-context-guard.js
          node scripts/checks/lagrange-new-order-contention-observer-guard.js
          node scripts/checks/oltp-scenario-a-lagrange-new-order-contention-runner-guard.js
