name: rs-raft-control-proof-quest-seal
on:
  push:
    branches: [continue/rs-raft-seed-control-proof-amortization-20261014]
    paths: [.github/workflows/rs-raft-control-proof-quest-seal.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Canonical red seal, no production changes
        shell: bash
        run: |
          set -euo pipefail
          H="$GITHUB_SHA"
          npm ci
          node scripts/solve.js start --id seed-control-current-proof-amortization --json
          node scripts/solve.js probe --id seed-control-current-proof-amortization --json
          git diff --check
          git add solve/quests/seed-control-current-proof-amortization/quest.json solve/quests/seed-control-current-proof-amortization/log.ndjson
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: seal red canonical control proof owner optimization Quest'
          git fetch --no-tags origin refs/heads/continue/rs-raft-seed-control-proof-amortization-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$H" || {
            echo 'Concurrent owner moved branch — refuse push'; exit 1
          }
          git push origin HEAD:refs/heads/continue/rs-raft-seed-control-proof-amortization-20261014
      - name: Preserve bound red seal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-control-proof-quest-${{ github.sha }}
          path: solve/quests/seed-control-current-proof-amortization/
          retention-days: 14
          if-no-files-found: warn
