name: issued-action-recovery-corrections
on:
  push:
    branches: [ops/issued-action-recovery-corrections-20261009]
    paths: [.github/workflows/issued-action-recovery-corrections.yml]
permissions:
  contents: read
concurrency:
  group: issued-action-recovery-corrections-20261009
  cancel-in-progress: false
env:
  EXPECTED: 2d26da1b99bf66ad9ffa92d274ea8b5c75b11eae
  WORK_BRANCH: work/freshmg-issued-action-recovery-20261009
  QUEST: message-group-fresh-identity-membership
  LAGRANGE_LANE_JOBS_CAP: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  process-lifetime-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: carrier-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED }}
          path: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Retain all three earlier attempt outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/process-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          gh api repos/psvensson/lagrange/actions/artifacts/11605547814/zip > "$out/previous-attempt-37909499109.zip"
          echo "4289a814f7058fceda08dd2fff36c1e99fe8502a1687e65592c66536f36433cc  $out/previous-attempt-37909499109.zip" | sha256sum -c -
          echo '37909499109 passed the process lifetime correction but the original checker injector assumed term 2: only one rather than both intended election-history cases failed. It now rejects any post-initial term and asserts both exact failure identities; no production election settings change. That archive nests 37908863477 (extra storage-runner argument) and 37908352359 (ESRCH observer race). All original verdicts remain failed.' > "$out/previous-attempt-classification.txt"
      - name: Reproduce live descendants and prove owned-group cleanup
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/issued-recovery-corrections/process-review/run.sh measure
      - name: Preserve canonical evidence and normal expected-head push
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/issued-recovery-corrections/process-review/run.sh publish
      - name: Preserve every failure and recoverable candidate
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/process-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          cp -a ../carrier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/quest-evidence/issued-recovery-corrections/process-review "$out/carrier"
          git diff --binary "$EXPECTED" > "$out/total-change.patch"
          git status --porcelain > "$out/archive-status.txt"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED" ]; then
            git bundle create "$out/candidate.bundle" HEAD "^$EXPECTED"
          fi
          if [ -f test-output/reports/test-results.ndjson ]; then
            cp test-output/reports/test-results.ndjson "$out/all-test-results.ndjson"
          fi
          echo 'Bounded hosted Linux process-lifetime and normal SQLite component proof. No runtime/ordinary-test mutation retained, main merge, independent approval or physical acceptance. Existing full lab FAIL and all remaining cutover gates stand.' > "$out/proof-limits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issued-recovery-process-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: process-review-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
