name: rs-raft-startup-cleanup
on:
  push:
    branches: [resume/rs-raft-runtime-recovery-20261012]
    paths:
      - .github/workflows/rs-raft-startup-cleanup.yml
permissions:
  contents: read
concurrency:
  group: rs-raft-startup-cleanup-20261012
  cancel-in-progress: false
jobs:
  exact-cleanup-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BRANCH: resume/rs-raft-runtime-recovery-20261012
      QUEST: startup-refusal-cleanup-custody
      EVIDENCE: test-output/startup-cleanup-hosted
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Recover checksum-bound local execution input and locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          import base64,hashlib,json,os,time,urllib.request
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); t=e/'input-transfer'; t.mkdir()
          specs=[
            ('56a932af2d6fab85a0cd5b22cd0827a4036a3d6f','8acd3ee85e2c8ba120a519985a8bf0b6b5412ac7'),
            ('fbfe3f65eacca246a97607199558e84b542d6af9','f422a2f218100da99260bcfbde20d29b4bdef901'),
            ('b04f87506c8b1e0e7fc3f79790637248792a3d07','b04f87506c8b1e0e7fc3f79790637248792a3d07')]
          blob_sha=lambda b:hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          parts=[]
          for i,(remote,expected) in enumerate(specs):
              url=f'https://api.github.com/repos/psvensson/lagrange/git/blobs/{remote}'
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'lagrange-exact-cleanup-proof'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(attempt+1)
              received=base64.b64decode(result['content']); assert blob_sha(received)==remote
              (t/f'received-{i}.bin').write_bytes(received)
              data=received
              # Correct only identified transport transcription errors, never source semantics.
              # Each corrected piece and the complete payload must match pre-recorded local hashes.
              if i==0:
                  assert data[1507]==60
                  data=data[:1507]+bytes([28])+data[1508:]
              elif i==1:
                  encoded=base64.b64encode(data).decode().rstrip('=')
                  assert encoded.endswith('JKU0')
                  encoded=encoded[:-1]+'2'
                  for before,after in [('msx4i982','msx4r982'),('95MjsTch','95Mjsch'),('H1NiTpRpG10','H1NiTpG10')]:
                      assert encoded.count(before)==1
                      encoded=encoded.replace(before,after)
                  data=base64.b64decode(encoded)
              assert blob_sha(data)==expected, f'input-transfer mismatch in piece {i}'
              parts.append(data)
          payload=b''.join(parts)
          assert hashlib.sha256(payload).hexdigest()=='deb8700be5d9b15a46b5868447af1a86e9c9cb84b0d158e71941aa4db110573b'
          (e/'execution-input.json.gz').write_bytes(payload)
          (t/'manifest.json').write_text(json.dumps({'receivedAndRestoredBlobs':specs,'restoredPayloadSha256':hashlib.sha256(payload).hexdigest(),'scope':'byte-exact transfer correction; source/test preimages and postimages separately enforced'},indent=2)+'\n')
          PY
          npm ci > "$EVIDENCE/install.log" 2>&1
          node --version > "$EVIDENCE/node-version.txt"
          python3 -m py_compile scripts/quest-evidence/measure-startup-cleanup-20261012.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Measure baseline candidate source-only revert and all selected lifecycle cases
        id: measure
        shell: bash
        run: |
          set +e
          python3 scripts/quest-evidence/measure-startup-cleanup-20261012.py > "$EVIDENCE/measurement.log" 2>&1
          STATUS=$?
          printf '%s\n' "$STATUS" > "$EVIDENCE/measurement-exit.txt"
          tail -100 "$EVIDENCE/measurement.log"
          exit "$STATUS"
      - name: Preserve exact WIP source and every measured failure without merging
        if: steps.measure.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src
          DEST="solve/quests/$QUEST/evidence/native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp -a "$EVIDENCE/." "$DEST/"
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS"
          git add -- "$DEST" "solve/quests/$QUEST/evidence/receipt.json"
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP startup cleanup: retain exact native controls and unresolved wider gates'
          REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$EVIDENCE/published-sha.txt"
      - name: Retain incomplete attempts and current source
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          git status --porcelain > "$EVIDENCE/final-status.txt"
          git rev-parse HEAD > "$EVIDENCE/final-head.txt"
          git diff -- src | gzip -n > "$EVIDENCE/uncommitted-source.patch.gz"
          find "$EVIDENCE" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rs-raft-startup-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/startup-cleanup-hosted/
          retention-days: 30
          if-no-files-found: error
      - name: Keep every unresolved safety and static gate visible
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])/'summary.json'
          assert p.is_file(), 'missing or incomplete proof'
          s=json.loads(p.read_text())
          assert s['allRunGatesPassed'], 'not independent approval or merge readiness; unresolved gates remain RED'
          PY
