# Producer execution only; this workflow never updates a branch or merges.
name: original-handoff-metadata-objects
on:
  push:
    branches: [verify/original-metadata-generation-20261021]
    paths: [.github/workflows/original-handoff-metadata-objects.yml]
permissions:
  contents: write
concurrency:
  group: original-handoff-metadata-objects-20261021
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: d2d7c7504bc0b5134828e41243078fb004588ae8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d2d7c7504bc0b5134828e41243078fb004588ae8
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact source and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/original-metadata-objects"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          npm ci > "$OUT/npm-ci.log" 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Generate through the existing producers and run canonical gates
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/original-metadata-objects"
          npm run -s test:metadata:refresh > "$OUT/generate.log" 2>&1
          sha256sum test/shards/{primary,resource,subsystem}-classes.json test/shards/impact-graph-seal.json > "$OUT/first-sha256.txt"
          npm run -s test:metadata:refresh > "$OUT/generate-again.log" 2>&1
          sha256sum --check "$OUT/first-sha256.txt"
          npm run -s audit:impact-contracts > "$OUT/impact-contracts.log" 2>&1
          npm run -s audit:shards > "$OUT/shards.log" 2>&1
          npm run -s test:deps > "$OUT/dependencies.log" 2>&1
          git diff --check
          git diff --binary > "$OUT/generated.patch"
          git diff --stat
          cat "$OUT/generate.log" "$OUT/impact-contracts.log" "$OUT/shards.log" "$OUT/dependencies.log"
          cat "$OUT/generated.patch"
      - name: Preserve only verified generated objects and verify remote bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'original-metadata-objects'
          paths = [f'test/shards/{name}-classes.json' for name in ('primary', 'resource', 'subsystem')]
          paths.append('test/shards/impact-graph-seal.json')
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(paths), f'unexpected generated paths: {changed}'
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only']) == b''
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['SOURCE_SHA']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          api = 'https://api.github.com/repos/psvensson/lagrange/git/blobs'
          entries = []
          for path in paths:
              file = root / path
              assert file.is_file() and not file.is_symlink(), path
              data = file.read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              request = urllib.request.Request(api, data=payload, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  uploaded = json.load(response)
              assert uploaded['sha'] == expected, path
              with urllib.request.urlopen(urllib.request.Request(api + '/' + expected, headers=headers), timeout=60) as response:
                  observed = json.load(response)
              assert observed['encoding'] == 'base64' and base64.b64decode(observed['content']) == data, path
              entry = {'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
              entries.append(entry)
              destination = out / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          result = {'source_sha': os.environ['SOURCE_SHA'], 'entries': entries, 'canonical_gates': ['audit:impact-contracts', 'audit:shards', 'test:deps'], 'deterministic_regeneration': True, 'remote_bytes_verified': True, 'refs_updated': False, 'native_lab_acceptance': False}
          (out / 'objects.json').write_text(json.dumps(result, indent=2) + '\n')
          print('VERIFIED_GENERATED_OBJECTS=' + json.dumps(result, sort_keys=True))
          PY
      - name: Retain every available outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-metadata-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-metadata-objects/
          if-no-files-found: error
          retention-days: 30
