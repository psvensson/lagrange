# Read-only verification of an exact committed continuation; no ref mutation.
name: original-handoff-metadata-objects
on:
  push:
    branches: [verify/original-metadata-generation-20261021]
    paths: [.github/workflows/original-handoff-metadata-objects.yml]
permissions:
  contents: read
concurrency:
  group: original-handoff-metadata-objects-20261021
  cancel-in-progress: false
jobs:
  verify-committed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ba1d93bc7fd81c74267d66ee31cc717995269e60
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ba1d93bc7fd81c74267d66ee31cc717995269e60
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin committed source and metadata before installation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/original-metadata-final"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          sha256sum test/shards/{primary,resource,subsystem}-classes.json test/shards/impact-graph-seal.json scripts/checks/test-subsystem-classification.js test/scripts/test-subsystem-repository-index.test.js > "$OUT/committed-sha256.txt"
          npm ci > "$OUT/npm-ci.log" 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prove canonical regeneration changes no committed bytes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/original-metadata-final"
          npm run -s test:metadata:refresh > "$OUT/regenerate.log" 2>&1
          sha256sum --check "$OUT/committed-sha256.txt"
          git diff --exit-code > "$OUT/regenerated-diff.txt"
          node scripts/generate-global-owner-debt-inventory.js --verify-import-graph > "$OUT/import-graph-verification.log" 2>&1
          ./node_modules/.bin/eslint scripts/checks/test-subsystem-classification.js test/scripts/test-subsystem-repository-index.test.js > "$OUT/scoped-eslint.log" 2>&1
          npm run -s audit:impact-contracts > "$OUT/impact-contracts.log" 2>&1
          npm run -s audit:shards > "$OUT/shards.log" 2>&1
          npm run -s test:deps > "$OUT/dependencies.log" 2>&1
          sha256sum --check "$OUT/committed-sha256.txt"
          git diff --exit-code > "$OUT/final-diff.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
          cat "$OUT/regenerate.log" "$OUT/import-graph-verification.log" "$OUT/impact-contracts.log" "$OUT/shards.log" "$OUT/dependencies.log"
          printf 'COMMITTED_METADATA_PASS source=%s tracked_mutation=false\n' "$SOURCE_SHA"
      - name: Retain every available outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-metadata-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-metadata-final/
          if-no-files-found: error
          retention-days: 30
