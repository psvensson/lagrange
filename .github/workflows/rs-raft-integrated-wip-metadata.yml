# Exact source-only integrated WIP; metadata is derived, never authority.
# Re-run after final composed workflow content is installed; preserve fast-forward lease.
name: rs-raft-integrated-wip-metadata
on:
  push:
    branches: [continue/rs-raft-cloud-integrated-release-native-20261014]
    paths:
      - .github/workflows/rs-raft-integrated-wip-metadata.yml
permissions:
  contents: write
concurrency:
  group: rs-raft-integrated-wip-metadata
  cancel-in-progress: false
jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Recompute only the canonical source-derived test metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          npm run -s test:metadata:refresh
          git diff --check
          git diff --name-status
          while IFS= read -r changed; do
            test -z "$changed" && continue
            case "$changed" in
              test/shards/primary-classes.json|test/shards/resource-classes.json|test/shards/subsystem-classes.json|test/shards/impact-graph-seal.json) ;;
              *) echo "Refused non-produced $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          npm run -s audit:shards
          git add -- test/shards/primary-classes.json test/shards/resource-classes.json test/shards/subsystem-classes.json test/shards/impact-graph-seal.json
          if git diff --cached --quiet; then
            echo 'Already generated for this source'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LAGRANGE_SKIP_PRECOMMIT=1 git commit -m 'WIP rs-raft: regenerate integrated release/native impact metadata'
          git fetch --no-tags origin refs/heads/continue/rs-raft-cloud-integrated-release-native-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'The integrated head changed: refusing outdated metadata push'
            exit 1
          }
          git push origin HEAD:refs/heads/continue/rs-raft-cloud-integrated-release-native-20261014
