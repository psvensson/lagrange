name: a1-v13-attempt
# retry after isolated Map witness
on:
  push:
    branches:
      - quest/0-3-queryable-core-foundation
    paths:
      - .github/workflows/a1-v13-attempt.yml
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Verify sealed v13 predicate
        run: |
          node scripts/solve.js probe --id partition-key-ordering-owner-completion-v13 || true
      - name: Install exact v13 candidate
        shell: bash
        run: |
          set -euo pipefail
          v11=solve/quests/partition-key-ordering-owner-completion-v11/evidence
          cp "$v11/candidate-src-partition-constants.js" src/partition/partition-constants.js
          cp "$v11/candidate-src-strict-own-data.js" src/utils/strict-own-data.js
          cp "$v11/candidate-src-partition-service-shared.js" src/partition/partition-service-shared.js
          cp "$v11/candidate-src-split-merge-manager.js" src/partition/partition-split-merge-manager.js
          cp "$v11/candidate-src-evaluation-context.js" src/partition/partition-split-merge-evaluation-context.js
          cp "$v11/candidate-src-split-key-comparator.js" src/partition/split-key-comparator.js
          cp "$v11/candidate-src-split-merge-core.js" src/partition/partition-split-merge-manager-core-methods.js
          cp "$v11/candidate-src-split-merge-evaluation.js" src/partition/partition-split-merge-manager-evaluation-methods.js
          cp "$v11/candidate-src-split-merge-transition.js" src/partition/partition-split-merge-manager-transition-methods.js
          cp "$v11/candidate-test-routing-key-comparator.test.js" test/partition/routing-key-comparator.test.js
          cp "$v11/candidate-test-merge-auto-execution.test.js" test/partition/merge-auto-execution.test.js
          cp solve/quests/partition-key-ordering-owner-completion-v13/evidence/candidate-src-partition-split-routing.js src/partition/partition-split-routing.js
          cp solve/quests/partition-key-ordering-owner-completion-v13/evidence/candidate-test-partition-split-routing.test.js test/partition/partition-split-routing.test.js
      - name: Prove v13 closure
        run: node scripts/checks/partition-key-ordering-owner-completion-v13.js
      - name: Focused routing tests
        run: npx tap --timeout=120 test/partition/partition-split-routing.test.js
      - name: Candidate static guards
        run: |
          node node_modules/eslint/bin/eslint.js --no-warn-ignored src/partition/partition-split-routing.js test/partition/partition-split-routing.test.js scripts/checks/partition-key-ordering-owner-completion-v13.js
          node scripts/check-guideline-literals.js src/partition/partition-split-routing.js test/partition/partition-split-routing.test.js scripts/checks/partition-key-ordering-owner-completion-v13.js
          node scripts/check-guideline-decision-boundaries.js src/partition/partition-split-routing.js test/partition/partition-split-routing.test.js scripts/checks/partition-key-ordering-owner-completion-v13.js
          node scripts/check-guideline-ambient-intrinsics.js src/partition/partition-split-routing.js test/partition/partition-split-routing.test.js scripts/checks/partition-key-ordering-owner-completion-v13.js
          node scripts/check-guideline-silent-catch.js src/partition/partition-split-routing.js test/partition/partition-split-routing.test.js scripts/checks/partition-key-ordering-owner-completion-v13.js
      - name: Record content-bound attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_hashes="$(sha256sum \
            src/partition/partition-split-routing.js \
            test/partition/partition-split-routing.test.js | tr '\n' ';')"
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v13 \
            --finding "A1-v13 GitHub Actions run ${GITHUB_RUN_ID}: closure, focused routing tests and static guards green. Candidate sha256: ${candidate_hashes}" \
            --kind evidence \
            --evidence "github-actions:${GITHUB_RUN_ID}"
          node scripts/solve.js note \
            --id partition-key-ordering-owner-completion-v13 \
            --attempt "A1-v13 captures remaining mutable split-routing intrinsics and adds isolated live hostile Map.prototype/Object/String/Array/Number witnesses; closure, focused routing tests and static guards green in GitHub Actions run ${GITHUB_RUN_ID}."
          git restore \
            src/partition/partition-constants.js \
            src/utils/strict-own-data.js \
            src/partition/partition-service-shared.js \
            src/partition/partition-split-merge-manager.js \
            src/partition/partition-split-merge-evaluation-context.js \
            src/partition/split-key-comparator.js \
            src/partition/partition-split-merge-manager-core-methods.js \
            src/partition/partition-split-merge-manager-evaluation-methods.js \
            src/partition/partition-split-merge-manager-transition-methods.js \
            src/partition/partition-split-routing.js \
            test/partition/routing-key-comparator.test.js \
            test/partition/merge-auto-execution.test.js \
            test/partition/partition-split-routing.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solve/quests/partition-key-ordering-owner-completion-v13/log.ndjson
          git rm .github/workflows/a1-v13-attempt.yml
          git commit -m "0.3 A1: record v13 intrinsic-stability attempt"
          git push origin HEAD:quest/0-3-queryable-core-foundation
