# RED witness: real native current SQL control voter cohort and two dependent
# groups, on old source. This is not a proposed wave implementation.
name: rs-raft-control-wave-original-negative
on:
  push:
    branches: [design/rs-raft-seed-control-wave-20261014]
    paths:
      - .github/workflows/rs-raft-control-wave-original-negative.yml
      - test/partition/control-wave-duplicate-boundary.test.js
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAGRANGE_RETRY_FAILED_ONCE: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install exactly locked source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 47ceb42e4a36757007f0d8006d2014fa1400d9c8 HEAD -- src)"
          npm ci
      - name: Real native old-source redundant three-voter control work
        shell: bash
        run: |
          set +e
          set -uo pipefail
          OUT=test-output/rs-raft-control-wave-original-negative
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/tree-sha.txt"
          FILE=test/partition/control-wave-duplicate-boundary.test.js
          node --check "$FILE" > "$OUT/syntax.log" 2>&1
          syntax=$?
          npx eslint "$FILE" > "$OUT/lint.log" 2>&1
          lint=$?
          printf '%s\n' "$syntax" > "$OUT/syntax.status"
          printf '%s\n' "$lint" > "$OUT/lint.status"
          if test "$syntax" -ne 0; then cat "$OUT/syntax.log"; exit 1; fi
          if test "$lint" -ne 0; then cat "$OUT/lint.log"; exit 1; fi
          node --test "$FILE" > "$OUT/old-real-groups.tap" 2>&1
          result=$?
          printf '%s\n' "$result" > "$OUT/test.status"
          tail -n 90 "$OUT/old-real-groups.tap"
          test "$result" -ne 0 || exit 1
          grep -F 'one joined control wave must hold all actual current control voters' "$OUT/old-real-groups.tap" || exit 1
          grep -F "code: 'ERR_ASSERTION'" "$OUT/old-real-groups.tap" || exit 1
          grep -F 'expected: 3' "$OUT/old-real-groups.tap" || exit 1
          echo 'Engaged old-source three real control members and two successful native dependent releases; duplicated control PAUSE remains RED.'
      - name: Preserve all original outcomes, including setup and cleanup refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rs-raft-control-wave-old-${{ github.sha }}
          path: test-output/rs-raft-control-wave-original-negative/
          retention-days: 14
          if-no-files-found: warn
