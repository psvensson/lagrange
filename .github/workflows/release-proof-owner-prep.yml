name: release-proof-owner-prep

on:
  push:
    branches: [release/v0.2.3-proof-owner]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proof-owner branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: release/v0.2.3-proof-owner
          fetch-depth: 0

      - name: Patch proof ownership and tests
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';

          function replaceExact(path, from, to) {
            const before = readFileSync(path, 'utf8');
            if (!before.includes(from)) {
              throw new Error(`${path}: expected text not found:\n${from}`);
            }
            writeFileSync(path, before.replace(from, to));
          }

          replaceExact(
            'scripts/release-preflight.js',
            " *   3. the `ci` workflow's gate job concluded success for that exact sha;\n",
            " *   3. either the modular `ci` gate or stronger `full-gate` concluded\n *      success for that exact sha;\n",
          );
          replaceExact(
            'scripts/release-preflight.js',
            "const CI_WORKFLOW_PATH = '.github/workflows/ci.yml';\n",
            "const CI_WORKFLOW_PATH = '.github/workflows/ci.yml';\nconst FULL_GATE_WORKFLOW_PATH = '.github/workflows/full-gate.yml';\n",
          );
          replaceExact(
            'scripts/release-preflight.js',
            `function ciGateRun(facts) {\n  return facts.workflowRuns.find((run) =>\n    run.path === CI_WORKFLOW_PATH &&\n    run.head_sha === facts.headSha &&\n    run.status === RUN_STATUS_COMPLETED &&\n    run.conclusion === RUN_CONCLUSION_SUCCESS) || null;\n}\n`,
            `function preTagProofRun(facts) {\n  return facts.workflowRuns.find((run) =>\n    (run.path === CI_WORKFLOW_PATH || run.path === FULL_GATE_WORKFLOW_PATH) &&\n    run.head_sha === facts.headSha &&\n    run.status === RUN_STATUS_COMPLETED &&\n    run.conclusion === RUN_CONCLUSION_SUCCESS) || null;\n}\n`,
          );
          replaceExact(
            'scripts/release-preflight.js',
            '  const gateRun = ciGateRun(facts);\n',
            '  const gateRun = preTagProofRun(facts);\n',
          );
          replaceExact(
            'scripts/release-preflight.js',
            `        \`ci gate run \${gateRun.id} succeeded on \${facts.headSha}\` :\n        \`no completed successful \${CI_WORKFLOW_PATH} run for \${facts.headSha}\`,\n`,
            `        \`pre-tag proof \${gateRun.path} run \${gateRun.id} succeeded on \` +\n          facts.headSha :\n        \`no completed successful \${CI_WORKFLOW_PATH} or \` +\n          \`\${FULL_GATE_WORKFLOW_PATH} run for \${facts.headSha}\`,\n`,
          );

          replaceExact(
            'test/scripts/release-preflight.test.js',
            `const CI_RUN = Object.freeze({\n  id: 33985719321, path: '.github/workflows/ci.yml', head_sha: HEAD,\n  status: 'completed', conclusion: 'success',\n});\n`,
            `const CI_RUN = Object.freeze({\n  id: 33985719321, path: '.github/workflows/ci.yml', head_sha: HEAD,\n  status: 'completed', conclusion: 'success',\n});\nconst FULL_GATE_RUN = Object.freeze({\n  id: 33985719322, path: '.github/workflows/full-gate.yml', head_sha: HEAD,\n  status: 'completed', conclusion: 'success',\n});\n`,
          );
          replaceExact(
            'test/scripts/release-preflight.test.js',
            `      {...CI_RUN, conclusion: 'failure'},\n      {...CI_RUN, path: '.github/workflows/full-gate.yml'},\n      {...CI_RUN, head_sha: OTHER},\n`,
            `      {...CI_RUN, conclusion: 'failure'},\n      {...FULL_GATE_RUN, conclusion: 'failure'},\n      {...CI_RUN, head_sha: OTHER},\n`,
          );
          replaceExact(
            'test/scripts/release-preflight.test.js',
            `  'only a completed successful ci.yml run on the exact sha counts');\n`,
            `  'only a completed successful ci.yml or full-gate.yml run on the exact sha counts');\n`,
          );
          replaceExact(
            'test/scripts/release-preflight.test.js',
            `test('each fact blocks on its own', (t) => {\n`,
            `test('a successful full gate is a stronger exact-sha pre-tag proof', (t) => {\n  const result = evaluateReleasePreflight(facts({\n    workflowRuns: [{...CI_RUN, conclusion: 'failure'}, FULL_GATE_RUN],\n  }));\n  t.equal(result.ok, true);\n  t.match(result.checks[2].detail, /full-gate\\.yml/);\n  t.end();\n});\n\ntest('each fact blocks on its own', (t) => {\n`,
          );

          replaceExact(
            'RELEASE.md',
            `| Manual | \`.github/workflows/full-gate.yml\` | \`npm run check:release\` — the whole system, on demand. No longer nightly: a scheduled whole-system proof is a standing veto, and an unchanged tree cannot grow new behavioural debt. |\n`,
            `| Manual / \`release-proof/**\` branch | \`.github/workflows/full-gate.yml\` | \`npm run check:release\` on the controlled GCP runner — the whole system, on demand or as the exact-head stronger proof when modular CI correctly refuses a release-surface change. It remains unscheduled. |\n`,
          );
          replaceExact(
            'RELEASE.md',
            `3. The full corpus is green on the exact SHA: the \`ci\` workflow's \`gate\` job\n   concluded success for that commit.\n`,
            `3. The exact SHA has a successful pre-tag proof: either the modular \`ci\`\n   workflow's \`gate\` job, or the stronger \`full-gate\` workflow. A\n   \`RELEASE_PROOF_REQUIRED\` refusal is not a red behavioural result; route that\n   exact main SHA through \`full-gate\` instead of weakening the selector.\n`,
          );
          replaceExact(
            'RELEASE.md',
            `3. **Land it through the ordinary publish gate** (\`npm run publish\`) and wait\n   for \`ci / gate\` on that SHA.\n`,
            `3. **Land it through the ordinary publish gate** (\`npm run publish\`). If\n   \`ci / gate\` is green, that is the pre-tag proof. If it refuses with\n   \`RELEASE_PROOF_REQUIRED\`, run \`full-gate\` on the exact same main SHA\n   (manual dispatch, or push a \`release-proof/**\` branch pointing at that SHA)\n   and wait for its \`gate\` job to succeed.\n`,
          );
          replaceExact(
            'RELEASE.md',
            `Each landed head is proven in full exactly once: the pre-push hook runs the\nfull test corpus before the push and \`ci.yml\` runs the impact cone after it.\n\`npm run check:release\` (the corpus plus the project-hardening acceptance)\nruns only inside \`release.yml\` on the tagged SHA, and on demand through\n\`full-gate.yml\`. Release-time re-runs of the corpus, local gate receipts and\ndigest-bound release row Quests were removed on 2026-09-05.\n`,
            `Each ordinary landed head is proven in full exactly once: the pre-push hook\nruns the full test corpus before the push and \`ci.yml\` runs the impact cone\nafter it. A release-surface head that the selector marks\n\`RELEASE_PROOF_REQUIRED\` uses \`full-gate.yml\` as its stronger exact-SHA\npre-tag proof. \`release.yml\` then re-runs that same \`npm run check:release\`\non the immutable tag before publishing anything. No scheduled whole-system\nproof exists.\n`,
          );
          NODE

          rm .github/workflows/release-proof-owner-prep.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/release-preflight.js test/scripts/release-preflight.test.js \
            RELEASE.md .github/workflows/release-proof-owner-prep.yml
          git commit -m "release: accept stronger exact-head full-gate proof"
          git push origin HEAD:release/v0.2.3-proof-owner
