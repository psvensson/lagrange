name: rsraft-historical-cdc-factory-pair-20261020
on:
  push:
    branches: [probe/rsraft-historical-cdc-factory-fixture-20261020]
    paths: [.github/workflows/rsraft-historical-cdc-factory-pair-20261020.yml]
permissions: {contents: read}
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: original
            sha: be25caa5f0c3612feec662d4feaa9ba28f8f34df
          - kind: test-double-interface
            sha: 2e210f9317ff4fc1ea5186f07814b87aabc1fa71
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run unchanged test scenario and interface probe
        shell: bash
        env:
          SHA: ${{ matrix.sha }}
          KIND: ${{ matrix.kind }}
          LAGRANGE_RETRY_FAILED_ONCE: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          npm ci
          mkdir -p test-output/cdc-factory-probe
          set +e
          node scripts/run-classified-test-files.js --stdin \
            <<<'test/bootstrap/dynamic-partition-cdc-subscription.test.js' \
            > test-output/cdc-factory-probe/run.log 2>&1
          status=$?
          set -e
          grep 'test-files total=' test-output/cdc-factory-probe/run.log | tail -n 5
          if [[ "$KIND" == original ]]; then
            test "$status" -ne 0
            grep -F 'this.replicaHandler.initialize is not a function' test-output/cdc-factory-probe/run.log
          else
            test "$status" -eq 0 || { tail -n 135 test-output/cdc-factory-probe/run.log; exit 1; }
            grep -F '# test-files total=1 pass=1 fail=0' test-output/cdc-factory-probe/run.log
            npx eslint test/bootstrap/dynamic-partition-cdc-subscription.test.js
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-cdc-factory-${{ matrix.kind }}-${{ github.run_id }}
          path: test-output/cdc-factory-probe/
          if-no-files-found: warn
          retention-days: 14
