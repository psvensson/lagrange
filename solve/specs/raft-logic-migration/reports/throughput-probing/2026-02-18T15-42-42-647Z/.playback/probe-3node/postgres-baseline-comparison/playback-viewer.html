<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Distributed Test Playback Viewer</title>
  <style>
    :root {
      --bg-a: #0f1720;
      --bg-b: #112b36;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.16);
      --text: #e6f0f2;
      --muted: #a9c0c7;
      --accent: #f8c55c;
      --danger: #ff6b6b;
      --good: #6de38d;
      --line: rgba(248, 197, 92, 0.45);
      --node: #59c3c3;
      --partition: #2c7da0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
      background:
        radial-gradient(1000px 600px at 10% -10%, #183847 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 110%, #29443f 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-a), var(--bg-b));
      padding: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(6px);
      padding: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Space Grotesk', 'Avenir Next', sans-serif;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .controls,
    .inputs {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    #timeline {
      max-height: 58vh;
      overflow: auto;
      display: grid;
      gap: 6px;
      padding-right: 4px;
    }

    .event-item {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.35;
    }

    .event-item.active {
      border-color: var(--accent);
      background: rgba(248, 197, 92, 0.12);
    }

    .event-type {
      color: var(--accent);
      font-weight: 600;
    }

    .main {
      display: grid;
      gap: 12px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .metric-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      animation: rise 220ms ease;
    }

    .metric-title {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #diagram {
      width: 100%;
      height: 676px;
      border-radius: 10px;
      background: rgba(5, 10, 15, 0.35);
    }

    .diagram-shell {
      position: relative;
      width: 100%;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      border-radius: 10px;
      background: rgba(8, 14, 22, 0.62);
      transition: opacity 160ms ease;
      pointer-events: none;
      z-index: 1;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(248, 197, 92, 0.25);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    .warn {
      color: var(--danger);
      font-size: 12px;
    }

    .setup-log-window {
      max-height: 110px;
      min-height: 92px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(9, 14, 19, 0.45);
      padding: 8px;
      font-family: 'IBM Plex Mono', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
      margin-bottom: 12px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      #timeline {
        max-height: 240px;
      }

      #diagram {
        height: 546px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h1>Playback Viewer</h1>
      <div class="inputs">
        <label>Manifest JSON<input id="manifestFile" type="file" accept="application/json"></label>
        <label>Events NDJSON<input id="eventsFile" type="file" accept=".ndjson,.jsonl,.txt"></label>
        <label>Samples NDJSON<input id="samplesFile" type="file" accept=".ndjson,.jsonl,.txt"></label>
        <label>Snapshots NDJSON<input id="snapshotsFile" type="file" accept=".ndjson,.jsonl,.txt"></label>
      </div>
      <div class="controls">
        <div class="row">
          <button id="btnStart">Start</button>
          <button id="btnPrev">Prev</button>
          <button id="btnNext">Next</button>
          <button id="btnEnd">End</button>
          <button id="btnPlay">Play</button>
          <button id="btnStop">Stop</button>
        </div>
      </div>
      <div id="status" class="footer">Load playback files to begin.</div>
      <div id="warning" class="warn"></div>
      <h2>Setup Logs</h2>
      <div id="setupLogs" class="setup-log-window">Waiting for setup logs...</div>
      <h2>Timeline</h2>
      <div id="timeline"></div>
    </aside>

    <main class="main">
      <section class="panel">
        <h2>Current Event</h2>
        <pre id="eventDetail">No event selected.</pre>
      </section>
      <section class="panel">
        <h2>Node Load</h2>
        <div id="metrics" class="meta"></div>
      </section>
      <section class="panel">
        <h2>Topology Diagram</h2>
        <div id="diagramWrap" class="diagram-shell">
          <svg id="diagram" viewBox="0 0 980 430" aria-label="Topology diagram"></svg>
          <div id="loadingOverlay" class="loading-overlay hidden" aria-live="polite">
            <div class="spinner"></div>
            <div id="loadingText" class="loading-text">Waiting for playback data...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const PLAYBACK_STEP_INTERVAL_MS = 1000;
    const LIVE_FOLLOW_POLL_INTERVAL_MS = 1000;
    const RUN_EVENT_TYPE_PROGRESS = 'run.progress';
    const RUN_EVENT_TYPE_STAGE = 'run.stage';
    const RUN_EVENT_SCOPE = 'run';
    const RUN_EVENT_ENTITY = 'runner';
    const RUN_DETAIL_ENDPOINT_PREFIX = '/api/admin/test-runs/';
    const RUN_STAGE_LOG_LIMIT = 120;
    const SETUP_LOG_WINDOW_LINES = 5;
    const SETUP_LOG_EMPTY_FOLLOW = 'Waiting for setup logs...';
    const SETUP_LOG_EMPTY_STATIC = 'No setup logs.';
    const RUN_STAGE_KEYWORDS = Object.freeze([
      'docker',
      'build',
      'config',
      'scenario',
      'network',
      'teardown',
      'cluster',
      'preflight',
      'seed',
      'joiner',
      'node',
      'image',
    ]);

    const state = {
      manifest: null,
      events: [],
      recordedEvents: [],
      samples: [],
      snapshots: [],
      step: -1,
      playTimer: null,
      isPlaying: false,
      followMode: false,
      autoPlay: false,
      followTimer: null,
      followPollInFlight: false,
      followSources: {
        events: null,
        samples: null,
        snapshots: null,
      },
      runId: null,
      runStartMs: null,
      runMetaEvents: [],
      seenRunMetaSignatures: new Set(),
      setupLogLines: [],
    };

    const dom = {
      status: document.getElementById('status'),
      warning: document.getElementById('warning'),
      timeline: document.getElementById('timeline'),
      eventDetail: document.getElementById('eventDetail'),
      metrics: document.getElementById('metrics'),
      diagram: document.getElementById('diagram'),
      manifestFile: document.getElementById('manifestFile'),
      eventsFile: document.getElementById('eventsFile'),
      samplesFile: document.getElementById('samplesFile'),
      snapshotsFile: document.getElementById('snapshotsFile'),
      btnStart: document.getElementById('btnStart'),
      btnPrev: document.getElementById('btnPrev'),
      btnNext: document.getElementById('btnNext'),
      btnEnd: document.getElementById('btnEnd'),
      btnPlay: document.getElementById('btnPlay'),
      btnStop: document.getElementById('btnStop'),
      loadingOverlay: document.getElementById('loadingOverlay'),
      loadingText: document.getElementById('loadingText'),
      setupLogs: document.getElementById('setupLogs'),
    };

    function formatTs(value) {
      if (!Number.isFinite(value)) {
        return '-';
      }
      return new Date(value).toLocaleTimeString();
    }

    function parseNdjson(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
          continue;
        }
        try {
          parsed.push(JSON.parse(trimmed));
        } catch (_err) {
          // Ignore malformed line.
        }
      }
      return parsed;
    }

    function readFileText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsText(file);
      });
    }

    function eventTimestamp(event) {
      const ts = Number(event?.timestamp);
      return Number.isFinite(ts) ? ts : 0;
    }

    function isRunMetaEvent(event) {
      const type = String(event?.type || '');
      const scope = String(event?.scope || '');
      return type.startsWith('run.') || scope === RUN_EVENT_SCOPE;
    }

    function scopeToLatestRunWindow(events, samples, snapshots) {
      const eventList = Array.isArray(events) ? events : [];
      const sampleList = Array.isArray(samples) ? samples : [];
      const snapshotList = Array.isArray(snapshots) ? snapshots : [];

      let scopedEvents = eventList;
      let scopedSamples = sampleList;
      let scopedSnapshots = snapshotList;
      const runStartMs = Number(state.runStartMs);
      if (Number.isFinite(runStartMs) && runStartMs > 0) {
        scopedEvents = scopedEvents.filter((item) =>
          eventTimestamp(item) >= runStartMs);
        scopedSamples = scopedSamples.filter((item) =>
          eventTimestamp(item) >= runStartMs);
        scopedSnapshots = scopedSnapshots.filter((item) =>
          eventTimestamp(item) >= runStartMs);
      }

      const runMetaEvents = scopedEvents.filter((item) => isRunMetaEvent(item));
      const playbackEvents = scopedEvents.filter((item) => !isRunMetaEvent(item));
      let latestStartTimestamp = 0;
      for (const event of playbackEvents) {
        if (event?.type === 'cluster.start') {
          latestStartTimestamp = eventTimestamp(event);
        }
      }

      if (latestStartTimestamp <= 0) {
        return {
          events: [...playbackEvents, ...runMetaEvents]
            .sort((a, b) => eventTimestamp(a) - eventTimestamp(b)),
          samples: scopedSamples,
          snapshots: scopedSnapshots,
        };
      }

      return {
        events: [
          ...playbackEvents.filter((item) =>
            eventTimestamp(item) >= latestStartTimestamp),
          ...runMetaEvents,
        ].sort((a, b) => eventTimestamp(a) - eventTimestamp(b)),
        samples: scopedSamples.filter((item) =>
          eventTimestamp(item) >= latestStartTimestamp),
        snapshots: scopedSnapshots.filter((item) =>
          eventTimestamp(item) >= latestStartTimestamp),
      };
    }

    function mergeTimelineEvents(recordedEvents, runMetaEvents) {
      const merged = [
        ...(Array.isArray(recordedEvents) ? recordedEvents : []),
        ...(Array.isArray(runMetaEvents) ? runMetaEvents : []),
      ];
      merged.sort((a, b) => eventTimestamp(a) - eventTimestamp(b));
      return merged;
    }

    function clipLabel(value, maxLength = 14) {
      const text = String(value || '-');
      if (text.length <= maxLength) {
        return text;
      }
      return text.slice(0, Math.max(1, maxLength - 1)) + '…';
    }

    function shortNodeId(nodeId) {
      const text = String(nodeId || '-');
      if (text.length <= 12) {
        return text;
      }
      return text.slice(0, 8) + '…';
    }

    function nodeIdFromRecord(record, fallback) {
      return String(
        record?.node_id ||
        record?.nodeId ||
        record?.id ||
        fallback ||
        '',
      );
    }

    function partitionIdFromRecord(record, fallback) {
      return String(
        record?.partition_id ||
        record?.partitionId ||
        record?.id ||
        fallback ||
        '',
      );
    }

    function normalizeNodeStatus(value) {
      return String(value || '').trim().toLowerCase();
    }

    function isNodeRemovedStatus(value) {
      const status = normalizeNodeStatus(value);
      return status === 'removed' ||
        status === 'deleted' ||
        status === 'gone';
    }

    function shouldIncludeNodeRecord(record) {
      const status = record?.status || record?.state || '';
      return !isNodeRemovedStatus(status);
    }

    function rebuild(options = {}) {
      const resetPlayback = options.resetPlayback !== false;
      if (resetPlayback) {
        stopPlayback();
      }
      state.events = mergeTimelineEvents(
        state.recordedEvents,
        state.runMetaEvents,
      );
      state.events.sort((a, b) => eventTimestamp(a) - eventTimestamp(b));
      state.samples.sort((a, b) => eventTimestamp(a) - eventTimestamp(b));
      state.snapshots.sort((a, b) => eventTimestamp(a) - eventTimestamp(b));

      if (state.events.length > 0) {
        state.step = Math.max(0, Math.min(state.step, state.events.length - 1));
      } else {
        state.step = -1;
      }

      renderTimeline();
      renderStep();
      updatePlaybackControls();
      updateLoadingOverlay();
    }

    function resetPlaybackData() {
      stopPlayback();
      state.recordedEvents = [];
      state.events = [];
      state.samples = [];
      state.snapshots = [];
      state.runMetaEvents = [];
      state.seenRunMetaSignatures.clear();
      state.setupLogLines = [];
      state.step = -1;
      renderTimeline();
      renderStep();
      renderSetupLogWindow();
      updatePlaybackControls();
      updateLoadingOverlay();
    }

    function setStatus(message) {
      dom.status.textContent = message;
    }

    function setWarning(message) {
      dom.warning.textContent = message || '';
    }

    function formatSetupLogLine(entry) {
      const timestamp = Number(Date.parse(entry?.timestamp || ''));
      const prefix = Number.isFinite(timestamp) ?
        formatTs(timestamp) :
        '-';
      const stream = String(entry?.stream || 'log');
      const line = String(entry?.line || '').trim();
      return `${prefix} ${stream}: ${line}`;
    }

    function renderSetupLogWindow() {
      const lines = Array.isArray(state.setupLogLines) ? state.setupLogLines : [];
      if (lines.length === 0) {
        dom.setupLogs.textContent = state.followMode ?
          SETUP_LOG_EMPTY_FOLLOW :
          SETUP_LOG_EMPTY_STATIC;
        return;
      }
      dom.setupLogs.textContent = lines.map((entry) =>
        formatSetupLogLine(entry)).join('\n');
      dom.setupLogs.scrollTop = dom.setupLogs.scrollHeight;
    }

    function hasRecordedPlaybackEvents() {
      return Array.isArray(state.recordedEvents) &&
        state.recordedEvents.length > 0;
    }

    function updateLoadingOverlay(message = 'Waiting for playback data...') {
      const showInitialWait = state.followMode &&
        hasFollowSources() &&
        !hasRecordedPlaybackEvents();
      if (!showInitialWait) {
        dom.loadingOverlay.classList.add('hidden');
        return;
      }
      dom.loadingText.textContent = String(message || 'Waiting for playback data...');
      dom.loadingOverlay.classList.remove('hidden');
    }

    function updatePlaybackControls() {
      dom.btnPlay.disabled = state.events.length === 0 || state.isPlaying;
      dom.btnStop.disabled = !state.isPlaying;
    }

    function hasFollowSources() {
      return Boolean(
        state.followSources.events ||
        state.followSources.samples ||
        state.followSources.snapshots,
      );
    }

    function stopFollowPolling() {
      if (state.followTimer) {
        clearInterval(state.followTimer);
        state.followTimer = null;
      }
      state.followPollInFlight = false;
      updateLoadingOverlay();
    }

    function stopPlayback() {
      if (state.playTimer) {
        clearInterval(state.playTimer);
        state.playTimer = null;
      }
      state.isPlaying = false;
      updatePlaybackControls();
    }

    function startPlayback() {
      if (state.events.length === 0) {
        return;
      }
      if (state.step < 0) {
        selectStep(0);
      }
      stopPlayback();
      state.isPlaying = true;
      updatePlaybackControls();
      state.playTimer = setInterval(() => {
        if (state.step >= state.events.length - 1) {
          if (!state.followMode) {
            stopPlayback();
          }
          return;
        }
        selectStep(state.step + 1);
      }, PLAYBACK_STEP_INTERVAL_MS);
    }

    function selectStep(step) {
      if (state.events.length === 0) {
        state.step = -1;
      } else {
        state.step = Math.max(0, Math.min(step, state.events.length - 1));
      }
      renderTimeline();
      renderStep();
      if (!state.followMode && state.step >= state.events.length - 1) {
        stopPlayback();
      }
    }

    function hasDatasetChanged(current, incoming) {
      if (!Array.isArray(current) || !Array.isArray(incoming)) {
        return true;
      }
      if (current.length !== incoming.length) {
        return true;
      }
      if (current.length === 0) {
        return false;
      }
      const currentLast = JSON.stringify(current[current.length - 1]);
      const incomingLast = JSON.stringify(incoming[incoming.length - 1]);
      return currentLast !== incomingLast;
    }

    async function fetchNdjsonFromUrl(url) {
      if (!url) {
        return null;
      }
      try {
        const response = await fetch(url, {cache: 'no-store'});
        if (!response.ok) {
          return null;
        }
        const text = await response.text();
        return parseNdjson(text);
      } catch (_err) {
        return null;
      }
    }

    async function fetchRunDetails(runId) {
      if (!runId) {
        return null;
      }
      const url = `${RUN_DETAIL_ENDPOINT_PREFIX}${encodeURIComponent(runId)}`;
      try {
        const response = await fetch(url, {cache: 'no-store'});
        if (!response.ok) {
          return null;
        }
        const payload = await response.json();
        return payload?.run || null;
      } catch (_err) {
        return null;
      }
    }

    function pushRunMetaEvent(event) {
      if (!event || typeof event !== 'object') {
        return false;
      }
      const signature = [
        event.type || '',
        event.timestamp || '',
        event.entityId || '',
        event.details?.message || '',
        event.details?.phase || '',
      ].join('|');
      if (state.seenRunMetaSignatures.has(signature)) {
        return false;
      }
      state.seenRunMetaSignatures.add(signature);
      state.runMetaEvents.push(event);
      if (state.runMetaEvents.length > RUN_STAGE_LOG_LIMIT) {
        state.runMetaEvents = state.runMetaEvents.slice(
          state.runMetaEvents.length - RUN_STAGE_LOG_LIMIT,
        );
      }
      return true;
    }

    function shouldIncludeRunStageLog(entry) {
      const stream = String(entry?.stream || '').toLowerCase();
      if (stream === 'system') {
        return true;
      }
      const line = String(entry?.line || '').toLowerCase();
      if (!line) {
        return false;
      }
      for (const keyword of RUN_STAGE_KEYWORDS) {
        if (line.includes(keyword)) {
          return true;
        }
      }
      return false;
    }

    function setupLogWindowsEqual(left, right) {
      if (!Array.isArray(left) || !Array.isArray(right)) {
        return false;
      }
      if (left.length !== right.length) {
        return false;
      }
      for (let i = 0; i < left.length; i++) {
        const leftItem = left[i];
        const rightItem = right[i];
        if (leftItem?.timestamp !== rightItem?.timestamp ||
            leftItem?.stream !== rightItem?.stream ||
            leftItem?.line !== rightItem?.line) {
          return false;
        }
      }
      return true;
    }

    function updateSetupLogWindowFromRun(run) {
      if (!run || typeof run !== 'object') {
        return false;
      }
      const runLogs = Array.isArray(run.logs) ? run.logs : [];
      const filtered = runLogs.filter((entry) =>
        shouldIncludeRunStageLog(entry));
      const windowLines = filtered.slice(
        Math.max(0, filtered.length - SETUP_LOG_WINDOW_LINES),
      );
      if (setupLogWindowsEqual(state.setupLogLines, windowLines)) {
        return false;
      }
      state.setupLogLines = windowLines;
      renderSetupLogWindow();
      return true;
    }

    function ingestRunDetailsAsMetaEvents(run) {
      if (!run || typeof run !== 'object') {
        return false;
      }
      let changed = false;
      const progress = run.progress;
      if (progress && typeof progress === 'object') {
        const progressTimestamp = Number(Date.parse(progress.updatedAt || '')) || Date.now();
        changed = pushRunMetaEvent({
          timestamp: progressTimestamp,
          type: RUN_EVENT_TYPE_PROGRESS,
          scope: RUN_EVENT_SCOPE,
          entityId: RUN_EVENT_ENTITY,
          details: {
            phase: progress.phase || String(run.status || 'running'),
            message: progress.message || String(run.status || 'running'),
            percent: Number(progress.percent || 0),
            status: run.status || null,
          },
        }) || changed;
      }

      const runLogs = Array.isArray(run.logs) ?
        run.logs.slice(Math.max(0, run.logs.length - RUN_STAGE_LOG_LIMIT)) :
        [];
      for (const entry of runLogs) {
        if (!shouldIncludeRunStageLog(entry)) {
          continue;
        }
        const timestamp = Number(Date.parse(entry?.timestamp || '')) || Date.now();
        changed = pushRunMetaEvent({
          timestamp,
          type: RUN_EVENT_TYPE_STAGE,
          scope: RUN_EVENT_SCOPE,
          entityId: RUN_EVENT_ENTITY,
          details: {
            stream: entry?.stream || 'log',
            message: String(entry?.line || '').trim() || 'run-stage',
            status: run.status || null,
          },
        }) || changed;
      }

      return changed;
    }

    function latestRunMetaMessage() {
      if (!Array.isArray(state.runMetaEvents) || state.runMetaEvents.length === 0) {
        return null;
      }
      const latest = state.runMetaEvents[state.runMetaEvents.length - 1];
      return String(latest?.details?.message || '').trim() || null;
    }

    async function pollFollowSources() {
      if (!state.followMode || !hasFollowSources() || state.followPollInFlight) {
        return;
      }
      state.followPollInFlight = true;
      updateLoadingOverlay('Waiting for playback data...');
      try {
        let [events, samples, snapshots, runDetails] = await Promise.all([
          fetchNdjsonFromUrl(state.followSources.events),
          fetchNdjsonFromUrl(state.followSources.samples),
          fetchNdjsonFromUrl(state.followSources.snapshots),
          fetchRunDetails(state.runId),
        ]);

        const scoped = scopeToLatestRunWindow(
          events || state.recordedEvents,
          samples || state.samples,
          snapshots || state.snapshots,
        );
        events = scoped.events.filter((event) => !isRunMetaEvent(event));
        samples = scoped.samples;
        snapshots = scoped.snapshots;

        let changed = false;
        if (events && hasDatasetChanged(state.recordedEvents, events)) {
          state.recordedEvents = events;
          changed = true;
        }
        if (samples && hasDatasetChanged(state.samples, samples)) {
          state.samples = samples;
          changed = true;
        }
        if (snapshots && hasDatasetChanged(state.snapshots, snapshots)) {
          state.snapshots = snapshots;
          changed = true;
        }
        if (runDetails && updateSetupLogWindowFromRun(runDetails)) {
          changed = true;
        }
        if (runDetails && ingestRunDetailsAsMetaEvents(runDetails)) {
          changed = true;
        }

        if (changed) {
          rebuild({resetPlayback: false});
          if (state.step < 0 && state.events.length > 0) {
            selectStep(0);
          }
          if (state.autoPlay && !state.isPlaying && state.events.length > 0) {
            startPlayback();
          }
        } else if (!hasRecordedPlaybackEvents()) {
          const runLabel = state.runId ? ` for ${state.runId}` : '';
          const latestMessage = latestRunMetaMessage();
          if (latestMessage) {
            setStatus(`Waiting for topology data${runLabel}... ${latestMessage}`);
            updateLoadingOverlay(latestMessage);
          } else {
            setStatus(`Waiting for live playback data${runLabel}...`);
            updateLoadingOverlay(`Waiting for data${runLabel}...`);
          }
        }
      } finally {
        state.followPollInFlight = false;
        updateLoadingOverlay();
      }
    }

    function startFollowPolling() {
      stopFollowPolling();
      if (!state.followMode || !hasFollowSources()) {
        updateLoadingOverlay();
        return;
      }
      updateLoadingOverlay('Waiting for playback data...');
      void pollFollowSources();
      state.followTimer = setInterval(() => {
        void pollFollowSources();
      }, LIVE_FOLLOW_POLL_INTERVAL_MS);
    }

    function renderTimeline() {
      dom.timeline.innerHTML = '';
      for (let i = 0; i < state.events.length; i++) {
        const event = state.events[i];
        const description = describeStageEvent(event);
        const item = document.createElement('div');
        item.className = 'event-item' + (state.step === i ? ' active' : '');
        item.innerHTML =
          '<div class="event-type">' + String(event.type || 'unknown') + '</div>' +
          '<div>' + formatTs(eventTimestamp(event)) + '</div>' +
          '<div>' + String(event.entityId || '-') + '</div>' +
          '<div>' + clipLabel(description, 72) + '</div>';
        item.addEventListener('click', () => selectStep(i));
        dom.timeline.appendChild(item);
      }
      scrollTimelineToActiveStep();
    }

    function scrollTimelineToActiveStep() {
      const activeItem = dom.timeline.querySelector('.event-item.active');
      if (!activeItem) {
        return;
      }
      const timelineRect = dom.timeline.getBoundingClientRect();
      const itemRect = activeItem.getBoundingClientRect();
      const itemAboveView = itemRect.top < timelineRect.top;
      const itemBelowView = itemRect.bottom > timelineRect.bottom;
      if (itemAboveView || itemBelowView) {
        activeItem.scrollIntoView({
          block: 'nearest',
          inline: 'nearest',
        });
      }
    }

    function nearestSnapshot(timestamp) {
      let snapshot = null;
      for (const item of state.snapshots) {
        if (eventTimestamp(item) <= timestamp) {
          snapshot = item;
        } else {
          break;
        }
      }
      return snapshot || state.snapshots[0] || null;
    }

    function latestClusterStartTimestamp(stepIndex) {
      let latest = 0;
      for (let i = 0; i <= stepIndex; i++) {
        const event = state.events[i];
        if (event?.type === 'cluster.start') {
          latest = eventTimestamp(event);
        }
      }
      return latest;
    }

    function nearestSnapshotInWindow(startTimestamp, endTimestamp) {
      let snapshot = null;
      for (const item of state.snapshots) {
        const itemTs = eventTimestamp(item);
        if (itemTs < startTimestamp) {
          continue;
        }
        if (itemTs <= endTimestamp) {
          snapshot = item;
        } else {
          break;
        }
      }
      return snapshot;
    }

    function applyNodeLifecycleEvent(nodeMap, removedNodeIds, event) {
      const details = event?.details || {};
      const nodeId = String(event?.entityId || details.nodeId || '');
      if (!nodeId) {
        return;
      }
      const existing = nodeMap.get(nodeId);

      switch (event.type) {
      case 'node.created':
        removedNodeIds.delete(nodeId);
        nodeMap.set(nodeId, {
          ...(existing || {}),
          node_id: nodeId,
          status: existing?.status || 'created',
          role: details.role || existing?.role || null,
          ip: details.ip || existing?.ip || null,
        });
        break;
      case 'node.started':
        removedNodeIds.delete(nodeId);
        nodeMap.set(nodeId, {
          ...(existing || {}),
          node_id: nodeId,
          status: 'active',
          role: details.role || existing?.role || null,
          ip: details.ip || existing?.ip || null,
        });
        break;
      case 'node.stopped':
        if (!existing) {
          break;
        }
        nodeMap.set(nodeId, {
          ...existing,
          node_id: nodeId,
          status: 'stopped',
        });
        break;
      case 'node.status.changed': {
        const nextStatus = details.toStatus || details.status || details.state;
        if (isNodeRemovedStatus(nextStatus)) {
          nodeMap.delete(nodeId);
          removedNodeIds.add(nodeId);
          break;
        }
        if (!existing || removedNodeIds.has(nodeId)) {
          break;
        }
        nodeMap.set(nodeId, {
          ...existing,
          node_id: nodeId,
          status: nextStatus || existing.status || 'unknown',
        });
        break;
      }
      case 'node.removed':
        nodeMap.delete(nodeId);
        removedNodeIds.add(nodeId);
        break;
      default:
        break;
      }
    }

    function partitionIdentityFromRecord(partition, fallback) {
      return String(
        partition?.partition_id ||
        partition?.partitionId ||
        partition?.id ||
        fallback ||
        '',
      );
    }

    function serviceIdentityFromRecord(service, fallback) {
      return String(
        service?.service_id ||
        service?.replica_id ||
        service?.replicaId ||
        service?.id ||
        fallback ||
        '',
      );
    }

    function serviceFallbackIdentity(service, index) {
      const partitionId = partitionIdFromRecord(service, `partition-${index}`);
      const nodeId = nodeIdFromRecord(service, `node-${index}`);
      return `${partitionId}::${nodeId}`;
    }

    function buildPartitionMap(partitions) {
      const map = new Map();
      const source = Array.isArray(partitions) ? partitions : [];
      for (let i = 0; i < source.length; i++) {
        const partition = source[i];
        const partitionId = partitionIdentityFromRecord(partition, `partition-${i}`);
        if (!partitionId) {
          continue;
        }
        map.set(partitionId, {
          ...partition,
          partition_id: partitionId,
        });
      }
      return map;
    }

    function buildServiceMap(services) {
      const map = new Map();
      const source = Array.isArray(services) ? services : [];
      for (let i = 0; i < source.length; i++) {
        const service = source[i];
        const serviceId = serviceIdentityFromRecord(
          service,
          serviceFallbackIdentity(service, i),
        );
        if (!serviceId) {
          continue;
        }
        map.set(serviceId, {
          ...service,
          service_id: serviceId,
        });
      }
      return map;
    }

    function applyPartitionLifecycleEvent(partitionMap, serviceMap, event) {
      const details = event?.details || {};
      const entityPartitionId = String(
        details.partitionId || event?.entityId || '',
      );

      const addPartition = (partitionId) => {
        const id = String(partitionId || '');
        if (!id) {
          return;
        }
        const existing = partitionMap.get(id) || {};
        partitionMap.set(id, {
          ...existing,
          partition_id: id,
          table_id: details.tableId || existing.table_id || null,
          table_name: details.tableName || existing.table_name || null,
          partition_key_start:
            details.rangeStart || existing.partition_key_start || null,
          partition_key_end:
            details.rangeEnd || existing.partition_key_end || null,
        });
      };

      const removePartition = (partitionId) => {
        const id = String(partitionId || '');
        if (!id) {
          return;
        }
        partitionMap.delete(id);
        for (const [serviceId, service] of serviceMap.entries()) {
          if (partitionIdFromRecord(service) === id) {
            serviceMap.delete(serviceId);
          }
        }
      };

      switch (event?.type) {
      case 'partition.created':
        addPartition(entityPartitionId);
        break;
      case 'partition.removed':
        removePartition(entityPartitionId);
        break;
      case 'partition.split':
        removePartition(entityPartitionId);
        if (Array.isArray(details.childPartitionIds)) {
          for (const childPartitionId of details.childPartitionIds) {
            addPartition(childPartitionId);
          }
        }
        break;
      case 'partition.merge':
        if (Array.isArray(details.parentPartitionIds)) {
          for (const parentPartitionId of details.parentPartitionIds) {
            removePartition(parentPartitionId);
          }
        }
        addPartition(entityPartitionId);
        break;
      default:
        break;
      }
    }

    function applyReplicaLifecycleEvent(partitionMap, serviceMap, event) {
      const details = event?.details || {};
      const fallbackId =
        details.operationId ||
        `${details.partitionId || 'partition'}::${details.nodeId || details.toNodeId || details.fromNodeId || 'node'}`;
      const serviceId = String(
        details.replicaId ||
        details.serviceId ||
        event?.entityId ||
        fallbackId,
      );
      if (!serviceId) {
        return;
      }

      const upsertReplica = (nodeId) => {
        const partitionId = details.partitionId ? String(details.partitionId) : null;
        if (partitionId && !partitionMap.has(partitionId)) {
          partitionMap.set(partitionId, {
            partition_id: partitionId,
            table_name: partitionId,
            table_id: null,
          });
        }
        const existing = serviceMap.get(serviceId) || {};
        serviceMap.set(serviceId, {
          ...existing,
          service_id: serviceId,
          replica_id: existing.replica_id || details.replicaId || serviceId,
          partition_id:
            partitionId || existing.partition_id || null,
          node_id: nodeId || existing.node_id || null,
          status: details.status || existing.status || 'active',
          service_type: existing.service_type || 'partition',
        });
      };

      const removeReplica = () => {
        if (serviceMap.has(serviceId)) {
          serviceMap.delete(serviceId);
          return;
        }
        const partitionId = String(details.partitionId || '');
        const nodeId = String(
          details.nodeId || details.fromNodeId || details.toNodeId || '',
        );
        for (const [identity, service] of serviceMap.entries()) {
          if (partitionId &&
              partitionIdFromRecord(service) !== partitionId) {
            continue;
          }
          if (nodeId && nodeIdFromRecord(service) !== nodeId) {
            continue;
          }
          serviceMap.delete(identity);
        }
      };

      switch (event?.type) {
      case 'replica.created':
        upsertReplica(details.nodeId || details.toNodeId || null);
        break;
      case 'replica.removed':
        removeReplica();
        break;
      case 'replica.moved':
        upsertReplica(details.toNodeId || details.nodeId || null);
        break;
      default:
        break;
      }
    }

    function buildDerivedTopology(stepIndex) {
      if (stepIndex < 0 || stepIndex >= state.events.length) {
        return {nodes: [], partitions: [], services: []};
      }

      const currentEvent = state.events[stepIndex];
      const currentTimestamp = eventTimestamp(currentEvent);
      const clusterStartTimestamp = latestClusterStartTimestamp(stepIndex);
      const baseSnapshot = nearestSnapshotInWindow(clusterStartTimestamp, currentTimestamp) ||
        (clusterStartTimestamp === 0 ? nearestSnapshot(currentTimestamp) : null);

      const nodeMap = new Map();
      const removedNodeIds = new Set();
      let partitionMap = new Map();
      let serviceMap = new Map();

      if (baseSnapshot) {
        const snapshotNodes = Array.isArray(baseSnapshot.nodes) ? baseSnapshot.nodes : [];
        for (const node of snapshotNodes) {
          const nodeId = nodeIdFromRecord(node);
          if (!nodeId) {
            continue;
          }
          if (!shouldIncludeNodeRecord(node)) {
            continue;
          }
          nodeMap.set(nodeId, {
            ...node,
            node_id: nodeId,
          });
        }
        partitionMap = buildPartitionMap(baseSnapshot.partitions);
        serviceMap = buildServiceMap(baseSnapshot.services);
      }

      // Build an event-applied topology model where lifecycle events mutate
      // node/partition/replica maps and changes persist across all later stages.
      for (let i = 0; i <= stepIndex; i++) {
        const event = state.events[i];
        const eventTs = eventTimestamp(event);
        if (eventTs < clusterStartTimestamp) {
          continue;
        }
        if (event.type === 'cluster.start') {
          // The initial cluster.start for this run is represented by the base
          // snapshot already. Only clear on unexpected mid-window restarts.
          if (eventTs > clusterStartTimestamp) {
            nodeMap.clear();
            partitionMap.clear();
            serviceMap.clear();
            removedNodeIds.clear();
          }
          continue;
        }
        applyNodeLifecycleEvent(nodeMap, removedNodeIds, event);
        if (String(event.type || '').startsWith('partition.')) {
          applyPartitionLifecycleEvent(partitionMap, serviceMap, event);
        }
        if (String(event.type || '').startsWith('replica.')) {
          applyReplicaLifecycleEvent(partitionMap, serviceMap, event);
        }
      }

      const nodes = Array.from(nodeMap.values())
        .filter((node) => shouldIncludeNodeRecord(node));
      const partitions = Array.from(partitionMap.values());
      const services = Array.from(serviceMap.values());
      const activeNodeIds = new Set(nodes.map((node) => nodeIdFromRecord(node)));
      const visiblePartitionIds = new Set(
        partitions.map((partition, index) => partitionIdFromRecord(partition, `partition-${index}`)),
      );
      const filteredServices = services.filter((service) => {
        const nodeId = nodeIdFromRecord(service);
        const partitionId = partitionIdFromRecord(service);
        return activeNodeIds.has(nodeId) && visiblePartitionIds.has(partitionId);
      });

      return {
        nodes,
        partitions,
        services: filteredServices,
      };
    }

    function nearestSamples(timestamp) {
      const byNode = new Map();
      for (const sample of state.samples) {
        const sampleTs = eventTimestamp(sample);
        if (sampleTs > timestamp) {
          break;
        }
        const nodeId = String(sample.nodeId || 'unknown');
        byNode.set(nodeId, sample);
      }
      return Array.from(byNode.values());
    }

    function readableId(value, maxLength = 16) {
      return clipLabel(String(value || '-'), maxLength);
    }

    function collectStageFocus(event, topology) {
      const focusedNodeIds = new Set();
      const focusedPartitionIds = new Set();
      const type = String(event?.type || '');
      const details = event?.details || {};
      const entityId = String(event?.entityId || '');

      const addNode = (value) => {
        const nodeId = String(value || '');
        if (!nodeId || nodeId === 'network') {
          return;
        }
        focusedNodeIds.add(nodeId);
      };
      const addPartition = (value) => {
        const partitionId = String(value || '');
        if (!partitionId) {
          return;
        }
        focusedPartitionIds.add(partitionId);
      };

      if (type.startsWith('node.')) {
        addNode(entityId || details.nodeId);
      }
      if (type === 'cluster.stage') {
        addNode(details.nodeId);
      }
      if (type === 'replica.created' || type === 'replica.removed') {
        addNode(details.nodeId || details.toNodeId || details.fromNodeId);
        addPartition(details.partitionId);
      }
      if (type === 'replica.moved') {
        addNode(details.fromNodeId);
        addNode(details.toNodeId);
        addPartition(details.partitionId);
      }
      if (type.startsWith('partition.')) {
        addPartition(details.partitionId || entityId);
        if (Array.isArray(details.childPartitionIds)) {
          for (const childPartitionId of details.childPartitionIds) {
            addPartition(childPartitionId);
          }
        }
        if (Array.isArray(details.parentPartitionIds)) {
          for (const parentPartitionId of details.parentPartitionIds) {
            addPartition(parentPartitionId);
          }
        }
      }
      if (type.startsWith('chaos.action')) {
        addNode(entityId);
        const chaosDetails = details.details || {};
        if (Array.isArray(chaosDetails.groupA)) {
          for (const nodeId of chaosDetails.groupA) {
            addNode(nodeId);
          }
        }
        if (Array.isArray(chaosDetails.groupB)) {
          for (const nodeId of chaosDetails.groupB) {
            addNode(nodeId);
          }
        }
      }

      const services = Array.isArray(topology?.services) ? topology.services : [];
      if (focusedPartitionIds.size > 0) {
        for (const service of services) {
          const partitionId = partitionIdFromRecord(service);
          if (!focusedPartitionIds.has(partitionId)) {
            continue;
          }
          addNode(nodeIdFromRecord(service));
        }
      }

      return {
        nodeIds: focusedNodeIds,
        partitionIds: focusedPartitionIds,
      };
    }

    function describeClusterStage(stage, details = {}) {
      switch (String(stage || '')) {
      case 'setup.network.creating':
        return `Creating Docker network ${readableId(details.networkName, 28)}`;
      case 'setup.network.created':
        return `Created Docker network ${readableId(details.networkName, 28)}`;
      case 'setup.seed.starting':
        return `Starting seed node ${readableId(details.nodeId)}`;
      case 'setup.seed.bootstrap.waiting':
        return `Waiting for seed bootstrap API (${readableId(details.nodeId)})`;
      case 'setup.seed.bootstrap.ready':
        return `Seed bootstrap API ready (${readableId(details.nodeId)})`;
      case 'setup.joiner.starting':
        return `Starting joiner #${Number(details.ordinal || 0)} (${readableId(details.nodeId)})`;
      case 'setup.joiner.started':
        return `Joiner started #${Number(details.ordinal || 0)} (${readableId(details.nodeId)})`;
      case 'setup.cluster.waiting-active':
        return `Waiting for cluster active state (${Number(details.expectedNodeCount || 0)} nodes)`;
      case 'setup.cluster.active':
        return `Cluster active (${Number(details.nodeCount || 0)} nodes)`;
      case 'setup.logs.subscription.starting':
        return `Starting live log subscription (${readableId(details.nodeId)})`;
      case 'setup.logs.subscription.ready':
        return `Live log subscription ready (${readableId(details.nodeId)})`;
      case 'setup.logs.subscription.failed':
        return `Live log subscription unavailable (${readableId(details.nodeId)})`;
      case 'teardown.starting':
        return `Teardown starting (${Number(details.nodeCount || 0)} nodes)`;
      case 'teardown.network.removing':
        return `Removing Docker network ${readableId(details.networkName, 28)}`;
      case 'teardown.network.removed':
        return `Removed Docker network ${readableId(details.networkName, 28)}`;
      case 'teardown.capture.finalizing':
        return 'Finalizing playback capture';
      case 'teardown.complete':
        return 'Teardown complete';
      default:
        return `Cluster stage: ${readableId(stage || 'unknown', 48)}`;
      }
    }

    function describeStageEvent(event) {
      const type = String(event?.type || 'unknown');
      const details = event?.details || {};
      const entityId = String(event?.entityId || '');
      switch (type) {
      case 'cluster.start':
        return 'Cluster start';
      case 'cluster.ready':
        return `Cluster ready (${Number(details.nodeCount || 0)} nodes)`;
      case 'cluster.stop':
        return 'Cluster stop';
      case 'cluster.stage':
        return describeClusterStage(details.stage, details);
      case 'node.created':
        return `Created node ${readableId(entityId)}${details.role ? ` (${details.role})` : ''}`;
      case 'node.started':
        return `Started node ${readableId(entityId)}`;
      case 'node.stopped':
        return `Stopped node ${readableId(entityId)}`;
      case 'node.removed':
        return `Removed node ${readableId(entityId)}`;
      case 'partition.created':
        return `Created partition ${readableId(entityId)} on table ${readableId(details.tableName || details.tableId)}`;
      case 'partition.removed':
        return `Removed partition ${readableId(entityId)}`;
      case 'partition.split':
        return `Split partition ${readableId(entityId)} into ${readableId((details.childPartitionIds || []).join(', '), 36)}`;
      case 'partition.merge':
        return `Merged partitions ${readableId((details.parentPartitionIds || []).join(', '), 36)} into ${readableId(entityId)}`;
      case 'replica.created':
        if (details.source === 'replica_operations') {
          return `Scheduled replica create of partition ${readableId(details.partitionId)} on node ${readableId(details.nodeId)} (${readableId(details.operationId, 24)})`;
        }
        return `Created replica ${readableId(entityId)} of partition ${readableId(details.partitionId)} on node ${readableId(details.nodeId)}`;
      case 'replica.removed':
        if (details.source === 'replica_operations') {
          return `Scheduled replica remove of partition ${readableId(details.partitionId)} from node ${readableId(details.nodeId)} (${readableId(details.operationId, 24)})`;
        }
        return `Removed replica ${readableId(entityId)} of partition ${readableId(details.partitionId)} from node ${readableId(details.nodeId)}`;
      case 'replica.moved':
        if (details.source === 'replica_operations') {
          return `Scheduled replica move of partition ${readableId(details.partitionId)} from ${readableId(details.fromNodeId)} to ${readableId(details.toNodeId)} (${readableId(details.operationId, 24)})`;
        }
        return `Moved replica ${readableId(entityId)} of partition ${readableId(details.partitionId)} from ${readableId(details.fromNodeId)} to ${readableId(details.toNodeId)}`;
      case 'chaos.action.started':
        return `Chaos started: ${readableId(details.action || entityId, 24)}`;
      case 'chaos.action.completed':
        return `Chaos completed: ${readableId(details.action || entityId, 24)}`;
      case 'load.started':
        return 'Started load generator';
      case 'load.progress':
        return `Load progress (${Number(details?.metrics?.total || 0)} ops, ${Number(details?.metrics?.success || 0)} successful)`;
      case 'load.completed':
        return `Load completed (${Number(details?.metrics?.success || 0)} successful writes)`;
      case 'capture.warning':
        return `Capture warning: ${readableId(details.message, 60)}`;
      case 'run.progress': {
        const pct = Number(details.percent);
        const pctText = Number.isFinite(pct) ? `${Math.round(pct)}%` : '-';
        return `Runner progress ${pctText}: ${readableId(details.message, 64)}`;
      }
      case 'run.stage':
        return `Runner stage: ${readableId(details.message, 64)}`;
      default:
        return `${type}${entityId ? ` (${readableId(entityId)})` : ''}`;
      }
    }

    function renderStep() {
      if (state.step < 0 || state.events.length === 0) {
        setStatus('No events loaded.');
        dom.eventDetail.textContent = 'No event selected.';
        dom.metrics.innerHTML = '';
        renderDiagram(null);
        return;
      }

      const event = state.events[state.step];
      const timestamp = eventTimestamp(event);
      const samples = nearestSamples(timestamp);
      const topology = buildDerivedTopology(state.step);
      const stageDescription = describeStageEvent(event);

      setStatus(
        'Step ' + (state.step + 1) + '/' + state.events.length +
        ' • ' + formatTs(timestamp) +
        ' • nodes: ' + topology.nodes.length +
        ' • ' + stageDescription,
      );
      dom.eventDetail.textContent = JSON.stringify(event, null, 2);
      renderMetrics(samples, topology);
      renderDiagram(topology, event);
    }

    function metricRow(label, value) {
      return '<div><span class="metric-title">' + label + '</span><div>' + value + '</div></div>';
    }

    function renderMetrics(samples, topology = null) {
      dom.metrics.innerHTML = '';
      const source = Array.isArray(samples) ? samples : [];
      const topologyNodes = Array.isArray(topology?.nodes) ? topology.nodes : [];
      const activeNodeIds = topologyNodes.map((node) => nodeIdFromRecord(node));
      let filteredSamples = source;
      if (activeNodeIds.length > 0) {
        const activeSet = new Set(activeNodeIds);
        const byNode = new Map();
        for (const sample of source) {
          const sampleNodeId = String(sample?.nodeId || 'unknown');
          if (!activeSet.has(sampleNodeId)) {
            continue;
          }
          byNode.set(sampleNodeId, sample);
        }
        filteredSamples = activeNodeIds
          .map((nodeId) => byNode.get(nodeId))
          .filter(Boolean);
      } else if (topology) {
        filteredSamples = [];
      }

      if (!filteredSamples || filteredSamples.length === 0) {
        dom.metrics.textContent = 'No resource samples for this step.';
        return;
      }

      for (const sample of filteredSamples) {
        const card = document.createElement('div');
        card.className = 'metric-card';

        const cpu = Number(sample.cpuPercent || 0).toFixed(1) + '%';
        const memoryUsedMb = Number(sample.memoryUsageBytes || 0) / (1024 * 1024);
        const memoryLimitMb = Number(sample.memoryLimitBytes || 0) / (1024 * 1024);
        const rxMb = Number(sample.rxBytes || 0) / (1024 * 1024);
        const txMb = Number(sample.txBytes || 0) / (1024 * 1024);

        card.innerHTML =
          '<div class="metric-title">' + String(sample.nodeId || 'unknown') + '</div>' +
          metricRow('CPU', cpu) +
          metricRow('Memory', memoryUsedMb.toFixed(1) + ' / ' + memoryLimitMb.toFixed(1) + ' MB') +
          metricRow('RX', rxMb.toFixed(2) + ' MB') +
          metricRow('TX', txMb.toFixed(2) + ' MB') +
          (sample.error ? metricRow('Error', String(sample.error)) : '');

        dom.metrics.appendChild(card);
      }
    }

    function renderDiagram(topology, event = null) {
      dom.diagram.innerHTML = '';
      if (!topology) {
        return;
      }

      const nodes = Array.isArray(topology.nodes) ? topology.nodes : [];
      const partitions = Array.isArray(topology.partitions) ? topology.partitions : [];
      const services = Array.isArray(topology.services) ? topology.services : [];
      const stageFocus = collectStageFocus(event, topology);
      const focusedNodeIds = stageFocus.nodeIds;
      const focusedPartitionIds = stageFocus.partitionIds;
      const stageCaption = describeStageEvent(event);

      const width = 980;
      const horizontalPadding = 78;
      const topPadding = 82;
      const nodeRadius = 24;
      const nodeRowSpacing = 92;
      const partitionRowSpacing = 74;
      const maxNodeCols = Math.max(1, Math.min(nodes.length || 1, 6));
      const maxPartitionCols = Math.max(1, Math.min(partitions.length || 1, 7));
      const nodeRows = Math.max(1, Math.ceil(nodes.length / maxNodeCols));
      const partitionRows = Math.max(1, Math.ceil(partitions.length / maxPartitionCols));
      const nodeBandHeight = nodeRows * nodeRowSpacing;
      const partitionYStart = topPadding + nodeBandHeight + 90;
      const height = Math.max(430, partitionYStart + (partitionRows - 1) * partitionRowSpacing + 80);
      dom.diagram.setAttribute('viewBox', `0 0 ${width} ${height}`);

      const nodeSpan = Math.max(1, width - horizontalPadding * 2);
      const nodeStepX = maxNodeCols > 1 ? nodeSpan / (maxNodeCols - 1) : 0;
      const partitionSpan = Math.max(1, width - horizontalPadding * 2);
      const partitionStepX = maxPartitionCols > 1 ? partitionSpan / (maxPartitionCols - 1) : 0;
      const nodePos = new Map();
      const partitionPos = new Map();

      const make = (tag, attrs) => {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [key, value] of Object.entries(attrs)) {
          el.setAttribute(key, value);
        }
        return el;
      };

      const captionRect = make('rect', {
        x: 16,
        y: 14,
        width: width - 32,
        height: 28,
        rx: 8,
        fill: 'rgba(248, 197, 92, 0.12)',
        stroke: 'rgba(248, 197, 92, 0.55)',
      });
      dom.diagram.appendChild(captionRect);
      const captionText = make('text', {
        x: 26,
        y: 33,
        fill: 'var(--text)',
        'font-size': '12',
      });
      captionText.textContent = clipLabel(stageCaption, 132);
      dom.diagram.appendChild(captionText);

      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        const row = Math.floor(i / maxNodeCols);
        const col = i % maxNodeCols;
        const x = Math.round(horizontalPadding + col * nodeStepX);
        const y = Math.round(topPadding + row * nodeRowSpacing);
        const id = nodeIdFromRecord(node, `node-${i}`);
        nodePos.set(id, {x, y});
        const isFocused = focusedNodeIds.has(id);
        const nodeStatus = String(node.status || 'active').toLowerCase();
        const isActive = nodeStatus === 'active' || nodeStatus === 'ready' || nodeStatus === 'created';

        if (isFocused) {
          const focusRing = make('circle', {
            cx: x,
            cy: y,
            r: nodeRadius + 8,
            fill: 'none',
            stroke: 'var(--accent)',
            'stroke-width': '3.2',
            opacity: '0.95',
          });
          dom.diagram.appendChild(focusRing);
        }

        const circle = make('circle', {
          cx: x,
          cy: y,
          r: nodeRadius,
          fill: 'var(--node)',
          opacity: isActive ? '0.95' : '0.45',
          stroke: isFocused ? 'var(--accent)' : 'rgba(0, 0, 0, 0.12)',
          'stroke-width': isFocused ? '2.6' : '1.2',
        });
        dom.diagram.appendChild(circle);
        const circleTitle = make('title', {});
        circleTitle.textContent = id;
        circle.appendChild(circleTitle);

        const label = make('text', {
          x,
          y: y + 44,
          'text-anchor': 'middle',
          fill: 'var(--text)',
          'font-size': '11',
        });
        label.textContent = shortNodeId(id);
        const labelTitle = make('title', {});
        labelTitle.textContent = id;
        label.appendChild(labelTitle);
        dom.diagram.appendChild(label);
      }

      for (let i = 0; i < partitions.length; i++) {
        const partition = partitions[i];
        const row = Math.floor(i / maxPartitionCols);
        const col = i % maxPartitionCols;
        const x = Math.round(horizontalPadding + col * partitionStepX);
        const y = Math.round(partitionYStart + row * partitionRowSpacing);
        const id = partitionIdFromRecord(partition, `partition-${i}`);
        partitionPos.set(id, {x, y});
        const isFocused = focusedPartitionIds.has(id);
        const partitionLabel = clipLabel(
          partition.table_name || partition.tableName || id,
          16,
        );

        const rect = make('rect', {
          x: x - 36,
          y: y - 16,
          width: 72,
          height: 30,
          rx: 8,
          fill: 'var(--partition)',
          stroke: isFocused ? 'var(--accent)' : 'rgba(255, 255, 255, 0.12)',
          'stroke-width': isFocused ? '2.2' : '1.1',
        });
        dom.diagram.appendChild(rect);

        const label = make('text', {
          x,
          y: y + 5,
          'text-anchor': 'middle',
          fill: 'var(--text)',
          'font-size': '10',
        });
        label.textContent = partitionLabel;
        const labelTitle = make('title', {});
        labelTitle.textContent = `${id}${partition.table_name ? ` (${partition.table_name})` : ''}`;
        label.appendChild(labelTitle);
        dom.diagram.appendChild(label);
      }

      const edgeMap = new Map();
      for (const service of services) {
        const nodeId = nodeIdFromRecord(service);
        const partitionId = partitionIdFromRecord(service);
        if (!nodeId || !partitionId) {
          continue;
        }
        const edgeKey = `${nodeId}::${partitionId}`;
        const emphasizesCurrentStage =
          focusedNodeIds.has(nodeId) || focusedPartitionIds.has(partitionId);
        const existing = edgeMap.get(edgeKey) || {
          nodeId,
          partitionId,
          count: 0,
          emphasizesCurrentStage: false,
        };
        existing.count += 1;
        existing.emphasizesCurrentStage =
          existing.emphasizesCurrentStage || emphasizesCurrentStage;
        edgeMap.set(edgeKey, existing);
      }

      for (const edge of edgeMap.values()) {
        const from = nodePos.get(edge.nodeId);
        const to = partitionPos.get(edge.partitionId);
        if (!from || !to) {
          continue;
        }

        const lineWidth = edge.emphasizesCurrentStage ?
          2.4 + Math.max(0, edge.count - 1) * 0.7 :
          1.6 + Math.max(0, edge.count - 1) * 0.55;
        const line = make('line', {
          x1: from.x,
          y1: from.y + nodeRadius,
          x2: to.x,
          y2: to.y - 16,
          stroke: edge.emphasizesCurrentStage ? 'var(--accent)' : 'var(--line)',
          'stroke-width': String(lineWidth),
          opacity: edge.emphasizesCurrentStage ? '0.95' : '0.78',
        });
        const lineTitle = make('title', {});
        lineTitle.textContent =
          `${edge.partitionId} on ${edge.nodeId} (${edge.count} replicas)`;
        line.appendChild(lineTitle);
        dom.diagram.appendChild(line);

        if (edge.count > 1) {
          const midX = Math.round((from.x + to.x) / 2);
          const midY = Math.round(((from.y + nodeRadius) + (to.y - 16)) / 2);
          const badge = make('rect', {
            x: midX - 13,
            y: midY - 10,
            width: 26,
            height: 15,
            rx: 7,
            fill: 'rgba(15, 23, 32, 0.88)',
            stroke: edge.emphasizesCurrentStage ? 'var(--accent)' : 'rgba(255, 255, 255, 0.35)',
            'stroke-width': '1',
          });
          dom.diagram.appendChild(badge);
          const badgeText = make('text', {
            x: midX,
            y: midY + 1,
            'text-anchor': 'middle',
            fill: 'var(--text)',
            'font-size': '10',
            'font-weight': '600',
          });
          badgeText.textContent = `x${edge.count}`;
          dom.diagram.appendChild(badgeText);
        }
      }
    }

    async function loadFromManifest(manifest) {
      resetPlaybackData();
      state.manifest = manifest;
      state.setupLogLines = [];
      renderSetupLogWindow();
      setWarning(manifest?.warning || '');

      if (!manifest?.files) {
        rebuild();
        return;
      }

      if (manifest.files.events) {
        state.followSources.events = manifest.files.events;
      }
      if (manifest.files.samples) {
        state.followSources.samples = manifest.files.samples;
      }
      if (manifest.files.snapshots) {
        state.followSources.snapshots = manifest.files.snapshots;
      }

      const fileEntries = [
        ['events', 'recordedEvents'],
        ['samples', 'samples'],
        ['snapshots', 'snapshots'],
      ];

      for (const [key, target] of fileEntries) {
        const path = manifest.files[key];
        if (!path) {
          continue;
        }
        try {
          const response = await fetch(path, {cache: 'no-store'});
          if (!response.ok) {
            continue;
          }
          const text = await response.text();
          state[target] = parseNdjson(text);
        } catch (_err) {
          // ignore and allow manual file load fallback
        }
      }
      const scoped = scopeToLatestRunWindow(
        state.recordedEvents,
        state.samples,
        state.snapshots,
      );
      state.recordedEvents = scoped.events.filter((event) => !isRunMetaEvent(event));
      state.samples = scoped.samples;
      state.snapshots = scoped.snapshots;
      rebuild();
      startFollowPolling();
    }

    async function applyFileInputs() {
      stopFollowPolling();
      state.followMode = false;
      state.autoPlay = false;
      state.runMetaEvents = [];
      state.seenRunMetaSignatures.clear();
      state.setupLogLines = [];
      renderSetupLogWindow();
      setWarning('');
      const manifestFile = dom.manifestFile.files[0];
      const eventsFile = dom.eventsFile.files[0];
      const samplesFile = dom.samplesFile.files[0];
      const snapshotsFile = dom.snapshotsFile.files[0];

      if (manifestFile) {
        const manifestText = await readFileText(manifestFile);
        try {
          const manifest = JSON.parse(manifestText);
          await loadFromManifest(manifest);
        } catch (_err) {
          setWarning('Manifest file is not valid JSON.');
        }
      }

      if (eventsFile) {
        state.recordedEvents = parseNdjson(await readFileText(eventsFile));
      }
      if (samplesFile) {
        state.samples = parseNdjson(await readFileText(samplesFile));
      }
      if (snapshotsFile) {
        state.snapshots = parseNdjson(await readFileText(snapshotsFile));
      }

      const scoped = scopeToLatestRunWindow(
        state.recordedEvents,
        state.samples,
        state.snapshots,
      );
      state.recordedEvents = scoped.events.filter((event) => !isRunMetaEvent(event));
      state.samples = scoped.samples;
      state.snapshots = scoped.snapshots;

      rebuild();
    }

    dom.manifestFile.addEventListener('change', applyFileInputs);
    dom.eventsFile.addEventListener('change', applyFileInputs);
    dom.samplesFile.addEventListener('change', applyFileInputs);
    dom.snapshotsFile.addEventListener('change', applyFileInputs);

    dom.btnStart.addEventListener('click', () => selectStep(0));
    dom.btnPrev.addEventListener('click', () => selectStep(state.step - 1));
    dom.btnNext.addEventListener('click', () => selectStep(state.step + 1));
    dom.btnEnd.addEventListener('click', () => selectStep(state.events.length - 1));
    dom.btnPlay.addEventListener('click', () => startPlayback());
    dom.btnStop.addEventListener('click', () => stopPlayback());

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        selectStep(state.step - 1);
      }
      if (event.key === 'ArrowRight') {
        selectStep(state.step + 1);
      }
      if (event.code === 'Space') {
        event.preventDefault();
        if (state.isPlaying) {
          stopPlayback();
        } else {
          startPlayback();
        }
      }
    });

    window.addEventListener('beforeunload', () => {
      stopPlayback();
      stopFollowPolling();
    });

    updatePlaybackControls();
    renderSetupLogWindow();

    const params = new URLSearchParams(window.location.search);
    const manifestPath = params.get('manifest');
    const eventsPath = params.get('events');
    const samplesPath = params.get('samples');
    const snapshotsPath = params.get('snapshots');
    const followParam = String(params.get('follow') || '').toLowerCase();
    const autoplayParam = String(params.get('autoplay') || '').toLowerCase();
    const runId = params.get('runId');
    const runStartMsParam = Number(params.get('runStartMs'));

    state.runId = runId;
    state.runStartMs =
      Number.isFinite(runStartMsParam) && runStartMsParam > 0 ?
        runStartMsParam : null;
    state.followSources.events = eventsPath || state.followSources.events;
    state.followSources.samples = samplesPath || state.followSources.samples;
    state.followSources.snapshots = snapshotsPath || state.followSources.snapshots;
    state.followMode = followParam === '1' || followParam === 'true' || followParam === 'yes';
    state.autoPlay = autoplayParam === '1' || autoplayParam === 'true' || autoplayParam === 'yes';

    if (manifestPath) {
      fetch(manifestPath, {cache: 'no-store'})
        .then((response) => {
          if (!response.ok) {
            throw new Error('manifest-not-ready');
          }
          return response.json();
        })
        .then((manifest) => loadFromManifest(manifest))
        .catch(() => {
          if (!hasFollowSources()) {
            setWarning('Unable to load manifest from URL parameter.');
          }
          startFollowPolling();
        });
    } else {
      startFollowPolling();
    }

    if (state.autoPlay) {
      startPlayback();
    }
  </script>
</body>
</html>
