\* Bounded route: unsafe readiness is disabled and deferred owner outcomes
\* retain a recoverable wake. Safety and EventuallyTerminal are expected to hold.
SPECIFICATION Spec
CONSTANTS
  AllowUnsafeReadiness = FALSE
  LoseWake = FALSE
INVARIANT TypeOK
INVARIANT ReadyRequiresCanonicalServiceability
INVARIANT DeferredOutcomeHasRecoverableWake
INVARIANT StaleProjectionNeverPromotes
PROPERTY EventuallyTerminal
