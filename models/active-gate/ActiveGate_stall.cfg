\* Phase B - current protocol with unbounded re-entry.
\* AllowUnboundedReentry = TRUE enables DeferReentry/StaleEvent, so an
\* adversary can keep the gate oscillating without ever reaching green.
\* EventuallyConverged is expected to FAIL; TLC returns the oscillation as a
\* liveness counterexample. The model:tlc runner inverts this expectation.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  AllowUnboundedReentry = TRUE
INVARIANT TypeOK
INVARIANT PublishedSubsetCovered
INVARIANT CoveredDisjointPending
PROPERTY EventuallyConverged
