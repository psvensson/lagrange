\* Production bug (CL-039): no leadership fail-back exists. Once publications-p1
\* leadership sheds onto the restarting replica, it strands there; the owner's
\* epoch-advance write can never commit and the epoch stays OPEN forever.
\* Expectation: EventuallyClosed FAILS (a fair behaviour sheds once and never
\* recovers).
CONSTANTS
  FailBack = FALSE
\* Liveness model: the stranded recover state is an intentional terminal stutter
\* (the real system keeps retrying but makes no progress), not a deadlock to flag.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ClosedImpliesNotOpen
PROPERTY EventuallyClosed
