\* Failed authoritative reads remain typed. Only a retryable failure for
\* priority recovery with canonical sync eligibility may use the existing
\* dispatch fallback. Successful empty and all other cases stay fail closed.
SPECIFICATION Spec
CONSTANTS
  CollapseFailureToMissing = FALSE
INVARIANT TypeOK
INVARIANT MissingMeansSuccessfulEmpty
INVARIANT SuccessfulEmptyNeverDispatches
INVARIANT NonRetryableFailureNeverDispatches
INVARIANT FallbackRequiresCanonicalRecoveryEvidence
PROPERTY EventuallyPriorityRecoveryDispatch
CHECK_DEADLOCK FALSE
