\* (authoritatively — the interlock's owner-RPC re-verify, c7a3bf19) and CARRIES
\* IT OVER instead of re-minting a duplicate, so its progress survives the
\* election. Expectation: EventuallySettled HOLDS even though the flap may occur
\* arbitrarily often, because progress is preserved and (under strong fairness on
\* Advance) reaches MaxSteps, terminalizes, and the cluster settles.
CONSTANTS
  IdempotentReplan = TRUE
  MaxSteps = 2
