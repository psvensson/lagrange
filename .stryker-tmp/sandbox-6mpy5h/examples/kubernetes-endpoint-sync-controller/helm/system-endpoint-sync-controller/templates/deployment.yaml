{{- $protocolAllowList := join "," .Values.sync.protocolAllowList -}}
{{- $serviceIdAllowList := join "," .Values.sync.serviceIdAllowList -}}
{{- $targetNamespace := default .Release.Namespace .Values.sync.targetNamespace -}}
{{- $leaseNamespace := default .Release.Namespace .Values.leaderElection.leaseNamespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "system-endpoint-sync-controller.fullname" . }}
  labels:
    {{- include "system-endpoint-sync-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "system-endpoint-sync-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "system-endpoint-sync-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "system-endpoint-sync-controller.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.controller.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controller.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ENDPOINT_SYNC_ADMIN_STREAM_URL
              value: {{ .Values.source.adminStreamUrl | quote }}
            - name: ENDPOINT_SYNC_INTERVAL_MS
              value: {{ .Values.sync.intervalMs | quote }}
            - name: ENDPOINT_SYNC_SOURCE_QUERY_TIMEOUT_MS
              value: {{ .Values.source.query.timeoutMs | quote }}
            - name: ENDPOINT_SYNC_SOURCE_QUERY_MAX_RETRIES
              value: {{ .Values.source.query.maxRetries | quote }}
            - name: ENDPOINT_SYNC_SOURCE_QUERY_RETRY_DELAY_MS
              value: {{ .Values.source.query.retryDelayMs | quote }}
            - name: ENDPOINT_SYNC_PROTOCOL_ALLOWLIST
              value: {{ $protocolAllowList | quote }}
            - name: ENDPOINT_SYNC_SERVICE_ID_ALLOWLIST
              value: {{ $serviceIdAllowList | quote }}
            - name: ENDPOINT_SYNC_HEALTHY_ONLY
              value: {{ .Values.sync.healthyOnly | quote }}
            - name: ENDPOINT_SYNC_UNHEALTHY_POLICY
              value: {{ .Values.sync.unhealthyPolicy | quote }}
            - name: ENDPOINT_SYNC_STRICT_PORT_MODE
              value: {{ .Values.sync.strictPortMode | quote }}
            - name: ENDPOINT_SYNC_MAX_ENDPOINTS_PER_SLICE
              value: {{ .Values.sync.maxEndpointsPerSlice | quote }}
            - name: ENDPOINT_SYNC_TARGET_NAMESPACE
              value: {{ $targetNamespace | quote }}
            - name: ENDPOINT_SYNC_SERVICE_NAME_PREFIX
              value: {{ .Values.sync.serviceNamePrefix | quote }}
            - name: ENDPOINT_SYNC_LEADER_ELECTION_ENABLED
              value: {{ .Values.leaderElection.enabled | quote }}
            - name: ENDPOINT_SYNC_LEASE_NAME
              value: {{ .Values.leaderElection.leaseName | quote }}
            - name: ENDPOINT_SYNC_LEASE_NAMESPACE
              value: {{ $leaseNamespace | quote }}
            - name: ENDPOINT_SYNC_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.source.auth.existingSecret.name }}
            - name: ENDPOINT_SYNC_ADMIN_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.source.auth.existingSecret.name }}
                  key: {{ .Values.source.auth.existingSecret.tokenKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
