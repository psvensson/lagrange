replicaCount: 2

image:
  # Placeholder — no controller image is published by the release pipeline;
  # point this at your own build (see the chart README for the entrypoint).
  repository: ghcr.io/example/lagrange-endpoint-sync-controller
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  command: []
  args: []

commonLabels: {}
podLabels: {}
podAnnotations: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

leaderElection:
  enabled: true
  leaseName: endpoint-sync-controller
  leaseNamespace: ""

source:
  adminStreamUrl: ws://127.0.0.1:8081/api/admin/stream
  auth:
    existingSecret:
      name: ""
      tokenKey: token
  query:
    timeoutMs: 30000
    maxRetries: 3
    retryDelayMs: 1000

sync:
  intervalMs: 5000
  protocolAllowList:
    - postgresql
  serviceIdAllowList: []
  healthyOnly: true
  unhealthyPolicy: exclude
  strictPortMode: true
  maxEndpointsPerSlice: 100
  targetNamespace: ""
  serviceNamePrefix: svc

metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 9090
    annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}

affinity: {}

tolerations: []

extraEnv: []
