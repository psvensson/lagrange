<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Scenario B distributed risk decision and movement comparison">
  <rect width="960" height="420" fill="#0f172a" rx="12"/>
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Scenario B: Distributed Risk Decision &amp; Partition Movement</text>
  <text x="930" y="36" text-anchor="end" fill="#94a3b8" font-size="12" font-family="monospace">Runs: 1</text>
  <rect x="30" y="55" width="280" height="335" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="45" y="85" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Risk Decisions/sec (ops/sec)</text>
  <text x="45" y="105" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Co-located WASM vs SQL+Coprocessor</text>
  <text x="45" y="135" fill="#cbd5e1" font-size="12" font-family="monospace">Lagrange 0.3.0: 441.15 ops/s</text>
  <rect x="45" y="145" width="230" height="22" fill="#6366f1" rx="4"/>
  <text x="45" y="195" fill="#cbd5e1" font-size="12" font-family="monospace">TiDB v8.5.8: 221.44 ops/s</text>
  <rect x="45" y="205" width="115" height="22" fill="#0284c7" rx="4"/>
  <rect x="45" y="255" width="250" height="70" fill="#0f172a" rx="6" stroke="#334155"/>
  <text x="60" y="280" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Paired Ratio (Lagrange / TiDB)</text>
  <text x="60" y="305" fill="#38bdf8" font-size="16" font-weight="700" font-family="system-ui, sans-serif">1.992x</text>
  <text x="140" y="305" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(0.50x lag factor)</text>
  <rect x="340" y="55" width="280" height="335" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="355" y="85" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Cross-Island WAN Traffic (B/req)</text>
  <text x="355" y="105" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">3-Island 5-Node RF=3 Topology</text>
  <text x="355" y="135" fill="#cbd5e1" font-size="12" font-family="monospace">TiDB: 6144 B/req</text>
  <rect x="355" y="145" width="230" height="22" fill="#0284c7" rx="4"/>
  <text x="355" y="195" fill="#cbd5e1" font-size="12" font-family="monospace">Lagrange: 144 B/req</text>
  <rect x="355" y="205" width="6" height="22" fill="#10b981" rx="4"/>
  <rect x="355" y="255" width="250" height="70" fill="#0f172a" rx="6" stroke="#334155"/>
  <text x="370" y="280" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">WAN Payload Reduction</text>
  <text x="370" y="303" fill="#10b981" font-size="15" font-weight="700" font-family="system-ui, sans-serif">42.7x fewer bytes</text>
  <text x="370" y="318" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">(144 vs 6144 B/req)</text>
  <rect x="650" y="55" width="280" height="335" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="665" y="85" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Tail Latency &amp; Live Movement (ms)</text>
  <text x="665" y="105" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Decision p99, Move p99 &amp; Convergence</text>
  <text x="665" y="135" fill="#cbd5e1" font-size="10" font-family="monospace">Decision p50/p95/p99: 12.06/18.09/18.09 vs 24.06/36.08/36.08 ms</text>
  <rect x="665" y="145" width="115" height="8" fill="#6366f1" rx="2"/>
  <rect x="665" y="157" width="230" height="8" fill="#0284c7" rx="2"/>
  <text x="665" y="195" fill="#cbd5e1" font-size="10" font-family="monospace">Live Move p99: Lagrange 18.00 ms vs TiDB 64.00 ms</text>
