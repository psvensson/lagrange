  <rect x="665" y="217" width="230" height="8" fill="#0284c7" rx="2"/>
  <text x="665" y="255" fill="#cbd5e1" font-size="10" font-family="monospace">Convergence: 45.00 ms vs 180.00 ms | Oracle: 8/8 PASS</text>
  <rect x="665" y="265" width="58" height="8" fill="#6366f1" rx="2"/>
  <rect x="665" y="277" width="230" height="8" fill="#0284c7" rx="2"/>
  <text x="665" y="335" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Indigo/Emerald: Lagrange | Blue: TiDB</text>
</svg>
